  /* Data da primeira e da última edição DA SÉRIE — diferente das datas das
     edições que você tem. A Mulher-Maravilha começou em 1942, mas o volume
     mais antigo do acervo é de 1981: ordenar pelo que se tem colocava ela
     39 anos fora do lugar. */
  let inicioSerie = "", fimSerie = "";
  if (todos.length) {
    const tituloDe = (n) => {
      const achado = edicoes.find((e) => e.n === n);
      return achado ? achado.titulo : base + " " + n;
    };

    /* O menor número nem sempre é o mais antigo: a Action Comics #0 saiu em
       1994, 56 anos depois da #1. Por isso lê várias das pontas e decide
       pela DATA, não pela numeração. */
    const candidatos = [...new Set([
      ...todos.slice(0, 4),
      ...todos.slice(-2),
      ...(todos.includes(1) ? [1] : []),
    ])];

    const lidas = await Promise.all(candidatos.map(async (n) => {
      if (fora.has(n)) return { n, data: fora.get(n) };
      try {
        const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
          + encodeURIComponent(tituloDe(n)) + "&format=json&formatversion=2&origin=*";
        const r = await fetch(url, { mode: "cors", credentials: "omit" });
        if (!r.ok) return { n, data: "" };
        const d = await r.json();
        const pg = ((d.query && d.query.pages) || [])[0] || {};
        const txt = (pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content) || "";
        return { n, data: dataDaFicha(txt) };
      } catch (err) { return { n, data: "" }; }
    }));

    const comData = lidas.filter((x) => x.data).map((x) => {
      const d = dataDaSerie({ data: x.data });
      return { ...x, ordem: d.ano != null ? d.ano * 12 + ((d.mes || 1) - 1) : null };
    }).filter((x) => x.ordem != null);

    if (comData.length) {
      inicioSerie = comData.reduce((a, b) => (b.ordem < a.ordem ? b : a)).data;
      fimSerie = comData.reduce((a, b) => (b.ordem > a.ordem ? b : a)).data;
    }
  }

  if (fora.size || todos.length) {
    return {
      inicioSerie, fimSerie,
      numeros: todos,
      datas: [...fora.entries()].map(([n, data]) => ({ n, data })).sort((a, b) => a.n - b.n),
      origem: `${edicoes.length} da categoria + ${doHtml.length} da página = ${todos.length}`,
    };
  }

  // 3) reserva: o texto renderizado da categoria, no formato "#N (Mês, Ano)"
  const d = await tentarParse(wiki, pagina);
  if (!d) throw new Error(`não achei edições em “${base}”. Confira o volume, ou cole o endereço da página da edição.`);
  const html = (d.parse && d.parse.text && d.parse.text["*"]) || "";
  const mapa = new Map();
  const re = /#(\d{1,7}(?:\.\d{1,2})?)\s*\(\s*([A-Za-z]+),?\s*(\d{4})\s*\)/g;
  let m;
  while ((m = re.exec(html))) {
    const n = Number(m[1]);
    const mes = MESES_EN[m[2].toLowerCase()];
    if (!mes || mapa.has(n)) continue;
    mapa.set(n, String(mes).padStart(2, "0") + "/" + m[3]);
  }
  if (mapa.size) {
    return {
      inicioSerie: "", fimSerie: "",
      numeros: [...mapa.keys()].sort((a, b) => a - b),
      datas: [...mapa.entries()].map(([n, data]) => ({ n, data })).sort((a, b) => a.n - b.n),
    };
  }
  {
    throw new Error(edicoes.length
      ? `achei ${edicoes.length} edição(ões) em “${base}”, mas nenhuma com data de capa legível`
      : `não achei nenhuma edição em “${base}”. Confira o volume, ou cole o endereço da página da edição.`);
  }
}

/* O DC Database classifica os volumes por categoria: Limited Series,
   One Shots, Ongoing Series, Graphic Novels. Uma consulta na página do
   volume resolve — e, quando ela não diz nada, o número de edições dá um
   palpite razoável. */
const TIPOS_SERIE = [
  { cat: /one[- ]shots?/i, rot: "One-shot" },
  { cat: /graphic novels?/i, rot: "Graphic novel" },
  { cat: /limited series/i, rot: "Minissérie" },
  { cat: /maxi[- ]series/i, rot: "Maxissérie" },
  { cat: /ongoing series/i, rot: "Série mensal" },
  { cat: /annuals?/i, rot: "Anual" },
  { cat: /^reprints?$/i, rot: "Reimpressão" },
];

/* A página do volume traz campos declarados pelo próprio DC Database:
   Type (Ongoing Series, Limited Series, One Shot…), StartYear e EndYear.
   A regra deles é explícita: volume sem EndYear continua saindo; com
   EndYear preenchido, encerrou. Isso é declaração, não dedução pela última
   edição encontrada — que numa série mal cadastrada não significa nada. */
const TIPO_DO_MODELO = {
  "ongoing series": "Série mensal",
  "limited series": "Minissérie",
  "maxi series": "Maxissérie",
  "maxiseries": "Maxissérie",
  "one shot": "One-shot",
  "one-shot": "One-shot",
  "annuals": "Anual",
  "annual": "Anual",
  "reprints": "Reimpressão",
  "graphic novel": "Graphic novel",
};

async function fichaDoVolume(wiki, categoria) {
  const pagina = String(categoria).replace(/^Category:/, "");
  try {
    const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
      + encodeURIComponent(pagina) + "&format=json&formatversion=2&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (!r.ok) return null;
    const d = await r.json();
    const pg = ((d.query && d.query.pages) || [])[0] || {};
    const txt = (pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content) || "";
    if (!txt) return null;

    const campo = (nome) => {
      const m = txt.match(new RegExp("\\\\|\\\\s*" + nome + "\\\\s*=\\\\s*([^\\\\n|}]*)", "i"));
      return m ? m[1].replace(/\\[\\[|\\]\\]/g, "").trim() : "";
    };
    const bruto = campo("Type");
    const inicio = campo("StartYear").match(/(?:19|20)\\d{2}/);
    const fim = campo("EndYear").match(/(?:19|20)\\d{2}/);

    return {
      tipo: TIPO_DO_MODELO[semAcento(bruto)] || "",
      tipoBruto: bruto,
      anoInicio: inicio ? Number(inicio[0]) : null,
      anoFim: fim ? Number(fim[0]) : null,
      // sem EndYear no modelo, a série ainda está saindo
      publicando: !fim,
    };
  } catch (e) { return null; }
}

async function tipoDaSerieWiki(wiki, categoria, qtdEdicoes) {
  const pagina = String(categoria).replace(/^Category:/, "");
  try {
    const url = wiki.base + "?action=query&prop=categories&cllimit=max&titles="
      + encodeURIComponent(pagina) + "&format=json&formatversion=2&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (r.ok) {
      const d = await r.json();
      const pg = ((d.query && d.query.pages) || [])[0] || {};
      const cats = (pg.categories || []).map((c) => String(c.title).replace(/^Category:/, ""));
      for (const t of TIPOS_SERIE) {
        if (cats.some((c) => t.cat.test(c))) return { tipo: t.rot, deduzido: false };
      }
    }
  } catch (e) { /* cai no palpite */ }

  // sem categoria: o tamanho da série é uma pista boa o bastante
  if (!qtdEdicoes) return { tipo: "", deduzido: false };
  if (qtdEdicoes === 1) return { tipo: "One-shot", deduzido: true };
  if (qtdEdicoes <= 12) return { tipo: "Minissérie", deduzido: true };
  return { tipo: "Série mensal", deduzido: true };
}

/* Capa da primeira edição do volume. A categoria "Category:X Vol 2" tem a
   edição em "X Vol 2 1" — daí sai a página de onde vem a imagem. */
async function capaDaWiki(wiki, categoria, primeiroNumero) {
  const base = String(categoria).replace(/^Category:/, "");
  // mesma regra da ficha: página solta já é a edição
  const pagina = /^Category:/i.test(categoria) ? `${base} ${primeiroNumero}` : base;

  // caminho curto: extensão PageImages, quando a wiki tiver
  try {
    const url = `${wiki.base}?action=query&prop=pageimages&piprop=original|thumbnail&pithumbsize=520`
      + `&titles=${encodeURIComponent(pagina)}&format=json&origin=*`;
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (r.ok) {
      const d = await r.json();
      const p = Object.values(d.query?.pages || {})[0] || {};
      const src = p.original?.source || p.thumbnail?.source;
      if (src) return { src, pagina };
    }
  } catch (e) { /* tenta o caminho longo */ }

  // caminho longo: lê a página e pega a primeira imagem da ficha
  const r2 = await fetch(`${wiki.base}?action=parse&page=${encodeURIComponent(pagina)}&prop=text&format=json&origin=*`,
    { mode: "cors", credentials: "omit" });
  if (!r2.ok) throw new Error("não achei a página da edição #" + primeiroNumero);
  const html = (await r2.json()).parse?.text?.["*"] || "";
  const m = html.match(/https:\/\/static\.wikia\.nocookie\.net\/[^"'\s]+?\.(?:jpg|jpeg|png)/i);
  if (!m) throw new Error("a página não tinha imagem de capa");
  // pede uma versão reduzida em vez do original gigante
  return { src: m[0].replace(/\/revision\/latest.*$/, "") + "/revision/latest/scale-to-width-down/520", pagina };
}

const chavePersonagem = (nome) => `pers:${semAcento(String(nome || "").trim())}`;

/* Créditos e personagens saem do texto-fonte das páginas de edição, onde a
   ficha é um modelo com campos nomeados — bem mais confiável que raspar o
   HTML. A API aceita 50 páginas por consulta, então uma série inteira cabe
   em uma ou duas requisições. */
const IGNORAR_PERS = /mentioned only|cameo|in a photograph|behind the scenes|flashback only|fictional character|as a corpse|unnamed/i;
const RE_SECAO = new RegExp("'''(?=[A-Z])");

/* Nomes vêm com sobras da wiki: "Sandy Tilford <small>(assistente do
   prefeito)</small>" virava nome de personagem. Remove blocos de etiqueta
   inteiros, depois qualquer etiqueta solta, e por fim sobras de pontuação. */
function limparNome(bruto) {
  return String(bruto || "")
    .replace(/<(small|sup|sub|ref|span|i|b|em|strong)\b[^>]*>[\s\S]*?<\/\1>/gi, "")
    .replace(/<[^>]*>/g, "")
    .replace(/&nbsp;|&amp;/gi, (x) => (x.toLowerCase() === "&amp;" ? "&" : " "))
    .replace(/\s+/g, " ")
    // a etiqueta removida deixava espaço antes da vírgula: "Greg Potter , George Pérez"
    .replace(/\s+([,;])/g, "$1")
    .replace(/([,;])\s*([,;])/g, "$1")
    .replace(/^[\s,;·\-–—]+|[\s,;·\-–—]+$/g, "")
    .trim();
}

function lerFicha(texto) {
  const creditos = { roteirista: [], desenhista: [] };
  /* O nome do campo varia entre as gerações de modelo do DC Database:
     "Writer1_1" nas páginas antigas, mas também "Writer1", "Writer" e
     "Writers" nas mais novas. Exigir o padrão com dois números fazia séries
     recentes, como a Batman Vol 4 de 2025, voltarem sem nenhum crédito. */
  for (const [campo, alvo] of [["Writer", "roteirista"], ["Penciler", "desenhista"]]) {
    /* A barra precisa continuar excluída: em fichas escritas numa linha só,
       "Writer1_1 = A|Penciler1_1 = B" fazia o roteirista sair como
       "A|Penciler1_1 = B". Foi assim que apareceu "Penciler1_1 = Dick
       Sprang" na lista de fases. */
    const re = new RegExp("\\|\\s*" + campo + "s?(?:\\d+)?(?:_\\d+)?\\s*=\\s*([^\\n|}]+)", "gi");
    let m;
    while ((m = re.exec(texto))) {
      // um campo pode trazer vários nomes separados por ";" ou "<br>"
      const bruto = m[1].replace(/<br\s*\/?>/gi, ";").replace(/\{\{|\}\}/g, "");
      for (const parte of bruto.split(/;|,(?![^(]*\))/)) {
        const v = limparNome(parte.replace(/\[\[|\]\]/g, "").split("|").pop());
        if (v && v.length < 60 && !/^\s*$/.test(v)) creditos[alvo].push(v);
      }
    }
  }

  /* Só "Featured" e "Supporting" — "Antagonists" e "Other" são ruído. O
     destaque é anotado porque no DC Database "Featured" costuma ser apenas
     o protagonista: usar só ele devolveria um personagem por série. O
     elenco de verdade está em "Supporting". */
  const pers = [];
  for (const bloco of texto.split(RE_SECAO)) {
    const destaque = /^Featured Characters/i.test(bloco);
    if (!destaque && !/^Supporting Characters/i.test(bloco)) continue;
    for (const linha of bloco.split("\n")) {
      if (!/^\s*\*/.test(linha) || IGNORAR_PERS.test(linha)) continue;
      const m = linha.match(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/);
      if (!m) continue;
      const nome = limparNome(m[2] || m[1]);
      if (nome) pers.push({ nome, pagina: limparNome(m[1]), destaque });
    }
  }
  return { creditos, pers };
}

/* Fases de roteirista de uma série inteira.
   Lê os créditos e a data de cada edição, em lotes de 50, e junta edições
   vizinhas do mesmo autor numa fase. Interrupções curtas — um crossover que
   desloca o roteirista por uma ou duas edições — são costuradas, senão uma
   fase longa viraria seis pedacinhos. */
async function fasesDaSerie(wiki, categoria, numeros, aoProgresso) {
  const base = String(categoria).replace(/^Category:/, "");
  const solta = !/^Category:/i.test(categoria);
  const lista = [...numeros].filter(Number.isInteger).sort((a, b) => a - b);
  const porEdicao = new Map();

  for (let i = 0; i < lista.length; i += 50) {
    const lote = lista.slice(i, i + 50);
    const titulos = solta ? [base] : lote.map((n) => base + " " + n);
    try {
      const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
        + encodeURIComponent(titulos.join("|")) + "&format=json&formatversion=2&origin=*";
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (r.ok) {
        const d = await r.json();
        const porTitulo = new Map(lote.map((n, k) => [titulos[k], n]));
        for (const pg of (d.query && d.query.pages) || []) {
          const n = porTitulo.get(pg.title);
          const txt = pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content;
          if (n === undefined || !txt) continue;
          const f = lerFicha(txt);
          porEdicao.set(n, {
            autor: (f.creditos.roteirista[0] || "").trim(),
            data: dataDaFicha(txt),
          });
        }
      }
    } catch (e) { /* segue para o próximo lote */ }
    if (aoProgresso) aoProgresso(Math.min(i + 50, lista.length), lista.length);
  }

  // agrupa edições vizinhas do mesmo roteirista
  const brutas = [];
  for (const n of lista) {
    const e = porEdicao.get(n);
    if (!e || !e.autor) continue;
    const ultima = brutas[brutas.length - 1];
    if (ultima && ultima.autor === e.autor && n - ultima.fim <= 2) {
      ultima.fim = n;
      if (e.data) ultima.dataFim = e.data;
    } else {
      brutas.push({ autor: e.autor, ini: n, fim: n, dataIni: e.data, dataFim: e.data });
    }
  }

  /* Costura: o mesmo autor voltando depois de uma passagem curta de outros
     continua na mesma fase. Na Hellblazer, o Delano é interrompido por
     Morrison e Gaiman em três edições e volta — são três fases quando é uma
     só, com convidados dentro. Olha para trás enquanto o que houve no meio
     somar até 3 edições. */
  const fases = [];
  for (const f of brutas) {
    let achou = -1, meio = 0;
    for (let k = fases.length - 1; k >= 0; k--) {
      if (fases[k].autor === f.autor) { achou = k; break; }
      meio += fases[k].fim - fases[k].ini + 1;
      if (meio > 3) break;
    }
    if (achou >= 0 && achou < fases.length - 1) {
      const alvo = fases[achou];
      alvo.fim = f.fim;
      alvo.dataFim = f.dataFim || alvo.dataFim;
      alvo.convidados = (alvo.convidados || []).concat(fases.slice(achou + 1).map((x) => x.autor));
      fases.length = achou + 1;
      continue;
    }
    fases.push({ ...f });
  }

  return { fases, lidas: porEdicao.size };
}

async function fichasDaWiki(wiki, categoria, numeros) {
  const base = String(categoria).replace(/^Category:/, "");
  /* Página solta (sem "Vol N" no título) é a própria edição — montar
     "Batman: War On Crime 1" daria uma página que não existe. */
  const solta = !/^Category:/i.test(categoria);
  const titulos = solta ? [base] : numeros.slice(0, 50).map((n) => base + " " + n);
  const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main"
    + "&titles=" + encodeURIComponent(titulos.join("|")) + "&format=json&formatversion=2&origin=*";
  const r = await fetch(url, { mode: "cors", credentials: "omit" });
  if (!r.ok) throw new Error("as páginas das edições não responderam (" + r.status + ")");
  const d = await r.json();

  const contaRot = new Map(), contaDes = new Map(), contaPers = new Map();
  let lidas = 0;
  const somar = (mapa, chave, extra) => {
    if (!chave) return;
    const at = mapa.get(chave) || Object.assign({ n: 0 }, extra || {});
    at.n++; mapa.set(chave, at);
  };
  for (const pg of (d.query && d.query.pages) || []) {
    const txt = pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content;
    if (!txt) continue;
    lidas++;
    const ficha = lerFicha(txt);
    // conta uma vez por edição, mesmo repetindo entre as histórias dela
    new Set(ficha.creditos.roteirista).forEach((v) => somar(contaRot, v));
    new Set(ficha.creditos.desenhista).forEach((v) => somar(contaDes, v));
    const vistos = new Set();
    for (const pp of ficha.pers) {
      if (vistos.has(pp.nome)) continue;
      vistos.add(pp.nome);
      somar(contaPers, pp.nome, { pagina: pp.pagina, destaques: 0 });
      if (pp.destaque) contaPers.get(pp.nome).destaques++;
    }
  }

  const ordena = (m) => [...m.entries()].map(([nome, v]) => Object.assign({ nome }, v)).sort((a, b) => b.n - a.n);

  /* O que polui a lista não é o coadjuvante, é o convidado de uma edição
     só. Então corta quem aparece em menos de um quarto das edições lidas, e
     põe na frente quem chegou a ser destaque. */
  const minimo = Math.max(2, Math.ceil(lidas * 0.25));
  const elenco = ordena(contaPers)
    .filter((p) => p.n >= Math.min(minimo, lidas))
    .sort((a, b) => {
      const da = a.destaques > 0 ? 0 : 1, db = b.destaques > 0 ? 0 : 1;
      if (da !== db) return da - db;
      return b.n - a.n;
    });

  return { lidas, roteiristas: ordena(contaRot), desenhistas: ordena(contaDes), personagens: elenco, minimo };
}

/* Todas as imagens da página do personagem, para você escolher em vez de
   aceitar a miniatura da ficha — que costuma vir pequena e mal enquadrada.
   Descarta ícones, selos e logos pelo tamanho e pelo nome do arquivo. */
const LIXO_IMG = /disambig|ambox|icon|logo|symbol|stub|quote|nuvola|wiki|button|emblem|seal\b/i;

async function imagensDaPaginaWiki(wiki, pagina, limite = 24) {
  const lista = wiki.base + "?action=query&prop=images&imlimit=60&titles="
    + encodeURIComponent(pagina) + "&format=json&formatversion=2&origin=*";
  const r = await fetch(lista, { mode: "cors", credentials: "omit" });
  if (!r.ok) throw new Error("a página não respondeu (" + r.status + ")");
  const d = await r.json();
  const pg = ((d.query && d.query.pages) || [])[0] || {};
  const arquivos = (pg.images || [])
    .map((x) => x.title)
    .filter((t) => /\.(jpe?g|png)$/i.test(t) && !LIXO_IMG.test(t))
    .slice(0, limite);
  if (!arquivos.length) return [];

  // pede as versões reduzidas de uma vez só
  const info = wiki.base + "?action=query&prop=imageinfo&iiprop=url|size&iiurlwidth=420&titles="
    + encodeURIComponent(arquivos.join("|")) + "&format=json&formatversion=2&origin=*";
  const r2 = await fetch(info, { mode: "cors", credentials: "omit" });
  if (!r2.ok) return [];
  const d2 = await r2.json();
  return ((d2.query && d2.query.pages) || [])
    .map((x) => {
      const ii = x.imageinfo && x.imageinfo[0];
      return ii ? { titulo: x.title.replace(/^File:/, ""), src: ii.thumburl || ii.url, w: ii.width, h: ii.height } : null;
    })
    .filter(Boolean)
    // imagem muito pequena é ícone; muito larga costuma ser banner
    .filter((x) => x.w >= 180 && x.h >= 180 && x.w / x.h < 2.2);
}

/* Nome em português: não é tradução, é o nome que as editoras usaram
   aqui. Vem da ligação entre a Wikipédia em inglês e a em português —
   "Green Arrow" aponta para "Arqueiro Verde". O original fica guardado,
   porque é ele que liga o personagem ao DC Database. */
const semIdentidade = (n) => String(n || "").replace(/\s*\([^)]*\)\s*$/, "").trim();

/* Sobras que a Wikipédia usa para desambiguar artigo, e que não fazem
   parte do nome: "Flash (DC Comics)", "John Constantine (Hellblazer)". */
const semDesambiguacao = (n) => String(n || "")
  .replace(/\s*\((?:DC Comics|Marvel Comics|personagem|comics?|banda desenhada|Hellblazer|herói|super-herói)[^)]*\)\s*$/i, "")
  .trim();

async function nomesEmPortugues(nomes) {
  const fora = new Map();
  const limpos = [...new Set(nomes.map(semIdentidade).filter(Boolean))];

  for (let i = 0; i < limpos.length; i += 40) {
    const lote = limpos.slice(i, i + 40);
    try {
      const url = "https://en.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=pt"
        + "&lllimit=max&redirects=1&titles=" + encodeURIComponent(lote.join("|"))
        + "&format=json&formatversion=2&origin=*";
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) continue;
      const d = await r.json();
      // a API normaliza e segue redirecionamentos: é preciso voltar ao nome pedido
      const volta = new Map();
      for (const n of (d.query && d.query.normalized) || []) volta.set(n.to, n.from);
      for (const n of (d.query && d.query.redirects) || []) volta.set(n.to, n.from);
      for (const pg of (d.query && d.query.pages) || []) {
        const orig = volta.get(pg.title) || pg.title;
        const ll = pg.langlinks && pg.langlinks[0];
        if (ll && ll.title) fora.set(orig, semDesambiguacao(ll.title));
      }
    } catch (e) { /* segue para o próximo lote */ }
  }
  return fora;
}

/* Candidatos a nome em português para quem a ligação direta não resolveu.
   Busca o nome em inglês dentro da Wikipédia em português — "Beast Boy"
   devolve "Mutano" — e consulta o rótulo do Wikidata. Nenhuma das duas
   inventa tradução: são nomes já usados por aqui. */
async function candidatosPt(nome) {
  const limpo = semIdentidade(nome);
  const fora = [];
  const visto = new Set();
  const por = (rot, fonte) => {
    const t = semDesambiguacao(rot);
    if (!t || visto.has(semAcento(t)) || semAcento(t) === semAcento(limpo)) return;
    visto.add(semAcento(t));
    fora.push({ nome: t, fonte });
  };

  try {
    const url = "https://pt.wikipedia.org/w/api.php?action=query&list=search&srlimit=4&srsearch="
      + encodeURIComponent(limpo) + "&format=json&formatversion=2&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (r.ok) {
      const d = await r.json();
      for (const x of (d.query && d.query.search) || []) por(x.title, "Wikipédia");
    }
  } catch (e) { /* segue para o Wikidata */ }

  try {
    const url = "https://www.wikidata.org/w/api.php?action=wbsearchentities&language=en&uselang=pt-br"
      + "&type=item&limit=3&search=" + encodeURIComponent(limpo) + "&format=json&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (r.ok) {
      const d = await r.json();
      for (const x of d.search || []) por(x.label, "Wikidata");
    }
  } catch (e) { /* devolve o que houver */ }

  return fora.slice(0, 5);
}

/* Retrato do personagem para o círculo na ficha. A imagem fica guardada pelo
   nome, então o Batman é baixado uma vez e reaproveitado por toda série em
   que ele apareça. */
async function retratosDaWiki(wiki, paginas) {
  const url = wiki.base + "?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=420"
    + "&titles=" + encodeURIComponent(paginas.slice(0, 50).join("|")) + "&format=json&formatversion=2&origin=*";
  const r = await fetch(url, { mode: "cors", credentials: "omit" });
  if (!r.ok) return {};
  const d = await r.json();
  const fora = {};
  for (const pg of (d.query && d.query.pages) || []) {
    if (pg.thumbnail && pg.thumbnail.source) fora[pg.title] = pg.thumbnail.source;
  }
  return fora;
}

/* Ficha do personagem: resumo e dados básicos da página dele na wiki.
   Texto pesa quase nada — 400 descrições dão 125 KB, contra 56 MB das capas
   —, então vale guardar tudo e nunca mais consultar. */
/* Remove modelos {{...}} respeitando aninhamento. O jeito ingênuo, com
   uma expressão regular só, tropeça na ficha do personagem — ela tem
   modelos dentro de modelos, e sobrava o cabeçalho solto
   "{{DC Database:Character Template" no lugar do resumo. */
function semModelos(txt) {
  let fora = "", prof = 0;
  for (let i = 0; i < txt.length; i++) {
    if (txt[i] === "{" && txt[i + 1] === "{") { prof++; i++; continue; }
    if (txt[i] === "}" && txt[i + 1] === "}" && prof > 0) { prof--; i++; continue; }
    if (!prof) fora += txt[i];
  }
  return fora;
}

// tira marcação de link, negrito, comentários, tabelas e referências
function limparWiki(txt) {
  return semModelos(txt)
    .replace(/<!--[\s\S]*?-->/g, " ")
    .replace(/<ref[\s\S]*?<\/ref>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/^\s*\{\|[\s\S]*?^\s*\|\}/gm, " ")
    .replace(/\[\[(?:File|Image|Arquivo):[^\]]*\]\]/gi, " ")
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2")
    .replace(/\[\[([^\]]+)\]\]/g, "$1")
    .replace(/'{2,}/g, "");
}

async function fichaPersonagemDaWiki(wiki, pagina) {
  /* Pede o texto renderizado e o wikitexto na mesma chamada: a ficha
     (nome real, afiliação) sai melhor do wikitexto, e a descrição sai
     muito melhor do HTML, onde a prosa já vem em parágrafos <p>. */
  const url = wiki.base + "?action=parse&prop=text|wikitext&page=" + encodeURIComponent(pagina)
    + "&format=json&formatversion=2&origin=*";
  const r = await fetch(url, { mode: "cors", credentials: "omit" });
  if (!r.ok) throw new Error("a página do personagem não respondeu (" + r.status + ")");
  const d = await r.json();
  if (d.error) throw new Error(d.error.info || "página não encontrada");
  const bruto = (d.parse && d.parse.wikitext) || "";
  const html = (d.parse && d.parse.text) || "";

  const campo = (nomes) => {
    for (const nome of nomes) {
      // captura até o fim da linha: cortar no "|" quebrava [[A|B]]
      const m = bruto.match(new RegExp("\\n\\s*\\|\\s*" + nome + "\\s*=([^\\n]*)"));
      if (!m) continue;
      // o <br> vira separador ANTES da limpeza, senão ela o apaga e cola os nomes
      let v = limparWiki(m[1].replace(/\s*<br\s*\/?>\s*/gi, " ||| "))
        .replace(/\[\[|\]\]/g, "").split("|||").map((x) => x.trim()).filter(Boolean).join(", ");
      v = v.replace(/,\s*$/, "").replace(/\s+/g, " ");
      if (v && v !== "-") return v;
    }
    return "";
  };

  /* Descrição: os parágrafos do HTML. Vai pulando os que são aviso de
     manutenção, citação ou legenda até achar prosa de verdade. Nas páginas
     do DC Database isso costuma cair na primeira frase de "History". */
  const RUIM = /^(this article|this page|for other uses|redirect|contents|gallery|see also)/i;
  let resumo = "";
  const paras = html.match(/<p\b[^>]*>[\s\S]*?<\/p>/gi) || [];
  for (const bloco of paras) {
    const t = bloco
      .replace(/<sup[\s\S]*?<\/sup>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/&#160;|&nbsp;/g, " ")
      .replace(/&quot;/g, '"').replace(/&amp;/g, "&").replace(/&#39;/g, "'")
      .replace(/\s+/g, " ")
      .replace(/\s+([,.;:!?])/g, "$1")   // tag removida deixava espaço antes da pontuação
      .trim();
    if (t.length < 80 || !/[.!?]/.test(t) || RUIM.test(t)) continue;
    resumo = t;
    break;
  }
  if (resumo.length > 700) resumo = resumo.slice(0, 700).replace(/\s+\S*$/, "") + "…";

  return {
    resumo,
    nomeReal: campo(["RealName", "Real Name", "CharacterName"]),
    primeiraAparicao: campo(["FirstAppearance", "First Appearance", "Debut"]),
    afiliacao: campo(["Affiliation", "Alliance", "GroupAffiliation"]),
    alinhamento: campo(["Alignment"]),
  };
}

/* Personagens do acervo: derivados das séries que os citam, iguais às
   séries e aos mapas. Somem sozinhos se o último volume que os menciona
   sair. O que fica guardado é a ficha e o retrato. */
function montarPersonagens(itens, metaPers) {
  const meta = new Map((metaPers || []).map((m) => [m.id, m]));
  const m = new Map();
  for (const it of itens) {
    for (const o of originaisDe(it)) {
      for (const p of o.personagens || []) {
        const id = chavePersonagem(p.nome);
        if (!m.has(id)) {
          m.set(id, { id, nome: p.nome, pagina: p.pagina || "", volumes: [], series: new Set(),
                      ...(meta.get(id) || {}) });
        }
        const g = m.get(id);
        if (!g.pagina && p.pagina) g.pagina = p.pagina;
        if (!g.volumes.some((v) => v.item.id === it.id)) g.volumes.push({ item: it, serie: o.serie });
        g.series.add(o.serie);
      }
    }
  }
  return [...m.values()]
    .map((g) => {
      const md = (metaPers || []).find((x) => x.id === g.id) || {};
      /* "nome" continua sendo o da base — é ele que liga ao DC Database.
         "nomePt" é como se chama aqui, e é o que aparece na tela. */
      return { ...g, series: [...g.series], nomePt: md.nomePt || "", exibir: md.nomePt || g.nome };
    })
    .sort((a, b) => (b.volumes.length !== a.volumes.length
      ? b.volumes.length - a.volumes.length
      : a.exibir.localeCompare(b.exibir, "pt-BR")));
}

/* Tradução do resumo. A MyMemory responde a requisições anônimas de
   qualquer origem, o que é raro entre tradutores — mas tem limite diário e
   aceita textos curtos, então o resumo vai em pedaços por frase. */
async function traduzirTexto(texto, para = "pt-BR") {
  const partes = String(texto || "").match(/[^.!?]+[.!?]*/g) || [texto];
  const blocos = [];
  let atual = "";
  for (const p of partes) {
    if ((atual + p).length > 450) { blocos.push(atual); atual = p; }
    else atual += p;
  }
  if (atual.trim()) blocos.push(atual);

  const fora = [];
  for (const b of blocos) {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(b.trim())
      + "&langpair=" + encodeURIComponent("en|" + para);
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (!r.ok) throw new Error("o tradutor não respondeu (" + r.status + ")");
    const d = await r.json();
    const t = d.responseData && d.responseData.translatedText;
    if (!t) throw new Error(d.responseDetails || "sem tradução");
    if (/MYMEMORY WARNING|QUOTA/i.test(t)) throw new Error("limite diário do tradutor atingido");
    fora.push(t);
  }
  return fora.join(" ").replace(/\s+/g, " ").trim();
}

const paraLista = (v) => {
  const t = semAcento(String(v || "").trim());
  if (!t) return "";
  if (/desej|wish|quero|comprar|lista de compra/.test(t)) return "desejos";
  if (/estante|tenho|acervo|colecao|possuo|biblioteca/.test(t)) return "estante";
  return "";
};

const paraIso = (v) => {
  const t = String(v || "").trim();
  if (!t) return "";
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
  m = t.match(/^(\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[2]}-${String(m[1]).padStart(2, "0")}-01`;
  m = t.match(/^(\d{4})$/);
  if (m) return `${m[1]}-01-01`;
  return "";
};

const paraLeitura = (v) => {
  const t = semAcento(v);
  if (!t) return "";
  if (/^(lido|sim|s|x|concluido|finalizado|true|1)$/.test(t)) return "lido";
  if (/(lendo|em leitura|leitura|iniciado)/.test(t)) return "lendo";
  if (/^(nao lido|nao|n|pendente|false|0)$/.test(t)) return "nao_lido";
  return "";
};

/* Aceita CSV com cabeçalho, ou uma coluna solta de ISBNs, ou linhas
   soltas onde o ISBN, a data e o preço aparecem em qualquer ordem. */
function lerPlanilha(texto) {
  const linhas = texto.split(/[\r\n]+/).map((l) => l.trim()).filter(Boolean);
  if (!linhas.length) return [];

  const amostra = linhas.slice(0, 5).join("\n");
  const sep = [";", "\t", ","].map((c) => ({ c, n: (amostra.match(new RegExp(`\\${c}`, "g")) || []).length }))
    .sort((a, b) => b.n - a.n)[0];
  const partir = (l) => (sep.n > 0 ? l.split(sep.c === "\t" ? "\t" : sep.c) : [l]).map((c) => c.trim().replace(/^"|"$/g, ""));

  const cab = partir(linhas[0]).map((c) => semAcento(c));
  const temCabecalho = cab.some((c) => COLUNAS.isbn.includes(c) || COLUNAS.titulo.includes(c));
  const mapa = {};
  if (temCabecalho) {
    cab.forEach((nome, i) => {
      for (const campo of Object.keys(COLUNAS)) {
        if (COLUNAS[campo].some((alias) => semAcento(alias) === nome)) { mapa[campo] = i; break; }
      }
    });
  }

  const saida = [];
  for (const l of linhas.slice(temCabecalho ? 1 : 0)) {
    const campos = partir(l);
    const reg = {};
    if (temCabecalho) {
      const pega = (k) => (mapa[k] != null ? campos[mapa[k]] || "" : "");
      // guarda o ISBN como veio, mesmo que não bata 10/13 dígitos — não
      // precisa ser válido, é só um campo de referência sua
      reg.isbn = soIsbn(pega("isbn"));
      reg.titulo = pega("titulo");
      reg.aquisicao = paraIso(pega("aquisicao"));
      reg.precoPago = numero(pega("precoPago"));
      reg.leitura = paraLeitura(pega("leitura"));
      reg.dataLeitura = paraIso(pega("dataLeitura"));
      reg.volume = parseInt(pega("volume"), 10) || null;
      reg.colecao = pega("colecao");
      reg.notas = pega("notas");
      reg.editora = pega("editora");
      reg.autor = pega("autor");
      reg.generos = pega("generos").split(/[\/,]/).map((g) => g.trim()).filter(Boolean);
      reg.tipo = TIPOS.find((t) => semAcento(t) === semAcento(pega("tipo"))) || "";
      reg.paginas = parseInt(pega("paginas"), 10) || null;
      reg.ano = pega("ano");
      reg.capaUrl = pega("capaUrl").trim();
      reg.lista = paraLista(pega("lista"));
      reg.original = textoParaOrigens(pega("publicacaoOriginal"));
      const mk = semAcento(pega("marco").trim());
      reg.marco = mk ? /^(s|1|sim|x|true|v)/.test(mk) : undefined;
    } else {
      const iCod = campos.findIndex((c) => ehIsbn(c));
      reg.isbn = iCod >= 0 ? soIsbn(campos[iCod]) : "";
      const resto = campos.filter((_, i) => i !== iCod);
      reg.aquisicao = paraIso(resto.find((c) => paraIso(c)) || "");
      const usada = resto.find((c) => paraIso(c));
      reg.precoPago = numero(resto.filter((c) => c !== usada).find((c) => numero(c) != null) || "");
      reg.titulo = reg.isbn ? "" : (campos[0] || "");
      reg.leitura = ""; reg.dataLeitura = ""; reg.volume = null; reg.colecao = ""; reg.notas = "";
      reg.editora = ""; reg.autor = ""; reg.generos = []; reg.tipo = "";
      reg.paginas = null; reg.ano = ""; reg.capaUrl = ""; reg.lista = ""; reg.original = []; reg.marco = undefined;
    }
    if (!reg.isbn && (!reg.titulo || reg.titulo.length < 4)) continue;
    reg.chave = reg.isbn || `titulo:${reg.titulo}`;
    saida.push(reg);
  }
  return saida;
}

/* Monta um item direto da linha da planilha — sem busca, sem rede,
   sem achado nenhum para completar. Só o que você escreveu. */
function itemDaImportacao(sheet, destino, tipoPadrao, colecaoId) {
  const titulo = (sheet.titulo || (sheet.isbn ? `ISBN ${sheet.isbn}` : "")).trim() || "Sem título";
  const generos = (sheet.generos || []).slice(0, 3);
  // a coluna LISTA da planilha manda; sem ela, vale o destino escolhido na tela
  const alvo = sheet.lista === "estante" || sheet.lista === "desejos" ? sheet.lista : destino;
  return {
    ...itemVazio(alvo),
    original: (sheet.original && sheet.original.length) ? sheet.original : null,
    marco: !!sheet.marco,
    id: uid(),
    titulo,
    volume: sheet.volume ?? separarVolume(titulo).vol,
    autor: sheet.autor || "",
    editora: sheet.editora || "",
    isbn: sheet.isbn || "",
    paginas: sheet.paginas ?? null,
    ano: sheet.ano || "",
    capaUrl: sheet.capaUrl || "",
    generos,
    tipo: sheet.tipo || tipoPadrao,
    colecoes: colecaoId ? [colecaoId] : [],
    aquisicao: sheet.aquisicao || (alvo === "estante" ? hoje() : ""),
    precoPago: sheet.precoPago ?? null,
    leitura: sheet.leitura || "nao_lido",
    dataLeitura: sheet.dataLeitura || "",
    notas: sheet.notas || "",
  };
}

/* Liga o nome que veio na coluna COLECAO a uma coleção já existente
   (por nome, sem acento/maiúsculas) ou cria uma nova — sem inventar
   pertencimento algum: só reconhece o que você escreveu na planilha. */
function criarResolvedorColecoes(existentes) {
  const chaveDe = (n) => semAcento(String(n || "").trim());
  const porNome = new Map(existentes.map((c) => [chaveDe(c.nome), c.id]));
  const novas = [];
  return {
    resolver(nomeBruto, editoraFallback) {
      const nome = String(nomeBruto || "").trim();
      if (!nome) return null;
      const chave = chaveDe(nome);
      if (porNome.has(chave)) return porNome.get(chave);
      const nova = { ...colecaoVazia(), nome, tipo: "serie", total: 0, editora: editoraFallback || "" };
      porNome.set(chave, nova.id);
      novas.push(nova);
      return nova.id;
    },
    get novasColecoes() { return novas; },
  };
}

/* ══════════════════════════════════════════════════════════════
   IMPORTAÇÃO EM LOTE
   ══════════════════════════════════════════════════════════════ */
function ImportarLote({ isbnsExistentes, itensExistentes, colecoesExistentes, aoImportar, aoFechar, aoAvisar }) {
  const [etapa, setEtapa] = useState("entrada");
  const [modoImport, setModoImport] = useState("direto");
  const [seq, setSeq] = useState(null);   // gerador de volumes em sequência
  /* Ajustes feitos linha a linha na conferência. Ficam separados do que a
     busca trouxe, então dá para corrigir a editora de um item sem refazer
     a consulta — e a correção vence na hora de importar. */
  const [ajustes, setAjustes] = useState({});
  const [abertaRef, setAbertaRef] = useState(null);
  const ajustar = (ref, campo, valor) =>
    setAjustes((a) => ({ ...a, [ref]: { ...(a[ref] || {}), [campo]: valor } }));
  const [texto, setTexto] = useState("");
  const [destino, setDestino] = useState("estante");
  const [tipoPadrao, setTipoPadrao] = useState("Quadrinho");
  const [fase, setFase] = useState("");
  const [prog, setProg] = useState({ feitos: 0, total: 0 });
  const [achados, setAchados] = useState({});
  const [faltantes, setFaltantes] = useState([]);
  const [fora, setFora] = useState(() => new Set());
  const [erroRede, setErroRede] = useState("");
  const [semBases, setSemBases] = useState(false);
  const [atualizarExistentes, setAtualizarExistentes] = useState(false);
  const arquivoRef = useRef(null);
  const cancelar = useRef(false);

  const [incluirFaltantes, setIncluirFaltantes] = useState(false);

  const porIsbnExistente = useMemo(() => {
    const m = new Map();
    for (const it of itensExistentes || []) {
      for (const i of String(it.isbn || "").split(",")) {
        const limpo = soIsbn(i);
        if (limpo) m.set(limpo, it);
      }
    }
    return m;
  }, [itensExistentes]);

  const entradas = useMemo(() => {
    const jaTem = new Set(isbnsExistentes);
    const regs = lerPlanilha(texto).filter((r) => atualizarExistentes || !r.isbn || !jaTem.has(r.isbn));
    const vistos = new Set();
    const unicos = regs.filter((r) => (vistos.has(r.chave) ? false : (vistos.add(r.chave), true)));
    return {
      registros: unicos,
      extras: new Map(unicos.map((r) => [r.chave, r])),
      isbns: unicos.filter((r) => r.isbn).map((r) => r.isbn),
      titulos: unicos.filter((r) => !r.isbn).map((r) => r.titulo),
      comExtras: unicos.filter((r) => r.aquisicao || r.precoPago != null || r.leitura).length,
      comColecao: unicos.filter((r) => r.colecao).length,
      comExistente: unicos.filter((r) => r.isbn && jaTem.has(r.isbn)).length,
      duplicadas: regs.length - unicos.length,
    };
  }, [texto, isbnsExistentes, atualizarExistentes]);

  /* Sinais de arquivo problemático, direto no texto colado — antes de
     processar tudo. Pega o que mais gerou dor de cabeça até aqui: Excel
     convertendo ISBN pra notação científica, e CSV salvo com a
     codificação errada (vira caractere de substituição, sem volta). */
  const diagnosticoArquivo = useMemo(() => {
    if (!texto.trim()) return null;
    const cientifica = (texto.match(/\b\d[\d.,]*E[+\-]?\d+\b/gi) || []).length;
    const substituicao = (texto.match(/\uFFFD/g) || []).length;
    const duplicadas = entradas.duplicadas;
    if (!cientifica && !substituicao && !duplicadas) return null;
    return { cientifica, substituicao, duplicadas };
  }, [texto, entradas.duplicadas]);

  // modo direto: cada linha da planilha vira um item, sem nenhuma chamada
  // de rede — por isso funciona igual aqui no Claude e no acervo-pc.html
  const linhasDiretas = useMemo(() => entradas.registros.map((r) => ({
    ...r,
    ref: r.chave,
    tituloExibicao: r.titulo || (r.isbn ? `ISBN ${r.isbn}` : "Sem título"),
  })), [entradas]);

  const nomesColecoesPreview = useMemo(
    () => [...new Set(linhasDiretas.map((l) => l.colecao).filter(Boolean))],
    [linhasDiretas]
  );

  const baixarModelo = () => {
    const linhas = [
      "ISBN;TITULO;VOLUME;COLECAO;EDITORA;AUTOR;TIPO;GENERO;DATA AQUISICAO;PRECO PAGO;LEITURA;DATA LEITURA;QTD PAGINAS;LINK DE IMAGEM DE CAPA;NOTAS;LISTA;PUBLICACAO ORIGINAL;PONTO CHAVE",
      "9788542618709;Dragon Ball Edição Definitiva;1;Dragon Ball Edição Definitiva;Panini;Akira Toriyama;Mangá;Aventura/Ação;12/03/2023;64,90;lido;05/04/2023;232;https://.../capa-vol1.jpg;",
      "9788542624373;Dragon Ball Edição Definitiva;5;Dragon Ball Edição Definitiva;Panini;Akira Toriyama;Mangá;Aventura/Ação;20/05/2024;69,90;lendo;;236;;",
      "8573516534;Sandman Edição Definitiva;1;Sandman Edição Definitiva;Panini;Neil Gaiman;Quadrinho;Fantasia/Horror;;;nao lido;;616;;edição antiga, o ISBN novo não bate mais",
      ";Watchmen;;;Panini;Alan Moore;Graphic novel;;10/01/2020;89,90;lido;;416;;sem ISBN — ainda funciona no modo direto",
    ];
    const blob = new Blob(["\uFEFF" + linhas.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "modelo-acervo.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  /* O Excel do Windows, ao "Salvar como CSV", grava em Windows-1252 —
     não em UTF-8. Lendo esses bytes como UTF-8 direto, todo acento vira
     um caractere de substituição (�), sem volta. Por isso: tenta UTF-8
     de forma estrita primeiro; se os bytes não forem UTF-8 válido, cai
     para Windows-1252, que é a origem quase certa do arquivo. */
  const lerTextoDeArquivo = (arquivo) =>
    new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = () => reject(new Error("falha na leitura"));
      r.onload = () => {
        const bytes = new Uint8Array(r.result);
        try {
          resolve(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
        } catch (e) {
          resolve(new TextDecoder("windows-1252").decode(bytes));
        }
      };
      r.readAsArrayBuffer(arquivo);
    });

  const lerArquivo = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const conteudo = await lerTextoDeArquivo(f);
      setTexto((t) => (t ? t + "\n" : "") + conteudo);
    } catch (err) {
      aoAvisar("Não consegui ler esse arquivo.");
    }
    e.target.value = "";
  };

  /* ---- busca: bases quando dá, IA sempre que preciso ---- */
  const buscar = async () => {
    const { isbns, titulos } = entradas;
    if (!isbns.length && !titulos.length) return aoAvisar("Cole ao menos um ISBN ou título.");
    cancelar.current = false;
    setEtapa("buscando");
    setErroRede("");

    const encontrados = {};
    let feitos = 0;
    const etapaNova = (n) => { feitos = 0; setProg({ feitos: 0, total: n }); };
    const andar = (n) => { feitos++; setProg({ feitos, total: n }); };

    const temBases = !dentroDoClaude();
    setSemBases(!temBases);

    if (temBases) {
      // 1 — Open Library aceita vários ISBNs por chamada
      setFase("Consultando a Open Library");
      etapaNova(isbns.length);
      await emFila(fatias(isbns, 20), 3, async (bloco) => {
        try { Object.assign(encontrados, await viaOpenLibrary(bloco)); } catch (e) {}
        bloco.forEach(() => andar(isbns.length));
        await espera(120);
      }, null, () => cancelar.current);

      // 2 — catálogo brasileiro para o que a Open Library não tinha
      const semOL = isbns.filter((i) => !encontrados[i]);
      if (semOL.length && !cancelar.current) {
        setFase("Consultando o catálogo brasileiro");
        etapaNova(semOL.length);
        await emFila(semOL, 3, async (isbn) => {
          try {
            const r = await viaMercadoEditorial(isbn);
            if (r) encontrados[isbn] = r;
          } catch (e) { /* segue */ }
          andar(semOL.length);
        }, null, () => cancelar.current);
      }

      // 3 — Google Books para o que sobrou, um a um
      const restantes = isbns.filter((i) => !encontrados[i]);
      if (restantes.length && !cancelar.current) {
        setFase("Consultando o Google Books");
        etapaNova(restantes.length);
        let bloqueado = false;
        await emFila(restantes, 3, async (isbn) => {
          if (!bloqueado) {
            try {
              const r = await viaGoogleBooks(isbn);
              if (r) encontrados[isbn] = r;
            } catch (e) {
              if (String(e.message) === "429") { bloqueado = true; await espera(1200); }
            }
          }
          andar(restantes.length);
        }, null, () => cancelar.current);
        if (bloqueado) aoAvisar("O Google Books limitou as consultas. Tente o restante daqui a pouco.");
      }

      // 4 — linhas sem ISBN: busca por título
      if (titulos.length && !cancelar.current) {
        setFase("Buscando pelos títulos");
        etapaNova(titulos.length);
        await emFila(titulos, 3, async (q) => {
          try {
            const r = await viaTitulo(q);
            if (r) encontrados[r.isbn || `titulo:${q}`] = { ...r, ref: r.isbn || `titulo:${q}` };
          } catch (e) {}
          andar(titulos.length);
        }, null, () => cancelar.current);
      }
    }

    const pendentes = [...isbns, ...titulos].filter(
      (c) => !encontrados[c] && !Object.values(encontrados).some((r) => r.ref === c)
    );

    if (!temBases) {
      setErroRede(
        "A janela do Claude bloqueia consultas a sites externos por segurança. Baixe o acervo-pc.html e abra no seu navegador para que a busca por ISBN funcione."
      );
    }
    setAchados(encontrados);
    setFaltantes(
      [...isbns, ...titulos].filter((c) => !Object.values(encontrados).some((r) => r.ref === c))
    );
    setEtapa("revisao");
  };

  const linhas = useMemo(() => {
    return Object.values(achados).sort((a, b) => {
      const A = separarVolume(a.titulo), B = separarVolume(b.titulo);
      const t = semAcento(A.base).localeCompare(semAcento(B.base));
      return t !== 0 ? t : (A.vol ?? 0) - (B.vol ?? 0);
    });
  }, [achados]);


  const linhasAtivas = modoImport === "direto" ? linhasDiretas : linhas;
  const selecionadas = linhasAtivas.filter((l) => !fora.has(l.ref));

  const alternar = (ref) =>
    setFora((p) => { const s = new Set(p); s.has(ref) ? s.delete(ref) : s.add(ref); return s; });

  const baixarFaltantes = () => {
    const blob = new Blob([faltantes.join("\n")], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `isbns-nao-encontrados-${hoje()}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const concluir = () => {
    const resolvedor = criarResolvedorColecoes(colecoesExistentes || []);
    let novos = [];
    const atualizacoes = [];

    const separaExistente = (linhas) =>
      atualizarExistentes
        ? linhas.reduce((acc, r) => {
            const existente = r.isbn && porIsbnExistente.get(r.isbn);
            (existente ? acc.paraAtualizar : acc.paraCriar).push(existente ? [r, existente] : r);
            return acc;
          }, { paraCriar: [], paraAtualizar: [] })
        : { paraCriar: linhas, paraAtualizar: [] };

    const campoNovo = (v) => (v != null && v !== "" ? v : undefined);
    const monta = (r) => {
      const campos = {
        titulo: campoNovo(r.titulo),
        autor: campoNovo(r.autor),
        editora: campoNovo(r.editora),
        tipo: campoNovo(r.tipo),
        ano: campoNovo(r.ano),
        paginas: campoNovo(r.paginas),
        notas: campoNovo(r.notas),
      };
      Object.keys(campos).forEach((k) => campos[k] === undefined && delete campos[k]);
      if (r.generos && r.generos.length) campos.generos = r.generos.slice(0, 3);
      // a coluna LISTA move o item que já existe entre estante e desejos
      if (r.lista === "estante" || r.lista === "desejos") campos.lista = r.lista;
      if (r.original && r.original.length) campos.original = r.original;
      if (r.marco !== undefined) campos.marco = r.marco;
      return campos;
    };

    if (modoImport === "direto") {
      const { paraCriar, paraAtualizar } = separaExistente(selecionadas);
      novos = paraCriar.map((r) => {
        const r2 = { ...r, ...(ajustes[r.ref] || {}) };
        return itemDaImportacao(r2, destino, tipoPadrao, resolvedor.resolver(r2.colecao, r2.editora));
      });
      for (const [r0, existente] of paraAtualizar) {
        const r = { ...r0, ...(ajustes[r0.ref] || {}) };
        const campos = monta(r);
        if (r.colecao) {
          const colId = resolvedor.resolver(r.colecao, r.editora);
          if (colId) campos.colecoes = [...new Set([...(existente.colecoes || []), colId])];
        }
        atualizacoes.push({ id: existente.id, campos });
      }
    } else {
      const extraDe = (ref) => ({ ...(entradas.extras.get(ref) || {}), ...(ajustes[ref] || {}) });
      const { paraCriar, paraAtualizar } = separaExistente(selecionadas);
      novos = paraCriar.map((r) => {
        const x = extraDe(r.ref);
        return itemDaImportacao({ ...r, ...x }, destino, tipoPadrao, resolvedor.resolver(x.colecao, x.editora || r.editora));
      });
      for (const [r, existente] of paraAtualizar) {
        const x = extraDe(r.ref);
        const campos = monta({ ...r, ...x }); // planilha tem prioridade sobre o que a busca achou
        if (x.colecao) {
          const colId = resolvedor.resolver(x.colecao, x.editora || r.editora);
          if (colId) campos.colecoes = [...new Set([...(existente.colecoes || []), colId])];
        }
        atualizacoes.push({ id: existente.id, campos });
      }

      // linhas que a busca não achou, mas que trazem dados da planilha
      if (incluirFaltantes) {
        const { paraCriar: faltCriar, paraAtualizar: faltAtualizar } = separaExistente(
          faltantes.map((ref) => ({ ref, isbn: /^\d{9,13}[Xx]?$/.test(ref) ? ref : "", ...entradas.extras.get(ref) }))
        );
        novos = [...novos, ...faltCriar.map((r) => {
          const x = entradas.extras.get(r.ref) || {};
          return itemDaImportacao(x, destino, tipoPadrao, resolvedor.resolver(x.colecao, x.editora));
        })];
        for (const [r, existente] of faltAtualizar) {
          const x = entradas.extras.get(r.ref) || {};
          atualizacoes.push({ id: existente.id, campos: monta(x) });
        }
      }
    }

    aoImportar({ itens: novos, colecoes: resolvedor.novasColecoes, atualizacoes });
  };

  const pct = prog.total ? Math.round((prog.feitos / prog.total) * 100) : 0;

  return (
    <Modal
      titulo="Importar por lista de ISBNs"
      aoFechar={() => { cancelar.current = true; aoFechar(); }}
      rodape={
        etapa === "revisao" ? (
          <>
            <button className="btn btn-primario" onClick={concluir} disabled={!selecionadas.length && !(incluirFaltantes && faltantes.length)}>
              <Check size={15} /> {atualizarExistentes ? "Aplicar" : "Adicionar"} {selecionadas.length + (incluirFaltantes ? faltantes.length : 0)} item(ns)
            </button>
            <button className="btn" onClick={() => setEtapa("entrada")}>Voltar</button>
          </>
        ) : etapa === "buscando" ? (
          <button className="btn btn-perigo" onClick={() => { cancelar.current = true; }}>
            <X size={14} /> Interromper
          </button>
        ) : modoImport === "direto" ? (
          <>
            <button className="btn btn-primario" onClick={() => setEtapa("revisao")} disabled={!entradas.registros.length}>
              <Check size={15} /> Revisar {entradas.registros.length} item(ns)
            </button>
            <button className="btn" onClick={aoFechar}>Cancelar</button>
          </>
        ) : (
          <>
            <button className="btn btn-primario" onClick={buscar} disabled={!entradas.isbns.length && !entradas.titulos.length}>
              <Search size={15} /> Buscar dados
            </button>
            <button className="btn" onClick={aoFechar}>Cancelar</button>
          </>
        )
      }
    >
      {etapa === "entrada" && (
        <>
          <div className="secao" style={{ marginTop: 0, paddingTop: 0, borderTop: "none" }}>
            <p className="secao-tit">Como a planilha vai ser tratada</p>
            <div className="chips" style={{ marginBottom: 4 }}>
              <button
                className={`chip ${modoImport === "direto" ? "ativo" : ""}`}
                onClick={() => setModoImport("direto")}
              >
                Já tenho todos os dados
              </button>
              <button
                className={`chip ${modoImport === "buscar" ? "ativo" : ""}`}
                onClick={() => setModoImport("buscar")}
              >
                Buscar o que faltar nas bases
              </button>
            </div>
            <label style={{ display: "flex", gap: 9, alignItems: "flex-start", cursor: "pointer", fontSize: 13, marginTop: 10 }}>
              <input
                type="checkbox"
                checked={atualizarExistentes}
                onChange={(e) => setAtualizarExistentes(e.target.checked)}
                style={{ marginTop: 2 }}
              />
              <span>
                Atualizar itens que já existem, em vez de pular
                <span className="dica" style={{ display: "block" }}>
                  Casa pelo ISBN e substitui título, autor, editora e outros campos que a planilha
                  trouxer — sem mexer em coleção, leitura, preço ou capa que você já tenha ajustado.
                  Use para corrigir dados que entraram errados numa importação anterior.
                </span>
              </span>
            </label>
          </div>

          {modoImport === "direto" ? (
            <div className="aviso" style={{ marginBottom: 16 }}>
              <Check size={15} />
              <span>
                Sem busca, sem internet — cada linha vira um item exatamente com os dados que você
                trouxer. Funciona igual aqui no chat e no arquivo do computador. Preencha uma coluna
                <b style={{ fontFamily: "var(--mono)", color: "var(--papel)" }}> COLECAO</b> com o mesmo
                nome em todas as linhas de uma série e o item já entra vinculado a ela — cria a coleção
                na hora, se ainda não existir. ISBN antigo ou fora do padrão não é problema: entra como
                texto, sem precisar ser válido.
              </span>
            </div>
          ) : (
            <div className="aviso" style={{ marginBottom: 16 }}>
              <TriangleAlert size={15} />
              <span>
                Consulta a Open Library, o catálogo brasileiro da CBL e o Google Books para preencher o
                que a planilha deixar em branco — o que vier preenchido na planilha sempre tem prioridade.
                <b style={{ display: "block", marginTop: 6, color: "var(--papel)" }}>
                  Só funciona no acervo-pc.html, aberto no seu navegador — dentro da janela do Claude o
                  acesso a sites externos é bloqueado.
                </b>
              </span>
            </div>
          )}

          <div className="campo largo">
            <label>Lista</label>
            <textarea
              value={texto}
              onChange={(e) => setTexto(e.target.value)}
              style={{ minHeight: 190, fontFamily: "var(--mono)", fontSize: 12.5 }}
              placeholder={
                modoImport === "direto"
                  ? "ISBN;TITULO;VOLUME;COLECAO;EDITORA;DATA AQUISICAO;PRECO PAGO;LEITURA;QTD PAGINAS;LISTA\n9788542618709;Dragon Ball Edição Definitiva;1;Dragon Ball Edição Definitiva;Panini;12/03/2023;64,90;lido;232;Estante\n9788542624373;Dragon Ball Edição Definitiva;5;Dragon Ball Edição Definitiva;Panini;;;nao lido;236;Desejos"
                  : "ISBN;EDITORA;DATA AQUISICAO;PRECO PAGO;LEITURA;DATA LEITURA\n9788542618709;Panini;12/03/2023;64,90;lido;05/04/2023\n9788542619058;Panini;20/05/2024;69,90;lendo;\n9788542619041;Panini;;;nao lido;"
              }
            />
          </div>

          {seq && (
            /* Uma coleção inteira raramente tem ISBN à mão. Aqui o volume é
               o que muda, então basta o nome e a faixa. */
            <div className="secao" style={{ marginTop: 14 }}>
              <p className="secao-tit">Gerar volumes em sequência</p>
              <div className="grade-form">
                <div className="campo largo">
                  <label>Nome da série</label>
                  <input
                    value={seq.nome}
                    onChange={(e) => setSeq({ ...seq, nome: e.target.value })}
                    placeholder="Saga do Flash"
                    autoFocus
                  />
                </div>
                <div className="campo">
                  <label>Do volume</label>
                  <input value={seq.de} inputMode="numeric"
                         onChange={(e) => setSeq({ ...seq, de: e.target.value.replace(/[^0-9]/g, "") })} />
                </div>
                <div className="campo">
                  <label>Até</label>
                  <input value={seq.ate} inputMode="numeric"
                         onChange={(e) => setSeq({ ...seq, ate: e.target.value.replace(/[^0-9]/g, "") })} />
                </div>
                <div className="campo">
                  <label>Editora</label>
                  <input value={seq.editora} onChange={(e) => setSeq({ ...seq, editora: e.target.value })}
                         placeholder="Panini" />
                </div>
                <div className="campo">
                  <label>Coleção</label>
                  <input value={seq.colecao} onChange={(e) => setSeq({ ...seq, colecao: e.target.value })}
                         placeholder="usa o nome da série se ficar vazio" />
                </div>
                <div className="campo largo">
                  <span className="dica">
                    {(() => {
                      const a = parseInt(seq.de, 10), b = parseInt(seq.ate, 10);
                      if (!seq.nome.trim() || !a || !b || b < a) return "Preencha o nome e a faixa de volumes.";
                      return `${b - a + 1} linha(s): “${seq.nome.trim()} vol. ${a}” até “${seq.nome.trim()} vol. ${b}”. O ISBN fica em branco — dá para preencher depois, ou usar a busca por título em cada item.`;
                    })()}
                  </span>
                </div>
              </div>
              <div className="lote-topo">
                <button
                  className="btn btn-primario btn-mini"
                  onClick={() => {
                    const a = parseInt(seq.de, 10), b = parseInt(seq.ate, 10);
                    const nome = seq.nome.trim();
                    if (!nome || !a || !b || b < a) return aoAvisar("Informe o nome e uma faixa válida.");
                    if (b - a > 300) return aoAvisar("Faixa grande demais — no máximo 300 volumes por vez.");
                    const col = (seq.colecao || nome).trim();
                    const linhas = [];
                    for (let v = a; v <= b; v++) {
                      linhas.push([";" + nome + " vol. " + v, v, col, seq.editora.trim(), "", "", "nao lido", "", ""].join(";"));
                    }
                    setTexto((t) => (t.trim() ? t.trim() + "\n" : "") + linhas.join("\n"));
                    setSeq(null);
                    aoAvisar(`${linhas.length} linha(s) geradas. Confira e ajuste antes de importar.`);
                  }}
                >
                  <Check size={13} /> Gerar as linhas
                </button>
                <button className="btn btn-mini" onClick={() => setSeq(null)}>Cancelar</button>
              </div>
            </div>
          )}

          <div className="lote-topo" style={{ marginTop: 14 }}>
            {modoImport === "direto" && !seq && (
              <button
                className="btn btn-mini"
                onClick={() => setSeq({ nome: "", de: "1", ate: "", editora: "", colecao: "" })}
              >
                <Plus size={13} /> Volumes em sequência
              </button>
            )}
            <button className="btn btn-mini" onClick={() => arquivoRef.current.click()}>
              <Upload size={13} /> Abrir arquivo .txt ou .csv
            </button>
            <button className="btn btn-mini" onClick={baixarModelo}>
              <Download size={13} /> Baixar modelo
            </button>
            <input ref={arquivoRef} type="file" accept=".txt,.csv,text/plain,text/csv" hidden onChange={lerArquivo} />
            <span className="carga-txt">
              {modoImport === "direto" ? (
                <>
                  <span><b>{entradas.registros.length}</b> linha(s) reconhecida(s)</span>
                  {entradas.comColecao > 0 && (
                    <span style={{ color: "var(--amarelo)" }}><b>{entradas.comColecao}</b> com coleção</span>
                  )}
                  {atualizarExistentes && entradas.comExistente > 0 && (
                    <span style={{ color: "var(--ciano)" }}><b>{entradas.comExistente}</b> vão atualizar itens existentes</span>
                  )}
                </>
              ) : (
                <>
                  <span><b>{entradas.isbns.length}</b> ISBNs</span>
                  {entradas.titulos.length > 0 && <span><b>{entradas.titulos.length}</b> por título</span>}
                  {entradas.comExtras > 0 && (
                    <span style={{ color: "var(--amarelo)" }}><b>{entradas.comExtras}</b> com data ou preço</span>
                  )}
                </>
              )}
            </span>
          </div>

          <div className="secao">
            <p className="secao-tit">Como adicionar</p>
            <div className="chips" style={{ marginBottom: 12 }}>
              {[["estante", "Já tenho — estante"], ["desejos", "Quero comprar — desejos"]].map(([v, rot]) => (
                <button key={v} className={`chip ${destino === v ? "ativo" : ""}`} onClick={() => setDestino(v)}>{rot}</button>
              ))}
            </div>
            <div className="campo" style={{ maxWidth: 210, marginBottom: 14 }}>
              <label>Tipo padrão (se a coluna TIPO vier vazia)</label>
              <select value={tipoPadrao} onChange={(e) => setTipoPadrao(e.target.value)}>
                {TIPOS.map((t) => <option key={t}>{t}</option>)}
              </select>
            </div>
            <p className="dica">
              Coleções só nascem quando você preenche a coluna COLECAO — nada é encaixado por adivinhação.
              O total de volumes de cada coleção nova fica em branco; ajuste na aba Coleções depois.
            </p>
          </div>
        </>
      )}

      {etapa === "buscando" && (
        <div style={{ padding: "30px 0" }}>
          <p className="secao-tit">{fase}…</p>
          <div className="carga"><i style={{ width: `${pct}%` }} /></div>
          <div className="carga-txt">
            <span><b>{prog.feitos}</b> de {prog.total}</span>
            <span>{pct}%</span>
          </div>
          <p className="dica" style={{ marginTop: 18 }}>
            Listas grandes levam alguns minutos. Deixe esta janela aberta até terminar.
          </p>
        </div>
      )}

      {etapa === "revisao" && (
        <>
          {erroRede && (
            <div className="aviso" style={{ borderColor: "rgba(229,72,127,.4)", background: "rgba(229,72,127,.08)", marginBottom: 14 }}>
              <TriangleAlert size={15} style={{ color: "var(--magenta)" }} />
              <span>{erroRede}</span>
            </div>
          )}

          <div className="lote-topo">
            <span className="carga-txt">
              <span><b>{selecionadas.length}</b> item(ns) marcado(s)</span>
              {modoImport === "buscar" && faltantes.length > 0 && (
                <span style={{ color: "var(--magenta)" }}><b>{faltantes.length}</b> sem dados</span>
              )}
              {modoImport === "direto" && nomesColecoesPreview.length > 0 && (
                <span style={{ color: "var(--amarelo)" }}><b>{nomesColecoesPreview.length}</b> coleção(ões)</span>
              )}
            </span>
            <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
              <button className="btn btn-mini" onClick={() => setFora(new Set())}>Marcar todos</button>
              <button className="btn btn-mini" onClick={() => setFora(new Set(linhasAtivas.map((l) => l.ref)))}>Desmarcar</button>
            </div>
          </div>

          {modoImport === "buscar" && faltantes.length > 0 && (
            <div className="aviso" style={{ marginTop: 12 }}>
              <TriangleAlert size={15} />
              <span>
                {faltantes.length} item(ns) sem ficha nas bases. Você pode adicioná-los assim mesmo, com o
                que veio da planilha, e completar o título depois — ou baixar a lista para tratar à parte.
                <span style={{ display: "flex", gap: 8, marginTop: 9, flexWrap: "wrap" }}>
                  <button className="btn btn-mini" onClick={baixarFaltantes}>
                    <Download size={13} /> Baixar lista
                  </button>
                  <button
                    className={`chip ${incluirFaltantes ? "ativo" : ""}`}
                    onClick={() => setIncluirFaltantes(!incluirFaltantes)}
                  >
                    Adicionar mesmo assim, com o que veio da planilha
                  </button>
                </span>
              </span>
            </div>
          )}

          <div className="lote-lista">
            {modoImport === "direto"
              ? linhasDiretas.slice(0, 250).map((l) => {
                  const existente = atualizarExistentes && l.isbn && porIsbnExistente.get(l.isbn);
                  return (
                    <div key={l.ref} className={`lote-linha ${fora.has(l.ref) ? "fora" : ""}`}>
                      <input type="checkbox" checked={!fora.has(l.ref)} onChange={() => alternar(l.ref)} />
                      <div className="lote-capa">{l.capaUrl && <img src={l.capaUrl} alt="" loading="lazy" />}</div>
                      <div className="lote-nome">
                        <b>{l.tituloExibicao}</b>
                        <small>
                          {[l.editora, dataCurta(l.aquisicao) !== "—" ? dataCurta(l.aquisicao) : "", l.precoPago != null ? brl(l.precoPago) : "", l.leitura ? rotLeitura(l.leitura) : ""]
                            .filter(Boolean).join(" · ") || "sem detalhes na planilha"}
                        </small>
                      </div>
                      {l.volume != null && <span className="lote-vols">#{l.volume}</span>}
                      {existente && (
                        <span className="lote-fonte" style={{ color: "var(--ciano)", borderColor: "rgba(49,187,217,.4)" }} title={`Vai atualizar "${existente.titulo}"`}>
                          atualiza
                        </span>
                      )}
                      {l.colecao && (
                        <span className="lote-fonte" title={l.colecao}>
                          {l.colecao.length > 14 ? l.colecao.slice(0, 13) + "…" : l.colecao}
                        </span>
                      )}
                    </div>
                  );
                })
              : linhas.slice(0, 250).map((l) => {
                  const aj = ajustes[l.ref] || {};
                  const v = (campo, padrao) => (aj[campo] !== undefined ? aj[campo] : (padrao != null ? padrao : ""));
                  const editando = abertaRef === l.ref;
                  const mudou = Object.keys(aj).length > 0;
                  return (
                  <div key={l.ref} className={`lote-item ${fora.has(l.ref) ? "fora" : ""}`}>
                    <div className="lote-linha">
                      <input type="checkbox" checked={!fora.has(l.ref)} onChange={() => alternar(l.ref)} />
                      <div className="lote-capa">
                        {v("capaUrl", l.capaUrl) && <img src={v("capaUrl", l.capaUrl)} alt="" loading="lazy" />}
                      </div>
                      <div className="lote-nome">
                        <b title={v("titulo", l.titulo)}>{v("titulo", l.titulo)}</b>
                        <small>
                          {[v("autor", l.autor), v("editora", l.editora), v("ano", l.ano),
                            v("paginas", l.paginas) ? `${v("paginas", l.paginas)} p.` : ""]
                            .filter(Boolean).join(" · ") || "sem detalhes"}
                        </small>
                      </div>
                      {v("volume", separarVolume(l.titulo).vol) != null && v("volume", separarVolume(l.titulo).vol) !== "" && (
                        <span className="lote-vols">#{v("volume", separarVolume(l.titulo).vol)}</span>
                      )}
                      {mudou && <span className="lote-fonte" style={{ color: "var(--amarelo)", borderColor: "rgba(242,179,61,.4)" }}>editado</span>}
                      <span className="lote-fonte">
                        {l.origem === "Open Library" ? "OL" : l.origem === "Mercado Editorial" ? "CBL" : "GB"}
                      </span>
                      <button
                        className="btn-mini-link"
                        onClick={() => setAbertaRef(editando ? null : l.ref)}
                        title="Ajustar este item antes de importar"
                      >
                        <Pencil size={11} /> {editando ? "fechar" : "editar"}
                      </button>
                    </div>

                    {editando && (
                      <div className="lote-editor">
                        <div className="grade-form">
                          <div className="campo largo">
                            <label>Título</label>
                            <input value={v("titulo", l.titulo)} onChange={(e) => ajustar(l.ref, "titulo", e.target.value)} />
                          </div>
                          <div className="campo">
                            <label>Volume</label>
                            <input
                              value={v("volume", separarVolume(l.titulo).vol ?? "")}
                              inputMode="numeric"
                              onChange={(e) => ajustar(l.ref, "volume", e.target.value.replace(/[^0-9]/g, ""))}
                            />
                          </div>
                          <div className="campo">
                            <label>Editora</label>
                            <input value={v("editora", l.editora)} onChange={(e) => ajustar(l.ref, "editora", e.target.value)} />
                          </div>
                          <div className="campo">
                            <label>Autor</label>
                            <input value={v("autor", l.autor)} onChange={(e) => ajustar(l.ref, "autor", e.target.value)} />
                          </div>
                          <div className="campo">
                            <label>Coleção</label>
                            <input value={v("colecao")} onChange={(e) => ajustar(l.ref, "colecao", e.target.value)}
                                   placeholder="agrupa os volumes" />
                          </div>
                          <div className="campo">
                            <label>Preço pago</label>
                            <input value={v("precoPago")} onChange={(e) => ajustar(l.ref, "precoPago", e.target.value)}
                                   placeholder="64,90" inputMode="decimal" />
                          </div>
                          <div className="campo">
                            <label>Data de aquisição</label>
                            <input value={v("aquisicao")} onChange={(e) => ajustar(l.ref, "aquisicao", e.target.value)}
                                   placeholder="12/03/2023" />
                          </div>
                          <div className="campo largo">
                            <label>Endereço da capa</label>
                            <input value={v("capaUrl", l.capaUrl)} onChange={(e) => ajustar(l.ref, "capaUrl", e.target.value)}
                                   placeholder="https://.../capa.jpg" />
                            <span className="dica">
                              Cole o endereço de outra imagem se a que veio não for a edição certa.
                            </span>
                          </div>
                        </div>
                        <div className="lote-topo">
                          <button className="btn btn-mini" onClick={() => { setAjustes((a) => { const c = { ...a }; delete c[l.ref]; return c; }); }}>
                            <X size={12} /> Desfazer as mudanças deste
                          </button>
                          {["editora", "colecao", "aquisicao", "precoPago"].some((k) => aj[k]) && (
                            <button
                              className="btn btn-mini"
                              onClick={() => {
                                const modelo = {};
                                for (const k of ["editora", "colecao", "aquisicao", "precoPago"]) if (aj[k]) modelo[k] = aj[k];
                                setAjustes((a) => {
                                  const c = { ...a };
                                  for (const x of linhas) if (!fora.has(x.ref)) c[x.ref] = { ...(c[x.ref] || {}), ...modelo };
                                  return c;
                                });
                                aoAvisar("Editora, coleção, data e preço aplicados a todos os selecionados.");
                              }}
                            >
                              <Copy size={12} /> Aplicar a todos
                            </button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                  );
                })}
            {linhasAtivas.length === 0 && <div style={{ padding: 26, textAlign: "center" }} className="dica">Nada encontrado nesta lista.</div>}
          </div>
          {linhasAtivas.length > 250 && (
            <p className="dica" style={{ marginTop: 8 }}>
              Mostrando os 250 primeiros. Todos os {linhasAtivas.length} marcados serão adicionados.
            </p>
          )}
        </>
      )}
    </Modal>
  );
}

/* ══════════════════════════════════════════════════════════════
   COLEÇÕES
   ══════════════════════════════════════════════════════════════ */
/* O nome da série vem dos itens e não se edita aqui — mudar o nome é
   mudar nos volumes. O que se personaliza é o total real de edições, a
   imagem e uma nota. */
/* Escolhe o volume na wiki e traz as datas de capa. A escolha é sua porque
   "Wonder Woman 220" existe em 1975 e em 2005 — o app mostra os volumes e
   você diz qual é, uma vez por série. */
function ModalDatasWiki({ nomeSerie, edicoesTexto, jaTemCapa, podeRenomear, aoAplicar, aoFechar }) {
  const [etapa, setEtapa] = useState("buscando");
  const [volumes, setVolumes] = useState([]);
  const [erro, setErro] = useState("");
  const [achadas, setAchadas] = useState([]);   // [{n, data}] das suas edições
  const [todosNums, setTodosNums] = useState([]);
  const [pontas, setPontas] = useState(null); // numeração completa da série
  const [tipoSerie, setTipoSerie] = useState(null);
  const [fichaVol, setFichaVol] = useState(null);
  const [origemNums, setOrigemNums] = useState("");
  const [escolhido, setEscolhido] = useState(null);
  const [ficha, setFicha] = useState(null);    // créditos e personagens agregados
  const [retratos, setRetratos] = useState({});
  const [querFicha, setQuerFicha] = useState(true);
  const [querNome, setQuerNome] = useState(true);
  const [capa, setCapa] = useState(null);      // { src, pagina } vinda da wiki
  const [capaErro, setCapaErro] = useState("");
  const [querCapa, setQuerCapa] = useState(!jaTemCapa);

  useEffect(() => {
    let vivo = true;
    volumesDaWiki(nomeSerie)
      .then((v) => {
        if (!vivo) return;
        setVolumes(v);
        setEtapa(v.length ? "escolher" : "vazio");

        /* Digitando "Superman (1987)", o ano vira critério: pergunta a data
           da primeira edição de cada volume e põe o mais próximo na frente.
           Uma requisição para todos, e a escolha continua sendo sua. */
        const alvo = anoDoNome(nomeSerie);
        if (v.length > 1) {
          anosDosVolumes(v).then((anos) => {
            if (!vivo || !anos.size) return;
            const com = v.map((x) => ({ ...x, ano: anos.get(x.rot) || null }));
            if (alvo) {
              com.sort((a, b) => {
                if (a.ano == null || b.ano == null) return a.ano == null ? 1 : -1;
                return Math.abs(a.ano - alvo) - Math.abs(b.ano - alvo);
              });
            }
            setVolumes(com);
          }).catch(() => {});
        }
      })
      .catch((e) => { if (vivo) { setErro(String(e.message || e)); setEtapa("erro"); } });
    return () => { vivo = false; };
  }, [nomeSerie]);

  const [manual, setManual] = useState("");

  /* Saída manual: você achou a página no site, cola o endereço e pronto.
     Aceita link de categoria ou de edição, com ou sem escapes de URL. */
  const usarManual = () => {
    let t = manual.trim();
    try { t = decodeURIComponent(t); } catch (e) { /* já estava legível */ }
    const wiki = WIKIS.find((w) => t.includes(new URL(w.base).hostname)) || WIKIS[0];
    t = t.replace(/^https?:\/\/[^/]+\/wiki\//, "").split("#")[0].split("?")[0].replace(/_/g, " ").trim();
    if (!t) return;
    /* Três formas de endereço, e confundi-las quebra a busca:
         Category:X Vol 1   → já é a categoria
         X Vol 1 1          → página da edição, a categoria é "X Vol 1"
         X Vol 1            → página do volume, a categoria tem o mesmo nome
         Batman: War On Crime → página solta, sem volume: lê-se direto */
    const pagina = /^Category:/i.test(t)
      ? t
      : (categoriaDaEdicao(t) || (ehPaginaDeVolume(t) ? "Category:" + t : t));
    /* Guarda também a página que você colou. Deduzir a categoria é o certo
       para uma série longa, mas one-shots muitas vezes não têm categoria de
       volume — aí a própria página da edição é a resposta. */
    abrir({
      wiki, pagina,
      rot: pagina.replace(/^Category:/, ""),
      solta: !/^Category:/i.test(pagina),
      reserva: pagina === t ? "" : t,
    });
  };

  const abrir = async (v) => {
    setEscolhido(v); setEtapa("lendo");
    try {
      // só busca a data das edições que você listou; a numeração da série
      // sai dos títulos, então não custa nada saber que ela vai até a #881
      const meusNums = edicoesDetalhadas(edicoesTexto).map((e) => e.n).filter(Number.isInteger);
      /* A categoria do volume é o caminho certo para séries longas, mas
         one-shots costumam não ter categoria — aí vale a própria página da
         edição que você colou. */
      let eds;
      try {
        eds = await edicoesDaWiki(v.wiki, v.pagina, meusNums);
      } catch (errCat) {
        if (!v.reserva) throw errCat;
        eds = await edicoesDaWiki(v.wiki, v.reserva, meusNums);
      }
      if (!eds.datas.length && !eds.numeros.length && v.reserva) {
        // categoria respondeu vazia sem erro: tenta a própria edição
