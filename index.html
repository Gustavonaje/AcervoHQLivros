            />
          </div>
          <div className="campo" style={{ flex: "2 1 160px" }}>
            <label>Loja</label>
            <input
              list="lojas-conhecidas"
              value={loja}
              onChange={(e) => setLoja(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && registrarPreco()}
              placeholder="Amazon"
            />
            <datalist id="lojas-conhecidas">
              {LOJAS.map((l) => <option key={l.nome} value={l.nome} />)}
            </datalist>
          </div>
          <button className="btn btn-primario" onClick={registrarPreco} style={{ marginBottom: 1 }}>
            <Plus size={14} /> Anotar
          </button>
        </div>

        {precos.length > 0 && (
          <>
            {precos.length > 1 && (
              <div className="graf" title="Preços na ordem em que foram anotados">
                {precos.map((p) => (
                  <i
                    key={p.id}
                    className={p.valor === melhor ? "melhor" : ""}
                    style={{ height: `${Math.max(6, (p.valor / teto) * 100)}%` }}
                  />
                ))}
              </div>
            )}
            <div style={{ marginTop: 8 }}>
              {[...precos].reverse().map((p) => (
                <div className="preco-linha" key={p.id}>
                  <span className={`val ${p.valor === melhor ? "melhor" : ""}`}>{brl(p.valor)}</span>
                  <span className="loja-nome">{p.loja}</span>
                  <span className="data">{dataCurta(p.data)}</span>
                  <button className="btn btn-mini btn-perigo" onClick={() => apagarPreco(p.id)} aria-label="Apagar preço">
                    <X size={12} />
                  </button>
                </div>
              ))}
            </div>
          </>
        )}
        {precos.length === 0 && (
          <p className="dica" style={{ marginTop: 10 }}>
            Nenhum preço anotado ainda. Abra uma loja acima, veja quanto está custando e registre aqui.
          </p>
        )}
      </div>
    </Modal>
  );
}

function Card({ item, capaSrc, colecoes, aoAbrir, indice, selecao, selecionado, aoAlternarSelecao }) {

  const nomes = (item.colecoes || [])
    .map((id) => (colecoes.find((c) => c.id === id) || {}).nome)
    .filter(Boolean);

  return (
    <button
      className={`card ${selecao && selecionado ? "selecionado" : ""}`}
      onClick={selecao ? aoAlternarSelecao : aoAbrir}
      style={{ animationDelay: `${Math.min(indice, 24) * 22}ms` }}
    >
      <div className="card-capa">
        <Capa item={item} src={capaSrc || item.capaUrl} />
        <span className="capa-vinco" />
        {selecao && (
          <span className={`marca-sel ${selecionado ? "on" : ""}`}>
            {selecionado && <Check size={13} />}
          </span>
        )}
        {item.volume != null && <span className="selo vol">#{item.volume}</span>}
        {desejo && abaixoDoAlvo && <span className="selo alvo">{brl(melhor)}</span>}
        {desejo && !abaixoDoAlvo && <span className="selo desejo">Quero</span>}
      </div>
      <div>
        <div className="card-titulo">{item.titulo || "Sem título"}</div>
        <div className="card-sub">
          {!desejo && item.leitura && item.leitura !== "nao_lido" && (
            <span className="pt" style={{ background: (LEITURAS.find((l) => l.v === item.leitura) || {}).cor }} />
          )}
          {nomes[0] || item.autor || item.editora || item.tipo}

}

/* Card da série: só texto e barra de cobertura por padrão. Se você
   escolher uma imagem para a série, ela vira o topo do card. */
/* ─── Mapa cronológico ───
   Uma faixa por série, posicionada pelo período de publicação. Os eventos
   ficam numa camada acima, como marcos. O mapa mostra sobreposição no
   tempo — e só isso. Duas séries no mesmo ano não têm relação nenhuma até
   você dizer que têm. */
/* ─── Mapa temporal ───
   Dois níveis. Na visão geral só aparecem os eventos posicionados no tempo
   — nada de despejar centenas de séries de uma vez. Clicando num evento o
   mapa dá zoom naquele período e aí sim mostra as séries que estavam
   sendo publicadas junto. Navega-se pelo tempo, não por uma lista. */
/* Cada editora original ganha um matiz estável. Antes tudo era ciano, o
   que desperdiçava a cor: com isso a DC e a Marvel se separam sozinhas no
   mapa e dá pra ver de longe onde cada universo se concentra. */
/* Matizes escolhidos a dedo, longe do magenta (que significa "ligada ao
   evento") e do amarelo (que significa "evento"). Cor no mapa é legenda,
   não enfeite — duas coisas diferentes não podem sair da mesma cor. */
const MATIZES = [200, 268, 96, 232, 300, 130, 172, 250];
/* Cor por posição, não por hash: hash fazia DC e Marvel caírem na mesma
   cor, que é justamente o par que precisa se distinguir. A ordem é
   alfabética sobre todas as editoras do acervo, então a cor de cada uma
   não muda conforme o zoom. Luminosidade alternada afasta os vizinhos. */

/* Mesma cor, com alfa só no fundo. Usar opacity no elemento apagava também
   o rótulo da era, que era o que deixava o texto ilegível. */
function RevisarNomes({ fila, retratoDe, aoDecidir, aoFechar }) {
  const [i, setI] = useState(0);
  const [cands, setCands] = useState(null);
  const [erro, setErro] = useState("");
  const [manual, setManual] = useState("");
  const atual = fila[i];

  useEffect(() => {
    if (!atual) return;
    let vivo = true;
    setCands(null); setErro(""); setManual("");
    candidatosPt(atual.nome)
      .then((c) => { if (vivo) { setCands(c); if (!c.length) setErro("Nenhum candidato encontrado."); } })
      .catch(() => { if (vivo) setErro("A busca falhou."); });
    return () => { vivo = false; };
  }, [atual && atual.id]);

  const seguir = () => {
    if (i + 1 >= fila.length) return aoFechar();
    setI(i + 1);
  };

  const escolher = (nome) => { aoDecidir(atual.id, nome); seguir(); };

  if (!atual) return null;

  return (
    <Modal
      titulo={`Nomes em português · ${i + 1} de ${fila.length}`}
      aoFechar={aoFechar}
      rodape={
        <>
          {/* manter é uma decisão, não um adiamento: ele não pergunta de novo */}
          <button className="btn" onClick={() => escolher(atual.nome)}>
            Manter “{semIdentidade(atual.nome)}”
          </button>
          <button className="btn" onClick={seguir}>Pular</button>
          <button className="btn btn-mini" style={{ marginLeft: "auto" }} onClick={aoFechar}>Encerrar</button>
        </>
      }
    >
      <div className="rev-topo">
        <div className="rev-retrato">
          {retratoDe(atual.id)
            ? <img src={retratoDe(atual.id)} alt="" />
            : <span>{atual.nome.slice(0, 2).toUpperCase()}</span>}
        </div>
        <div>
          <h3 className="rev-nome">{atual.nome}</h3>
          <p className="dica" style={{ margin: "2px 0 0" }}>
            {atual.volumes.length} volume(s) · {atual.series.length} série(s)
          </p>
        </div>
      </div>

      {cands === null ? (
        <p className="dica">Procurando…</p>
      ) : (
        <>
          {cands.length > 0 && (
            <div className="rev-ops">
              {cands.map((c) => (
                <button key={c.nome} className="rev-op" onClick={() => escolher(c.nome)}>
                  <b>{c.nome}</b>
                  <em>{c.fonte}</em>
                </button>
              ))}
            </div>
          )}
          {erro && <p className="dica" style={{ color: "var(--papel3)" }}>{erro}</p>}

          <div className="campo largo" style={{ marginTop: 10 }}>
            <label>ou escreva o nome</label>
            <div className="lote-topo" style={{ marginTop: 4 }}>
              <input
                value={manual}
                onChange={(e) => setManual(e.target.value)}
                placeholder="Amazonas de Themyscira"
                onKeyDown={(e) => { if (e.key === "Enter" && manual.trim()) escolher(manual.trim()); }}
                style={{ flex: 1, minWidth: 200 }}
              />
              <button className="btn btn-primario btn-mini" disabled={!manual.trim()}
                      onClick={() => escolher(manual.trim())}>
                <Check size={13} /> Usar
              </button>
            </div>
            <span className="dica">
              Os candidatos vêm da Wikipédia em português e do Wikidata — nenhum é tradução automática.
            </span>
          </div>
        </>
      )}
    </Modal>
  );
}

  const [galeria, setGaleria] = useState(null);      // imagens achadas na wiki

  const [erroImgs, setErroImgs] = useState("");
  const [baixando, setBaixando] = useState("");
  const arquivoRef = useRef(null);

  const buscarImagens = async () => {
    if (!pers.pagina) { setErroImgs("esta entrada não guardou o endereço na wiki"); return; }
    setBuscandoImgs(true); setErroImgs(""); setGaleria(null);
    for (const w of WIKIS) {

    setBaixando(img.src);
    try { setRetratoNovo(await baixarCapaComoBase64(img.src, 400)); setGaleria(null); }
    catch (e) { setErroImgs("o servidor recusou baixar essa imagem: " + (e.message || e)); }

  const enviar = async (e) => {

    try { setRetratoNovo(await comprimirImagem(a, 200)); }

  return (
    <Modal

        <div className="pers-retrato grande">
          {previa ? <img src={previa} alt="" /> : <span>{(f.nome || "?").slice(0, 2).toUpperCase()}</span>}
        </div>
        <div style={{ flex: "1 1 220px", display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="btn btn-mini" onClick={buscarImagens} disabled={buscandoImgs}>
              <ImageIcon size={13} /> {buscandoImgs ? "procurando…" : "Buscar imagens na wiki"}
            </button>
            <button className="btn btn-mini" onClick={() => arquivoRef.current.click()}>
              <Upload size={13} /> Enviar do computador
            </button>
            {previa && (
              <button className="btn btn-mini btn-perigo" onClick={() => setRetratoNovo(null)}>
                <X size={13} /> Remover

          </div>
          <input ref={arquivoRef} type="file" accept="image/*" hidden onChange={enviar} />

          </p>

        </div>
      </div>

      {galeria && (

      <div className="grade-form">
        <div className="campo">
          <label>Nome</label>

function LinhaDoTempo({ linha, series, eventos, eras, aberta, fases, buscandoFases, aoAbrirFaixa,
                       aoAtualizarFases, aoAbrirSerie, aoEditar, aoRemover, aoNovoEvento,
                       aoEditarEvento, aoEditarEras }) {
  const [faseSel, setFaseSel] = useState(null);
  useEffect(() => { setFaseSel(null); }, [aberta, fases]);

  const { faixas, eventos: evs, eras: ers, janela } = useMemo(
    () => montarLinha(linha, series, eventos, eras),
    [linha, series, eventos, eras]
  );

  if (!janela) {
    return (
      <div className="vazio">
        <Calendar size={34} color="var(--papel3)" />
        <h3>{linha.nome || "Linha sem nome"}</h3>
        <p>
          {(linha.series || []).length
            ? "As séries escolhidas ainda não têm período conhecido. Abra cada uma e use “Buscar numeração no DC/Marvel Database”."
            : "Escolha as séries que entram nesta linha."}
        </p>
        <button className="btn btn-primario" onClick={aoEditar}><Pencil size={15} /> Escolher séries</button>
      </div>
    );
  }

  /* Abrindo uma faixa, a escala passa a ser a dela. A Batman Vol 4 começa em
     2025: mostrada na régua de 1937 a 2026, as fases viram um risco de dois
     pixels no canto. Com folga de um ano de cada lado para respirar. */
  const faixaAtiva = faixas.find((f) => f.id === aberta);
  const janelaUsada = faixaAtiva
    ? { ini: idxMes(anoDoIdx(faixaAtiva.ini) - 1, 1), fim: idxMes(anoDoIdx(faixaAtiva.fim) + 1, 12) }
    : janela;

  const larg = janelaUsada.fim - janelaUsada.ini + 1;
  const pos = (i) => ((i - janelaUsada.ini) / larg) * 100;
  const tam = (a, b) => Math.max(0.5, ((b - a + 1) / larg) * 100);
  const noRecorte = (a, b) => b >= janelaUsada.ini && a <= janelaUsada.fim;

  /* Os nomes dos eventos se empilhavam: seis marcos entre 2004 e 2011
     viravam um borrão. Distribui em linhas — cada nome vai para a primeira
     linha onde não encosta no anterior. É o mesmo problema de rótulo de
     mapa, resolvido do mesmo jeito. */
  const LARG_CHAR = 0.58;   // largura média de um caractere, em % da pista
  const rotulos = [];
  const ocupado = [];
  for (const e of evs) {
    const x = pos(e.per.ini);
    const w = (e.nome.length + 2) * LARG_CHAR;
    let linhaRot = 0;
    while (ocupado[linhaRot] != null && x < ocupado[linhaRot]) linhaRot++;
    ocupado[linhaRot] = x + w;
    rotulos.push({ ...e, x, linhaRot });
  }
  const alturaRot = (ocupado.length || 1) * 13 + 4;

  const a1 = anoDoIdx(janelaUsada.ini), a2 = anoDoIdx(janelaUsada.fim);
  const passo = a2 - a1 > 70 ? 20 : a2 - a1 > 35 ? 10 : 5;
  const marcas = [];
  for (let a = Math.ceil(a1 / passo) * passo; a <= a2; a += passo) marcas.push(a);

  return (
    <div className="lt">
      <div className="lt-topo">
        <h2>{linha.nome || "Linha sem nome"}</h2>
        <span className="contagem">{faixas.length} série(s) · {evs.length} evento(s)</span>
        <button className="btn btn-mini" onClick={aoEditar}><Pencil size={12} /> Séries</button>
        <button className="btn btn-mini" onClick={() => aoNovoEvento(linha.id)}><Plus size={12} /> Evento</button>
        <button className="btn btn-mini" onClick={aoEditarEras}><Calendar size={12} /> Eras</button>
        <button className="btn btn-mini btn-perigo" onClick={aoRemover}><Trash2 size={12} /></button>
      </div>

      {/* a era nomeia o trecho do tempo: fica na régua, não entre as faixas */}
      <div className="lt-eras">
        {ers.map((e) => {
          const ini = Math.max(e.per.ini, janelaUsada.ini);
          const fim = Math.min(e.per.fim, janelaUsada.fim);
          if (fim < ini) return null;
          return (
            <span key={e.id || e.nome} className="lt-era" style={{ left: `${pos(ini)}%`, width: `${tam(ini, fim)}%` }}>
              <em>{e.nome}</em>
            </span>
          );
        })}
      </div>

      <div className="lt-regua">
        {marcas.map((a) => (
          <span key={a} className="lt-tick" style={{ left: `${pos(idxMes(a, 1))}%` }}>{a}</span>
        ))}
      </div>

      <div className="lt-rotulos" style={{ height: alturaRot }}>
        {rotulos.filter((e) => noRecorte(e.per.ini, e.per.fim)).map((e) => (
          <button
            key={e.id}
            className={`lt-rot ${e.linha ? "proprio" : ""}`}
            style={{ left: `${e.x}%`, top: e.linhaRot * 13 }}
            onClick={() => aoEditarEvento(e)}
            title={`${e.nome} · ${e.inicio}${e.fim && e.fim !== e.inicio ? ` – ${e.fim}` : ""}${e.linha ? " · só nesta linha" : " · em todas as linhas"}`}
          >
            {e.nome}
          </button>
        ))}
      </div>

      <div className="lt-corpo">
        {/* eventos atravessam todas as faixas, como colunas ao fundo */}
        <div className="lt-eventos">
          {evs.filter((e) => noRecorte(e.per.ini, e.per.fim)).map((e) => {
            const l = pos(e.per.ini), w = tam(e.per.ini, e.per.fim);
            return (
              <span
                key={e.id}
                className={`lt-evento ${e.linha ? "proprio" : ""}`}
                style={{ left: `${l}%`, width: `${Math.max(w, 0.35)}%` }}
              />
            );
          })}
        </div>

        {/* Expandir foca: as outras faixas saem da tela. Antes ficavam
            todas visíveis com a barra de fases no meio, e não dava para
            saber qual barra era de qual série. */}
        {(faixaAtiva ? [faixaAtiva] : faixas).map((f) => {
          const l = pos(f.ini), w = tam(f.ini, f.fim);
          const abertaAqui = aberta === f.id;
          return (
            <React.Fragment key={f.id}>
            <div className={`lt-faixa ${abertaAqui ? "aberta" : ""}`}>
              <button className="lt-nome" onClick={() => aoAbrirFaixa(abertaAqui ? null : f.id)} title={`${f.nome} — ver as fases de roteirista`}>
                <ChevronDown size={11} style={{ transform: abertaAqui ? "none" : "rotate(-90deg)", opacity: .55 }} />
                <b>{f.nome}</b>
              </button>
              <div className="lt-pista">
                {/* Com as fases abertas, a barra da série repetiria o que a
                    de baixo já mostra — só que sem dizer de quem é cada
                    trecho. Então ela sai de cena. */}
                {!(abertaAqui && fases && fases.lista && fases.lista.length) && (
                  <span className="lt-barra" style={{ left: `${l}%`, width: `${w}%` }}>
                    {blocosDePosse(f.tenho, f.primeiro, f.ultimo).map((b, k) => (
                      <i key={k} style={{ left: `${b.esq}%`, width: `${b.larg}%` }} />
                    ))}
                  </span>
                )}
              </div>
              <button className="lt-conta" onClick={() => aoAbrirSerie(f)} title="Abrir a ficha da série">
                {f.tenho.size} de {f.total || "?"}
              </button>
            </div>

            {abertaAqui && (
              <div className="lt-fases">
                {buscandoFases ? (
                  <p className="dica">
                    Lendo os créditos edição por edição… {buscandoFases.feitas} de {buscandoFases.total}
                  </p>
                ) : !fases ? (
                  <p className="dica">
                    Ainda não li as fases desta série.{" "}
                    <button className="btn-mini-link" onClick={() => aoAtualizarFases(f.id)}>
                      <Search size={11} /> buscar agora
                    </button>
                  </p>
                ) : fases.erro ? (
                  <p className="dica" style={{ color: "var(--vermelho)" }}>{fases.erro}</p>
                ) : !fases.lista.length ? (
                  <p className="dica">
                    Li {fases.lidas || 0} de {fases.pedidas || 0} edição(ões), mas nenhuma trouxe
                    roteirista. Se a base tem o crédito na tela, pode ser um formato de ficha que o app
                    ainda não reconhece — me avise qual série.
                  </p>
                ) : (
                  <>
                  <p className="dica" style={{ margin: "0 0 6px", display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                    {fases.salvas
                      ? <span>Guardadas no acervo{fases.lidasEm ? ` desde ${fases.lidasEm.split("-").reverse().join("/")}` : ""}.</span>
                      : <span>Créditos de <b style={{ color: "var(--papel)" }}>{fases.fonte}</b> · {fases.lidas} edição(ões) lidas</span>}
                    <button className="btn-mini-link" onClick={() => aoAtualizarFases(f.id)}>
                      <Search size={11} /> atualizar da wiki
                    </button>
                  </p>
                  {/* Uma barra só, dividida em trechos. Trinta linhas, uma
                      por fase, faziam a página rolar sem fim — e a comparação
                      entre fases, que é o ponto, se perdia. */}
                  {(() => {
                    const trechos = fases.lista.map((fa) => {
                      const p = periodoDoTexto(`${fa.dataIni || ""} ${fa.dataFim || fa.dataIni || ""}`);
                      if (!p) return null;
                      const meu = [...f.tenho].filter((n) => Number.isInteger(n) && n >= fa.ini && n <= fa.fim).length;
                      const tot = fa.fim - fa.ini + 1;
                      return { fa, esq: pos(p.ini), larg: tam(p.ini, p.fim), meu, tot };
                    }).filter(Boolean);
                    if (!trechos.length) return <p className="dica">As fases não têm datas legíveis.</p>;

                    return (
                      <>


                        <div className="fx-barra">
                          {trechos.map((t, k) => (
                            <span
                              key={t.fa.autor + k}
                              className={`fx ${faseSel === k ? "sel" : ""} ${t.meu === 0 ? "vazia" : t.meu === t.tot ? "cheia" : ""}`}
                              style={{
                                left: `${t.esq}%`,
                                width: `${t.larg}%`,
                                background: `hsl(${matizDoTitulo(t.fa.autor)} 45% 34%)`,
                              }}
                              onClick={() => setFaseSel(faseSel === k ? null : k)}
                              title={`${t.fa.autor} · #${rotuloNumero(t.fa.ini)}–${rotuloNumero(t.fa.fim)} · você tem ${t.meu} de ${t.tot} · clique para a lista`}
                            >
                              {/* preenche pela proporção: metade plena é
                                  metade da fase no acervo. Quais edições são,
                                  a lista do clique diz. */}
                              <i style={{ width: `${(t.meu / t.tot) * 100}%`,
                                          background: `hsl(${matizDoTitulo(t.fa.autor)} 62% 58%)` }} />
                            </span>
                          ))}

                        </div>

                        {/* O nome só aqui: com cem fases, escrever dentro de
                            cada lasca não cabia, e a lista inteira virava uma
                            parede de nomes. */}
                        {(() => {
                          const t = faseSel != null ? trechos[faseSel] : null;
                          if (!t) {
                            return (
                              <p className="dica" style={{ margin: "2px 0 0" }}>
                                {trechos.length} fase(s) de roteiro · clique numa cor para ver de quem é.
                                {" "}Os trechos claros são as edições que você tem, na posição em que saíram.
                              </p>
                            );
                          }
                          const todos = [];
                          for (let n = t.fa.ini; n <= t.fa.fim; n++) todos.push(n);
                          const tenho = todos.filter((n) => f.tenho.has(n));
                          const faltam = todos.filter((n) => !f.tenho.has(n));
                          return (
                            <div className="fx-detalhe">
                              <div className="fx-cab">
                                <i style={{ background: `hsl(${matizDoTitulo(t.fa.autor)} 62% 58%)` }} />
                                <b>{t.fa.autor}</b>
                                <span className="fx-num">#{rotuloNumero(t.fa.ini)}–{rotuloNumero(t.fa.fim)}</span>
                                <span className="fx-per">{t.fa.dataIni || "?"} – {t.fa.dataFim || "?"}</span>
                                <span className={`fx-cob ${t.meu === t.tot ? "cheia" : t.meu === 0 ? "vazia" : ""}`}>
                                  {t.meu} de {t.tot}
                                </span>
                                {t.fa.convidados && t.fa.convidados.length > 0 && (
                                  <span className="fx-conv">com {[...new Set(t.fa.convidados)].join(", ")}</span>
                                )}
                                <button className="btn-mini-link" onClick={() => setFaseSel(null)}>fechar</button>
                              </div>

                              {/* as edições em faixas, que é como se fala
                                  delas: "#80-90, 95, 99" e não uma lista de
                                  vinte números soltos */}
                              <div className="fx-listas">
                                <span className="fx-linha tem">
                                  <em>tem</em>
                                  {tenho.length ? compactarNumeros(tenho).replace(/-/g, "–") : "nenhuma"}
                                </span>
                                <span className="fx-linha falta">
                                  <em>falta</em>
                                  {faltam.length ? compactarNumeros(faltam).replace(/-/g, "–") : "nenhuma — fase completa"}
                                </span>
                              </div>
                            </div>
                          );
                        })()}
                      </>
                    );
                  })()}
                  </>
                )}
              </div>
            )}
          </React.Fragment>
          );
        })}
      </div>

      {faixaAtiva && (
        <button className="btn btn-mini" style={{ marginTop: 10 }} onClick={() => aoAbrirFaixa(null)}>
          <ChevronDown size={12} style={{ transform: "rotate(90deg)" }} /> Voltar para as {faixas.length} séries
        </button>
      )}

      <p className="dica" style={{ marginTop: 12 }}>
        {faixaAtiva && <b style={{ color: "var(--papel)" }}>Mostrando só a {faixaAtiva.nome}, no período dela. </b>}
        Os trechos claros são as edições que você tem, na posição em que saíram — é possível ver de
        relance se a coleção está concentrada num período ou espalhada. Clique no nome para abrir as
        fases de roteirista, ou no número para ir à ficha da série.
      </p>
    </div>
  );
}

function FormLinha({ inicial, series, aoSalvar, aoFechar, aoAvisar }) {
  const [nome, setNome] = useState(inicial.nome || "");
  const [escolhidas, setEscolhidas] = useState(new Set(inicial.series || []));
  const [busca, setBusca] = useState("");

  const q = semAcento(busca.trim());
  const lista = useMemo(() => {
    const base = [...series].sort((a, b) => {
      const ma = escolhidas.has(a.id), mb = escolhidas.has(b.id);
      if (ma !== mb) return ma ? -1 : 1;       // as escolhidas sobem
      return (a.ordemEstreia ?? 9e9) - (b.ordemEstreia ?? 9e9) || a.nome.localeCompare(b.nome, "pt-BR");
    });
    return q ? base.filter((x) => semAcento(x.nome).includes(q)) : base;
  }, [series, q, escolhidas]);

  const alternar = (id) => setEscolhidas((p) => {
    const n = new Set(p);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });

  return (
    <Modal
      titulo={inicial.nome ? "Editar linha do tempo" : "Nova linha do tempo"}
      aoFechar={aoFechar}
      rodape={
        <>
          <button
            className="btn btn-primario"
            onClick={() => {
              if (!nome.trim()) return aoAvisar("Dê um nome à linha.");
              aoSalvar({ ...inicial, nome: nome.trim(), series: [...escolhidas] });
            }}
          >
            <Check size={15} /> Salvar
          </button>
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <div className="campo largo" style={{ marginBottom: 14 }}>
        <label>Nome da linha</label>
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Batman" autoFocus />
        <span className="dica">
          Pode ser um personagem, um evento ou um recorte seu — “Batman”, “Ponto de Ignição”,
          “o que li em 2026”.
        </span>
      </div>

      <div className="campo largo">
        <label>Séries desta linha ({escolhidas.size})</label>
        <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="filtrar por nome…" />
      </div>

      <div className="lt-escolha">
        {lista.slice(0, 300).map((se) => (
          <button
            key={se.id}
            className={`lt-op ${escolhidas.has(se.id) ? "on" : ""}`}
            onClick={() => alternar(se.id)}
          >
            <i />
            <b title={se.nome}>{se.nome}</b>
            <em>{se.inicio ? se.inicio.replace(/^\d{2}\//, "") : (se.ano ?? "—")}</em>
            <small>{se.tenho.size} de {se.total || "?"}</small>
          </button>
        ))}
        {!lista.length && <p className="dica">Nenhuma série com esse nome.</p>}
      </div>
      <span className="dica">
        Só aparecem séries com publicação original preenchida. A ordem é por estreia, com as já
        escolhidas no topo.
      </span>
    </Modal>
  );
}

function FormErasLinha({ eras, aoSalvar, aoFechar }) {
  /* O espalhamento vem primeiro: com "{ id: uid(), ...x }" um x sem id
     sobrescrevia o id recém-criado com undefined, e a linha ficava sem
     chave estável — mesmo tropeço do "fim" que zerou a régua. */
  const [lista, setLista] = useState(() =>
    (eras && eras.length ? eras : ERAS_PADRAO).map((x) => ({ ...x, id: x.id || uid() }))
  );
  const set = (i, k, v) => setLista((p) => p.map((x, j) => (j === i ? { ...x, [k]: v } : x)));
  const remover = (i) => setLista((p) => p.filter((_, j) => j !== i));
  return (
    <Modal
      titulo="Eras"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn btn-primario" onClick={() => aoSalvar(lista.filter((x) => x.nome.trim()))}>
            <Check size={15} /> Salvar
          </button>
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <p className="dica" style={{ marginTop: 0 }}>
        As eras nomeiam trechos do tempo e aparecem acima da régua, em todas as linhas. Diferente dos
        eventos, que acontecem dentro delas.
      </p>
      {lista.map((x, i) => (
        <div className="era-linha" key={x.id}>
          <div className="campo" style={{ flex: "2 1 160px" }}>
            <label>Nome</label>
            <input value={x.nome || ""} onChange={(e) => set(i, "nome", e.target.value)} placeholder="Era de Ouro" />
          </div>
          <div className="campo" style={{ flex: "1 1 90px" }}>
            <label>De</label>
            <input value={x.inicio || ""} onChange={(e) => set(i, "inicio", e.target.value)} placeholder="1938" />
          </div>
          <div className="campo" style={{ flex: "1 1 90px" }}>
            <label>Até</label>
            <input value={x.fim || ""} onChange={(e) => set(i, "fim", e.target.value)} placeholder="1956" />
            <span className="dica">vazio = até hoje</span>
          </div>
          <button className="btn btn-mini btn-perigo" onClick={() => remover(i)} title="Remover esta era">
            <X size={12} />
          </button>
        </div>
      ))}
      <button className="btn btn-mini" onClick={() => setLista((p) => [...p, { id: uid(), nome: "", inicio: "", fim: "" }])}>
        <Plus size={12} /> Acrescentar era
      </button>
    </Modal>
  );
}

const MESES_CURTO = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

function MapaAnos({ mapa, anoAberto, capas, aoAbrirAno, aoAbrirSerie }) {
  const [modo, setModo] = useState("serie");   // serie | editora | capa
  if (!mapa.length) {
    return (
      <div className="vazio">
        <BarChart3 size={34} color="var(--papel3)" />
        <h3>Nenhuma edição com data ainda</h3>
        <p>
          O mapa usa a data de capa de cada edição. Preencha a publicação original dos seus volumes —
          ou use a busca no DC/Marvel Database, que traz as datas prontas.
        </p>
      </div>
    );
  }

  const total = mapa.reduce((n, a) => n + a.eds.length, 0);
  const maior = Math.max(...mapa.map((a) => a.eds.length));
  /* Empilhar 160 quadrados numa fileira só daria 1400px de altura. Em cinco
     colunas o ano mais cheio cabe em pouco mais de 200px, e o desenho
     continua lendo como barra. */
  /* O tamanho vem da quantidade de anos: com 87 colunas, quadrado de 6px em
     cinco fileiras daria 3300px de pista. Em 4px e três fileiras, cabe em
     1570px — um empurrão lateral, não cinco telas. */
  const muitos = mapa.length > 55;
  const COLS = muitos ? 3 : 5;
  const L = muitos ? 4 : 6;
  const G = 1;
  const alturaMax = Math.ceil(maior / COLS) * ((modo === "capa" ? Math.round(L * 1.45) : L) + G) + 8;

  /* Editora tem poucos valores, então a cor pode ser fixa e legível; série
     usa o matiz do nome, que dá cor estável sem precisar de legenda. */
  const CORES_EDITORA = {
    "dc comics": "hsl(210 70% 54%)",
    "marvel": "hsl(2 72% 55%)",
    "image": "hsl(0 0% 62%)",
    "dark horse": "hsl(28 70% 50%)",
    "vertigo": "hsl(276 52% 56%)",
  };
  const COR_OUTRAS = "hsl(150 30% 45%)";
  const corDe = (e) => (modo === "editora"
    ? (CORES_EDITORA[semAcento(e.editora || "")] || COR_OUTRAS)
    : `hsl(${matizDoTitulo(e.serie)} 58% 52%)`);

  /* Legenda só do que existe no acervo, com a contagem — uma lista fixa
     mostraria editoras que você não tem. As que não têm cor própria somam
     em "outras", e a dica diz quais são. */
  const legenda = useMemo(() => {
    if (modo !== "editora") return [];
    const conta = new Map();
    const outras = new Map();
    for (const a of mapa) {
      for (const e of a.eds) {
        const chave = semAcento(e.editora || "");
        const rot = (e.editora || "").trim() || "sem editora";
        if (CORES_EDITORA[chave]) conta.set(rot, (conta.get(rot) || 0) + 1);
        else outras.set(rot, (outras.get(rot) || 0) + 1);
      }
    }
    const fora = [...conta.entries()]
      .map(([rot, n]) => ({ rot, n, cor: CORES_EDITORA[semAcento(rot)] }))
      .sort((a, b) => b.n - a.n);
    const totalOutras = [...outras.values()].reduce((x, y) => x + y, 0);
    if (totalOutras) {
      fora.push({
        rot: "outras",
        n: totalOutras,
        cor: COR_OUTRAS,
        detalhe: [...outras.entries()].sort((a, b) => b[1] - a[1]).map(([r, n]) => `${r} (${n})`).join(", "),
      });
    }
    return fora;
  }, [modo, mapa]);

  /* Peças do detalhe: capa legível ou quadrado maior que o da pista. */
  const modoCapa = modo === "capa";
  const LARG_MES = modoCapa ? 26 : 11;
  const ALT_MES = modoCapa ? 38 : 11;
  const COLS_MES = modoCapa ? 3 : 5;

  const peca = (e, k, larg, alt) => (modoCapa && capas[e.id] ? (
    <button
      key={e.id + e.n + k}
      className="mq mq-capa"
      style={{ width: larg, height: alt }}
      title={`${e.serie} #${rotuloNumero(e.n)} · ${MESES_CURTO[e.mes - 1]}/${e.ano || ""} · em ${e.titulo}`}
      onClick={(ev) => { ev.stopPropagation(); aoAbrirSerie(e.id); }}
    >
      <img src={capas[e.id]} alt="" loading="lazy" />
    </button>
  ) : (
    <button
      key={e.id + e.n + k}
      className="mq"
      style={{ width: larg, height: alt, background: corDe(e) }}
      title={`${e.serie} #${rotuloNumero(e.n)} · ${MESES_CURTO[e.mes - 1]}/${e.ano || ""} · em ${e.titulo}`}
      onClick={(ev) => { ev.stopPropagation(); aoAbrirSerie(e.id); }}
    />
  ));

  const grande = (e, k) => peca(e, k, LARG_MES, ALT_MES);

  // peça da pista: pequena, no tamanho que faz os 87 anos caberem
  const quadrado = (e, k) => peca(e, k, L, modoCapa ? Math.round(L * 1.45) : L);

  return (
    <div className="mapa-anos">
      <div className="chips" style={{ marginBottom: 10 }}>
        {[["serie", "Cor por série"], ["editora", "Cor por editora"], ["capa", "Capas"]].map(([v, rot]) => (
          <button key={v} className={`chip ${modo === v ? "ativo" : ""}`} onClick={() => setModo(v)}>{rot}</button>
        ))}
      </div>

      {legenda.length > 0 && (
        <div className="ma-legenda">
          {legenda.map((x) => (
            <span key={x.rot} title={x.detalhe || `${x.n} edição(ões)`}>
              <i style={{ background: x.cor }} />
              {x.rot}
              <b>{x.n}</b>
            </span>
          ))}
        </div>
      )}

      <p className="dica" style={{ marginTop: 0 }}>
        {total} edição(ões) com data de capa, de {mapa[0].ano} a {mapa[mapa.length - 1].ano}.
        Cada quadrado é uma edição, na cor da série. Clique num ano para ver mês a mês, ou num
        quadrado para abrir a série.
      </p>

      <div className="ma-pista" style={{ height: alturaMax + 34 }}>
        {mapa.map((a) => {
          const aberto = anoAberto === a.ano;
          return (
            <button
              key={a.ano}
              className={`ma-ano ${aberto ? "aberto" : ""} ${anoAberto != null && !aberto ? "apagado" : ""}`}
              onClick={() => aoAbrirAno(aberto ? null : a.ano)}
              title={`${a.ano} · ${a.eds.length} edição(ões) — clique para abrir os meses`}
            >
              <span className="ma-bloco" style={{ width: COLS * (L + G), gap: G }}>
                {a.eds.map(quadrado)}
              </span>
              {/* a década inteira ancora a leitura; os anos do meio viram
                  traço, e o ano aberto mostra o número sempre */}
              <em className={aberto ? "fixo" : ""}>
                {aberto || a.ano % 10 === 0 ? a.ano : a.ano % 5 === 0 ? "·" : ""}
              </em>
            </button>
          );
        })}
      </div>

      {anoAberto != null && (() => {
        const a = mapa.find((x) => x.ano === anoAberto);
        if (!a) return null;
        return (
          <div className="ma-meses">
            <div className="ma-meses-topo">
              <b>{a.ano}</b>
              <span className="contagem">{a.eds.length} edição(ões) · {new Set(a.eds.map((e) => e.id)).size} série(s)</span>
              <button className="btn btn-mini" onClick={() => aoAbrirAno(null)}><X size={12} /> fechar</button>
            </div>
            {/* No detalhe as peças são maiores, e o mês cresce para BAIXO em
                poucas colunas. Uma fileira horizontal por mês empurrava a
                rolagem lateral para fora da tela em meses de 18 edições. */}
            <div className={`ma-mes-grade ${modoCapa ? "capas" : ""}`}>
              {a.porMes.map(([mes, eds]) => (
                <div className="ma-mes" key={mes}>
                  <em>{MESES_CURTO[mes - 1]}</em>
                  <small>{eds.length}</small>
                  <span
                    className="ma-bloco detalhe"
                    style={{ gap: 2, width: COLS_MES * (LARG_MES + 2) }}
                  >
                    {eds.map((e, k) => grande({ ...e, ano: a.ano }, k))}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

const ROTULO_ABA = {

  personagens: "Personagens", listas: "Listas", relatorios: "Relatórios",

const ROTULO_PARTE = {
  itens: "títulos", colecoes: "coleções", listas: "listas", series: "séries",
  eventos: "eventos", eras: "eras", personagens: "personagens",

};

function EscolherLado({ nuvem: cN, local: cL, aoUsarNuvem, aoUsarLocal, aoFechar }) {
  const linhas = Object.keys(ROTULO_PARTE).filter((k) => (cN[k] || 0) !== (cL[k] || 0));
  const somaN = Object.values(cN).reduce((a, b) => a + b, 0);
  const somaL = Object.values(cL).reduce((a, b) => a + b, 0);
  const nuvemMaior = somaN > somaL;

  return (
    <Modal
      titulo="Os dois lados estão diferentes"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className={`btn ${nuvemMaior ? "btn-primario" : ""}`} onClick={aoUsarNuvem}>
            <Download size={14} /> Trazer da nuvem
          </button>
          <button className={`btn ${!nuvemMaior ? "btn-primario" : ""}`} onClick={aoUsarLocal}>
            <Upload size={14} /> Enviar o daqui
          </button>
          <button className="btn btn-mini" style={{ marginLeft: "auto" }} onClick={aoFechar}>
            decidir depois
          </button>
        </>
      }
    >
      <p className="dica" style={{ marginTop: 0 }}>
        {nuvemMaior
          ? "A nuvem tem mais coisas que este aparelho — provavelmente você mexeu em outro lugar."
          : "Este aparelho tem mais coisas que a nuvem — provavelmente você mexeu aqui sem estar conectado."}
        {" "}Nada foi alterado ainda. Escolhendo um lado, o outro é substituído.
      </p>

      <div className="cmp">
        <div className="cmp-cab">
          <span />
          <b>na nuvem</b>
          <b>aqui</b>
        </div>
        {linhas.map((k) => {
          const n = cN[k] || 0, l = cL[k] || 0;
          return (
            <div className="cmp-linha" key={k}>
              <span>{ROTULO_PARTE[k]}</span>
              <b className={n > l ? "mais" : n < l ? "menos" : ""}>{n}</b>
              <b className={l > n ? "mais" : l < n ? "menos" : ""}>{l}</b>
            </div>
          );
        })}
        {!linhas.length && <p className="dica">As contagens batem; a diferença está no conteúdo.</p>}
      </div>

      <p className="dica" style={{ marginTop: 10 }}>
        Em dúvida, escolha "decidir depois" e guarde uma cópia local pelo painel da nuvem — aí nenhum
        dos dois se perde enquanto você confere.
      </p>
    </Modal>
  );
}

function FormGrupoSerie({ inicial, series, grupos, capas, aoSalvar, aoRemover, aoFechar, aoAvisar }) {
  const [nome, setNome] = useState(inicial.nome || "");
  const [escolhidas, setEscolhidas] = useState(new Set(inicial.series || []));
  const [capa, setCapa] = useState(inicial.capa || "");
  const [busca, setBusca] = useState("");

  // de quem é cada série, para avisar antes de roubar de outro grupo
  const dono = useMemo(() => {
    const m = new Map();
    for (const g of grupos) {
      if (g.id === inicial.id) continue;
      for (const id of g.series || []) m.set(id, g.nome);
    }
    return m;
  }, [grupos, inicial.id]);

  const q = semAcento(busca.trim());
  const lista = useMemo(() => {
    const base = [...series].sort((a, b) => {
      const ma = escolhidas.has(a.id), mb = escolhidas.has(b.id);
      if (ma !== mb) return ma ? -1 : 1;
      return a.nome.localeCompare(b.nome, "pt-BR");
    });
    return q ? base.filter((x) => semAcento(x.nome).includes(q)) : base;
  }, [series, q, escolhidas]);

  const alternar = (id) => setEscolhidas((p) => {
    const n = new Set(p);
    if (n.has(id)) { n.delete(id); if (capa === id) setCapa(""); }
    else n.add(id);
    return n;
  });

  const membros = series.filter((x) => escolhidas.has(x.id));

  return (
    <Modal
      titulo={inicial.nome ? "Editar grupo de séries" : "Novo grupo de séries"}
      aoFechar={aoFechar}
      rodape={
        <>
          <button
            className="btn btn-primario"
            onClick={() => {
              if (!nome.trim()) return aoAvisar("Dê um nome ao grupo.");
              if (!escolhidas.size) return aoAvisar("Escolha ao menos uma série.");
              aoSalvar({ ...inicial, nome: nome.trim(), series: [...escolhidas], capa });
            }}
          >
            <Check size={15} /> Salvar
          </button>
          {inicial.nome && (
            <button className="btn btn-perigo" onClick={() => aoRemover(inicial)}>
              <Trash2 size={14} /> Desfazer grupo
            </button>
          )}
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <div className="campo largo" style={{ marginBottom: 14 }}>
        <label>Nome do grupo</label>
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Death Metal" autoFocus />
        <span className="dica">
          É só organização da aba Séries: as séries e as edições continuam exatamente como estão.
        </span>
      </div>

      <div className="campo largo">
        <label>Séries do grupo ({escolhidas.size})</label>
        <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="filtrar por nome…" />
      </div>

      <div className="lt-escolha">
        {lista.slice(0, 400).map((se) => (
          <button
            key={se.id}
            className={`lt-op ${escolhidas.has(se.id) ? "on" : ""}`}
            onClick={() => alternar(se.id)}
            title={dono.get(se.id) ? `hoje está no grupo “${dono.get(se.id)}” — escolhendo aqui, ela sai de lá` : se.nome}
          >
            <i />
            <b title={se.nome}>{se.nome}</b>
            {dono.get(se.id) && <em style={{ color: "var(--amarelo)" }}>em {dono.get(se.id)}</em>}
            <small>{se.tenho.size} de {se.total || "?"}</small>
          </button>
        ))}
        {!lista.length && <p className="dica">Nenhuma série com esse nome.</p>}
      </div>

      {membros.length > 0 && (
        <div className="secao" style={{ marginTop: 4 }}>
          <p className="secao-tit">Capa do grupo</p>
          <div className="galeria-wiki">
            {membros.map((m) => (
              <button
                key={m.id}
                className={`gal-item ${capa === m.id ? "" : ""}`}
                style={capa === m.id ? { borderColor: "var(--ciano)" } : undefined}
                onClick={() => setCapa(capa === m.id ? "" : m.id)}
                title={m.nome}
              >
                {capas[m.id]
                  ? <img src={capas[m.id]} alt="" loading="lazy" />
                  : <div className="capa-vazia" style={{ height: "100%" }}><b>{m.nome}</b></div>}
                <em>{capa === m.id ? "escolhida" : m.nome.slice(0, 18)}</em>
              </button>
            ))}
          </div>
          <span className="dica">
            Clique numa capa para representar o grupo. Sem escolha, o card mostra só o nome.
          </span>
        </div>
      )}
    </Modal>
  );
}

function CardSerie({ serie, capaSrc, indice, noGrupo, aoAbrir }) {
  const pct = serie.total > 0 ? Math.round((serie.tenho.size / serie.total) * 100) : 0;
  /* Três estados: amarelo continua saindo, verde encerrou, vermelho foi
     cancelada. Os dois primeiros vêm declarados no modelo do volume; o
     terceiro é marcação sua, porque a base não distingue "acabou" de "foi
     cortada". Sem informação, não há bolinha. */
  /* O "em publicação" da base depende de alguém preencher o EndYear, e
     volumes antigos ficaram para trás: a More Fun Comics consta como ativa
     embora a última edição seja de 1947. Então a evidência desmente a
     declaração — última edição há mais de dois anos, a série acabou. */
  const situacao = (() => {
    if (serie.cancelada) return { cor: "cancelada", rot: `Cancelada${serie.anoFim ? ` em ${serie.anoFim}` : ""}` };
    if (serie.publicando == null) return null;

    const p = serie.fimTexto ? periodoDoTexto(serie.fimTexto) : null;
    const mesesParado = p ? idxMes(new Date().getFullYear(), new Date().getMonth() + 1) - p.fim : null;

    if (serie.publicando) {
      if (mesesParado != null && mesesParado > 24) {
        const ano = anoDoIdx(p.fim);
        return {
          cor: "encerrada duvida",
          rot: `A base diz "em publicação", mas a última edição é de ${rotuloIdx(p.fim, true)} — provavelmente encerrada`,
        };
      }
      return { cor: "publicando", rot: "Em publicação" };
    }
    return { cor: "encerrada", rot: `Encerrada${serie.anoFim ? ` em ${serie.anoFim}` : ""}` };
  })();
  return (
    <button className={`card card-serie ${noGrupo ? "no-grupo" : ""}`} onClick={aoAbrir} style={{ animationDelay: `${Math.min(indice, 24) * 22}ms` }}>
      {capaSrc ? (
        <div className="card-capa">
          <img src={capaSrc} alt="" loading="lazy" />
          {situacao && <span className={`selo-sit ${situacao.cor}`} title={situacao.rot} />}
        </div>
      ) : (
        <div className="serie-marca" style={{ background: `hsl(${matizDoTitulo(serie.nome)} 42% 26%)` }}>
          <Globe size={20} />
          <span>{serie.total > 0 ? `${pct}%` : "—"}</span>
          {situacao && <span className={`selo-sit ${situacao.cor}`} title={situacao.rot} />}
        </div>
      )}

      <div className="serie-txt">
        <div className="serie-nome" title={serie.nome}>{serie.nome}</div>
        <div className="serie-sub">
          {(serie.inicio || serie.ano != null) && (
            <b
              className={`selo-estreia ${serie.estreiaReal ? "" : "palpite"}`}
              title={serie.estreiaReal
                ? "Estreia da série, segundo o DC/Marvel Database"
                : "Deduzida da edição mais antiga que você tem — busque a numeração para a data real"}
            >
              {serie.estreiaReal ? serie.inicio.replace(/^\d{2}\//, "") : `${serie.ano}?`}
            </b>
          )}
          {serie.tipo && (
            <b className={`selo-tipo ${serie.tipoDeduzido ? "palpite" : ""}`}
               title={serie.tipoDeduzido ? "deduzido do tamanho da série — ajuste em Personalizar" : "informado"}>
              {serie.tipo}{serie.tipoDeduzido ? "?" : ""}
            </b>
          )}
          {[
            serie.editora,
            serie.data || (serie.ano != null ? (serie.mes != null ? `${String(serie.mes).padStart(2, "0")}/${serie.ano}` : String(serie.ano)) : ""),
          ].filter(Boolean).join(" · ") || "—"}
        </div>

        {serie.total > 0 ? (
          <>
            <div className="serie-cob">
              Cobertura: <b>{serie.tenho.size}/{serie.total}</b>
              {serie.totalEstimado && <span className="serie-est" title="Faixa deduzida do que você tem. Abra a série e informe a numeração real.">?</span>}
            </div>
            <Lombadas total={serie.total} tenho={serie.tenho} querendo={serie.querendo} />
            <div className={`serie-falta ${serie.completa ? "ok" : ""}`}>
              {serie.completa ? "Completa" : `Faltam: ${serie.faltam.length}`}
              {!serie.completa && serie.querendo.size > 0 && (
                <span className="serie-desejo"> · {serie.querendo.size} nos desejos</span>
              )}
            </div>
          </>
        ) : (
          <div className="serie-falta">{serie.itens.length} volume(s), sem numeração informada</div>
        )}
      </div>
    </button>
  );
}

function CardColecao({ col, itens, capaDe, aoAbrir, indice, arrastavel, arrastando, alvo, aoArrastarInicio, aoArrastarSobre, aoSairDoAlvo, aoSoltar, aoArrastarFim }) {
  const e = estadoColecao(col, itens);
  const capa = capaDe(col) || [...e.naEstante, ...e.membros]
    .sort((a, b) => (a.volume ?? 999) - (b.volume ?? 999))
    .map((i) => capaDe(i))
    .find(Boolean);
  const primeiro = e.membros.length ? e.membros[0] : { titulo: col.nome, autor: "" };

  return (
    <button
      className={`card ${arrastando ? "arrastando" : ""} ${alvo ? "alvo-solta" : ""}`}
      onClick={aoAbrir}
      style={{ animationDelay: `${Math.min(indice, 24) * 22}ms` }}
      draggable={!!arrastavel}
      onDragStart={arrastavel ? (ev) => {
        ev.dataTransfer.effectAllowed = "move";
        // o Firefox só inicia o arrasto se algum dado for definido
        try { ev.dataTransfer.setData("text/plain", col.id); } catch {}
        aoArrastarInicio();
      } : undefined}
      onDragOver={arrastavel ? (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; aoArrastarSobre(); } : undefined}
      onDragLeave={arrastavel ? aoSairDoAlvo : undefined}
      onDrop={arrastavel ? (ev) => { ev.preventDefault(); ev.stopPropagation(); aoSoltar(); } : undefined}
      onDragEnd={arrastavel ? aoArrastarFim : undefined}
    >
      {arrastavel && (
        <span className="alca-arrasto" title="Arraste para reordenar">
          <GripVertical size={14} />
        </span>
      )}
      <div className="card-capa pilha">
        <Capa item={{ ...primeiro, titulo: col.nome }} src={capa} />
        <span className="capa-vinco" />
        {col.tipo === "serie" ? (
          <span className={`selo ${e.completa ? "ok" : e.total > 0 ? "falta" : "tema"}`}>
            {e.total > 0 ? (e.completa ? "Completa" : `Faltam ${e.faltam.length}`) : "Sem total"}
          </span>
        ) : (
          <span className="selo tema">{e.membros.length} itens</span>
        )}
      </div>
      {col.tipo === "serie" && <Lombadas total={e.total} tenho={e.tenho} querendo={e.querendo} legenda />}
      <div>
        <div className="card-titulo">{col.nome}</div>
        <div className="card-sub">
          {col.tipo === "serie"
            ? e.total > 0
              ? `${e.tenho.size} de ${e.total} volumes`
              : `${e.naEstante.length} volumes · defina o total`
            : `${e.membros.length} ${e.membros.length === 1 ? "item" : "itens"}`}
        </div>
      </div>
    </button>
  );
}

/* ══════════════════════════════════════════════════════════════

function Acervo() {
  const [itens, setItens] = useState([]);
  const [colecoes, setColecoes] = useState([]);
  const [listas, setListas] = useState([]);
  const [metaSeries, setMetaSeries] = useState([]); // só o que você personaliza numa série
  const [eventos, setEventos] = useState([]);
  const [eras, setEras] = useState([]);
  const [metaPers, setMetaPers] = useState([]); // fichas de personagem já baixadas
  const [linhasTempo, setLinhasTempo] = useState([]);
  const [gruposSerie, setGruposSerie] = useState([]);
  const [grupoEditando, setGrupoEditando] = useState(null);
  const [gruposAbertos, setGruposAbertos] = useState([]);
  const [vistaSeries, setVistaSeries] = useState("lista");   // lista | mapa
  const [anoAberto, setAnoAberto] = useState(null);
  const [linhaAberta, setLinhaAberta] = useState(null);
  const [linhaEditando, setLinhaEditando] = useState(null);
  const [faixaAberta, setFaixaAberta] = useState(null);
  const [fasesPorSerie, setFasesPorSerie] = useState({});   // guardadas depois de lidas
  const [buscandoFases, setBuscandoFases] = useState(null);
  const [eventoEditando, setEventoEditando] = useState(null);
  const [erasEditando, setErasEditando] = useState(false);
  const [capas, setCapas] = useState({});
  const [carregando, setCarregando] = useState(true);
  const [aba, setAba] = useState("estante");
  const [modoSelecao, setModoSelecao] = useState(false);
  const [selecionados, setSelecionados] = useState(() => new Set());
  useEffect(() => { setModoSelecao(false); setSelecionados(new Set()); }, [aba]);
  const [busca, setBusca] = useState("");
  const [fTipo, setFTipo] = useState("");
  const [fEditora, setFEditora] = useState("");
  const [fGenero, setFGenero] = useState("");
  const [fColecao, setFColecao] = useState("");
  const [ordem, setOrdem] = useState("recentes");
  const [ordemInv, setOrdemInv] = useState(false);

  /* Ordenação das coleções: alfabética (padrão) ou manual, arrastando os cards.
     A escolha fica no navegador — é preferência de tela, não dado do acervo. */
  const [colManual, setColManual] = useState(() => {
    try { return localStorage.getItem("acervo:colecoes-manual") === "1"; } catch { return false; }
  });
  useEffect(() => {
    try { localStorage.setItem("acervo:colecoes-manual", colManual ? "1" : "0"); } catch {}
  }, [colManual]);
  const [colArrastada, setColArrastada] = useState(null); // id sendo arrastado
  const [colAlvo, setColAlvo] = useState(null);           // id sob o cursor

  /* Paginação da grade de itens: com alguns milhares de cards o navegador
     engasga se todos forem pro DOM de uma vez. */
  const [porPagina, setPorPagina] = useState(() => {
    try {
      const n = parseInt(localStorage.getItem("acervo:por-pagina") || "60", 10);
      return [60, 100, 200, 0].includes(n) ? n : 60;
    } catch { return 60; }
  });
  const [pagina, setPagina] = useState(1);
  useEffect(() => {
    try { localStorage.setItem("acervo:por-pagina", String(porPagina)); } catch {}
  }, [porPagina]);
  const [editando, setEditando] = useState(null);
  const [aberto, setAberto] = useState(null);
  const [navLista, setNavLista] = useState(null); // itens pra navegar com as setinhas, ou null se não fizer sentido aqui
  /* De onde o item foi aberto. Ao fechar o detalhe, volta exatamente para
     essa tela — antes o app jogava você na estante e você tinha que entrar
     na coleção de novo. */
  const [origemItem, setOrigemItem] = useState(null);
  const [colEditando, setColEditando] = useState(null);
  const [colAberta, setColAberta] = useState(null);
  const [serieAberta, setSerieAberta] = useState(null);
  const [serieEditando, setSerieEditando] = useState(null);
  const [fSerie, setFSerie] = useState("todas"); // todas | lacunas | completas
  // situação é filtro próprio: cruzar com lacunas é útil — "em publicação e
  // com lacunas" é a lista do que dá para continuar comprando
  const [fSit, setFSit] = useState("todas"); // todas | publicando | encerrada | cancelada | semdado
  const [persAberto, setPersAberto] = useState(null);  // { nome, pagina }
  const [persEditando, setPersEditando] = useState(null);
  const [persCarregando, setPersCarregando] = useState(false);
  const [persErro, setPersErro] = useState("");
  const [ordemSerie, setOrdemSerie] = useState(() => {
    try { return localStorage.getItem("acervo:ordem-series") || "completar"; } catch { return "completar"; }
  });
  useEffect(() => {
    try { localStorage.setItem("acervo:ordem-series", ordemSerie); } catch {}
  }, [ordemSerie]);
  const [listaEditando, setListaEditando] = useState(null);
  const [listaAberta, setListaAberta] = useState(null);
  const [importando, setImportando] = useState(false);
  const [completando, setCompletando] = useState(null);
  const [fLeitura, setFLeitura] = useState("");
  const [trocaEditora, setTrocaEditora] = useState(null);
  const [arquivo, setArquivo] = useState(null);
  const [permPendente, setPermPendente] = useState(false);
  const [modalArquivo, setModalArquivo] = useState(false);
  const [salvoEm, setSalvoEm] = useState(null);
  const [modalReset, setModalReset] = useState(false);
  const [toast, setToast] = useState("");

  const carregado = useRef(false);
  const buscaRef = useRef(null);
  const importRef = useRef(null);

  const avisar = useCallback((m) => {
    setToast(m);
    setTimeout(() => setToast((t) => (t === m ? "" : t)), 3200);
  }, []);

  /* ---- carga inicial ---- */
  useEffect(() => {
    let vivo = true;
    (async () => {
      try {
        const d = await carregarTudo();
        if (!vivo) return;
        let ite = d.itens, col = d.colecoes, lst = d.listas, ser = d.series || [], evt = d.eventos || [], era = d.eras || [], per = d.personagens || [], lt = d.linhasTempo || [], gs = d.gruposSerie || [], cap = d.capas;

        if (suportaArquivo) {
          const h = await buscarAtalho();
          if (h && vivo) {
            setArquivo({ handle: h, nome: h.name });
            const perm = await h.queryPermission({ mode: "readwrite" });
            if (perm === "granted") {
              try {
                const doDisco = await lerArquivoDoDisco(h);
                if (doDisco) {
                  ite = doDisco.itens;
                  col = doDisco.colecoes;
                  lst = doDisco.listas || [];
                  ser = doDisco.series || ser;
                  evt = doDisco.eventos || evt;
                  era = doDisco.eras || era;
                  per = doDisco.personagens || per;
                  lt = doDisco.linhasTempo || lt;
                  gs = doDisco.gruposSerie || gs;
                  cap = { ...cap, ...doDisco.capas };
                }
              } catch (e) { avisar("O arquivo vinculado não pôde ser lido."); }
            } else {
              setPermPendente(true);
            }
          }
        }

        if (!vivo) return;
        setItens(ite);
        setMetaSeries(ser);
        setEventos(evt);
        setEras(era);
        setMetaPers(per);
        setLinhasTempo(lt);
        setGruposSerie(gs);
        setColecoes(col);
        setListas(lst);
        setCapas(cap);
      } catch (e) {
        if (vivo) avisar("Não foi possível ler os dados salvos.");
      }
      if (vivo) {
        setCarregando(false);
        carregado.current = true;
      }
    })();
    return () => { vivo = false; };
  }, [avisar]);

  // avisa uma vez por sessão, não a cada gravação
  const cacheCheio = useRef(false);
  const [falhaArquivo, setFalhaArquivo] = useState(null);

  /* ---- nuvem ---- */
  const [cfgNuvem, setCfgNuvem] = useState(() => lerConfigNuvem());
  const [sessao, setSessao] = useState(null);
  const [painelNuvem, setPainelNuvem] = useState(false);
  /* Mexendo no computador e no celular, entrar deixou de ser opcional: sem
     sessão, tudo o que você fizer fica só naquele aparelho. Então a entrada
     pede o login — com saída para quem precisar trabalhar solto. */
  const [semNuvem, setSemNuvem] = useState(false);
  /* Só no celular: as abas viram um menu e os filtros ficam atrás de um
     botão. No computador nada disso aparece — lá a barra inteira cabe. */
  const [menuCel, setMenuCel] = useState(false);
  const [filtrosCel, setFiltrosCel] = useState(false);
  const [nuvemOcupada, setNuvemOcupada] = useState("");
  const [nuvemEm, setNuvemEm] = useState(null);
  const partesSujas = useRef(new Set());

  /* Sessão guardada pelo próprio Supabase: reabrindo o app, você continua
     conectado sem digitar nada. */
  useEffect(() => {
    const sb = nuvem();
    if (!sb) return;
    let vivo = true;
    sb.auth.getSession().then(({ data }) => { if (vivo) setSessao(data.session || null); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, ses) => { if (vivo) setSessao(ses); });
    return () => { vivo = false; sub && sub.subscription && sub.subscription.unsubscribe(); };
  }, [cfgNuvem]);

  const valorDaParte = useCallback((parte) => ({
    itens, colecoes, listas, series: metaSeries, eventos, eras,
    personagens: metaPers, linhasTempo, gruposSerie,
  })[parte], [itens, colecoes, listas, metaSeries, eventos, eras, metaPers, linhasTempo, gruposSerie]);

  /* Envia as imagens. Pula as órfãs — 649 capas de itens já apagados, 38 MB
     que não servem a nada — e as que já estão lá. */
  const [capasProg, setCapasProg] = useState(null);
  const pararCapas = useRef(false);

  const chavesUteis = useCallback(() => {
    const ids = new Set(itens.map((i) => i.id));
    return Object.keys(capas).filter((k) => k.startsWith("pers:") || ids.has(k));
  }, [itens, capas]);

  const enviarCapas = async () => {
    if (!sessao) return;
    pararCapas.current = false;
    setCapasProg({ feitas: 0, total: 0, etapa: "conferindo o que já está lá…" });
    let jaLa = new Set();
    try { jaLa = new Set(await listarCapasNuvem()); } catch (e) { /* segue enviando tudo */ }

    const alvos = chavesUteis().filter((k) => !jaLa.has(k));
    if (!alvos.length) {
      setCapasProg(null);
      return avisar("Todas as imagens já estão na nuvem.");
    }

    let enviadas = 0, falhas = 0, feitas = 0;
    const filaEnv = [...alvos];
    const enviarUm = async () => {
      while (filaEnv.length && !pararCapas.current) {
        const k = filaEnv.shift();
        try { if (await enviarCapaNuvem(k, capas[k])) enviadas++; }
        catch (e) { falhas++; }
        feitas++;
        if (feitas % 5 === 0 || !filaEnv.length) {
          setCapasProg({ feitas, total: alvos.length, etapa: "enviando" });
        }
      }
    };
    await Promise.all(Array.from({ length: 6 }, enviarUm));
    setCapasProg(null);
    avisar(pararCapas.current
      ? `Interrompido. ${enviadas} imagem(ns) enviadas.`
      : `${enviadas} imagem(ns) enviadas${falhas ? `, ${falhas} falharam` : ""}.`);
  };

  /* Traz o que falta aqui. Num aparelho novo, é isto que enche o acervo de
     capas sem você reenviar nada. */
  const baixarCapas = async () => {
    if (!sessao) return;
    pararCapas.current = false;
    setCapasProg({ feitas: 0, total: 0, etapa: "vendo o que há na nuvem…" });
    let naNuvem = [];
    try { naNuvem = await listarCapasNuvem(); } catch (e) {
      setCapasProg(null);
      return avisar("Não consegui listar as imagens da nuvem.");
    }
    const faltam = naNuvem.filter((k) => !capas[k]);
    if (!faltam.length) {
      setCapasProg(null);
      return avisar("Todas as imagens da nuvem já estão aqui.");
    }
    /* Seis por vez em vez de uma: o tempo é de espera de rede, não de
       processamento, então baixar em paralelo multiplica a velocidade.
       2500 imagens em fila levariam quase uma hora. */
    let trazidas = 0, feitas = 0;
    const FRENTES = 6;
    const fila = [...faltam];

    const trabalhar = async () => {
      while (fila.length && !pararCapas.current) {
        const k = fila.shift();
        try {
          const d = await baixarCapaNuvem(k);
          if (d) { await guardarCapa(k, d); trazidas++; }
        } catch (e) { /* uma que falha não para as outras */ }
        feitas++;
        if (feitas % 5 === 0 || !fila.length) {
          setCapasProg({ feitas, total: faltam.length, etapa: "baixando" });
        }
      }
    };
    await Promise.all(Array.from({ length: FRENTES }, trabalhar));
    setCapasProg(null);
    avisar(`${trazidas} imagem(ns) trazidas da nuvem.`);
  };

  /* Salvaguarda automática. A nuvem pode falhar, a conta pode expirar, o
     projeto pode sumir — e um acervo de dois anos não deve depender de um
     serviço só. A cada meia hora, grava uma cópia onde der: no arquivo
     vinculado, se houver; senão, baixa para a pasta de downloads. */
  const [backupAuto, setBackupAuto] = useState(() => {
    try { return localStorage.getItem("acervo:backup-auto") !== "0"; } catch (e) { return true; }
  });
  const [backupEm, setBackupEm] = useState(null);

  useEffect(() => {
    try { localStorage.setItem("acervo:backup-auto", backupAuto ? "1" : "0"); } catch (e) {}
  }, [backupAuto]);

  const salvaguarda = useCallback(async (manual) => {
    if (!carregado.current) return;
    const dados = {
      versao: 2, itens, colecoes, listas, series: metaSeries, eventos, eras,
      personagens: metaPers, linhasTempo, gruposSerie, capas,
    };
    // com arquivo vinculado, ele já está sendo gravado: não duplica
    if (arquivo && !permPendente) {
      setBackupEm(new Date());
      if (manual) avisar("O arquivo vinculado já está atualizado.");
      return;
    }
    try {
      const blob = new Blob([JSON.stringify(dados)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `acervo-${hoje()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      setBackupEm(new Date());
      if (manual) avisar("Cópia baixada.");
    } catch (e) {
      if (manual) avisar("Não consegui baixar a cópia.");
    }
  }, [itens, colecoes, listas, metaSeries, eventos, eras, metaPers, linhasTempo, gruposSerie, capas, arquivo, permPendente, avisar]);

  useEffect(() => {
    if (!backupAuto) return;
    const t = setInterval(() => salvaguarda(false), 30 * 60 * 1000);
    return () => clearInterval(t);
  }, [backupAuto, salvaguarda]);

  const enviarTudo = async () => {
    if (!sessao) return;
    setNuvemOcupada("enviando…");
    try {
      for (const parte of PARTES) {
        setNuvemOcupada(`enviando ${parte}…`);
        await gravarNaNuvem(parte, valorDaParte(parte) || []);
      }
      partesSujas.current.clear();
      setNuvemEm(new Date());
      avisar("Acervo enviado para a nuvem.");
    } catch (e) {
      avisar(`Não consegui enviar: ${String(e.message || e).slice(0, 80)}`);
    }
    setNuvemOcupada("");
  };

  /* Ao conectar, a nuvem manda: traz o que está lá. Vazia, recebe o que
     está aqui — é a primeira carga. */

  /* Antes de sobrescrever qualquer lado, compara. Mexendo no computador e
     no celular, a nuvem vencer calada apagaria trabalho — e o contrário
     também. Quando os dois têm conteúdo diferente, quem decide é você. */
  const [conflito, setConflito] = useState(null);
  const jaPuxou = useRef(false);

  const contarLocal = useCallback(() => ({
    itens: itens.length, colecoes: colecoes.length, listas: listas.length,
    series: metaSeries.length, eventos: eventos.length, eras: eras.length,
    personagens: metaPers.length, linhasTempo: linhasTempo.length,
    gruposSerie: gruposSerie.length,
  }), [itens, colecoes, listas, metaSeries, eventos, eras, metaPers, linhasTempo, gruposSerie]);

  const aplicarDaNuvem = useCallback((d) => {
    if (d.itens) setItens(d.itens);
    if (d.colecoes) setColecoes(d.colecoes);
    if (d.listas) setListas(d.listas);
    if (d.series) setMetaSeries(d.series);
    if (d.eventos) setEventos(d.eventos);
    if (d.eras) setEras(d.eras);
    if (d.personagens) setMetaPers(d.personagens);
    if (d.linhasTempo) setLinhasTempo(d.linhasTempo);
    if (d.gruposSerie) setGruposSerie(d.gruposSerie);
    setNuvemEm(new Date());
  }, []);

  const puxarDaNuvem = useCallback(async () => {
    setNuvemOcupada("comparando…");
    try {
      const d = await lerDaNuvem();
      const daNuvem = {};
      for (const k of PARTES) daNuvem[k] = Array.isArray(d && d[k]) ? d[k].length : 0;
      const local = contarLocal();

      const somaN = PARTES.reduce((n, k) => n + daNuvem[k], 0);
      const somaL = PARTES.reduce((n, k) => n + local[k], 0);

      // nuvem vazia: nada a trazer, e o envio fica por sua conta
      if (!somaN) { setNuvemOcupada(""); return "nuvem-vazia"; }

      // aqui está vazio: traz sem perguntar, não há o que perder
      if (!somaL) { aplicarDaNuvem(d); setNuvemOcupada(""); avisar(`Acervo carregado da nuvem: ${daNuvem.itens} itens.`); return "trazido"; }

      // iguais em tudo: segue com o que está na nuvem, em silêncio
      const iguais = PARTES.every((k) => daNuvem[k] === local[k]);
      if (iguais) { aplicarDaNuvem(d); setNuvemOcupada(""); return "iguais"; }

      setNuvemOcupada("");
      setConflito({ dados: d, nuvem: daNuvem, local });
      return "conflito";
    } catch (e) {
      avisar(`Não consegui ler da nuvem: ${String(e.message || e).slice(0, 80)}`);
      setNuvemOcupada("");
      return "erro";
    }
  }, [contarLocal, aplicarDaNuvem, avisar]);

  useEffect(() => {
    if (!sessao || !carregado.current || jaPuxou.current) return;
    jaPuxou.current = true;
    puxarDaNuvem().then((r) => {
      if (r === "nuvem-vazia") avisar("A nuvem está vazia. Use “Enviar os dados agora” para a primeira carga.");
    });
  }, [sessao, puxarDaNuvem, avisar]);
