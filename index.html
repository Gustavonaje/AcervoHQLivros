        try { eds = await edicoesDaWiki(v.wiki, v.reserva, meusNums); } catch (e2) { /* mantém o vazio */ }
      }
      if (!eds.datas.length && !eds.numeros.length) {
        setErro("A página abriu, mas não tinha datas no formato esperado."); setEtapa("erro"); return;
      }
      // sem isto, a estreia nunca chegava ao Aplicar: o estado ficava vazio
      setAchadas(eds.datas); setTodosNums(eds.numeros); setOrigemNums(eds.origem || "");
      setPontas({ ini: eds.inicioSerie || "", fim: eds.fimSerie || "" });
      setEtapa("pronto");

      fichaDoVolume(v.wiki, v.pagina).then(setFichaVol).catch(() => setFichaVol(null));

      tipoDaSerieWiki(v.wiki, v.pagina, eds.numeros.length)
        .then(setTipoSerie)
        .catch(() => setTipoSerie(null));

      /* Créditos e personagens: uma consulta cobre até 50 edições. Se o
         campo de edições estiver vazio, usa as primeiras da série. */
      const alvo = (meusNums.length ? meusNums : eds.numeros).slice(0, 50);
      fichasDaWiki(v.wiki, v.pagina, alvo)
        .then(async (f) => {
          setFicha(f);
          const top = f.personagens.slice(0, 6).map((x) => x.pagina);
          if (top.length) {
            try { setRetratos(await retratosDaWiki(v.wiki, top)); } catch (e) { /* segue sem retrato */ }
          }
        })
        .catch(() => setFicha({ erro: true }));

      // a capa é um extra: se falhar, o resto continua valendo
      if (!jaTemCapa) {
        const menor = Math.min(...(eds.numeros.length ? eds.numeros : eds.datas.map((e) => e.n)));
        capaDaWiki(v.wiki, v.pagina, menor)
          .then(setCapa)
          .catch((e) => setCapaErro(String(e.message || e)));
      }
    } catch (e) { setErro(String(e.message || e)); setEtapa("erro"); }
  };

  // cruza o que você listou com o que veio da wiki
  const minhas = edicoesDetalhadas(edicoesTexto);
  const porNum = new Map(achadas.map((e) => [e.n, e.data]));
  const casadas = minhas.filter((e) => porNum.has(e.n));
  const orfas = minhas.filter((e) => !porNum.has(e.n));

  const [salvando, setSalvando] = useState(false);

  const aplicar = async () => {
    const texto = minhas
      .map((e) => (porNum.has(e.n) ? `${e.n} (${porNum.get(e.n)})` : (e.data ? `${e.n} (${e.data})` : String(e.n))))
      .join(", ");
    const brutos = (todosNums.length ? todosNums : achadas.map((e) => e.n));
    const nums = separarNumeracao(brutos).sequencia;

    let capaBase64 = null;
    if (capa && querCapa) {
      setSalvando(true);
      try { capaBase64 = await baixarCapaComoBase64(capa.src, 400); }
      catch (e) { setCapaErro("a imagem existe, mas o servidor recusou o download: " + (e.message || e)); }
      setSalvando(false);
    }

    let creditos = null, personagens = null;
    if (querFicha && ficha && !ficha.erro) {
      creditos = {
        roteirista: ficha.roteiristas.slice(0, 2).map((x) => x.nome).join(", "),
        desenhista: ficha.desenhistas.slice(0, 2).map((x) => x.nome).join(", "),
      };
      personagens = ficha.personagens.slice(0, 6).map((x) => ({
        nome: x.nome, pagina: x.pagina, retrato: retratos[x.pagina] || "",
      }));
    }

    aoAplicar({
      // adotar o nome da wiki padroniza a grafia e casa com as próximas buscas
      nome: podeRenomear && querNome && escolhido && escolhido.rot !== nomeSerie ? escolhido.rot : "",
      // o modelo do volume manda; as categorias ficam de reserva
      tipo: (fichaVol && fichaVol.tipo) || (tipoSerie && tipoSerie.tipo) || "",
      publicando: fichaVol ? fichaVol.publicando : null,
      anoInicio: (fichaVol && fichaVol.anoInicio) || null,
      anoFim: (fichaVol && fichaVol.anoFim) || null,
      // guarda a origem: sem isso, atualizar exigia procurar tudo de novo
      wikiId: (escolhido && escolhido.wiki && escolhido.wiki.id) || "",
      paginaWiki: (escolhido && escolhido.pagina) || "",
      editora: (escolhido && escolhido.wiki && escolhido.wiki.editora) || "",
      pais: (escolhido && escolhido.wiki && escolhido.wiki.pais) || "",
      texto: minhas.length ? texto : "",
      /* "eds" só existe dentro da busca; aqui o que vale é o que ficou
         guardado em "pontas" quando ela terminou. */
      inicioSerie: (pontas && pontas.ini) || "", fimSerie: (pontas && pontas.fim) || "",
      primeiro: nums.length ? Math.min(...nums) : null,
      ultimo: nums.length ? Math.max(...nums) : null,
      publicados: nums.length ? compactarNumeros(nums) : "",
      totalWiki: achadas.length,
      capa: capaBase64,
      creditos,
      personagens,
    });
  };

  return (
    <Modal
      titulo="Buscar datas de publicação"
      aoFechar={aoFechar}
      rodape={
        <>
          {etapa === "pronto" && (
            <button className="btn btn-primario" onClick={aplicar} disabled={salvando}>
              <Check size={15} /> {salvando ? "Salvando a capa…" : "Aplicar"}
            </button>
          )}
          <button className="btn" onClick={aoFechar}>Fechar</button>
        </>
      }
    >
      <p className="secao-tit" style={{ marginTop: 0 }}>{nomeSerie || "(sem nome de série)"}</p>

      {etapa === "buscando" && <p className="dica">Procurando o volume no DC Database e no Marvel Database…</p>}

      {(etapa === "vazio" || etapa === "escolher") && (
        <div className={etapa === "vazio" ? "" : "colar-wiki"}>
          {etapa === "vazio" && (
            <p className="dica" style={{ marginBottom: 10 }}>
              Nenhum volume encontrado para “{nomeParaBusca(nomeSerie)}”. As bases usam o título original
              em inglês e às vezes com grafia própria — “Blood &amp; Whiskey”, não “Blood And Whiskey”.
            </p>
          )}
          <div className="campo largo">
            <label>{etapa === "vazio" ? "Achou a página no site? Cole o endereço aqui" : "Ou cole o endereço da página"}</label>
            <input
              value={manual}
              onChange={(e) => setManual(e.target.value)}
              placeholder="https://dc.fandom.com/wiki/Preacher_Special:_Cassidy:_Blood_%26_Whiskey_Vol_1_1"
            />
            <span className="dica">
              Serve a categoria, a página do volume ou a de uma edição. Especiais avulsos — como os de
              Free Comic Book Day — muitas vezes não têm categoria própria; nesse caso o app lê a
              própria página que você colar.
            </span>
          </div>
          <button className="btn btn-mini" onClick={usarManual} disabled={!manual.trim()}>
            <Check size={12} /> Usar esta página
          </button>
        </div>
      )}

      {etapa === "erro" && (
        <p className="dica" style={{ color: "var(--vermelho)" }}>
          {erro}<br />Se disser “Failed to fetch”, a base recusou a consulta a partir do arquivo local.
        </p>
      )}

      {etapa === "escolher" && (
        <>
          <p className="dica" style={{ marginBottom: 10 }}>
            {anoDoNome(nomeSerie)
              ? `Você escreveu ${anoDoNome(nomeSerie)} no nome, então o volume que começou nesse ano vem primeiro. Confira antes de seguir.`
              : "Escolha o volume. Pôr o ano no nome da série — “Superman (1987)” — faz o app identificar o volume sozinho."}
          </p>
          <div className="chips">
            {volumes.map((v) => (
              <button
                key={v.wiki.id + v.pagina}
                className={`chip ${v.ano && anoDoNome(nomeSerie) === v.ano ? "ativo" : ""}`}
                onClick={() => abrir(v)}
                title={v.ano ? `primeira edição em ${v.ano}` : "ano desconhecido"}
              >
                <b style={{ opacity: .55, marginRight: 5 }}>{v.wiki.rot}</b>{v.rot}
                {v.ano && <b style={{ opacity: .7, marginLeft: 6 }}>{v.ano}</b>}
              </button>
            ))}
          </div>
        </>
      )}

      {etapa === "lendo" && <p className="dica">Lendo as edições de {escolhido.rot}…</p>}

      {etapa === "pronto" && (
        <>
          <div className="painel" style={{ padding: "4px 0 14px", borderBottom: "1px solid var(--linha)", marginBottom: 14 }}>
            <div className="stat"><b>{todosNums.length || achadas.length}</b><small>edições na série</small></div>
            {pontas && pontas.ini && (
              <div className="stat">
                <b style={{ fontSize: 15 }}>{pontas.ini}{pontas.fim && pontas.fim !== pontas.ini ? ` – ${pontas.fim}` : ""}</b>
                <small>a série inteira</small>
              </div>
            )}
            {tipoSerie && tipoSerie.tipo && (
              <div className="stat">
                <b style={{ fontSize: 15 }}>{tipoSerie.tipo}</b>
                <small>{tipoSerie.deduzido ? "deduzido do tamanho" : "segundo a base"}</small>
              </div>
            )}
            {(() => {
              /* A faixa é da numeração corrida. A ½ e as .1 são especiais e
                 ficam fora dela — mostradas à parte, senão "#½–100" dá a
                 entender que a série começou numa meia edição. */
              const brutos = todosNums.length ? todosNums : achadas.map((e) => e.n);
              const { sequencia, extras } = separarNumeracao(brutos);
              const base = sequencia.length ? sequencia : brutos;
              return (
                <>
                  <div className="stat">
                    <b>#{rotuloNumero(Math.min(...base))}–{rotuloNumero(Math.max(...base))}</b>
                    <small>numeração</small>
                  </div>
                  {extras.length > 0 && (
                    <div className="stat">
                      <b style={{ fontSize: 15 }}>{extras.map(rotuloNumero).join(", ")}</b>
                      <small>especiais, fora da faixa</small>
                    </div>
                  )}
                </>
              );
            })()}
            <div className="stat ok"><b>{casadas.length}</b><small>das suas, com data</small></div>
            {orfas.length > 0 && <div className="stat falta"><b>{orfas.length}</b><small>não encontradas</small></div>}
          </div>

          <p className="dica" style={{ marginBottom: 8 }}>
            Fonte: {escolhido.wiki.rot} Database · {escolhido.rot} · datas de capa.
            {" "}Editora e país serão preenchidos como <b style={{ color: "var(--papel)" }}>{escolhido.wiki.editora}</b> e{" "}
            <b style={{ color: "var(--papel)" }}>{escolhido.wiki.pais}</b>.
            {origemNums && <><br />Numeração: {origemNums}</>}
          </p>

          {podeRenomear && escolhido.rot !== nomeSerie && (
            <div className="bloco-ficha" style={{ padding: "10px 12px" }}>
              <label className="opcao">
                <input type="checkbox" checked={querNome} onChange={(e) => setQuerNome(e.target.checked)} />
                Usar o nome da base: <b style={{ marginLeft: 4 }}>{escolhido.rot}</b>
              </label>
              <p className="dica" style={{ margin: "5px 0 0" }}>
                Hoje está “{nomeSerie}”. Padronizar ajuda: o mapa e a aba Séries agrupam pelo nome, então
                grafias diferentes viram séries diferentes. Se outros volumes usam o nome antigo, troque
                neles também para continuarem juntos.
              </p>
            </div>
          )}

          {/* créditos e elenco, agregados por frequência nas edições lidas */}
          {ficha && !ficha.erro && (ficha.roteiristas.length > 0 || ficha.personagens.length > 0) && (
            <div className="bloco-ficha">
              <label className="opcao">
                <input type="checkbox" checked={querFicha} onChange={(e) => setQuerFicha(e.target.checked)} />
                Preencher créditos e personagens
              </label>
              <p className="dica" style={{ margin: "4px 0 10px" }}>
                Lido de {ficha.lidas} edição(ões). Entram quem aparece em ao menos {ficha.minimo} delas —
                convidado de uma edição só fica de fora. Protagonistas vêm primeiro.
              </p>

              <div className="ficha" style={{ margin: "0 0 10px" }}>
                <div>
                  <dt>Roteiro</dt>
                  <dd>{ficha.roteiristas.slice(0, 2).map((x) => `${x.nome} (${x.n})`).join(", ") || "—"}</dd>
                </div>
                <div>
                  <dt>Desenho</dt>
                  <dd>{ficha.desenhistas.slice(0, 2).map((x) => `${x.nome} (${x.n})`).join(", ") || "—"}</dd>
                </div>
              </div>

              {ficha.personagens.length > 0 && (
                <div className="elenco">
                  {ficha.personagens.slice(0, 6).map((x) => (
                    <div className="pers" key={x.nome} title={`${x.nome} · em ${x.n} edição(ões)`}>
                      <div className="pers-face">
                        {retratos[x.pagina]
                          ? <img src={retratos[x.pagina]} alt="" />
                          : <span>{x.nome.slice(0, 2).toUpperCase()}</span>}
                      </div>
                      <em>{x.nome}</em>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* capa da primeira edição — só oferecida quando a série ainda não tem */}
          {jaTemCapa ? (
            <p className="dica" style={{ marginBottom: 10 }}>
              Esta série já tem imagem salva, então a capa não é buscada de novo.
            </p>
          ) : capa ? (
            <div className="capa-wiki">
              <img src={capa.src} alt="" />
              <div>
                <label className="opcao">
                  <input type="checkbox" checked={querCapa} onChange={(e) => setQuerCapa(e.target.checked)} />
                  Salvar como imagem da série
                </label>
                <span className="dica">Capa de {capa.pagina}. Fica guardada no acervo e vai no backup.</span>
              </div>
            </div>
          ) : capaErro ? (
            <p className="dica" style={{ marginBottom: 10, color: "var(--papel3)" }}>
              Sem capa desta vez: {capaErro}
            </p>
          ) : (
            <p className="dica" style={{ marginBottom: 10 }}>Procurando a capa da primeira edição…</p>
          )}

          {casadas.length > 0 && (
            <div className="chips" style={{ marginBottom: 10 }}>
              {casadas.slice(0, 40).map((e) => (
                <span key={e.n} className="chip">#{e.n} <b style={{ opacity: .6, marginLeft: 4 }}>{porNum.get(e.n)}</b></span>
              ))}
            </div>
          )}

          {orfas.length > 0 && (
            <p className="dica">
              Sem data na base: {orfas.map((e) => "#" + e.n).join(", ")}. Costuma ser anual, especial ou
              numeração fora do padrão — essas ficam como estão.
            </p>
          )}

          {!minhas.length && (
            <p className="dica">
              Você não listou edições neste campo. Aplicando, o app usa só a numeração da série.
            </p>
          )}
        </>
      )}
    </Modal>
  );
}

/* Ficha do personagem. A parte de cima vem da wiki; a de baixo é o que só
   o seu acervo sabe — em quais volumes ele aparece. */
function FichaPersonagem({ personagem, retrato, ficha, carregando, erro, volumes, navLista, aoNavegar, aoAbrirItem, aoBuscar, aoEditar, aoRebuscar, aoGuardarTraducao, aoFechar }) {
  /* Setas do teclado percorrem as fichas, como já acontece no detalhe do
     item. Ignora quando o foco está num campo, senão digitar vira navegação. */
  const posNav = navLista ? navLista.findIndex((x) => chavePersonagem(x.nome) === chavePersonagem(personagem.nome)) : -1;
  const anterior = posNav > 0 ? navLista[posNav - 1] : null;
  const proximo = posNav >= 0 && navLista && posNav < navLista.length - 1 ? navLista[posNav + 1] : null;

  // trocar de personagem fecha o que estava aberto
  useEffect(() => { setAberta(null); setVerTudo(false); }, [personagem.nome]);

  useEffect(() => {
    if (!aoNavegar) return;
    const naTecla = (e) => {
      const alvo = e.target && e.target.tagName;
      if (alvo === "INPUT" || alvo === "TEXTAREA" || alvo === "SELECT") return;
      if (e.key === "ArrowLeft" && anterior) { e.preventDefault(); aoNavegar(anterior); }
      if (e.key === "ArrowRight" && proximo) { e.preventDefault(); aoNavegar(proximo); }
    };
    window.addEventListener("keydown", naTecla);
    return () => window.removeEventListener("keydown", naTecla);
  }, [anterior, proximo, aoNavegar]);

  const [aberta, setAberta] = useState(null);
  const [verTudo, setVerTudo] = useState(false);

  /* Agrupa as aparições por série original: um personagem recorrente rende
     dezenas de volumes, mas poucas séries. */
  const porSerie = useMemo(() => {
    const m = new Map();
    for (const { item, series } of volumes) {
      for (const s of (series && series.length ? series : ["(sem série)"])) {
        if (!m.has(s)) m.set(s, []);
        if (!m.get(s).some((x) => x.id === item.id)) m.get(s).push(item);
      }
    }
    return [...m.entries()].sort((a, b) => (b[1].length !== a[1].length
      ? b[1].length - a[1].length
      : a[0].localeCompare(b[0], "pt-BR")));
  }, [volumes]);

  const [traduzido, setTraduzido] = useState("");
  const [traduzindo, setTraduzindo] = useState(false);
  const [erroTrad, setErroTrad] = useState("");

  const traduzir = async () => {
    if (!ficha || !ficha.resumo) return;
    setTraduzindo(true); setErroTrad("");
    try { setTraduzido(await traduzirTexto(ficha.resumo)); }
    catch (e) { setErroTrad(String(e.message || e)); }
    setTraduzindo(false);
  };

  const linhas = [
    ["Nome real", ficha && ficha.nomeReal],
    ["Primeira aparição", ficha && ficha.primeiraAparicao],
    ["Afiliação", ficha && ficha.afiliacao],
    ["Alinhamento", ficha && ficha.alinhamento],
  ].filter(([, v]) => v);

  return (
    <Modal
      titulo="Personagem"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn" onClick={() => aoBuscar(personagem.nome)}>
            <Search size={14} /> Buscar na coleção
          </button>
          <button className="btn" onClick={aoEditar}><Pencil size={14} /> Editar ficha</button>
          <button className="btn btn-mini" onClick={aoRebuscar} title="Consulta a wiki de novo e substitui a ficha">
            <Search size={13} /> Buscar de novo
          </button>
          <button className="btn" onClick={aoFechar}>Fechar</button>
        </>
      }
    >
      {navLista && navLista.length > 1 && posNav >= 0 && (
        <div className="nav-item">
          <button onClick={() => anterior && aoNavegar(anterior)} disabled={!anterior} title="Personagem anterior (seta ⯇)">
            <ChevronDown size={15} style={{ transform: "rotate(90deg)" }} />
          </button>
          <span>{posNav + 1} de {navLista.length}</span>
          <button onClick={() => proximo && aoNavegar(proximo)} disabled={!proximo} title="Próximo personagem (seta ⯈)">
            <ChevronDown size={15} style={{ transform: "rotate(-90deg)" }} />
          </button>
        </div>
      )}

      {/* Cartão: retrato à esquerda, ficha à direita — como um verbete do
          Who's Who, que é a referência natural aqui. */}
      <div className="pers-cartao">
        <div className="pers-cartao-foto">
          {retrato ? <img src={retrato} alt="" /> : <span>{(personagem.exibir || personagem.nome).slice(0, 2).toUpperCase()}</span>}
        </div>

        <div className="pers-cartao-info">
          <h3>{personagem.exibir || personagem.nome}</h3>
          {personagem.nomePt && personagem.nomePt !== personagem.nome && (
            <p className="dica" style={{ margin: "1px 0 4px" }}>
              na base: <b style={{ color: "var(--papel2)" }}>{personagem.nome}</b>
            </p>
          )}
          <p className="pers-sub">{volumes.length} volume(s) na sua coleção</p>

          {linhas.length > 0 && (
            <dl className="pers-dados">
              {linhas.map(([r, v]) => (
                <div key={r}><dt>{r}</dt><dd>{v}</dd></div>
              ))}
            </dl>
          )}

          {carregando && <p className="dica">Buscando a ficha na wiki…</p>}
          {erro && <p className="dica">Não consegui trazer o resumo: {erro}</p>}

          {ficha && ficha.resumo && (
            <div className="pers-resumo">
              <p>{traduzido || ficha.resumo}</p>
              <div className="pers-resumo-pe">
                {traduzido ? (
                  <button className="btn-mini-link" onClick={() => setTraduzido("")}>ver original em inglês</button>
                ) : (
                  <button className="btn-mini-link" onClick={traduzir} disabled={traduzindo}>
                    <Languages size={11} /> {traduzindo ? "traduzindo…" : "traduzir para português"}
                  </button>
                )}
                {traduzido && aoGuardarTraducao && (
                  <button className="btn-mini-link" onClick={() => aoGuardarTraducao(traduzido)}>
                    guardar esta tradução
                  </button>
                )}
                {erroTrad && <span className="dica">{erroTrad}</span>}
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="secao">
        <p className="secao-tit">Onde ele aparece no seu acervo ({volumes.length})</p>
        {volumes.length ? (
          /* Batman aparece em dezenas de volumes: a lista crua tomava a tela
             inteira. Agrupa por série, mostra o resumo, e a série se abre
             quando você quiser ver os volumes dela. */
          <div className="aparicoes">
            {porSerie.slice(0, verTudo ? porSerie.length : 6).map(([serie, vols]) => (
              <div className="apar-serie" key={serie}>
                <button className="apar-tit" onClick={() => setAberta(aberta === serie ? null : serie)}>
                  <ChevronDown size={11} style={{ transform: aberta === serie ? "none" : "rotate(-90deg)", opacity: .5 }} />
                  <b title={serie}>{serie}</b>
                  <em>{vols.length} volume{vols.length > 1 ? "s" : ""}</em>
                </button>
                {aberta === serie && (
                  <div className="chips" style={{ margin: "6px 0 4px 18px" }}>
                    {vols.map((it) => (
                      <button key={it.id} className="chip" onClick={() => aoAbrirItem(it)}>{it.titulo}</button>
                    ))}
                  </div>
                )}
              </div>
            ))}

            {porSerie.length > 6 && (
              <button className="btn-mini-link" style={{ marginTop: 6 }} onClick={() => setVerTudo(!verTudo)}>
                {verTudo ? "mostrar menos" : `ver as outras ${porSerie.length - 6} séries`}
              </button>
            )}
          </div>
        ) : (
          <p className="dica">Nenhum volume registrado com ele ainda.</p>
        )}
      </div>
    </Modal>
  );
}

function FormSerie({ serie, capaAtual, aoSalvar, aoFechar, aoAvisar }) {
  const [de, setDe] = useState(serie.faixaEstimada ? "" : String(serie.primeiro || ""));
  const [ate, setAte] = useState(serie.faixaEstimada ? "" : String(serie.ultimo || ""));
  const [notas, setNotas] = useState(serie.notas || "");
  const [tipo, setTipo] = useState(serie.tipo || "");
  // a lista do que existe vinha da busca e se perdia aqui: só início e fim eram salvos
  const [publicados, setPublicados] = useState(serie.publicadosTexto || "");
  const [pontasSerie, setPontasSerie] = useState({ inicio: serie.inicio || "", fim: serie.fimTexto || "" });
  const [situacao, setSituacao] = useState({ publicando: serie.publicando, anoFim: serie.anoFim || 0 });
  const [cancelada, setCancelada] = useState(!!serie.cancelada);
  const [origemWiki, setOrigemWiki] = useState({ wikiId: serie.wikiId || "", paginaWiki: serie.paginaWiki || "" });
  const [capaNova, setCapaNova] = useState(undefined);
  const [buscando, setBuscando] = useState(false);
  const arquivoRef = useRef(null);
  const previa = capaNova === undefined ? capaAtual : capaNova;

  const enviarArquivo = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try { setCapaNova(await comprimirImagem(f)); }
    catch (err) { aoAvisar("Não deu para ler esse arquivo. Use uma imagem JPG ou PNG."); }
    e.target.value = "";
  };

  /* A faixa é da numeração corrida, então a validação também precisa
     ignorar os especiais. Com a #1000000 da DC One Million no acervo, o app
     recusava "até 1102" dizendo que você já tem uma edição maior — e não
     havia faixa possível. */
  const meusNaSequencia = separarNumeracao([...serie.tenho, ...serie.querendo]).sequencia;
  const maiorQueTenho = meusNaSequencia.length ? Math.max(...meusNaSequencia) : 0;
  const menorQueTenho = separarNumeracao([...serie.tenho]).sequencia.length
    ? Math.min(...separarNumeracao([...serie.tenho]).sequencia)
    : 0;

  const salvar = () => {
    /* Zero é edição válida — a Action Comics tem a #0. Por isso os testes
       são por "está vazio?", e não por "é falso?": em JavaScript o 0 é
       falso, e era ele que fazia o campo recusar o valor. */
    const vazio = (v) => !String(v).trim();
    const a = vazio(de) ? null : parseInt(de, 10);
    const b = vazio(ate) ? null : parseInt(ate, 10);
    if ((a !== null && Number.isNaN(a)) || (b !== null && Number.isNaN(b))) {
      return aoAvisar("Use números inteiros na faixa.");
    }
    if (a !== null && b !== null && b < a) return aoAvisar(`A faixa está invertida: ${a} a ${b}.`);
    if (b !== null && b < maiorQueTenho) return aoAvisar(`Você já tem a edição #${maiorQueTenho}, então a faixa não pode terminar em ${b}.`);
    if (a !== null && a > menorQueTenho && serie.tenho.size) return aoAvisar(`Você já tem a edição #${menorQueTenho}, então a faixa não pode começar em ${a}.`);
    // grava total também, pra um backup antigo continuar legível
    const campos = { nome: serie.nome, primeiro: a === null ? 0 : a, ultimo: b === null ? 0 : b,
                     total: b === null ? 0 : b, tipo, notas: notas.trim() };
    if (publicados) campos.publicados = publicados;
    if (pontasSerie.inicio) { campos.inicio = pontasSerie.inicio; campos.fim = pontasSerie.fim; }
    if (situacao.publicando != null) { campos.publicando = situacao.publicando; campos.anoFim = situacao.anoFim; }
    campos.cancelada = cancelada;
    if (origemWiki.paginaWiki) { campos.wikiId = origemWiki.wikiId; campos.paginaWiki = origemWiki.paginaWiki; }
    aoSalvar(serie.id, campos, capaNova);
  };

  return (
    <Modal
      titulo="Personalizar série"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn btn-primario" onClick={salvar}><Check size={15} /> Salvar</button>
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <p className="secao-tit" style={{ marginTop: 0 }}>{serie.nome}</p>
      <p className="dica" style={{ marginBottom: 18 }}>
        A série existe porque seus volumes apontam para ela — o nome se muda editando os itens, não aqui.
      </p>

      <div className="grade-form" style={{ marginBottom: 16 }}>
        <div className="campo">
          <label>Numeração de</label>
          <input value={de} onChange={(e) => setDe(e.target.value.replace(/[^0-9]/g, ""))}
                 placeholder={menorQueTenho ? String(menorQueTenho) : "1"} inputMode="numeric" autoFocus />
        </div>
        <div className="campo">
          <label>até</label>
          <input value={ate} onChange={(e) => setAte(e.target.value.replace(/[^0-9]/g, ""))}
                 placeholder={maiorQueTenho ? `no mínimo ${maiorQueTenho}` : "329"} inputMode="numeric" />
        </div>
        <div className="campo largo">
          <button className="btn btn-mini" style={{ marginBottom: 8 }} onClick={() => setBuscando(true)}>
            <Search size={12} /> Buscar numeração no DC/Marvel Database
          </button>
          <span className="dica">
            Nem toda série começa no #1. A numeração de legado da DC faz a Mulher-Maravilha saltar do
            #44 para o #600 — declarando “de 600 até 614”, o app para de apontar 599 lacunas que nunca
            existiram. Em branco, ele deduz do que você tem.
            {de.trim() && ate.trim() && Number(ate) >= Number(de) && (
              <b style={{ color: "var(--papel)" }}> · {Number(ate) - Number(de) + 1} edições na faixa</b>
            )}
          </span>
        </div>
      </div>

      <div className="secao">
        <p className="secao-tit"><ImageIcon size={12} /> Imagem da série (opcional)</p>
        <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ width: 96, flexShrink: 0 }}>
            <div className="det-capa" style={{ aspectRatio: "2/3" }}>
              <Capa item={{ titulo: serie.nome }} src={previa} />
            </div>
          </div>
          <div style={{ flex: "1 1 240px", display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="btn btn-mini" onClick={() => arquivoRef.current.click()}>
                <Upload size={13} /> Enviar do computador
              </button>
              {previa && (
                <button className="btn btn-mini btn-perigo" onClick={() => setCapaNova(null)}>
                  <X size={13} /> Remover imagem
                </button>
              )}
            </div>
            <input ref={arquivoRef} type="file" accept="image/*" hidden onChange={enviarArquivo} />
            <p className="dica">
              Escolha a capa que preferir — a da primeira edição, uma arte promocional, o que fizer mais
              sentido. Sem imagem, o card mostra só o texto e a barra de cobertura.
            </p>
          </div>
        </div>
      </div>

      {buscando && (
        <ModalDatasWiki
          nomeSerie={serie.nome}
          edicoesTexto=""
          jaTemCapa={!!capaAtual}
          aoFechar={() => setBuscando(false)}
          aoAplicar={({ primeiro, ultimo, capa, publicados: pub, tipo: tp, inicioSerie: ini, fimSerie: fim, publicando: pb, anoFim: af, wikiId: wi, paginaWiki: pw }) => {
            // "0" é número de edição válido: testar por != null, não por verdadeiro
            if (primeiro != null) setDe(String(primeiro));
            if (ultimo != null) setAte(String(ultimo));
            if (capa) setCapaNova(capa);
            if (tp) setTipo(tp);
            if (pub) setPublicados(pub);
            if (ini) setPontasSerie({ inicio: ini, fim: fim || "" });
            if (pb != null) setSituacao({ publicando: pb, anoFim: af || 0 });
            if (pw) setOrigemWiki({ wikiId: wi, paginaWiki: pw });
            setBuscando(false);
            aoAvisar(`Numeração #${primeiro}–${ultimo}${pub ? ", lista de edições" : ""}${capa ? " e capa" : ""} preenchidas. Confira e salve.`);
          }}
        />
      )}

      <div className="campo largo" style={{ marginBottom: 14 }}>
        <label>Tipo de série</label>
        <div className="chips">
          {["", "Série mensal", "Minissérie", "Maxissérie", "One-shot", "Graphic novel", "Anual", "Reimpressão"].map((t) => (
            <button key={t || "vazio"} className={`chip ${tipo === t ? "ativo" : ""}`} onClick={() => setTipo(t)}>
              {t || "sem tipo"}
            </button>
          ))}
        </div>
        <span className="dica">
          Também vem preenchido pela busca no DC/Marvel Database, que classifica os volumes. Serve para
          filtrar o mapa cronológico — mostrar só as mensais, por exemplo.
        </span>
      </div>

      <div className="campo largo">
        <label>Nota sobre a série</label>
        <input
          value={notas}
          onChange={(e) => setNotas(e.target.value)}
          placeholder="Cancelada na #20 — o arco termina na minissérie seguinte"
        />
      </div>
    </Modal>
  );
}

function FormColecao({ inicial, capaAtual, aoSalvar, aoFechar, aoAvisar }) {
  const [c, setC] = useState({ ...inicial });
  const [capaNova, setCapaNova] = useState(undefined); // undefined = sem alteração
  const arquivoRef = useRef(null);
  const set = (k, v) => setC((p) => ({ ...p, [k]: v }));
  const previa = capaNova === undefined ? capaAtual : capaNova;

  const enviarArquivo = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const dados = await comprimirImagem(f);
      setCapaNova(dados);
      set("capaUrl", "");
    } catch (err) {
      aoAvisar("Não deu para ler esse arquivo. Use uma imagem JPG ou PNG.");
    }
    e.target.value = "";
  };

  const salvar = () => {
    if (!c.nome.trim()) return aoAvisar("Dê um nome à coleção.");
    aoSalvar({ ...c, nome: c.nome.trim(), total: c.tipo === "serie" ? Number(c.total) || 0 : 0 }, capaNova);
  };

  return (
    <Modal
      titulo={inicial.nome ? "Editar coleção" : "Nova coleção"}
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn btn-primario" onClick={salvar}><Check size={15} /> Salvar</button>
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <div className="campo largo" style={{ marginBottom: 18 }}>
        <label>Nome</label>
        <input value={c.nome} onChange={(e) => set("nome", e.target.value)} placeholder="Dragon Ball Edição Definitiva" autoFocus />
      </div>

      <p className="secao-tit">Que tipo de coleção é</p>
      <div className="chips" style={{ marginBottom: 16 }}>
        {[
          ["serie", "Série numerada — tem volume 1, 2, 3…"],
          ["tema", "Estante temática — junta o que você quiser"],
        ].map(([v, rot]) => (
          <button key={v} className={`chip ${c.tipo === v ? "ativo" : ""}`} onClick={() => set("tipo", v)}>{rot}</button>
        ))}
      </div>

      <div className="grade-form">
        {c.tipo === "serie" && (
          <div className="campo">
            <label>Total de volumes</label>
            <input
              type="number"
              min="0"
              value={c.total || ""}
              onChange={(e) => set("total", Math.max(0, parseInt(e.target.value || "0", 10)))}
              placeholder="34"
            />
            <span className="dica">Deixe 0 se a série ainda está saindo.</span>
          </div>
        )}
        <div className="campo">
          <label>Editora</label>
          <input value={c.editora} onChange={(e) => set("editora", e.target.value)} placeholder="Panini" />
        </div>
      </div>

      <div className="campo largo" style={{ marginTop: 16 }}>
        <label>Notas</label>
        <textarea value={c.notas} onChange={(e) => set("notas", e.target.value)} placeholder="Edição, formato, onde costuma comprar…" />
      </div>

      <div className="secao">
        <p className="secao-tit"><ImageIcon size={12} /> Capa da coleção (opcional)</p>
        <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ width: 96, flexShrink: 0 }}>
            <div className="det-capa" style={{ aspectRatio: "2/3" }}>
              <Capa item={{ titulo: c.nome }} src={previa || c.capaUrl} />
            </div>
          </div>
          <div style={{ flex: "1 1 240px", display: "flex", flexDirection: "column", gap: 10 }}>
            <div className="campo">
              <label>Endereço da imagem</label>
              <input
                value={c.capaUrl || ""}
                onChange={(e) => { set("capaUrl", e.target.value); setCapaNova(null); }}
                placeholder="https://…/capa.jpg"
              />
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="btn btn-mini" onClick={() => arquivoRef.current.click()}>
                <Upload size={13} /> Enviar do computador
              </button>
              {(previa || c.capaUrl) && (
                <button className="btn btn-mini btn-perigo" onClick={() => { setCapaNova(null); set("capaUrl", ""); }}>
                  <X size={13} /> Remover, voltar a usar as capas dos volumes
                </button>
              )}
            </div>
            <input ref={arquivoRef} type="file" accept="image/*" hidden onChange={enviarArquivo} />
            <p className="dica">
              Sem uma capa própria, esta coleção mostra a capa do primeiro volume que você tiver — é
              o padrão, e continua sendo depois que você sair desta tela sem preencher nada aqui.
            </p>
          </div>
        </div>
      </div>
    </Modal>
  );
}

function ModalResetar({ numeros, temArquivo, capasSalvas, aoApagarCapas, aoConfirmar, aoFechar }) {
  const [confirmacao, setConfirmacao] = useState("");
  const [apagando, setApagando] = useState(false);
  const liberado = confirmacao.trim().toLowerCase() === "apagar tudo";

  const confirmar = async () => {
    setApagando(true);
    await aoConfirmar();
  };

  return (
    <Modal
      titulo="Apagar todos os dados"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn btn-perigo" onClick={confirmar} disabled={!liberado || apagando}>
            <Trash2 size={15} /> {apagando ? "Apagando…" : "Apagar tudo, sem volta"}
          </button>
          <button className="btn" onClick={aoFechar}>Cancelar</button>
        </>
      }
    >
      <div className="aviso" style={{ borderColor: "rgba(229,72,127,.4)", background: "rgba(229,72,127,.08)" }}>
        <TriangleAlert size={15} style={{ color: "var(--magenta)" }} />
        <span>
          Isso apaga <b style={{ color: "var(--papel)" }}>{numeros.itens} item(ns)</b>,{" "}
          <b style={{ color: "var(--papel)" }}>{numeros.colecoes} coleção(ões)</b> e{" "}
          <b style={{ color: "var(--papel)" }}>{numeros.listas} lista(s) de leitura</b> guardados
          neste navegador. Não tem como desfazer — só um backup baixado antes resolve.
        </span>
      </div>

      {capasSalvas > 0 && (
        <p className="dica" style={{ marginTop: 14 }}>
          Há <b style={{ color: "var(--papel)" }}>{capasSalvas} capa(s) guardada(s)</b> dentro do acervo.
          Dá para apagar só elas, sem mexer em mais nada — as capas voltam a ser buscadas na internet
          e o acervo fica bem mais leve.
          {" "}
          <button className="btn btn-mini" style={{ marginTop: 8 }} onClick={aoApagarCapas}>
            <ImageIcon size={13} /> Apagar só as capas salvas
          </button>
        </p>
      )}

      {temArquivo && (
        <p className="dica" style={{ marginTop: 14 }}>
          Você tem um arquivo vinculado no computador — a ligação com ele também é desfeita, mas o
          arquivo em si <b style={{ color: "var(--papel)" }}>não é apagado nem alterado</b>. Se quiser
          recuperar esses dados depois, é só vincular esse mesmo arquivo de novo.
        </p>
      )}

      <div className="campo largo" style={{ marginTop: 18 }}>
        <label>Digite "apagar tudo" para confirmar</label>
        <input
          value={confirmacao}
          onChange={(e) => setConfirmacao(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && liberado && !apagando && confirmar()}
          placeholder="apagar tudo"
          autoFocus
        />
      </div>
    </Modal>
  );
}

function EscolherParaVolume({ col, volume, itens, capaDe, aoFechar, aoEscolher, aoNovoVolume }) {
  const [busca, setBusca] = useState("");
  const candidatos = useMemo(() => {
    const q = busca.trim().toLowerCase();
    if (!q) return [];
    return itens
      .filter((i) => !(i.colecoes || []).includes(col.id))
      .filter((i) => [i.titulo, i.autor, i.editora].some((c) => (c || "").toLowerCase().includes(q)))
      .slice(0, 12);
  }, [busca, itens, col.id]);

  return (
    <Modal
      titulo={`Volume ${volume} — ${col.nome}`}
      aoFechar={aoFechar}
      rodape={<button className="btn" onClick={aoFechar}>Cancelar</button>}
    >
      <p className="dica" style={{ marginBottom: 12 }}>
        Se esse volume já está cadastrado no seu acervo — mesmo fora de qualquer coleção —, procure
        abaixo e encaixe ele direto nesta vaga, em vez de criar um item novo. O item escolhido passa
        a ter o número <b style={{ color: "var(--papel)" }}>{volume}</b> — confira se é mesmo o
        volume certo antes de usar.
      </p>
      <div className="busca" style={{ maxWidth: "100%" }}>
        <Search size={15} />
        <input
          value={busca}
          onChange={(ev) => setBusca(ev.target.value)}
          placeholder="Buscar por título, autor ou editora…"
          autoFocus
        />
      </div>
      {candidatos.length > 0 && (
        <div className="col-res">
          {candidatos.map((i) => (
            <div className="lote-linha" key={i.id}>
              <div className="lote-capa"><Capa item={i} src={capaDe(i)} /></div>
              <div className="lote-nome">
                <b>{i.titulo}</b>
                <small>{[i.autor, i.editora, i.volume != null ? `vol. ${i.volume}` : ""].filter(Boolean).join(" · ")}</small>
              </div>
              <button className="btn btn-mini" onClick={() => aoEscolher(i)}><Check size={13} /> Usar aqui</button>
            </div>
          ))}
        </div>
      )}
      {busca.trim() && candidatos.length === 0 && (
        <p className="dica" style={{ marginTop: 10 }}>Nada no acervo bate com esse termo.</p>
      )}

      <div className="secao">
        <p className="dica" style={{ marginBottom: 10 }}>Não tem esse volume cadastrado ainda?</p>
        <button className="btn" onClick={aoNovoVolume}>
          <Plus size={14} /> Cadastrar um item novo para o volume {volume}
        </button>
      </div>
    </Modal>
  );
}
function DetalheSerie({ serie, capaSrc, aoFechar, aoEditar, aoLimpar, aoAbrirItem }) {
  const [verTudo, setVerTudo] = useState(false);
  const [verFaltam, setVerFaltam] = useState(false);
  /* Usa a lista real quando a wiki informou quais edições existem; senão,
     assume numeração contínua a partir do primeiro. */
  const numeros = (serie.publicados && serie.publicados.length)
    ? serie.publicados
    : (serie.total > 0 ? Array.from({ length: serie.total }, (_, i) => (serie.primeiro || 1) + i) : []);
  const mostrar = verTudo ? numeros : numeros.slice(0, 60);

  return (
    <Modal
      titulo="Série original"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn" onClick={aoEditar}>
            <Pencil size={14} /> Numeração e imagem
          </button>
          {(serie.notas || capaSrc || !serie.totalEstimado) && (
            <button className="btn btn-mini btn-perigo" onClick={aoLimpar}>
              <X size={13} /> Limpar personalização
            </button>
          )}
        </>
      }
    >
      <div className="serie-cabecalho">
        {capaSrc && <img className="serie-img" src={capaSrc} alt="" />}
        <div>
          <h3 style={{ margin: "0 0 4px", fontSize: 19 }}>{serie.nome}</h3>
          <p className="dica" style={{ margin: 0 }}>
            {(() => {
              /* Antes esta linha mostrava serie.data, que é o período das
                 SUAS edições — na Supergirl aparecia "02/2010 - 04/2010"
                 porque você tem três volumes daquele intervalo. O período da
                 série inteira é outro: 10/2005 a 09/2011. */
              const daSerie = serie.inicio
                ? serie.inicio + (serie.fimTexto && serie.fimTexto !== serie.inicio ? ` – ${serie.fimTexto}` : "")
                : "";
              return [serie.tipo, serie.editora, serie.pais, daSerie].filter(Boolean).join(" · ")
                || "Sem dados da publicação original";
            })()}
          </p>

          {(serie.data || !serie.inicio) && (
            <p className="dica" style={{ margin: "4px 0 0" }}>
              {serie.inicio
                ? `Suas edições vão de ${serie.data}.`
                : `Período das suas edições: ${serie.data || "—"}. Busque a numeração no DC/Marvel Database para o app saber quando a série começou e terminou.`}
            </p>
          )}
        </div>
      </div>

      <div className="painel" style={{ padding: "14px 0", borderBottom: "1px solid var(--linha)", marginBottom: 14 }}>
        <div className="stat">
          <b>{serie.total || "—"}</b>
          <small>{serie.primeiro > 1 ? `edições · #${serie.primeiro}–${serie.ultimo}` : "edições na série"}</small>
        </div>
        <div className="stat ok"><b>{serie.tenho.size}</b><small>você tem</small></div>
        {serie.especiais > 0 && (
          <div className="stat" title={(serie.especiaisLista || []).map((n) => "#" + rotuloNumero(n)).join(", ")}>
            <b>{serie.especiais}</b>
            <small>{(serie.especiaisLista || []).length <= 3
              ? (serie.especiaisLista || []).map((n) => "#" + rotuloNumero(n)).join(" ")
              : "especiais, fora da faixa"}</small>
          </div>
        )}
        <div className="stat falta"><b>{serie.faltam.length}</b><small>faltam</small></div>
        <div className="stat desejo"><b>{serie.querendo.size}</b><small>nos desejos</small></div>
        <div className="stat"><b>{serie.itens.length}</b><small>volumes br</small></div>
      </div>

      {serie.totalEstimado && serie.total > 0 && (
        <p className="dica" style={{ marginBottom: 14 }}>
          A faixa <b style={{ color: "var(--papel)" }}>#{serie.primeiro}–{serie.ultimo}</b> foi deduzida do que
          você tem — a série pode ser maior, ou começar em outro número. Informe a numeração real em
          “Numeração e imagem” para as lacunas ficarem corretas.
        </p>
      )}

      {serie.total > 0 && <Lombadas total={serie.total} tenho={serie.tenho} querendo={serie.querendo} legenda />}

      {!(serie.publicados || []).length && serie.total > 40 && (
        <p className="dica aviso-buraco" style={{ borderLeftColor: "var(--papel3)" }}>
          Esta série assume numeração contínua de #{serie.primeiro} a #{serie.ultimo}. Se ela teve
          interrupção — como a Action Comics, que pulou de #904 para #957 —, use
          <b> Numeração e imagem → Buscar no DC/Marvel Database</b> para o app aprender quais números
          existem de fato e parar de apontar lacunas impossíveis.
        </p>
      )}

      {(serie.buracos || []).length > 0 && (
        <p className="dica aviso-buraco">
          <b>Números que não existem nesta série:</b>{" "}
          {serie.buracos.map(([a, b]) => (a === b ? `#${a}` : `#${a}–${b}`)).join(", ")}.
          {" "}Não entram na conta de lacunas — o título mudou de volume nesse intervalo e voltou depois.
        </p>
      )}

      {serie.faltam.length > 0 && (
        <div className="secao">
          <p className="secao-tit">Faltam {serie.faltam.length} edição(ões)</p>
          <div className="serie-faltantes">
            {serie.faltam.slice(0, verFaltam ? serie.faltam.length : 80).map((n) => (
              <a
                key={n}
                className={`num-falta ${serie.querendo.has(n) ? "desejo" : ""}`}
                href={linkGuia(serie.nome, n)}
                target="_blank"
                rel="noopener noreferrer"
                title={`${serie.querendo.has(n) ? "já está na lista de desejos" : "não tem"} · abre a busca no Guia dos Quadrinhos`}
              >
                #{rotuloNumero(n)}
              </a>
            ))}
          </div>
          <p className="dica" style={{ margin: "6px 0 0" }}>
            Clique num número para procurá-lo no Guia dos Quadrinhos e descobrir em qual edição
            brasileira ele saiu.
          </p>
          {serie.faltam.length > 80 && (
            <button className="btn-mini-link" style={{ marginTop: 8 }} onClick={() => setVerFaltam(!verFaltam)}>
              {verFaltam ? "mostrar menos" : `ver as outras ${serie.faltam.length - 80}`}
            </button>
          )}
          {serie.querendo.size > 0 && (
            <p className="dica" style={{ marginTop: 8 }}>
              Os números em azul já estão anotados na sua lista de desejos.
            </p>
          )}
        </div>
      )}

      {serie.total > 0 && (
        <div className="secao">
          <p className="secao-tit">Edição por edição</p>
          <div className="mapa-nums">
            {mostrar.map((n) => {
              const donos = serie.porNumero.get(n) || [];
              const tem = serie.tenho.has(n);
              const quer = serie.querendo.has(n);
              return (
                <div key={n} className={`linha-num ${tem ? "tem" : quer ? "quer" : "falta"}`}>
                  <a className="num" href={linkGuia(serie.nome, n)} target="_blank" rel="noopener noreferrer"
               title="Ver no Guia dos Quadrinhos em que edição brasileira saiu">#{n}</a>
                  {donos.length ? (
                    <span className="donos">
                      {donos.map((it) => (
                        <button key={it.id} className="chip" onClick={() => aoAbrirItem(it)}>
                          {it.titulo}
                        </button>
                      ))}
                    </span>
                  ) : (
                    <span className="donos vazio">não compilada em nenhum volume seu</span>
                  )}
                </div>
              );
            })}
          </div>
          {numeros.length > mostrar.length && (
            <button className="btn btn-mini" style={{ marginTop: 10 }} onClick={() => setVerTudo(true)}>
              Ver as {numeros.length - mostrar.length} restantes
            </button>
          )}
        </div>
      )}

      <div className="secao">
        <p className="secao-tit">Volumes brasileiros que compilam esta série ({serie.itens.length})</p>
        <div className="chips">
          {serie.itens.map((it) => {
            const trechos = originaisDe(it)
              .filter((o) => chaveSerie(o.serie) === serie.id)
              .map((o) => rotuloEdicoes(o.edicoesTexto))
              .filter(Boolean)
              .join(" / ");
            return (
              <button key={it.id} className="chip" onClick={() => aoAbrirItem(it)}>
                {it.titulo}{trechos ? ` · ${trechos}` : ""}
                {it.lista === "desejos" && <span style={{ color: "var(--ciano)" }}> (desejo)</span>}
              </button>
            );
          })}
        </div>
        {serie.semNumero.length > 0 && (
          <p className="dica" style={{ marginTop: 8 }}>
            {serie.semNumero.length} volume(s) citam esta série sem dizer quais edições compilam — por isso
            não entram na contagem de cobertura.
          </p>
        )}
      </div>

      {serie.notas && <div className="notas" style={{ borderLeftColor: "var(--ciano)" }}>{serie.notas}</div>}
    </Modal>
  );
}

function DetalheColecao({ col, itens, capaDe, aoFechar, aoEditar, aoRemover, aoAbrirItem, aoVincular, aoDesvincular, aoNovoVolume, aoDesejarLacunas, aoAjustar, aoEscolherParaVolume }) {
  const [busca, setBusca] = useState("");
  const [escolhendoVol, setEscolhendoVol] = useState(null);
  const e = estadoColecao(col, itens);
  const porVolume = new Map();
  for (const m of e.membros) if (m.volume != null && !porVolume.has(m.volume)) porVolume.set(m.volume, m);

  const candidatos = useMemo(() => {
    const q = busca.trim().toLowerCase();
    if (!q) return [];
    return itens
      .filter((i) => !(i.colecoes || []).includes(col.id))
      .filter((i) => [i.titulo, i.autor, i.editora].some((c) => (c || "").toLowerCase().includes(q)))
      .slice(0, 12);
  }, [busca, itens, col.id]);

  const soltos = e.membros.filter((m) => m.volume == null || col.tipo !== "serie" || m.volume > e.total);

  return (
    <Modal
      titulo="Coleção"
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn" onClick={aoEditar}><Pencil size={14} /> Nome, editora e notas</button>
          {col.tipo === "serie" && e.faltam.length > 0 && (
            <button className="btn" onClick={() => aoDesejarLacunas(col, e.faltam)}>
              <Heart size={14} /> Pôr as {e.faltam.length} que faltam na lista de desejos
            </button>
          )}
          <button className="btn btn-perigo" style={{ marginLeft: "auto" }} onClick={() => {
            if (window.confirm(`Apagar a coleção "${col.nome}"? Os itens continuam no acervo, só deixam de estar agrupados aqui.`)) aoRemover();
          }}>
            <Trash2 size={14} /> Apagar coleção
          </button>
        </>
      }
    >
      <h3 style={{ fontFamily: "var(--disp)", fontSize: 25, fontWeight: 700, margin: "0 0 4px", letterSpacing: "-.025em" }}>
        {col.nome}
      </h3>
      <p className="autor" style={{ margin: "0 0 14px" }}>
        {col.tipo === "serie"
          ? e.total > 0
            ? `${e.tenho.size} de ${e.total} volumes na estante`
            : `${e.naEstante.length} volumes, série em andamento`
          : `${e.membros.length} ${e.membros.length === 1 ? "item" : "itens"}`}
        {col.editora ? ` · ${col.editora}` : ""}
      </p>

      {col.tipo === "serie" && (
        <div className={`total-linha ${e.total ? "" : "pedindo"}`}>
          <label htmlFor={`tot-${col.id}`}>Coleção completa tem</label>
          <input
            id={`tot-${col.id}`}
            type="number"
            min="0"
            value={col.total || ""}
            onChange={(ev) => aoAjustar({ ...col, total: Math.max(0, parseInt(ev.target.value || "0", 10)) })}
            placeholder="34"
          />
          <span style={{ fontSize: 13 }}>volumes</span>
          <span className="dica">
            {e.total
              ? `Você tem ${e.tenho.size}. Faltam ${e.faltam.length}.`
              : "Preencha para o app calcular o que falta. Deixe vazio se a série ainda está saindo."}
          </span>
        </div>
      )}

      <div className="col-ajuste">
        <div className="chips">
          {[["serie", "Série numerada"], ["tema", "Estante temática"]].map(([v, rot]) => (
            <button
              key={v}
              className={`chip ${col.tipo === v ? "ativo" : ""}`}
              onClick={() => aoAjustar({ ...col, tipo: v })}
            >
              {rot}
            </button>
          ))}
        </div>
        {col.tipo === "serie" && (
          <label className="col-total">
            <span>Total de volumes</span>
            <input
              type="number"
              min="0"
              value={col.total || ""}
              onChange={(ev) => aoAjustar({ ...col, total: Math.max(0, parseInt(ev.target.value || "0", 10)) })}
              placeholder="0"
            />
          </label>
        )}
      </div>

      {col.tipo === "serie" && e.total === 0 && (
        <div className="aviso" style={{ marginBottom: 14 }}>
          <Package size={15} />
          <span>
            Sem o total, o Acervo não tem como saber o que falta. Se esta série tem um número fechado
            de volumes, escreva ele no campo acima — os {e.naEstante.length} que você já tem viram
            posições preenchidas e o resto aparece como lacuna. Se a série ainda está saindo, deixe em 0.
          </span>
        </div>
      )}

      {col.tipo === "serie" && e.total > 1 && (
        <div style={{ marginBottom: 6 }}>
          <Lombadas total={e.total} tenho={e.tenho} querendo={e.querendo} />
        </div>
      )}

      {col.tipo === "serie" && e.faltam.length > 0 && (
        <div className="aviso" style={{ marginTop: 14, borderColor: "rgba(229,72,127,.3)", background: "rgba(229,72,127,.07)" }}>
          <TriangleAlert size={15} style={{ color: "var(--magenta)" }} />
          <span>
            Faltam os volumes{" "}
            <b style={{ fontFamily: "var(--mono)", color: "var(--papel)" }}>{e.faltam.join(", ")}</b>.
          </span>
        </div>
      )}

      {col.notas && <div className="notas" style={{ marginTop: 14 }}>{col.notas}</div>}

      {/* grade de volumes: o que tem, o que falta */}
      <div className="secao">
        <p className="secao-tit">
          {col.tipo === "serie" ? "Volume a volume" : "O que está aqui dentro"}
        </p>
        <div className="slots">
          {col.tipo === "serie" && e.total > 0
            ? Array.from({ length: e.total }, (_, i) => i + 1).map((v) => {
                const m = porVolume.get(v);
                if (!m)
                  return (
                    <button key={v} className="slot lacuna" onClick={() => setEscolhendoVol(v)} title={`Preencher o volume ${v}`}>
                      <b>{v}</b>
                      <small>falta</small>
                    </button>
                  );
                return (
                  <button key={v} className="slot" onClick={() => aoAbrirItem(m)} title={m.titulo}>
                    <Capa item={m} src={capaDe(m)} />
                    <span className="slot-num" style={m.lista === "desejos" ? { color: "var(--ciano)" } : undefined}>
                      {m.lista === "desejos" ? `#${v} · desejo` : `#${v}`}
                    </span>
                  </button>
                );
              })
            : null}
          {soltos.map((m) => (
            <button key={m.id} className="slot" onClick={() => aoAbrirItem(m)} title={m.titulo}>
              <Capa item={m} src={capaDe(m)} />
              <span className="slot-num">{m.volume != null ? `#${m.volume}` : m.titulo.slice(0, 12)}</span>
            </button>
          ))}
        </div>
        {e.membros.length === 0 && (
          <p className="dica" style={{ marginTop: 10 }}>
            Nenhum item vinculado ainda. Use a busca abaixo para trazer o que já está cadastrado.
          </p>
        )}
      </div>

      {/* trazer itens já cadastrados para dentro */}
      <div className="secao">
        <p className="secao-tit"><Plus size={12} /> Adicionar itens que já estão no acervo</p>
        <div className="busca" style={{ maxWidth: "100%" }}>
          <Search size={15} />
          <input value={busca} onChange={(ev) => setBusca(ev.target.value)} placeholder="Buscar por título, autor ou editora…" />
        </div>
        {candidatos.length > 0 && (
          <div className="col-res">
            {candidatos.map((i) => (
              <div className="lote-linha" key={i.id}>
                <div className="lote-capa"><Capa item={i} src={capaDe(i)} /></div>
                <div className="lote-nome">
                  <b>{i.titulo}</b>
                  <small>{[i.autor, i.editora, i.volume != null ? `vol. ${i.volume}` : ""].filter(Boolean).join(" · ")}</small>
                </div>
                <button className="btn btn-mini" onClick={() => aoVincular(i)}><Plus size={13} /> Incluir</button>
              </div>
            ))}
          </div>
        )}
        {busca.trim() && candidatos.length === 0 && (
          <p className="dica" style={{ marginTop: 10 }}>Nada fora desta coleção com esse termo.</p>
        )}
      </div>

      {e.membros.length > 0 && (
        <div className="secao">
          <p className="secao-tit">Tirar da coleção</p>
          <div className="chips">
            {e.membros.map((m) => (
              <button key={m.id} className="chip" onClick={() => aoDesvincular(m)} title="Remover desta coleção">
                {m.volume != null ? `#${m.volume} ` : ""}{m.titulo.slice(0, 26)} <X size={11} style={{ verticalAlign: -1 }} />
              </button>
            ))}
          </div>
        </div>
      )}

      {escolhendoVol != null && (
        <EscolherParaVolume
          col={col}
          volume={escolhendoVol}
          itens={itens}
          capaDe={capaDe}
          aoFechar={() => setEscolhendoVol(null)}
          aoEscolher={(item) => { aoEscolherParaVolume(item, col, escolhendoVol); setEscolhendoVol(null); }}
          aoNovoVolume={() => { const v = escolhendoVol; setEscolhendoVol(null); aoNovoVolume(col, v); }}
        />
      )}
    </Modal>
  );
}

/* ══════════════════════════════════════════════════════════════
   LISTAS DE LEITURA
   Uma ordem de leitura pode cruzar coleções, editoras e tipos —
   é só uma sequência de itens que já existem no acervo.
   ══════════════════════════════════════════════════════════════ */
function CardListaLeitura({ lista, itens, capaDe, aoAbrir, indice }) {
  const membros = lista.itens.map((id) => itens.find((i) => i.id === id)).filter(Boolean);
  const capaPersonalizada = capaDe(lista);

  return (
    <button className="card" onClick={aoAbrir} style={{ animationDelay: `${Math.min(indice, 24) * 22}ms` }}>
      <div className="card-lista">
        <span className="num-ordem">1→{membros.length || "?"}</span>
        {capaPersonalizada ? (
          <div className="pilha-capas unica">
            <div><Capa item={{ titulo: lista.nome }} src={capaPersonalizada} /></div>
          </div>
        ) : membros.length > 0 ? (
          <div className="pilha-capas">
            {membros.slice(0, 3).map((m, i) => (
              <div key={m.id}><Capa item={m} src={capaDe(m)} /></div>
            ))}
          </div>
        ) : (
          <BookOpen size={26} color="var(--papel3)" style={{ marginBottom: "auto" }} />
        )}
      </div>
      <div>
        <div className="card-titulo">{lista.nome || "Sem nome"}</div>
        <div className="card-sub">{membros.length} {membros.length === 1 ? "item" : "itens"}</div>
      </div>
    </button>
  );
}

function FormListaLeitura({ inicial, capaAtual, aoSalvar, aoFechar, aoAvisar }) {
  const [l, setL] = useState({ ...inicial });
  const [capaNova, setCapaNova] = useState(undefined); // undefined = sem alteração
  const arquivoRef = useRef(null);
  const previa = capaNova === undefined ? capaAtual : capaNova;

  const enviarArquivo = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const dados = await comprimirImagem(f);
      setCapaNova(dados);
      setL((p) => ({ ...p, capaUrl: "" }));
    } catch (err) {
      aoAvisar("Não deu para ler esse arquivo. Use uma imagem JPG ou PNG.");
    }
    e.target.value = "";
  };

  const salvar = () => {
    if (!l.nome.trim()) return aoAvisar("Dê um nome à lista.");
    aoSalvar({ ...l, nome: l.nome.trim() }, capaNova);
  };
  return (
    <Modal
      titulo={inicial.nome ? "Editar lista" : "Nova lista de leitura"}
      aoFechar={aoFechar}
      rodape={<>
        <button className="btn btn-primario" onClick={salvar}><Check size={15} /> Salvar</button>
        <button className="btn" onClick={aoFechar}>Cancelar</button>
      </>}
    >
      <div className="campo largo" style={{ marginBottom: 16 }}>
        <label>Nome</label>
        <input
          value={l.nome}
          onChange={(e) => setL({ ...l, nome: e.target.value })}

            </p>
