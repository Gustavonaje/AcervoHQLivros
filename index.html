];

/* Agrupa o acervo por editora original. Cada volume entra pelo período que
   ele compila — um omnibus de 1963-1968 é uma barra de cinco anos, um
   avulso é um traço. Se o volume compila séries de editoras diferentes, ele
   aparece no mapa de cada uma, com o trecho que cabe a ela. */
/* Quando a base não classificou, o tamanho da série diz quase tudo: uma
   edição é one-shot, até doze é minissérie, acima disso é mensal. É palpite,
   mas deixa o filtro funcionando desde já — e você corrige onde errar. */
/* O nome entrega o tipo melhor que o tamanho: uma anual tem poucas edições
   e cairia em "minissérie" pelo palpite, mas anual é edição extra recorrente
   de uma mensal, não história fechada. Por isso o nome vem antes. */
const TIPO_PELO_NOME = [
  { re: /\bannuals?\b/i, tipo: "Anual" },
  { re: /\bgiant(-size)?\b/i, tipo: "One-shot" },
  { re: /\bspecials?\b/i, tipo: "One-shot" },
  { re: /\bsecret files\b/i, tipo: "One-shot" },
  { re: /\bone[- ]shot\b/i, tipo: "One-shot" },
];

function tipoPeloNome(nome) {
  const n = String(nome || "");
  for (const t of TIPO_PELO_NOME) if (t.re.test(n)) return t.tipo;
  return "";
}

function tipoPorTamanho(m) {
  if (!m) return "";
  const a = Number(m.primeiro) || 0, b = Number(m.ultimo) || Number(m.total) || 0;
  if (!b) return "";
  const qtd = b >= a && a > 0 ? b - a + 1 : b;
  if (qtd <= 1) return "One-shot";
  if (qtd <= 12) return "Minissérie";
  if (qtd <= 24) return "Maxissérie";
  return "Série mensal";
}

// o que você escolheu vence a base, que vence o nome, que vence o tamanho
const tipoDaMeta = (m) => (m && m.tipo) || tipoPeloNome(m && m.nome) || tipoPorTamanho(m);


/* Acomoda barras em poucas linhas sem sobreposição — é o que faz o mapa
   recolhido caber em três faixas em vez de trezentas. */

/* Mapa de edições no tempo: um quadrado por edição original, posicionado
   pela data de capa. Só entra o que tem mês e ano — data de aquisição conta
   outra história (quando você comprou), e não é a que este mapa conta. */
function montarMapaAnos(itens) {
  const porAno = new Map();
  for (const it of itens) {
    for (const o of originaisDe(it)) {
      const nome = (o.serie || "").trim();
      if (!nome) continue;
      const id = chaveSerie(nome);
      for (const e of edicoesDetalhadas(o.edicoesTexto)) {
        if (!e.data) continue;
        const m = String(e.data).match(/^(\d{2})\/(\d{4})$/);
        if (!m) continue;
        const ano = Number(m[2]), mes = Number(m[1]);
        if (!porAno.has(ano)) porAno.set(ano, []);
        porAno.get(ano).push({ n: e.n, mes, serie: nome, id, editora: o.editora || "", item: it.id, titulo: it.titulo });
      }
    }
  }
  return [...porAno.entries()]
    .map(([ano, eds]) => ({
      ano,
      eds: eds.sort((a, b) => a.mes - b.mes || a.serie.localeCompare(b.serie, "pt-BR") || a.n - b.n),
      porMes: (() => {
        const m = new Map();
        for (const e of eds) {
          if (!m.has(e.mes)) m.set(e.mes, []);
          m.get(e.mes).push(e);
        }
        return [...m.entries()].sort((a, b) => a[0] - b[0]);
      })(),
    }))
    .sort((a, b) => a.ano - b.ano);
}

function montarSeries(itens, metaSeries) {
  const meta = new Map((metaSeries || []).map((m) => [m.id, m]));
  const m = new Map();

  for (const it of itens) {
    for (const o of originaisDe(it)) {
      const nome = o.serie.trim();
      const id = chaveSerie(nome);
      if (!m.has(id)) {
        m.set(id, {
          id, nome,
          editora: o.editora || "",
          pais: o.pais || "",
          data: o.data || "",
          ini: null, fim: null, comMes: false,
          tenho: new Set(),      // números que estão na estante
          querendo: new Set(),   // números que estão na lista de desejos
          porNumero: new Map(),  // número -> itens brasileiros que o compilam
          itens: [],
          semNumero: [],         // volumes que citam a série sem dizer as edições
        });
      }
      const g = m.get(id);
      if (!g.editora && o.editora) g.editora = o.editora;
      if (!g.pais && o.pais) g.pais = o.pais;
      if (!g.data && o.data) g.data = o.data;
      if (!g.itens.some((x) => x.id === it.id)) g.itens.push(it);

      const per = periodoDaOrigem(o);
      if (per) {
        g.ini = g.ini == null ? per.ini : Math.min(g.ini, per.ini);
        g.fim = g.fim == null ? per.fim : Math.max(g.fim, per.fim);
        g.comMes = g.comMes || per.comMes;
      }

      const nums = o.numeros || [];
      if (!nums.length) { g.semNumero.push(it); continue; }
      for (const n of nums) {
        if (it.lista === "desejos") g.querendo.add(n); else g.tenho.add(n);
        if (!g.porNumero.has(n)) g.porNumero.set(n, []);
        if (!g.porNumero.get(n).some((x) => x.id === it.id)) g.porNumero.get(n).push(it);
      }
    }
  }

  return [...m.values()].map((g) => {
    const md = meta.get(g.id) || {};
    /* As decimais (23.1, 23.2 do Villains Month) são edições complementares:
       entram na contagem do que você tem, mas não definem o tamanho da série
       nem tapam o buraco do número cheio. Por isso a conta de lacunas roda
       só com os inteiros. */
    const sep = separarNumeracao([...g.tenho]);
    const inteiros = sep.sequencia;
    const especiais = sep.extras;
    const querInt = separarNumeracao([...g.querendo]).sequencia;
    const maior = inteiros.length || querInt.length ? Math.max(...inteiros, ...querInt, 0) : 0;
    const menor = inteiros.length || querInt.length ? Math.min(...inteiros, ...querInt) : 0;

    /* Nem toda série começa no #1. A numeração de legado da DC faz Wonder
       Woman saltar do #44 para o #600, e assumir que ela vai de 1 a 614
       inventaria 599 lacunas que nunca existiram. Por isso a faixa é
       declarada por você: de X a Y. Sem declaração, deduz do que você tem. */
    /* Faixa salva antes da correção das anuais por ano pode ter guardado
       "até 2020". Se o fim parece ano e a série tem numeração normal, a
       faixa é ignorada e recalculada — sem exigir que você refaça a busca. */
    /* Zero é edição válida e às vezes é a ÚNICA: a FCBD Dark Crisis Special
       Edition tem só a #0. Testar por "> 0" descartava a faixa inteira e a
       série ficava sem numeração. O teste certo é "foi informado?". */
    const temNum = (v) => v !== "" && v != null && Number.isFinite(Number(v));
    const fimSalvo = temNum(md.ultimo) ? Math.floor(Number(md.ultimo))
      : temNum(md.total) ? Math.floor(Number(md.total)) : null;
    const faixaContaminada = fimSalvo != null && fimSalvo >= PRIMEIRO_ANO && inteiros.some((n) => n < PRIMEIRO_ANO);

    const primeiro = !faixaContaminada && temNum(md.primeiro) ? Math.floor(Number(md.primeiro))
      : !faixaContaminada && temNum(md.total) ? 1 : (menor != null ? menor : 1);
    const ultimo = faixaContaminada ? maior : (fimSalvo != null ? fimSalvo : maior);
    /* Quando a wiki disse quais edições existem, as lacunas são calculadas
       contra essa lista. Sem isso, a Action Comics apontaria as 52 edições
       do intervalo 905-956 como faltantes — elas nunca foram publicadas. */
    const publicados = md.publicados ? numerosDeEdicoes(md.publicados).filter(ehInteiro) : [];
    const noRecorte = publicados.filter((n) => n >= primeiro && n <= ultimo);
    const usaLista = noRecorte.length > 0;

    const total = usaLista ? noRecorte.length : (ultimo >= primeiro ? ultimo - primeiro + 1 : 0);
    const faixaEstimada = faixaContaminada || !(temNum(md.ultimo) || temNum(md.total));
    const totalEstimado = faixaEstimada;
    const faltam = usaLista
      ? noRecorte.filter((n) => !g.tenho.has(n))
      : (total > 0 ? Array.from({ length: total }, (_, i) => primeiro + i).filter((n) => !g.tenho.has(n)) : []);
    const buracos = usaLista ? faixasInexistentes(noRecorte) : [];
    return {
      ...g, total, totalEstimado, faltam, primeiro, ultimo, faixaEstimada, buracos,
      publicados: usaLista ? noRecorte : [],
      publicadosTexto: md.publicados || "",
      publicando: md.publicando == null ? null : !!md.publicando,
      anoFim: md.anoFim || 0,
      cancelada: !!md.cancelada,
      wikiId: md.wikiId || "",
      paginaWiki: md.paginaWiki || "",
      especiais: especiais.length,
      especiaisLista: [...especiais].sort((a, b) => a - b),
      ...(() => {
        const d = dataDaSerie(g);
        const ini = g.ini != null ? g.ini : (d.ano != null ? idxMes(d.ano, d.mes || 1) : null);
        const fim = g.fim != null ? g.fim : (d.ano != null ? idxMes(d.ano, d.mes || 12) : null);
        return { ano: d.ano, mes: d.mes, ordemData: ordemDaData(d), ini, fim };
      })(),
      notas: md.notas || "",
      /* Estreia da série. Quando a busca na wiki trouxe a data da primeira
         edição, é ela que vale. Sem isso, usa a data mais antiga entre as
         edições que você tem — é aproximado, mas ordena de verdade; antes
         ficava nulo e a lista caía no alfabeto. */
      /* "fim" já é o índice de mês da série, calculado acima. O texto da
         última edição precisa de nome próprio: sobrescrevendo, ele virava
         string vazia e Math.min(23284, "") devolvia zero — era isso que
         jogava a régua para o ano 0. */
      inicio: md.inicio || "",
      fimTexto: md.fim || "",
      estreiaReal: !!md.inicio,
      ordemEstreia: md.inicio
        ? ordemDaData(dataDaSerie({ data: md.inicio }))
        : (() => { const d = dataDaSerie(g); return d.ano != null ? ordemDaData(d) : null; })(),
      tipo: tipoDaMeta({ ...md, nome: md.nome || g.nome }),
      tipoDeduzido: !md.tipo,
      completa: total > 0 && faltam.length === 0,
      cobertura: total > 0 ? Math.min(1, inteiros.length / total) : 0,
    };
  });
}

const melhorPreco = (it) =>
  (it.precos || []).length ? Math.min(...it.precos.map((p) => p.valor)) : null;

/* Antes, existindo ISBN, ele ia para todas as lojas — e só Amazon e Estante
   Virtual entendem ISBN. Magalu, Americanas e Panini não achavam nada.
   Agora o padrão é o título, que funciona em todas, e o ISBN fica como
   alternativa onde ele é mais preciso. */
const termoPorTitulo = (it) => {
  /* Só o título. Acrescentar a editora quebrava a busca dentro da própria
     loja dela: procurar "Crise nas Infinitas Terras Vol.04 Panini" no site
     da Panini não devolve nada, porque a palavra não está no nome do
     produto. Sem ela, o volume aparece. O autor também fica de fora — em
     HQ vem com vários nomes e a loja trata todos como exigência. */
  return String(it.titulo || "").replace(/\s+/g, " ").trim();
};

/* O Guia dos Quadrinhos é a única base que diz em quais edições brasileiras
   uma história saiu. Ele bloqueia leitura automática, mas abrir um link é
   navegação normal. O endereço de cada edição termina em identificadores
   internos que não dá para construir, então a saída é uma busca restrita ao
   site — cai na página certa na maioria das vezes. */
const linkGuia = (nomeSerie, numero) => {
  const limpo = String(nomeSerie || "")
    .replace(/\s+Vol\s+\d+.*$/i, "")
    .replace(/\s*\((?:19|20)\d{2}[^)]*\)/, "")
    .trim();
  const termo = `site:guiadosquadrinhos.com/edicao-estrangeira "${limpo}" n ${numero}`;
  return "https://www.google.com/search?q=" + encodeURIComponent(termo);
};

const consultaLoja = (it, porIsbn) =>
  encodeURIComponent(porIsbn && it.isbn ? it.isbn : termoPorTitulo(it));

/* Endereços possíveis para a capa de um item, na ordem de preferência.
   Mesma lista que o componente Capa percorre na tela — assim o que é
   baixado é exatamente o que você está vendo. */
function candidatasCapa(item, src) {
  const c = [];
  if (Array.isArray(src)) c.push(...src.filter(Boolean));
  else if (src) c.push(src);
  const bruto = String((item && item.isbn) || "").split(",")[0].trim();
  if (ehIsbn(bruto)) {
    for (const v of variantesIsbn(bruto)) c.push(`https://covers.openlibrary.org/b/isbn/${v}-L.jpg?default=false`);
    const amz = capaAmazon(bruto);
    if (amz) c.push(amz);
  }
  return [...new Set(c)].filter((u) => /^https?:/i.test(u));
}

// Capa de livro é sempre bem mais alta que larga. Imagem quadradinha ou
// minúscula é o "sem capa" genérico da Amazon — não vale guardar.
const capaPlausivel = (l, a) => l >= 50 && a >= 50 && a >= l * 1.15;

/* Busca a imagem, confere se é capa mesmo e devolve em base64, já
   reduzida. Passa pelo fetch antes de desenhar no canvas: assim os bytes
   chegam pela rede com CORS resolvido e o canvas não fica "contaminado",
   que é o que impediria a conversão. */
async function baixarCapaComoBase64(url, largura = 360) {
  const resp = await fetch(url, { mode: "cors", credentials: "omit" });
  if (!resp.ok) throw new Error("resposta " + resp.status);
  const blob = await resp.blob();
  if (!String(blob.type || "").startsWith("image/")) throw new Error("não é uma imagem");
  const endereco = URL.createObjectURL(blob);
  try {
    return await new Promise((ok, err) => {
      const img = new Image();
      img.onload = () => {
        const { naturalWidth: l, naturalHeight: a } = img;
        if (!capaPlausivel(l, a)) return err(new Error("capa genérica"));
        const esc = Math.min(1, largura / l);
        const c = document.createElement("canvas");
        c.width = Math.round(l * esc);
        c.height = Math.round(a * esc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = () => err(new Error("imagem ilegível"));
      img.src = endereco;
    });
  } finally { URL.revokeObjectURL(endereco); }
}

// Reduz a imagem antes de guardar: 400px de largura já enche o olho na grade.
function comprimirImagem(arquivo, largura = 400) {
  return new Promise((ok, erro) => {
    const leitor = new FileReader();
    leitor.onerror = () => erro(new Error("falha na leitura"));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => erro(new Error("arquivo não é uma imagem válida"));
      img.onload = () => {
        const esc = Math.min(1, largura / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * esc);
        c.height = Math.round(img.height * esc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.74));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

/* ══════════════════════════════════════════════════════════════
   CONSULTA DE METADADOS POR ISBN
   Só funciona fora da janela do Claude — aqui dentro, o navegador
   bloqueia chamadas a sites externos por segurança. No acervo-pc.html
   as bases abaixo respondem normalmente.
   ══════════════════════════════════════════════════════════════ */
const dentroDoClaude = () => typeof window !== "undefined" && !!window.storage;

/* Livros registrados antes de 2007 costumam estar catalogados só pelo
   ISBN-10. Consultamos as duas formas — a que veio e a convertida. */
function isbn10De(v) {
  const d = soIsbn(v);
  if (d.length !== 13 || !/^97[89]/.test(d)) return "";
  const nove = d.slice(3, 12);
  let soma = 0;
  for (let k = 0; k < 9; k++) soma += (10 - k) * Number(nove[k]);
  const r = (11 - (soma % 11)) % 11;
  return nove + (r === 10 ? "X" : String(r));
}
function isbn13De(v) {
  const d = soIsbn(v);
  if (d.length !== 10) return "";
  const doze = "978" + d.slice(0, 9);
  let soma = 0;
  for (let k = 0; k < 12; k++) soma += Number(doze[k]) * (k % 2 ? 3 : 1);
  return doze + String((10 - (soma % 10)) % 10);
}
const variantesIsbn = (v) =>
  [...new Set([soIsbn(v), isbn10De(v), isbn13De(v)].filter((x) => x && x.length >= 10))];

/* A Amazon publica a capa num endereço previsível, montado a partir do
   ISBN-10 (que para livros é o próprio ASIN). Não é API, não precisa de
   chave: é só o link da imagem — por isso funciona mesmo sem rede liberada
   para os outros pedidos, já que exibir uma imagem não esbarra em CORS. */
const capaAmazon = (v) => {
  const d = soIsbn(v);
  const i10 = d.length === 10 ? d : isbn10De(d);
  return i10 ? `https://images-na.ssl-images-amazon.com/images/P/${i10}.01._SCLZZZZZZZ_.jpg` : "";
};

const fatias = (arr, n) =>
  Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n));
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

/* Fila com limite de simultaneidade — evita disparar 900 chamadas de uma
   vez só. onAndar recebe o total de itens já processados. */
async function emFila(lista, limite, tarefa, onAndar, parar) {
  let proximo = 0;
  const trabalhadores = Array.from({ length: Math.min(limite, lista.length) }, async () => {
    while (proximo < lista.length) {
      if (parar && parar()) return;
      const meu = proximo++;
      try { await tarefa(lista[meu]); } catch (e) { /* falha individual não derruba o lote */ }
      onAndar && onAndar(meu + 1);
    }
  });
  await Promise.all(trabalhadores);
}

/* ISBN brasileiro começa com 978-85 ou 978-65. Quando a base devolve
   uma editora do país de origem — a japonesa de um mangá, por exemplo —
   o campo fica vazio em vez de guardar a informação errada. */
const isbnBrasileiro = (i) => /^97[89](85|65)/.test(soIsbn(i)) || /^(85|65)/.test(soIsbn(i));
const EDITORA_DE_FORA = /^\s*(shueisha|shogakukan|kodansha|kadokawa|square.?enix|hakusensha|akita shoten|futabasha|viz|marvel|dc comics|image comics|dark horse|idw|boom|vertigo|titan|dargaud|glénat|glenat|planeta deagostini|norma editorial|panini (france|deutschland|uk|espa|italia))/i;

const httpsSeguro = (u) => (u || "").replace(/^http:/, "https:").replace(/&edge=curl/, "");

function limparRegistro(r, isbn) {
  let editora = (r.editora || "").trim();
  if (isbnBrasileiro(isbn) && EDITORA_DE_FORA.test(editora)) editora = "";
  return {
    isbn,
    titulo: (r.titulo || "").trim(),
    autor: (r.autor || "").trim(),
    editora,
    paginas: Number(r.paginas) > 0 ? Number(r.paginas) : null,
    ano: String(r.ano || "").match(/\d{4}/)?.[0] || "",
    capaUrl: httpsSeguro(r.capaUrl || ""),
    generos: (r.generos || []).filter(Boolean).slice(0, 4),
    origem: r.origem || "",
    ref: isbn || "",
  };
}

/* Cada provedor da BrasilAPI nomeia os campos à sua maneira. Em vez de
   apostar num formato só, aceitamos todas as variações conhecidas. */
const primeiroPreenchido = (...vs) =>
  vs.find((v) => v != null && v !== "" && !(Array.isArray(v) && v.length === 0));
const comoTexto = (v) => {
  if (v == null) return "";
  if (Array.isArray(v)) return v.map(comoTexto).filter(Boolean).join(", ");
  if (typeof v === "object") return String(v.nome || v.name || v.titulo || v.title || "").trim();
  return String(v).trim();
};
const NOME_PROVEDOR = { cbl: "CBL", "mercado-editorial": "Mercado Editorial", "open-library": "Open Library", "google-books": "Google Books" };

/* A melhor porta para livro brasileiro: a BrasilAPI consulta a Câmara
   Brasileira do Livro — registro oficial de ISBN daqui, onde Panini e
   JBC registram —, o Mercado Editorial, a Open Library e o Google Books. */
async function viaBrasilApi(isbn, provedores) {
  const q = provedores ? `?providers=${provedores}` : "";
  let ultimoErro = null;
  for (const v of variantesIsbn(isbn)) {
    let d;
    try {
      const r = await fetch(`https://brasilapi.com.br/api/isbn/v1/${v}${q}`);
      if (r.status === 404) continue;
      if (!r.ok) { ultimoErro = new Error(`respondeu ${r.status}`); continue; }
      d = await r.json();
    } catch (e) { ultimoErro = e; continue; }
    if (!d) continue;
    const titulo = comoTexto(primeiroPreenchido(d.title, d.titulo, d.nome));
    if (!titulo) continue;
    const sub = comoTexto(primeiroPreenchido(d.subtitle, d.subtitulo));
    return limparRegistro({
      titulo: sub ? `${titulo}: ${sub}` : titulo,
      autor: comoTexto(primeiroPreenchido(d.authors, d.autores, d.author, d.autor, d.contribuicao)),
      editora: comoTexto(primeiroPreenchido(d.publisher, d.editora, d.publishers, d.selo)),
      paginas: primeiroPreenchido(d.page_count, d.pageCount, d.paginas, d.numero_paginas, d.pages),
      ano: comoTexto(primeiroPreenchido(d.year, d.ano, d.published_date, d.publishedDate, d.data_publicacao, d.ano_edicao)),
      capaUrl: comoTexto(primeiroPreenchido(d.cover_url, d.coverUrl, d.capa, d.image, d.thumbnail, d.imagem)),
      generos: (primeiroPreenchido(d.subjects, d.assuntos, d.categories, d.generos) || []).slice(0, 3).map(comoTexto),
      origem: NOME_PROVEDOR[d.provider] || "BrasilAPI",
    }, isbn);
  }
  if (ultimoErro) throw ultimoErro;
  return null;
}

async function consultaGoogle(q) {
  for (const extra of ["", "&country=BR"]) {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=1${extra}&q=${encodeURIComponent(q)}`);
    if (r.status === 429) throw new Error("429");
    if (r.status === 403 && !extra) continue;
    if (!r.ok) throw new Error(`Google Books respondeu ${r.status}`);
    const d = await r.json();
    const v = d.items && d.items[0] && d.items[0].volumeInfo;
    if (v && v.title) return v;
    if (extra) return null;
  }
  return null;
}
const doVolume = (v) => {
  const img = v.imageLinks || {};
  return {
    titulo: v.subtitle ? `${v.title}: ${v.subtitle}` : v.title,
    autor: (v.authors || []).join(", "),
    editora: v.publisher,
    paginas: v.pageCount,
    ano: v.publishedDate,
    capaUrl: img.large || img.medium || img.thumbnail || img.smallThumbnail,
    generos: (v.categories || []).slice(0, 3),
    origem: "Google Books",
  };
};
async function viaGoogleBooks(isbn) {
  for (const v of variantesIsbn(isbn)) {
    const r = await consultaGoogle(`isbn:${v}`);
    if (r) return limparRegistro(doVolume(r), isbn);
  }
  const solto = await consultaGoogle(soIsbn(isbn));
  return solto ? limparRegistro(doVolume(solto), isbn) : null;
}

async function viaOpenLibrary(isbns) {
  const deOnde = new Map();
  for (const i of isbns) for (const v of variantesIsbn(i)) if (!deOnde.has(v)) deOnde.set(v, i);
  const chaves = [...deOnde.keys()].map((v) => `ISBN:${v}`).join(",");
  const r = await fetch(`https://openlibrary.org/api/books?bibkeys=${chaves}&format=json&jscmd=data`);
  if (!r.ok) throw new Error(`Open Library respondeu ${r.status}`);
  const d = await r.json();
  const saida = {};
  for (const [variante, original] of deOnde) {
    const b = d[`ISBN:${variante}`];
    if (!b || !b.title || saida[original]) continue;
    saida[original] = limparRegistro({
      titulo: b.subtitle ? `${b.title}: ${b.subtitle}` : b.title,
      autor: (b.authors || []).map((a) => a.name).join(", "),
      editora: (b.publishers || []).map((p) => p.name).join(", "),
      paginas: b.number_of_pages,
      ano: b.publish_date,
      capaUrl: b.cover ? b.cover.large || b.cover.medium || b.cover.small : "",
      generos: (b.subjects || []).slice(0, 4).map((x) => x.name || x),
      origem: "Open Library",
    }, original);
  }
  return saida;
}

async function viaMercadoEditorial(isbn) {
  for (const v of variantesIsbn(isbn)) {
    let d;
    try {
      const r = await fetch(`https://api.mercadoeditorial.org/api/v1.2/book?isbn=${v}`);
      if (!r.ok) continue;
      d = await r.json();
    } catch (e) { continue; }
    const b = d && ((d.books && d.books[0]) || (d.book && d.book[0]));
    if (!b || !b.titulo) continue;
    const autores = (b.contribuicao || [])
      .filter((c) => !c.tipo || /autor|escrit|roteir/i.test(String(c.tipo)))
      .map((c) => [c.nome, c.sobrenome].filter(Boolean).join(" ").trim())
      .filter(Boolean);
    const capa = b.imagens && (b.imagens.imagem_primeira_capa || b.imagens.primeira_capa);
    return limparRegistro({
      titulo: b.subtitulo ? `${b.titulo}: ${b.subtitulo}` : b.titulo,
      autor: autores.join(", "),
      editora: typeof b.editora === "string" ? b.editora : (b.editora && b.editora.nome) || "",
      paginas: b.paginas || b.numero_paginas,
      ano: b.data_publicacao || b.ano_edicao || b.ano,
      capaUrl: capa ? capa.grande || capa.media || capa.pequena : "",
      generos: [],
      origem: "Mercado Editorial",
    }, isbn);
  }
  return null;
}

/* Cascata de consulta que guarda o que aconteceu em cada fonte, para a
   interface poder mostrar onde a busca parou em vez de só dizer "nada". */
const CAMPOS_FICHA = ["titulo", "autor", "editora", "paginas", "ano", "capaUrl"];
async function buscarIsbn(isbn) {
  const relato = [];
  if (dentroDoClaude()) return { reg: null, relato, bloqueado: true };
  const fontes = [
    ["CBL / Mercado Editorial", () => viaBrasilApi(isbn, "cbl,mercado-editorial")],
    ["Google Books", () => viaGoogleBooks(isbn)],
    ["BrasilAPI (todas as fontes)", () => viaBrasilApi(isbn)],
    ["Open Library", async () => (await viaOpenLibrary([isbn]))[isbn]],
    ["Mercado Editorial direto", () => viaMercadoEditorial(isbn)],
  ];
  let ficha = null;
  for (const [nome, consultar] of fontes) {
    try {
      const r = await consultar();
      if (r && r.titulo) {
        ficha = mesclarRegistros(ficha, r);
        relato.push({ nome, estado: "achou" });
        if (fichaCompleta(ficha)) break;
      } else {
        relato.push({ nome, estado: "sem ficha" });
      }
    } catch (e) {
      relato.push({ nome, estado: "erro", detalhe: String((e && e.message) || e).slice(0, 90) });
    }
  }
  if (ficha && !ficha.capaUrl) ficha.capaUrl = `https://covers.openlibrary.org/b/isbn/${soIsbn(isbn)}-L.jpg?default=false`;
  return { reg: ficha, relato, falta: faltaNaFicha(ficha) };
}
function mesclarRegistros(base, novo) {
  if (!base) return { ...novo, fontes: [novo.origem] };
  const r = { ...base };
  if (novo.titulo && novo.titulo.length > (r.titulo || "").length) r.titulo = novo.titulo;
  for (const c of ["autor", "editora", "paginas", "ano", "capaUrl"]) if (!r[c] && novo[c]) r[c] = novo[c];
  if (!(r.generos || []).length && (novo.generos || []).length) r.generos = novo.generos;
  if (!r.fontes.includes(novo.origem)) r.fontes.push(novo.origem);
  r.origem = r.fontes.join(" + ");
  return r;
}
const fichaCompleta = (r) => !!(r && r.titulo && r.autor && r.editora && r.paginas && r.capaUrl);
const faltaNaFicha = (r) => (r ? CAMPOS_FICHA.filter((c) => !r[c]) : CAMPOS_FICHA);

/* ---------- busca por título (o caminho que funciona melhor pra HQ brasileira) ---------- */
async function consultaGoogleVarios(q, n = 10, editora) {
  const busca = editora ? `${q} inpublisher:${editora}` : q;
  for (const extra of ["", "&country=BR"]) {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=${n}${extra}&q=${encodeURIComponent(busca)}`);
    if (r.status === 429) throw new Error("429");
    if (r.status === 403 && !extra) continue;
    if (!r.ok) throw new Error(`Google Books respondeu ${r.status}`);
    const d = await r.json();
    const achados = (d.items || []).filter((i) => i.volumeInfo && i.volumeInfo.title);
    if (achados.length || extra) return achados.map((i) => i.volumeInfo);
  }
  return [];
}
const isbnDoVolume = (v) => {
  const ids = v.industryIdentifiers || [];
  return ((ids.find((i) => i.type === "ISBN_13") || ids.find((i) => i.type === "ISBN_10") || {}).identifier) || "";
};
async function viaOpenLibraryBusca(q, n = 10) {
  const campos = "title,author_name,publisher,first_publish_year,number_of_pages_median,isbn,cover_i";
  const r = await fetch(`https://openlibrary.org/search.json?limit=${n}&fields=${campos}&q=${encodeURIComponent(q)}`);
  if (!r.ok) throw new Error(`Open Library respondeu ${r.status}`);
  const d = await r.json();
  return (d.docs || []).filter((x) => x.title).map((x) =>
    limparRegistro({
      titulo: x.title,
      autor: (x.author_name || []).join(", "),
      editora: (x.publisher || [])[0] || "",
      paginas: x.number_of_pages_median,
      ano: x.first_publish_year,
      capaUrl: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg` : "",
      generos: [],
      origem: "Open Library",
    }, (x.isbn || []).find(ehIsbn) || "")
  );
}
async function viaMercadoEditorialPorTitulo(q, editora, n = 12) {
  const params = new URLSearchParams({ titulo: q });
  if (editora) params.set("nome_fantasia_da_editora", editora);
  let d;
  try {
    const r = await fetch(`https://api.mercadoeditorial.org/api/v1.2/book?${params}`);
    if (!r.ok) throw new Error(`Mercado Editorial respondeu ${r.status}`);
    d = await r.json();
  } catch (e) { throw e; }
  const livros = primeiroPreenchido(d.books, d.livros, Array.isArray(d) ? d : null) || [];
  return livros.slice(0, n).map((b) => {
    const autores = (primeiroPreenchido(b.contribuicao, b.autores, b.contribuicao_nome) || [])
      .filter((c) => !c || !c.tipo || /autor|escrit|roteir|organiz/i.test(comoTexto(c.tipo)))
      .map((c) => (typeof c === "string" ? c : [c.nome, c.sobrenome].filter(Boolean).join(" ")))
      .filter(Boolean);
    const titulo = comoTexto(primeiroPreenchido(b.titulo, b.title));
    const sub = comoTexto(primeiroPreenchido(b.subtitulo, b.subtitle));
    const capa = primeiroPreenchido(b.imagem_primeira_capa, b.imagens && b.imagens.imagem_primeira_capa, b.imagens && b.imagens.primeira_capa, b.capa);
    return limparRegistro({
      titulo: sub ? `${titulo}: ${sub}` : titulo,
      autor: autores.join(", ") || comoTexto(primeiroPreenchido(b.contribuicao_nome)),
      editora: comoTexto(primeiroPreenchido(b.editora, b.nome_fantasia_da_editora, b.selo_editorial)),
      paginas: primeiroPreenchido(b.paginas, b.numero_paginas),
      ano: comoTexto(primeiroPreenchido(b.ano_edicao, b.data_de_publicacao, b.ano)),
      capaUrl: comoTexto(capa),
      generos: [],
      origem: "Mercado Editorial",
    }, comoTexto(primeiroPreenchido(b.isbn, b.codigo_de_barras)));
  }).filter((r) => r.titulo);
}
async function viaTitulo(consulta) {
  const v = await consultaGoogle(consulta);
  if (!v) return null;
  return limparRegistro(doVolume(v), isbnDoVolume(v));
}

/* Busca por nome. O Mercado Editorial vai primeiro porque é a única das
   três que sabe o que é uma editora brasileira de verdade — quando você
   informa "Panini", ela exclui as edições americanas e japonesas em vez
   de só tentar não mostrá-las. As outras duas completam o que sobrar. */
async function buscarPorTitulo(consulta, editora) {
  if (dentroDoClaude()) return { itens: [], bloqueado: true };
  const achados = [];
  const fontes = [];
  try {
    const r = await viaMercadoEditorialPorTitulo(consulta, editora);
    achados.push(...r);
    fontes.push({ nome: "Mercado Editorial", qtd: r.length });
  } catch (e) { fontes.push({ nome: "Mercado Editorial", erro: true }); }
  try {
    const vs = await consultaGoogleVarios(consulta, 10, editora);
    const r = vs.map((v) => limparRegistro(doVolume(v), isbnDoVolume(v)));
    achados.push(...r);
    fontes.push({ nome: "Google Books", qtd: r.length });
  } catch (e) { fontes.push({ nome: "Google Books", erro: true }); }
  try {
    const r = await viaOpenLibraryBusca(editora ? `${consulta} ${editora}` : consulta);
    achados.push(...r);
    fontes.push({ nome: "Open Library", qtd: r.length });
  } catch (e) { fontes.push({ nome: "Open Library", erro: true }); }

  const alvo = editora ? semAcento(editora) : null;
  const bateEditora = (a) => !alvo || !a.editora || semAcento(a.editora).includes(alvo);
  const estrangeira = (a) => a.editora && EDITORA_DE_FORA.test(a.editora);
  const prioridade = (a) => (bateEditora(a) ? 0 : 2) + (estrangeira(a) ? 1 : 0);

  const vistos = new Set();
  const itens = [];
  for (const a of [...achados].sort((x, y) => prioridade(x) - prioridade(y))) {
    const chave = `${semAcento(a.titulo)}|${semAcento(a.autor)}`;
    if (vistos.has(chave)) continue;
    vistos.add(chave);
    itens.push({ ...a, volume: separarVolume(a.titulo).vol });
  }
  return { itens: itens.slice(0, 16), fontes };
}

/* ══════════════════════════════════════════════════════════════
   PEÇAS DE INTERFACE
   ══════════════════════════════════════════════════════════════ */
function Capa({ item, src }) {
  // Open Library primeiro: com ?default=false ela falha limpo (404) quando
  // não tem a capa. A Amazon, quando não tem, devolve uma imagem "sem capa"
  // genérica em vez de erro — carrega normal e engana a checagem de imagem
  // quebrada, então ela fica por último, como última tentativa.
  const candidatas = useMemo(() => {
    const base = candidatasCapa(item, src);
    // base64 já salvo não passa pelo filtro de http, mas é o que vale mais
    if (typeof src === "string" && src.startsWith("data:")) return [src, ...base];
    return base;
  }, [src, item && item.isbn]);

  const [n, setN] = useState(0);
  const assinatura = candidatas.join("|");
  useEffect(() => setN(0), [assinatura]);

  const atual = candidatas[n];
  if (atual) {
    return (
      <img
        src={atual}
        alt=""
        loading="lazy"
        onError={() => setN((k) => k + 1)}
        // capa "genérica" (sem imagem de verdade) costuma vir pequena e/ou
        // quadrada — bem diferente de uma capa de livro real, que é vertical
        // e maior. Qualquer imagem fora desse formato é tratada como quebrada.
        onLoad={(e) => {
          const { naturalWidth: w, naturalHeight: h } = e.target;
          const pequena = w < 50 || h < 50;
          const naoEhVertical = h < w * 1.15; // capa de livro é sempre mais alta que larga
          if (pequena || naoEhVertical) setN((k) => k + 1);
        }}
      />
    );
  }

  const h = matizDoTitulo(item.titulo);
  return (
    <div
      className="capa-vazia"
      style={{ background: `linear-gradient(150deg, hsl(${h} 42% 26%), hsl(${(h + 42) % 360} 38% 15%))` }}
    >
      <b>{item.titulo || "Sem título"}</b>
      <small>{item.autor || item.editora || item.tipo}</small>
    </div>
  );
}

/* A assinatura da interface: cada volume da coleção é uma lombada.
   Cheia = está na estante. Ciano = já está na lista de desejos.
   Contorno tracejado = buraco na coleção. */
function Lombadas({ total, tenho, querendo, legenda }) {
  const q = querendo || new Set();
  if (!total || total < 2) return null;

  if (total > 40) {
    return (
      <>
        <div className="prog"><i style={{ width: `${Math.min(100, (tenho.size / total) * 100)}%` }} /></div>
        {legenda && <div className="lomb-legenda">{tenho.size} de {total} volumes</div>}
      </>
    );
  }
  return (
    <div className="lombadas" aria-hidden="true">
      {Array.from({ length: total }, (_, i) => {
        const v = i + 1;
        const cls = tenho.has(v) ? "cheia" : q.has(v) ? "desejo" : "vazia";
        return <span key={v} className={`lomb ${cls}`} />;
      })}
    </div>
  );
}

function Estrelas({ valor = 0, aoMudar }) {
  return (
    <div className="estrelas">
      {[1, 2, 3, 4, 5].map((n) => (
        <button
          key={n}
          type="button"
          className={n <= valor ? "on" : ""}
          aria-label={`${n} de 5`}
          onClick={() => aoMudar && aoMudar(n === valor ? 0 : n)}
          disabled={!aoMudar}
          style={!aoMudar ? { cursor: "default" } : undefined}
        >
          <Star size={16} fill={n <= valor ? "currentColor" : "none"} />
        </button>
      ))}
    </div>
  );
}

function Modal({ titulo, aoFechar, children, rodape }) {
  useEffect(() => {
    const esc = (e) => e.key === "Escape" && aoFechar();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [aoFechar]);

  return (
    <div className="fundo" onMouseDown={(e) => e.target === e.currentTarget && aoFechar()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={titulo}>
        <div className="modal-topo">
          <h2>{titulo}</h2>
          <button className="btn btn-icone" onClick={aoFechar} aria-label="Fechar">
            <X size={16} />
          </button>
        </div>
        <div className="modal-corpo">{children}</div>
        {rodape && <div className="modal-pe">{rodape}</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   FORMULÁRIO — cadastro e edição
   ══════════════════════════════════════════════════════════════ */
function Formulario({ inicial, capaAtual, colecoes, sugestoesOrig, aoAbrirLote, temCapaSerie, aoSalvarCapaSerie, aoSalvarRetrato, aoSalvarNumeracao, aoCriarColecao, aoSalvar, aoFechar, aoAvisar }) {
  const [it, setIt] = useState(() => ({
    ...inicial,
    colecoes: [...(inicial.colecoes || [])],
    precoAlvo: paraTexto(inicial.precoAlvo),
    precoPago: paraTexto(inicial.precoPago),
  }));
  const [capaNova, setCapaNova] = useState(undefined); // undefined = sem alteração
  const arquivoRef = useRef(null);

  const [novaColecao, setNovaColecao] = useState("");
  const [filtroCol, setFiltroCol] = useState("");
  const [verColecoes, setVerColecoes] = useState(false);
  const [novoTotal, setNovoTotal] = useState("");
  const set = (campo, valor) => setIt((p) => ({ ...p, [campo]: valor }));
  const previa = capaNova === undefined ? capaAtual : capaNova;

  const alternarColecao = (id) => {
    const atual = it.colecoes || [];
    set("colecoes", atual.includes(id) ? atual.filter((x) => x !== id) : [...atual, id]);
  };

  const origens = comoOriginais(it.original);
  /* Cadastro em sequência: nada mais que repetir este mesmo formulário.
     Só aparece ao adicionar — editando um item existente não faz sentido. */
  const [quantos, setQuantos] = useState(1);
  const [feitos, setFeitos] = useState(0);
  const emSequencia = !inicial.titulo && quantos > 1;
  /* Junta o que já existe no acervo com o que você acabou de digitar nesta
     ficha, para a segunda série do mesmo item já sugerir a editora da primeira. */
  const sug = useMemo(() => {
    const base = sugestoesOrig || { editoras: [], paises: [] };
    const daFicha = comoOriginais(it.original);
    const juntar = (lista, campo) => [...new Set([
      ...daFicha.map((o) => (o[campo] || "").trim()).filter(Boolean),
      ...lista,
    ])];
    return { editoras: juntar(base.editoras, "editora"), paises: juntar(base.paises, "pais") };
  }, [sugestoesOrig, it.original]);
  const [buscaDatas, setBuscaDatas] = useState(null); // índice da origem consultando
  const [abaOrig, setAbaOrig] = useState(0);
  const [detalhando, setDetalhando] = useState(null); // índice com a lista aberta

  /* Reescreve o campo de texto a partir da lista editada. Faixas como "1-12"
     viram "1, 2, 3…" quando cada edição ganha data própria — não há como
     manter a forma compacta e datas individuais ao mesmo tempo. */
  const setDataEdicao = (idx, num, data) => {
    const eds = edicoesDetalhadas(origens[idx] && origens[idx].edicoesTexto);
    const texto = eds
      .map((e) => {
        const d = e.n === num ? data.trim() : e.data;
        return d ? `${e.n} (${d})` : String(e.n);
      })
      .join(", ");
    setOrigem(idx, "edicoesTexto", texto);
  };
  const setOrigem = (idx, campo, valor) =>
    setIt((p) => {
      const arr = comoOriginais(p.original).map((o, i) => (i === idx ? { ...o, [campo]: valor } : o));
      return { ...p, original: arr };
    });
  const addOrigem = () => setIt((p) => ({ ...p, original: [...comoOriginais(p.original), origemVazia()] }));
  const removerOrigem = (idx) =>
    setIt((p) => ({ ...p, original: comoOriginais(p.original).filter((_, i) => i !== idx) }));

  const criarEVincular = () => {
    const nome = novaColecao.trim();
    if (!nome) return;
    const col = {
      ...colecaoVazia(),
      nome,
      editora: it.editora || "",
      total: Math.max(0, parseInt(novoTotal || "0", 10)),
    };
    aoCriarColecao(col);
    set("colecoes", [...(it.colecoes || []), col.id]);
    setNovaColecao("");
    setNovoTotal("");
  };

  const alternarGenero = (g) => {
    const atual = it.generos || [];
    set("generos", atual.includes(g) ? atual.filter((x) => x !== g) : [...atual, g]);
  };

  const enviarArquivo = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const dados = await comprimirImagem(f);
      setCapaNova(dados);
      set("capaUrl", "");
    } catch (err) {
      aoAvisar("Não deu para ler esse arquivo. Use uma imagem JPG ou PNG.");
    }
    e.target.value = "";
  };

  const [buscandoIsbn, setBuscandoIsbn] = useState(false);
  const [relatoIsbn, setRelatoIsbn] = useState(null);
  const [consulta, setConsulta] = useState("");
  const [candidatos, setCandidatos] = useState(null);
  const [fontesTitulo, setFontesTitulo] = useState(null);
  const [buscandoTitulo, setBuscandoTitulo] = useState(false);

  const buscarPeloIsbn = async () => {
    const isbn = soIsbn(it.isbn);
    if (!ehIsbn(isbn)) return aoAvisar("Preencha o ISBN com 10 ou 13 dígitos primeiro.");
    setBuscandoIsbn(true);
    setRelatoIsbn(null);
    const { reg, relato, bloqueado, falta } = await buscarIsbn(isbn);
    setBuscandoIsbn(false);

    if (!reg) {
      set("capaUrl", `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`);
      setCapaNova(null);
      setRelatoIsbn({ bloqueado, relato });
      return aoAvisar(
        bloqueado
          ? "A busca por ISBN não funciona dentro da janela do Claude."
          : "Nada encontrado — veja abaixo o que cada fonte respondeu."
      );
    }
    setRelatoIsbn(falta && falta.length ? { parcial: true, falta, relato } : null);
    setIt((p) => ({
      ...p,
      titulo: p.titulo || reg.titulo,
      autor: p.autor || reg.autor,
      editora: p.editora || reg.editora,
      paginas: p.paginas || reg.paginas,
      ano: p.ano || reg.ano,
      capaUrl: reg.capaUrl || p.capaUrl,
      generos: (p.generos || []).length ? p.generos : (reg.generos || []).slice(0, 3),
      origem: reg.origem,
    }));
    if (reg.capaUrl) setCapaNova(null);
    aoAvisar(
      falta && falta.length
        ? `Preenchido pela ${reg.origem}. Nenhuma base tinha: ${falta.join(", ")}.`
        : `Ficha completa, vinda de ${reg.origem}.`
    );
  };

  const buscarPorNome = async () => {
    const q = (consulta || it.titulo || "").trim();
    if (q.length < 3) return aoAvisar("Escreva pelo menos três letras do título.");
    setBuscandoTitulo(true);
    setCandidatos(null);
    setFontesTitulo(null);
    try {
      const { itens, bloqueado, fontes } = await buscarPorTitulo(q, (it.editora || "").trim());
      if (bloqueado) {
        aoAvisar("A busca só funciona no acervo-pc.html, aberto no seu navegador.");
      } else {
        setCandidatos(itens);
        setFontesTitulo(fontes);
        if (!itens.length) aoAvisar("Nenhum resultado. Tente outras palavras do título ou remova a editora.");
      }
    } catch (e) {
      aoAvisar("As bases não responderam agora. Tente de novo em instantes.");
    }
    setBuscandoTitulo(false);
  };

  const aplicarCandidato = (c) => {
    setIt((p) => ({
      ...p,
      titulo: c.titulo || p.titulo,
      autor: c.autor || p.autor,
      editora: c.editora || p.editora,
      isbn: c.isbn || p.isbn,
      paginas: c.paginas || p.paginas,
      ano: c.ano || p.ano,
      capaUrl: c.capaUrl || p.capaUrl,
      generos: (p.generos || []).length ? p.generos : (c.generos || []).slice(0, 3),
      origem: c.origem,
    }));
    if (c.capaUrl) setCapaNova(null);
    setCandidatos(null);
    setRelatoIsbn(null);
    aoAvisar(`“${c.titulo}” preenchido.`);
  };

  const salvar = () => {
    if (!it.titulo.trim()) return aoAvisar("O título é obrigatório.");
    const original = comoOriginais(it.original)
      .filter((o) => o.serie && o.serie.trim())
      .map((o) => ({
        serie: o.serie.trim(),
        edicoesTexto: (o.edicoesTexto || "").trim(),
        numeros: numerosDeEdicoes(o.edicoesTexto),
        editora: (o.editora || "").trim(),
        pais: (o.pais || "").trim(),
        data: resumoDasEdicoes(o.edicoesTexto) || (o.data || "").trim(),
        arco: o.arco || "",
        cronologia: (o.cronologia || "").trim(),
        roteirista: (o.roteirista || "").trim(),
        desenhista: (o.desenhista || "").trim(),
        personagens: (o.personagens || []).map((x) => ({ nome: x.nome, pagina: x.pagina || "" })),
      }));
    /* Rede contra perda silenciosa: se o item tinha séries e o formulário
       está salvando nenhuma, algo deu errado — pergunta antes de apagar.
       Foi assim que séries cadastradas sumiram sem aviso. */
    const tinha = comoOriginais(inicial.original).filter((o) => o.serie && o.serie.trim()).length;
    if (tinha > 0 && original.length === 0) {
      const ok = typeof window !== "undefined" && window.confirm(
        `Este título tinha ${tinha} série(s) original(is) cadastrada(s) e está sendo salvo sem nenhuma.\n\n` +
        `Se você não removeu de propósito, cancele — salvar assim apaga esse trabalho.\n\n` +
        `Salvar mesmo assim?`);
      if (!ok) return;
    }

    const feitosAgora = feitos + 1;
    const continuar = emSequencia && feitosAgora < quantos;

    aoSalvar({
      ...it,
      titulo: it.titulo.trim(),
      original: original.length ? original : null,
      precoAlvo: numero(it.precoAlvo),
      precoPago: numero(it.precoPago),
    }, capaNova, continuar);

    if (continuar) {
      // formulário limpo para o próximo, mantendo a lista de destino
      /* previa é derivada de capaNova, então não tem setter próprio;
         zerar capaNova já limpa a imagem do próximo. */
      setIt(itemVazio(it.lista));
      setCapaNova(null);
      setFeitos(feitosAgora);
      setAbaOrig(0);
      setDetalhando(null);
      setNovaColecao("");
      setNovoTotal("");
      if (typeof window !== "undefined") {
        const caixa = document.querySelector(".modal-corpo");
        if (caixa) caixa.scrollTop = 0;
      }
    } else if (emSequencia) {
      setFeitos(feitosAgora);
    }
  };

  return (
    <Modal
      titulo={inicial.titulo ? "Editar título" : "Adicionar título"}

      rodape={
        <>
          <button className="btn btn-primario" onClick={salvar}>

                inputMode="numeric"
                onChange={(e) => {
                  const n = parseInt(e.target.value.replace(/[^0-9]/g, ""), 10);
                  setQuantos(!n || n < 1 ? 1 : Math.min(n, 200));

              <span>{quantos > 1 ? `em sequência · ${feitos} de ${quantos}` : "por vez"}</span>
            </label>

          {!inicial.titulo && aoAbrirLote && (
            /* Quem vai cadastrar uma coleção inteira descobre tarde que existe
               importação em lote — ela ficava só na barra de ferramentas. */
            <button className="btn btn-mini" onClick={aoAbrirLote}>
              <Package size={13} /> Adicionar vários de uma vez
            </button>

    >

          { v: "estante", rot: "Já tenho — vai para a estante", icone: <Library size={13} /> },
          { v: "desejos", rot: "Quero comprar — lista de desejos", icone: <Heart size={13} /> },

          <button

            className={`chip ${it.lista === o.v ? "ativo" : ""}`}

              style={{ flex: "2 1 220px" }}
            />
            <input

            />
            <button

          <span className="dica">

        {candidatos && (

            {candidatos.length > 0 ? (

            <button className="btn btn-mini" style={{ marginTop: 8, alignSelf: "flex-start" }} onClick={() => setCandidatos(null)}>
              <X size={12} /> Fechar resultados

        <div className="campo">

        <div className="campo">

<Search size={14} /> {buscandoIsbn ? "…" : "Buscar"}

                  </div>

            ) : relatoIsbn.bloqueado ? (

                    <b>{f.nome}</b>
                    <span>{f.estado === "erro" ? `não respondeu — ${f.detalhe}` : "não tem esse ISBN"}</span>

                <p className="dica" style={{ marginTop: 8 }}>

        <div className="campo">

          <input

        <div className="campo">
          <label>Ano</label>
          <input value={it.ano || ""} onChange={(e) => set("ano", e.target.value)} placeholder="2019" />

              {(previa || it.capaUrl) && (

                  <X size={13} /> Remover capa

              )}
            </div>
            <input ref={arquivoRef} type="file" accept="image/*" hidden onChange={enviarArquivo} />
            <p className="dica">
              Sem capa, o título ganha uma arte gerada a partir do próprio nome — ele nunca fica em branco na grade.
            </p>
          </div>
        </div>
      </div>

      {/* coleções */}
      <div className="secao">
        <p className="secao-tit"><Library size={12} /> Coleções</p>
        <p className="dica" style={{ marginBottom: 10 }}>
          Um item pode estar em mais de uma — a série numerada e a estante temática, por exemplo.
          Ao criar uma nova, o número ao lado é o total de volumes da série completa, e pode ficar vazio.
        </p>
        {/* Com dezenas de coleções a lista inteira vira uma parede. Mostra as
            marcadas, um punhado de sugestões e um filtro — o resto entra
            por busca. */}
        {colecoes.length === 0 ? (
          <span className="dica">Nenhuma coleção criada ainda.</span>
        ) : (() => {
          const marcadas = it.colecoes || [];
          const q = semAcento(filtroCol.trim());
          const casa = (c) => !q || semAcento(c.nome).includes(q);
          const dentro = colecoes.filter((c) => marcadas.includes(c.id));
          const fora = colecoes.filter((c) => !marcadas.includes(c.id) && casa(c));
          const mostrar = q || verColecoes ? fora : fora.slice(0, 8);
          return (
            <>
              {colecoes.length > 10 && (
                <input
                  value={filtroCol}
                  onChange={(e) => setFiltroCol(e.target.value)}
                  placeholder={`filtrar entre ${colecoes.length} coleções…`}
                  style={{ marginBottom: 8 }}
                />
              )}
              <div className="chips" style={{ marginBottom: 12 }}>
                {dentro.map((c) => (
                  <button key={c.id} className="chip ativo" onClick={() => alternarColecao(c.id)}>

                  </button>
                ))}
                {mostrar.map((c) => (
                  <button key={c.id} className="chip" onClick={() => alternarColecao(c.id)}>
                    {c.nome}
                  </button>
                ))}
                {!q && !verColecoes && fora.length > 8 && (
                  <button className="btn-mini-link" onClick={() => setVerColecoes(true)}>
                    ver as outras {fora.length - 8}
                  </button>

                {!q && verColecoes && fora.length > 8 && (
                  <button className="btn-mini-link" onClick={() => setVerColecoes(false)}>
                    mostrar menos
                  </button>

                {q && !fora.length && !dentro.length && (
                  <span className="dica">Nenhuma coleção com esse nome.</span>
                )}
              </div>
            </>
          );
        })()}
        <div style={{ display: "flex", gap: 8 }}>
          <input
            value={novaColecao}
            onChange={(e) => setNovaColecao(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && criarEVincular()}

            style={{ padding: "9px 11px", borderRadius: 8, background: "var(--tinta)", border: "1px solid var(--linha)", color: "var(--papel)", flex: 1, minWidth: 140 }}
          />
          <input
            type="number"
            min="0"
            value={novoTotal}
            onChange={(e) => setNovoTotal(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && criarEVincular()}

            title="Total de volumes da coleção (opcional)"

          />
          <button className="btn btn-mini" onClick={criarEVincular} disabled={!novaColecao.trim()}>
            <Plus size={13} /> Criar

        <div className="chips">

            <button

              className={`chip ${(it.generos || []).includes(g) ? "ativo" : ""}`}
              onClick={() => alternarGenero(g)}
            >
              {g}
            </button>
          ))}

      {/* específico de cada lista */}

        <div className="secao">
          <p className="secao-tit"><Store size={12} /> Intenção de compra</p>

              <label>Preço alvo (R$)</label>

          </div>
          <div className="grade-form">
            <div className="campo">
              <label>Data de aquisição</label>

              <label>Preço pago (R$)</label>

                inputMode="decimal"
                value={it.precoPago ?? ""}

                <label>Terminei em (opcional)</label>
                <input type="date" value={it.dataLeitura || ""} onChange={(e) => set("dataLeitura", e.target.value)} />
              </div>

            <div className="campo">
              <label>Avaliação</label>
              <div style={{ paddingTop: 6 }}>
                <Estrelas valor={it.nota} aoMudar={(n) => set("nota", n)} />

          </div>
        </div>

      <div className="secao">
        <p className="secao-tit"><Globe size={12} /> Publicação original (opcional)</p>

                    return `${eds.length} edição(ões)` + (comData ? ` · ${comData} com data própria` : " · sem datas individuais");

                  placeholder="DC Comics"
                />
                {(sug.editoras || []).length > 0 && (
                  <span className="dica sugestoes">
                    {sug.editoras.slice(0, 4).map((v) => (
                      <button key={v} className="sug" onClick={() => setOrigem(idx, "editora", v)}>{v}</button>
                    ))}
                  </span>
                )}
              </div>
              <div className="campo">
                <label>País</label>
                <input
                  list="sug-pais-orig"
                  value={o.pais || ""}
                  onChange={(e) => setOrigem(idx, "pais", e.target.value)}
                  placeholder="Estados Unidos"
                />
                {(sug.paises || []).length > 0 && (
                  <span className="dica sugestoes">
                    {sug.paises.slice(0, 4).map((v) => (
                      <button key={v} className="sug" onClick={() => setOrigem(idx, "pais", v)}>{v}</button>
                    ))}
                  </span>
                )}
              </div>
              {(() => {
                const auto = resumoDasEdicoes(o.edicoesTexto);
                if (auto) return (
                  <div className="campo">
                    <label>Publicação original</label>
                    <div className="campo-auto">
                      <b>{auto}</b>
                      <span>calculado das datas de cada edição</span>
                    </div>
                  </div>
                );
                return (
                  <div className="campo">
                    <label>Publicação original</label>
                    <input
                      value={o.data || ""}
                      onChange={(e) => setOrigem(idx, "data", e.target.value)}
                      placeholder="03/2007 - 09/2007"
                    />
                    <span className="dica">
                      {(() => {
                        const d = dataDaSerie({ data: o.data });
                        if (d.ano == null) return "com ou sem mês: 03/2007 - 09/2007, mar/2007 ou só 2007";
                        return d.mes != null
                          ? `ordena por ${String(d.mes).padStart(2, "0")}/${d.ano}`
                          : `ordena por ${d.ano} — informe o mês para afinar`;
                      })()}
                    </span>
                  </div>
                );
              })()}
              <div className="campo">
                <label>Roteiro</label>
                <input
                  value={o.roteirista || ""}
                  onChange={(e) => setOrigem(idx, "roteirista", e.target.value)}
                  placeholder="George Pérez"
                />
              </div>
              <div className="campo">
                <label>Desenho</label>
                <input
                  value={o.desenhista || ""}
                  onChange={(e) => setOrigem(idx, "desenhista", e.target.value)}
                  placeholder="George Pérez"
                />
              </div>

              {(o.personagens || []).length > 0 && (
                <div className="campo largo">
                  <label>Personagens principais</label>
                  <div className="chips">
                    {(o.personagens || []).map((x, k) => (
                      <span key={x.nome} className="chip-rel">
                        {x.nome}
                        <button className="x" onClick={() => setOrigem(idx, "personagens", (o.personagens || []).filter((_, j) => j !== k))}>
                          <X size={11} />
                        </button>
                      </span>
                    ))}
                  </div>
                </div>
              )}

              <div className="campo largo">
                <label>Cronologia</label>
                <input
                  value={o.cronologia || ""}
                  onChange={(e) => setOrigem(idx, "cronologia", e.target.value)}
                  placeholder="Ler antes de Amazons Attack!"
                />
              </div>
            </div>
          </div>
          )
        ))}

        <datalist id="sug-editora-orig">
          {(sug.editoras || []).map((v) => <option key={v} value={v} />)}
        </datalist>
        <datalist id="sug-pais-orig">
          {(sug.paises || []).map((v) => <option key={v} value={v} />)}
        </datalist>

        <button className="btn btn-mini" onClick={addOrigem} style={{ marginTop: origens.length ? 4 : 0 }}>
          <Plus size={12} /> {origens.length ? "Adicionar outra série" : "Adicionar série compilada"}
        </button>

        {buscaDatas !== null && origens[buscaDatas] && (
          <ModalDatasWiki
            nomeSerie={origens[buscaDatas].serie}
            edicoesTexto={origens[buscaDatas].edicoesTexto}
            jaTemCapa={!!(temCapaSerie && temCapaSerie(chaveSerie(origens[buscaDatas].serie)))}
            podeRenomear
            aoFechar={() => setBuscaDatas(null)}
            aoAplicar={({ nome, texto, capa, creditos, personagens, primeiro, ultimo, tipo, publicados, inicioSerie, fimSerie, editora, pais, publicando, anoFim, wikiId, paginaWiki }) => {
              const i = buscaDatas;
              /* A chave da série vem do nome FINAL. Usar origens[i].serie aqui
                 pegava o nome antigo — o estado ainda não atualizou —, e a capa
                 acabava guardada na série errada. */
              const nomeFinal = nome || origens[i].serie;
              const idSerie = chaveSerie(nomeFinal);

              if (nome) setOrigem(i, "serie", nome);
              if (texto) setOrigem(i, "edicoesTexto", texto);
              // decorrem da base que respondeu, não de um campo consultado
              if (editora) setOrigem(i, "editora", editora);
              if (pais) setOrigem(i, "pais", pais);
              // a numeração completa da série já veio junto: não faz sentido
              // você ter que abrir a série depois só para buscar de novo
              if (aoSalvarNumeracao && (primeiro || ultimo || tipo)) {
                aoSalvarNumeracao(idSerie, nomeFinal, primeiro, ultimo, tipo, publicados, inicioSerie, fimSerie, publicando, anoFim, wikiId, paginaWiki);
              }
              if (creditos) {
                if (creditos.roteirista) setOrigem(i, "roteirista", creditos.roteirista);
                if (creditos.desenhista) setOrigem(i, "desenhista", creditos.desenhista);
              }
              if (personagens) {
                setOrigem(i, "personagens", personagens.map((x) => ({ nome: x.nome, pagina: x.pagina })));
                // o retrato é do personagem, não da série: guardado uma vez e
                // reaproveitado por toda série em que ele apareça
                if (aoSalvarRetrato) personagens.forEach((x) => x.retrato && aoSalvarRetrato(x.nome, x.retrato));
              }
              if (capa && aoSalvarCapaSerie) aoSalvarCapaSerie(idSerie, capa);
              setBuscaDatas(null);
            }}
          />
        )}
      </div>

      <div className="campo largo" style={{ marginTop: 18 }}>
        <label>Notas pessoais</label>
        <textarea
          value={it.notas}
          onChange={(e) => set("notas", e.target.value)}
          placeholder="Onde comprou, estado de conservação, edição, por que gosta…"
        />
      </div>
    </Modal>
  );
}

/* ══════════════════════════════════════════════════════════════
   DETALHE — ficha completa, lombadas clicáveis e preços
   ══════════════════════════════════════════════════════════════ */
function Detalhe({ item, capaSrc, colecoes, navLista, capasPers, aoAbrirPersonagem, aoFechar, aoEditar, aoRemover, aoAtualizar, aoMover, aoNavegar, aoAbrirColecao }) {
  const [abaOrig, setAbaOrig] = useState(0);
  const [verEds, setVerEds] = useState(null);
  const [buscaIsbn, setBuscaIsbn] = useState(false);
  const [valor, setValor] = useState("");
  const [loja, setLoja] = useState("");
  const minhas = (item.colecoes || []).map((id) => colecoes.find((c) => c.id === id)).filter(Boolean);
  const melhor = melhorPreco(item);
  const abaixoDoAlvo = melhor != null && item.precoAlvo != null && melhor <= item.precoAlvo;
  const precos = [...(item.precos || [])].sort((a, b) => a.data.localeCompare(b.data));
  const teto = precos.length ? Math.max(...precos.map((p) => p.valor)) : 1;

  const posNav = navLista ? navLista.findIndex((x) => x.id === item.id) : -1;
  const anterior = posNav > 0 ? navLista[posNav - 1] : null;
  const proximo = posNav !== -1 && posNav < (navLista || []).length - 1 ? navLista[posNav + 1] : null;

  const registrarPreco = () => {
    const n = numero(valor);
    if (n == null || n <= 0) return;
    aoAtualizar({
      ...item,
      precos: [...(item.precos || []), { id: uid(), valor: n, loja: loja.trim() || "Não informada", data: hoje() }],
    });
    setValor(""); setLoja("");
  };

  const apagarPreco = (id) =>
    aoAtualizar({ ...item, precos: (item.precos || []).filter((p) => p.id !== id) });

  return (
    <Modal
      titulo={item.lista === "desejos" ? "Lista de desejos" : "Na estante"}
      aoFechar={aoFechar}
      rodape={
        <>
          <button className="btn" onClick={aoEditar}><Pencil size={14} /> Editar</button>
          <button className="btn" onClick={aoMover}>
            <ArrowRightLeft size={14} />
            {item.lista === "desejos" ? "Já comprei — mover para a estante" : "Mover para a lista de desejos"}
          </button>
          <button className="btn btn-perigo" style={{ marginLeft: "auto" }} onClick={() => {
            if (window.confirm(`Excluir "${item.titulo}" do acervo inteiro? Isso não afeta só esta coleção — o item some de vez, sem volta.`)) aoRemover();
          }}>
            <Trash2 size={14} /> Excluir do acervo
          </button>
        </>
      }
    >
      {navLista && navLista.length > 1 && (
        <div className="nav-item">
          <button onClick={() => anterior && aoNavegar(anterior)} disabled={!anterior} title="Item anterior (seta ⯇)">
            <ChevronDown size={15} style={{ transform: "rotate(90deg)" }} />
          </button>
          <span>{posNav + 1} de {navLista.length}</span>
          <button onClick={() => proximo && aoNavegar(proximo)} disabled={!proximo} title="Próximo item (seta ⯈)">
            <ChevronDown size={15} style={{ transform: "rotate(-90deg)" }} />
          </button>
        </div>
      )}
      <div className="det">
        <div>
          <div className="det-capa"><Capa item={item} src={capaSrc || item.capaUrl} /></div>
          {item.lista === "estante" && item.nota > 0 && (
            <div style={{ marginTop: 12, display: "flex", justifyContent: "center" }}>
              <Estrelas valor={item.nota} />
            </div>
          )}
        </div>

        <div>
          <h3>{item.titulo}</h3>
          <p className="autor">
            {item.autor || "Autoria não informada"}
            {item.editora ? ` · ${item.editora}` : ""}
          </p>

          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            <span className={`selo ${item.lista === "desejos" ? "desejo" : "ok"}`} style={{ position: "static" }}>
              {item.lista === "desejos" ? "Quero comprar" : "Na estante"}
            </span>
            {item.volume != null && (
              <span className="selo vol" style={{ position: "static" }}>Volume {item.volume}</span>
            )}
            {item.lista === "estante" && (
              <span
                className="selo"
                style={{
                  position: "static",
                  background: "transparent",
                  border: `1px solid ${(LEITURAS.find((l) => l.v === (item.leitura || "nao_lido")) || {}).cor}`,
                  color: (LEITURAS.find((l) => l.v === (item.leitura || "nao_lido")) || {}).cor,
                }}
              >
                {rotLeitura(item.leitura)}
              </span>
            )}
            <span className="selo" style={{ position: "static", background: "var(--tinta4)", color: "var(--papel2)" }}>
              {item.tipo}
            </span>
          </div>

          <div className="ficha">
            <div><dt>Gêneros</dt><dd>{(item.generos || []).join(", ") || "—"}</dd></div>
            {item.lista === "estante" && <div><dt>Aquisição</dt><dd>{dataCurta(item.aquisicao)}</dd></div>}
            {item.lista === "estante" && <div><dt>Preço pago</dt><dd>{brl(item.precoPago)}</dd></div>}
            {item.leitura === "lido" && (
              <div><dt>Terminei em</dt><dd>{item.dataLeitura ? dataCurta(item.dataLeitura) : "não anotado"}</dd></div>
            )}
            {item.paginas ? <div><dt>Páginas</dt><dd>{item.paginas}</dd></div> : null}
            {item.ano ? <div><dt>Ano</dt><dd>{item.ano}</dd></div> : null}
            {item.isbn && <div><dt>ISBN</dt><dd style={{ fontFamily: "var(--mono)", fontSize: 11.5, wordBreak: "break-all" }}>{item.isbn}</dd></div>}
            {item.lista === "desejos" && (
              <>
                <div><dt>Preço alvo</dt><dd>{brl(item.precoAlvo)}</dd></div>
                <div>
                  <dt>Prioridade</dt>
                  <dd>{(PRIORIDADES.find((p) => p.v === item.prioridade) || {}).rot || "—"}</dd>
                </div>
              </>
            )}
          </div>

          {item.lista === "estante" && (
            <div style={{ marginTop: 14 }}>
              <p className="secao-tit" style={{ marginBottom: 8 }}>Leitura</p>
              <div className="chips">
                {LEITURAS.map((l) => (
                  <button
                    key={l.v}
                    className={`chip ${(item.leitura || "nao_lido") === l.v ? "ativo" : ""}`}
                    onClick={() => aoAtualizar({
                      ...item,
                      leitura: l.v,
                      dataLeitura: l.v === "lido" ? item.dataLeitura : "",
                    })}
                  >
                    <span className="pt" style={{ background: l.cor }} />{l.rot}
                  </button>
                ))}
                {item.leitura === "lido" && (
                  <input
                    type="date"
                    value={item.dataLeitura || ""}
                    onChange={(ev) => aoAtualizar({ ...item, dataLeitura: ev.target.value })}
                    title="Quando terminou — pode deixar em branco"
                    style={{ padding: "5px 9px", borderRadius: 20, background: "var(--tinta)", border: "1px solid var(--linha)", color: "var(--papel2)", fontSize: 12 }}
                  />
                )}
              </div>
            </div>
          )}

          <div style={{ marginTop: 14 }}>
            <p className="secao-tit" style={{ marginBottom: 8 }}>Coleções</p>
            <div className="chips">
              {minhas.map((c) => (
                <span key={c.id} className="chip ativo" style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <button onClick={() => aoAbrirColecao(c)} style={{ color: "inherit" }}>{c.nome}</button>
                  <button
                    onClick={() => aoAtualizar({ ...item, colecoes: (item.colecoes || []).filter((x) => x !== c.id) })}
                    aria-label={`Tirar de ${c.nome}`}
                    style={{ color: "inherit", display: "flex" }}
                  >
                    <X size={12} />
                  </button>
                </span>
              ))}
              {colecoes.some((c) => !(item.colecoes || []).includes(c.id)) && (
                <span className="sel">
                  <select
                    value=""
                    onChange={(ev) => ev.target.value && aoAtualizar({ ...item, colecoes: [...(item.colecoes || []), ev.target.value] })}
                    style={{ padding: "5px 26px 5px 11px", borderRadius: 20, fontSize: 12 }}
                    aria-label="Adicionar a uma coleção"
                  >
                    <option value="">+ adicionar a uma coleção</option>
                    {colecoes.filter((c) => !(item.colecoes || []).includes(c.id)).map((c) => (
                      <option key={c.id} value={c.id}>{c.nome}</option>
                    ))}
                  </select>
                  <ChevronDown size={12} />
                </span>
              )}
              {colecoes.length === 0 && <span className="dica">Nenhuma coleção criada ainda.</span>}
            </div>
          </div>

          {item.origem && (
            <p className="dica" style={{ marginTop: 4 }}>
              Dados preenchidos automaticamente pela {item.origem}.
            </p>
          )}
          {item.notas && <div className="notas" style={{ marginTop: 16 }}>{item.notas}</div>}
        </div>
      </div>

      {/* ---- publicação original ---- */}
      <div className="secao">
        <p className="secao-tit">
          <Globe size={12} /> Publicação original
          <button className="btn btn-mini" style={{ marginLeft: "auto" }} onClick={aoEditar}>
            <Pencil size={12} /> {originaisDe(item).length ? "Alterar" : "Preencher"}
          </button>
        </p>

        {originaisDe(item).length > 0 ? (
          <>
            {originaisDe(item).length > 1 && (
              <div className="abas-origem" style={{ marginBottom: 10 }}>
                {originaisDe(item).map((o, i) => (
                  <button
                    key={i}
                    className={`aba-origem ${Math.min(abaOrig, originaisDe(item).length - 1) === i ? "ativa" : ""}`}
                    onClick={() => setAbaOrig(i)}
                    title={o.serie}
                  >
                    <b>{o.serie || `Série ${i + 1}`}</b>
                    <em>{edicoesDetalhadas(o.edicoesTexto).length} ed.</em>
                  </button>
                ))}
              </div>
            )}

            {originaisDe(item).map((o, idx) => (
              idx !== Math.min(abaOrig, originaisDe(item).length - 1) ? null : (
              <div key={idx} style={{ marginBottom: 10 }}>
                <div className="ficha" style={{ margin: "4px 0 6px" }}>
                  <div><dt>Série original</dt><dd>{o.serie || "—"}</dd></div>
                  <div><dt>Editora original</dt><dd>{o.editora || "—"}</dd></div>
                  <div><dt>País</dt><dd>{o.pais || "—"}</dd></div>
                  {(() => {
                    // se o campo estiver vazio, calcula das datas de cada edição —
                    // itens preenchidos antes desta versão não têm o resumo gravado
                    const auto = resumoDasEdicoes(o.edicoesTexto);
                    const valor = (o.data || "").trim() || auto;
                    return (
                      <div>
                        <dt>Publicação</dt>
                        <dd>
                          {valor || "—"}
                          {!(o.data || "").trim() && auto && (
                            <em style={{ fontFamily: "var(--mono)", fontSize: 9, color: "var(--papel3)", display: "block", fontStyle: "normal" }}>
                              das datas de cada edição
                            </em>
                          )}
                        </dd>
                      </div>
                    );
                  })()}
                  {o.arco && <div><dt>Arco</dt><dd>{o.arco}</dd></div>}
                </div>

                {/* A lista crua ocupava meia tela num omnibus. Vira resumo,
                    com as edições atrás de um clique. */}
                {(() => {
                  const eds = edicoesDetalhadas(o.edicoesTexto);
                  if (!eds.length) return <p className="dica">Nenhuma edição informada.</p>;
                  const comData = eds.filter((e) => e.data).length;
                  const nums = eds.map((e) => e.n);
                  return (
                    <>
                      <p className="dica" style={{ margin: "2px 0 6px" }}>
                        <b style={{ color: "var(--papel)" }}>{eds.length} edição(ões)</b>
                        {" · "}#{Math.min(...nums)}{nums.length > 1 ? `–#${Math.max(...nums)}` : ""}
                        {comData ? ` · ${comData} com data` : " · sem datas individuais"}
                        <button className="btn-mini-link" onClick={() => setVerEds(verEds === idx ? null : idx)}>
                          <ChevronDown size={10} style={{ transform: verEds === idx ? "none" : "rotate(-90deg)" }} />
                          {verEds === idx ? "esconder" : "ver as edições"}
                        </button>
                      </p>
                      {verEds === idx && (
                        <div className="chips lista-eds-det">
                          {eds.map((e) => (
                            <span key={e.n} className="chip">
                              #{e.n}{e.data && <b style={{ opacity: .55, marginLeft: 5 }}>{e.data}</b>}
                            </span>
                          ))}
                        </div>
                      )}
                    </>
                  );
                })()}

                {(o.roteirista || o.desenhista) && (
                  <div className="ficha" style={{ margin: "0 0 8px" }}>
                    {o.roteirista && <div><dt>Roteiro</dt><dd>{o.roteirista}</dd></div>}
                    {o.desenhista && <div><dt>Desenho</dt><dd>{o.desenhista}</dd></div>}
                  </div>
                )}

                {(o.personagens || []).length > 0 && (
                  <div className="elenco" style={{ marginBottom: 10 }}>
                    {o.personagens.map((x) => (
                      <button
                        className="pers"
                        key={x.nome}
                        onClick={() => aoAbrirPersonagem && aoAbrirPersonagem(x)}
                        title={`Abrir a ficha de ${x.nome}`}
                      >
                        <div className="pers-face">
                          {capasPers && capasPers[chavePersonagem(x.nome)]
                            ? <img src={capasPers[chavePersonagem(x.nome)]} alt="" />
                            : <span>{x.nome.slice(0, 2).toUpperCase()}</span>}
                        </div>
                        <em>{x.nome}</em>
                      </button>
                    ))}
                  </div>
                )}

                {o.cronologia && (
                  <div className="notas" style={{ borderLeftColor: "var(--ciano)" }}>{o.cronologia}</div>
                )}
              </div>
              )
            ))}

            {(() => {
              const total = originaisDe(item).reduce((n, o) => n + (o.numeros || []).length, 0);
              return total > 0 ? (
                <p className="dica" style={{ marginTop: 8 }}>
                  {total} edição(ões) contabilizada(s) nos relatórios
                  {originaisDe(item).length > 1 ? `, em ${originaisDe(item).length} séries.` : "."}
                </p>
              ) : null;
            })()}
            <button
              className={`btn btn-mini ${item.marco ? "ativo" : ""}`}
              style={{ marginTop: 10, marginRight: 8 }}
              onClick={() => aoAtualizar({ ...item, marco: !item.marco })}
              title="Pontos-chave viram uma linha vertical no Mapa por editora, atravessando todas as faixas"
            >
              <Bookmark size={13} /> {item.marco ? "É um ponto-chave" : "Marcar como ponto-chave"}
            </button>
            <button className="btn btn-mini btn-perigo" style={{ marginTop: 10 }} onClick={() => aoAtualizar({ ...item, original: null })}>
              <X size={12} /> Limpar
            </button>
          </>
        ) : (
          <p className="dica">
            Para encadernados que reúnem várias revistas, anote aqui a série original e quais edições
            este volume compila. Os relatórios juntam essa informação de todos os seus itens e mostram,
            por série, quais edições você já tem e quais faltam.
          </p>
        )}
      </div>

      {/* ---- preços ---- */}
      <div className="secao">
        <p className="secao-tit">
          <Store size={12} /> Onde comprar
          {item.isbn && (
            <span className="chips" style={{ marginLeft: "auto" }}>
              {[[false, "Pelo título"], [true, "Pelo ISBN"]].map(([v, rot]) => (
                <button
                  key={String(v)}
                  className={`chip ${buscaIsbn === v ? "ativo" : ""}`}
                  onClick={() => setBuscaIsbn(v)}
                >
                  {rot}
                </button>
              ))}
            </span>
          )}
        </p>
        <div className="lojas">
          {LOJAS.map((l) => (
            <a
              key={l.nome}
              className="loja"
              href={l.url(consultaLoja(item, buscaIsbn))}
              target="_blank"
              rel="noopener noreferrer"
              title={decodeURIComponent(consultaLoja(item, buscaIsbn))}
            >
              <Search size={12} /> {l.nome}
            </a>
          ))}
        </div>
        <div className="aviso" style={{ marginTop: 12 }}>
          <TriangleAlert size={15} />
          <span>
            Cada botão abre a busca pelo título, que funciona em todas as lojas. O ISBN é mais preciso,

      <div className="secao">

              menor: {brl(melhor)}{abaixoDoAlvo ? " · abaixo do alvo" : ""}
            </span>
          )}
        </p>

        <div className="novo-preco">
          <div className="campo">
            <label>Preço</label>
            <input
              inputMode="decimal"
              value={valor}
              onChange={(e) => setValor(e.target.value)}
