    const q = semAcento(busca.trim());
    return series
      .filter((s) => (fSerie === "lacunas" ? !s.completa : fSerie === "completas" ? s.completa : true))
      .filter((s) => {
        if (fSit === "todas") return true;
        if (fSit === "cancelada") return !!s.cancelada;
        if (fSit === "semdado") return s.publicando == null && !s.cancelada;
        if (s.cancelada || s.publicando == null) return false;
        /* "em publicação" precisa passar pela mesma conferência do card:
           a base marca séries paradas há décadas como ativas. */
        const p = s.publicando && s.fimTexto ? periodoDoTexto(s.fimTexto) : null;
        const parado = p ? idxMes(new Date().getFullYear(), new Date().getMonth() + 1) - p.fim : null;
        const saindo = s.publicando && !(parado != null && parado > 24);
        return fSit === "publicando" ? saindo : !saindo;
      })
      .filter((s) => !q || semAcento(s.nome).includes(q) || semAcento(s.editora || "").includes(q))
      .sort((a, b) => {
        const nome = () => a.nome.localeCompare(b.nome, "pt-BR");
        // série sem data alguma vai pro fim, nas duas direções
        if (ordemSerie === "estreia" || ordemSerie === "estreia-nova") {
          // sem estreia conhecida vai para o fim, em qualquer sentido
          if (a.ordemEstreia == null || b.ordemEstreia == null) {
            if (a.ordemEstreia == null && b.ordemEstreia == null) return nome();
            return a.ordemEstreia == null ? 1 : -1;
          }
          if (a.ordemEstreia !== b.ordemEstreia) {
            return ordemSerie === "estreia" ? a.ordemEstreia - b.ordemEstreia : b.ordemEstreia - a.ordemEstreia;
          }
          return nome();
        }
        if (ordemSerie === "faltam") {
          const fa = a.total > 0 ? a.faltam.length : -1;
          const fb = b.total > 0 ? b.faltam.length : -1;
          if (fa !== fb) return fb - fa;
          return nome();
        }
        // padrão: mais perto de fechar primeiro; sem total conhecido vai pro fim
        const fa = a.total > 0 ? a.faltam.length : Infinity;
        const fb = b.total > 0 ? b.faltam.length : Infinity;
        if (fa !== fb) return fa - fb;
        if (b.cobertura !== a.cobertura) return b.cobertura - a.cobertura;
        return nome();
      });
  }, [series, fSerie, fSit, busca, ordemSerie]);

  /* Se o último item que citava a série sair do acervo, a série deixa de
     existir — e o detalhe aberto precisa fechar junto. */
  useEffect(() => {
    if (serieAberta && !series.some((x) => x.id === serieAberta.id)) {
      setSerieAberta(null);
      setSerieEditando(null);
    }
  }, [series, serieAberta]);

  /* Na primeira linha criada, o fundo não pode estar em branco: semeia os
     marcos canônicos da DC e as quatro eras. Você edita ou apaga depois. */
  const semear = () => {
    if (!eventos.length) setEventos(EVENTOS_PADRAO.map((e) => ({ id: uid(), linha: "", ...e })));
    if (!eras.length) setEras(ERAS_PADRAO.map((e) => ({ id: uid(), ...e })));
  };

  /* Atualização em massa: refaz a consulta de cada série usando a página
     que ficou guardada, sem você precisar procurar de novo. Sequencial e
     interrompível — são centenas de séries e três requisições por série. */
  const [atualizando, setAtualizando] = useState(null);
  const pararAtualizacao = useRef(false);

  /* Descobre o endereço de uma série que ainda não guardou o seu. O nome
     quase sempre é o da base ("Batman Vol 4" -> "Category:Batman Vol 4"),
     e quando não é, a busca por texto resolve — com o ano da estreia
     desempatando entre volumes homônimos. Só grava se a página responder
     com edições: dedução que não se confirma é descartada. */
  const descobrirPagina = async (md) => {
    const nome = md.nome || "";
    const alvoAno = anoDoNome(nome) || (md.inicio ? Number(String(md.inicio).slice(-4)) : null);
    const candidatos = [];

    if (ehPaginaDeVolume(nome)) {
      for (const w of WIKIS) candidatos.push({ wiki: w, pagina: "Category:" + nome });
    }
    try {
      const vols = await volumesDaWiki(nome);
      const exatos = vols.filter((v) => semAcento(v.rot) === semAcento(nome));
      candidatos.push(...exatos, ...vols.filter((v) => !exatos.includes(v)));
    } catch (e) { /* segue com o que houver */ }

    for (const c of candidatos.slice(0, 6)) {
      try {
        const eds = await edicoesDaWiki(c.wiki, c.pagina, []);
        if (!eds.numeros.length) continue;
        // com ano conhecido, exige que a estreia bata dentro de dois anos
        if (alvoAno && eds.inicioSerie) {
          const ano = Number(String(eds.inicioSerie).slice(-4));
          if (ano && Math.abs(ano - alvoAno) > 2) continue;
        }
        return { wiki: c.wiki, pagina: c.pagina, eds };
      } catch (e) { /* tenta o próximo */ }
    }
    return null;
  };

  /* Séries pesquisadas antes desta versão não guardaram o endereço. O nome
     quase sempre é o da base — "Batman Vol 1" é a categoria de mesmo nome —
     e o ano de estreia desempata quando há vários volumes. Se a página não
     existir, a série só não é atualizada. */
  /* Os nomes já gravados carregam a sujeira de antes da correção:
     comentários de HTML nos créditos e etiquetas nos personagens. Limpa o
     que está no acervo, sem precisar refazer busca nenhuma. */
  const nomesSujos = useMemo(() => {
    let n = 0;
    for (const i of itens) {
      for (const o of originaisDe(i)) {
        for (const c of ["roteirista", "desenhista"]) {
          if (o[c] && limparNome(o[c]) !== o[c]) n++;
        }
        for (const p of o.personagens || []) {
          if (p.nome && limparNome(p.nome) !== p.nome) n++;
        }
      }
    }
    return n;
  }, [itens]);

  const limparNomes = () => {
    let n = 0;
    setItens((lista) => lista.map((i) => {
      const orig = originaisDe(i);
      if (!orig.length) return i;
      let mudou = false;
      const novo = orig.map((o) => {
        const c = { ...o };
        for (const campo of ["roteirista", "desenhista"]) {
          if (c[campo]) {
            const lim = limparNome(c[campo]);
            if (lim !== c[campo]) { c[campo] = lim; mudou = true; n++; }
          }
        }
        if (c.personagens && c.personagens.length) {
          c.personagens = c.personagens.map((p) => {
            const lim = limparNome(p.nome);
            if (lim !== p.nome) { mudou = true; n++; return { ...p, nome: lim }; }
            return p;
          });
        }
        return c;
      });
      return mudou ? { ...i, original: novo } : i;
    }));
    avisar(`${n} nome(s) limpos.`);
  };

  const atualizarDaBase = async () => {
    // inclui as que ainda não têm endereço, desde que já tenham numeração
    const alvos = metaSeries.filter((m) => m.paginaWiki || m.publicados || m.inicio || Number(m.ultimo) > 0);
    if (!alvos.length) {
      return avisar("Nenhuma série tem numeração ainda. Faça uma busca em alguma série primeiro.");
    }
    pararAtualizacao.current = false;
    setAtualizando({ feitas: 0, total: alvos.length, nome: "", mudadas: 0 });
    let mudadas = 0, descobertas = 0, semAchar = 0;

    for (let i = 0; i < alvos.length; i++) {
      if (pararAtualizacao.current) break;
      const md = alvos[i];
      setAtualizando({ feitas: i, total: alvos.length, nome: md.nome || "", mudadas });
      try {
        let wiki, pagina, eds;
        if (md.paginaWiki) {
          wiki = WIKIS.find((w) => w.id === md.wikiId) || WIKIS[0];
          pagina = md.paginaWiki;
          eds = await edicoesDaWiki(wiki, pagina, []);
        } else {
          const achado = await descobrirPagina(md);
          if (!achado) { semAchar++; continue; }
          descobertas++;
          ({ wiki, pagina, eds } = achado);
        }
        const vol = await fichaDoVolume(wiki, pagina);
        const nums = separarNumeracao(eds.numeros || []).sequencia;
        const campos = {};
        if (nums.length) {
          campos.primeiro = Math.min(...nums);
          campos.ultimo = Math.max(...nums);
          campos.total = campos.ultimo;
          campos.publicados = compactarNumeros(eds.numeros);
        }
        if (eds.inicioSerie) campos.inicio = eds.inicioSerie;
        if (eds.fimSerie) campos.fim = eds.fimSerie;
        if (vol) {
          campos.publicando = vol.publicando;
          campos.anoFim = vol.anoFim || 0;
          if (vol.tipo) campos.tipo = vol.tipo;
        }
        if (!md.paginaWiki) { campos.wikiId = wiki.id; campos.paginaWiki = pagina; }
        if (!md.paginaWiki) { campos.wikiId = wiki.id; campos.paginaWiki = pagina; }
        if (Object.keys(campos).length) {
          mudadas++;
          setMetaSeries((p) => p.map((x) => (x.id === md.id ? { ...x, ...campos } : x)));
        }
      } catch (e) { /* uma série que falha não interrompe as outras */ }
    }

    setAtualizando(null);
    const extra = [
      descobertas ? `${descobertas} ganharam endereço` : "",
      semAchar ? `${semAchar} não encontradas` : "",
    ].filter(Boolean).join(" · ");
    avisar((pararAtualizacao.current
      ? `Interrompido. ${mudadas} série(s) atualizadas.`
      : `${mudadas} de ${alvos.length} série(s) atualizadas.`) + (extra ? ` ${extra}.` : ""));
  };

  const salvarGrupo = (g) => {
    // uma série por grupo: entrando neste, sai dos outros
    setGruposSerie((p) => {
      const outros = p.filter((x) => x.id !== g.id)
        .map((x) => ({ ...x, series: (x.series || []).filter((id) => !g.series.includes(id)) }));
      const tem = p.some((x) => x.id === g.id);
      return tem ? outros.map((x) => x).concat([g]).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
                 : [...outros, g].sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    });
    setGrupoEditando(null);
    avisar(`Grupo “${g.nome}” salvo com ${g.series.length} série(s).`);
  };

  const removerGrupo = (g) => {
    // só o grupo some; as séries e as edições continuam como estavam
    setGruposSerie((p) => p.filter((x) => x.id !== g.id));
    setGruposAbertos((p) => p.filter((x) => x !== g.id));
    avisar("Grupo removido. As séries continuam no acervo.");
  };

  const salvarLinha = (l) => {
    setLinhasTempo((p) => (p.some((x) => x.id === l.id) ? p.map((x) => (x.id === l.id ? l : x)) : [...p, l]));
    setLinhaEditando(null); setLinhaAberta(l.id); semear();
    avisar(`Linha “${l.nome}” salva.`);
  };

  const removerLinha = (l) => {
    setLinhasTempo((p) => p.filter((x) => x.id !== l.id));
    setEventos((p) => p.filter((e) => e.linha !== l.id));
    setLinhaAberta(null);
    avisar("Linha removida.");
  };

  /* Ao abrir uma faixa, lê os créditos daquela série — e só daquela. Uma
     linha com dez séries não custa dez buscas; custa as que você abrir.
     Depois de lida, fica guardada e a reabertura é instantânea. */
  const pedidoFases = useRef(0);

  const abrirFaixa = async (id, forcar) => {
    setFaixaAberta(id);
    if (!id) return;
    /* Antes ele desistia em silêncio se outra busca estivesse rodando, e a
       faixa ficava com "sem fases ainda" para sempre. Agora a nova busca
       assume, e o resultado da anterior é descartado por não ser o pedido
       corrente. */
    const meuPedido = ++pedidoFases.current;
    const se = series.find((x) => x.id === id);
    if (!se) return;

    /* Guardadas nos metadados da série, então não dependem de a wiki estar
       no ar nem são refeitas a cada sessão. O botão de atualizar existe
       para séries em lançamento, como a Absolute, onde números novos
       aparecem a cada mês. */
    if (!forcar) {
      if (fasesPorSerie[id]) return;
      const salvas = (metaSeries.find((m) => m.id === id) || {}).fases;
      if (salvas && salvas.length) {
        setFasesPorSerie((p) => ({ ...p, [id]: { lista: salvas, salvas: true, lidasEm: (metaSeries.find((m) => m.id === id) || {}).fasesEm } }));
        return;
      }
    }

    const nums = (se.publicados && se.publicados.length)
      ? se.publicados
      : (Number.isFinite(se.ultimo) && Number.isFinite(se.primeiro) && se.ultimo >= se.primeiro
          ? Array.from({ length: se.ultimo - se.primeiro + 1 }, (_, i) => se.primeiro + i)
          : []);
    if (!nums.length) {
      setFasesPorSerie((p) => ({ ...p, [id]: { erro: "Esta série ainda não tem numeração. Abra a ficha dela e busque no DC/Marvel Database." } }));
      return;
    }

    setBuscandoFases({ feitas: 0, total: nums.length });

    const candidatos = [];
    if (ehPaginaDeVolume(se.nome)) {
      for (const w of WIKIS) candidatos.push({ wiki: w, pagina: "Category:" + se.nome, rot: se.nome });
    }
    try {
      const vols = await volumesDaWiki(se.nome);
      const exato = vols.filter((v) => semAcento(v.rot) === semAcento(se.nome));
      candidatos.push(...exato, ...vols.filter((v) => !exato.includes(v)));
    } catch (e) { /* segue com o que houver */ }

    for (const alvo of candidatos) {
      try {
        const r = await fasesDaSerie(alvo.wiki, alvo.pagina, nums,
          (feitas, total) => { if (meuPedido === pedidoFases.current) setBuscandoFases({ feitas, total }); });
        if (meuPedido !== pedidoFases.current) return;   // você já abriu outra
        if (r.fases.length) {
          const quando = hoje();
          setFasesPorSerie((p) => ({
            ...p,
            [id]: { lista: r.fases, lidas: r.lidas, pedidas: nums.length, fonte: alvo.rot || alvo.pagina, lidasEm: quando },
          }));
          setMetaSeries((p) => {
            const tem = p.some((m) => m.id === id);
            const campos = { fases: r.fases, fasesEm: quando, fasesFonte: alvo.rot || alvo.pagina };
            return tem ? p.map((m) => (m.id === id ? { ...m, ...campos } : m)) : [...p, { id, nome: se.nome, ...campos }];
          });
          setBuscandoFases(null);
          return;
        }
      } catch (e) { /* tenta o próximo candidato */ }
    }
    if (meuPedido !== pedidoFases.current) return;
    setBuscandoFases(null);
    setFasesPorSerie((p) => ({ ...p, [id]: { erro: "Não achei esta série nas bases.", pedidas: nums.length, lidas: 0 } }));
  };

  const salvarEvento = (e) => {
    setEventos((p) => (p.some((x) => x.id === e.id) ? p.map((x) => (x.id === e.id ? e : x)) : [...p, e]));
    setEventoEditando(null);
  };

  /* Dobra a lista visível: séries de um grupo saem da lista solta e o grupo
     entra no lugar delas, na posição da primeira que apareceria. Com busca
     ou filtro ativo, o grupo só aparece se algum membro passar — e ao abrir,
     mostra apenas os que passaram. */
  const listaDeSeries = useMemo(() => {
    const dono = new Map();
    for (const g of gruposSerie) for (const id of g.series || []) dono.set(id, g.id);
    if (!dono.size) return seriesVisiveis.map((se) => ({ tipo: "serie", se }));

    const fora = [];
    const jaPosto = new Set();
    for (const se of seriesVisiveis) {
      const gid = dono.get(se.id);
      if (!gid) { fora.push({ tipo: "serie", se }); continue; }
      if (jaPosto.has(gid)) continue;
      jaPosto.add(gid);
      const g = gruposSerie.find((x) => x.id === gid);
      const membros = seriesVisiveis.filter((x) => dono.get(x.id) === gid);
      fora.push({ tipo: "grupo", grupo: g, membros });
    }
    return fora;
  }, [seriesVisiveis, gruposSerie]);

  const personagens = useMemo(() => montarPersonagens(itens, metaPers), [itens, metaPers]);

  const personagensVisiveis = useMemo(() => {
    const q = semAcento(busca.trim());
    if (!q) return personagens;
    // busca pelos dois nomes: procurar "Arqueiro" ou "Green Arrow" acha
    return personagens.filter((p) =>
      semAcento(p.nome).includes(q) ||
      semAcento(p.nomePt || "").includes(q) ||
      semAcento(p.nomeReal || "").includes(q) ||
      p.series.some((x) => semAcento(x).includes(q)));
  }, [personagens, busca]);

  /* Busca os nomes em português de quem ainda não tem. Uma requisição por
     lote de 40, e o original fica guardado. */
  const [traduzindoNomes, setTraduzindoNomes] = useState(null);
  const [revisandoNomes, setRevisandoNomes] = useState(null);

  const buscarNomesPt = async () => {
    const faltam = personagens.filter((p) => !p.nomePt);
    if (!faltam.length) return avisar("Todos os personagens já têm nome em português.");
    setTraduzindoNomes({ feitos: 0, total: faltam.length });
    let achados = 0;
    for (let i = 0; i < faltam.length; i += 40) {
      const lote = faltam.slice(i, i + 40);
      const mapa = await nomesEmPortugues(lote.map((p) => p.nome));
      const novos = [];
      for (const p of lote) {
        const pt = mapa.get(semIdentidade(p.nome));
        if (pt && semAcento(pt) !== semAcento(p.nome)) { novos.push([p.id, pt]); achados++; }
      }
      if (novos.length) {
        setMetaPers((prev) => {
          let fora = [...prev];
          for (const [id, pt] of novos) {
            const k = fora.findIndex((x) => x.id === id);
            if (k >= 0) fora[k] = { ...fora[k], nomePt: pt };
            else fora.push({ id, nomePt: pt });
          }
          return fora;
        });
      }
      setTraduzindoNomes({ feitos: Math.min(i + 40, faltam.length), total: faltam.length });
    }
    setTraduzindoNomes(null);
    avisar(`${achados} nome(s) em português encontrados de ${faltam.length}.`);
  };

  const decidirNomePt = (id, nome) => {
    setMetaPers((p) => {
      const tem = p.some((x) => x.id === id);
      const campos = { nomePt: nome, nomeRevisado: true };
      return tem ? p.map((x) => (x.id === id ? { ...x, ...campos } : x)) : [...p, { id, ...campos }];
    });
  };

  const salvarPersonagem = async (id, campos, retratoNovo) => {
    setMetaPers((p) => {
      const tem = p.some((x) => x.id === id);
      return tem ? p.map((x) => (x.id === id ? { ...x, ...campos } : x)) : [...p, { id, ...campos }];
    });
    if (retratoNovo !== undefined) await guardarCapa(id, retratoNovo);
    setPersEditando(null);
    setPersAberto((a) => (a && chavePersonagem(a.nome) === id ? { ...a, ...campos } : a));
    avisar("Ficha do personagem salva.");
  };

  /* Abre a ficha do personagem; se ainda não tiver sido baixada, busca uma
     vez e guarda — resumo é texto, cabe de sobra no backup. */
  /* Ficha ruim é a que ficou com sobra de marcação — versões anteriores
     do extrator deixavam passar "{{DC Database:Character Template". Nesse
     caso vale buscar de novo em vez de mostrar lixo. */
  const fichaBoa = (f) => f && f.resumo && !/^\s*[{|]|Character Template|Database:/i.test(f.resumo);

  /* Fechar a ficha devolve para o item de onde ela foi aberta — antes caía
     na estante, o que quebrava a leitura de um volume. */
  const fecharPersonagem = () => {
    const o = origemItem;
    setPersAberto(null);
    if (o && o.item) {
      setOrigemItem(null);
      setAberto(o.item);
      if (o.aba) setAba(o.aba);
    }
  };

  const abrirPersonagem = async (p, forcar) => {
    setPersAberto(p); setPersErro("");
    const id = chavePersonagem(p.nome);
    const atual = metaPers.find((x) => x.id === id);
    if (!forcar && fichaBoa(atual)) return;
    if (!p.pagina) { setPersErro("esta entrada não guardou o endereço na wiki"); return; }
    setPersCarregando(true);
    for (const w of WIKIS) {
      try {
        const f = await fichaPersonagemDaWiki(w, p.pagina);
        if (f.resumo || f.nomeReal) {
          setMetaPers((prev) => [...prev.filter((x) => x.id !== id), { id, nome: p.nome, pagina: p.pagina, ...f }]);
          setPersCarregando(false);
          return;
        }
      } catch (e) { /* tenta a outra wiki */ }
    }
    setPersCarregando(false);
    setPersErro("não achei a página dele nas bases");
  };

  /* Busca em massa: percorre quem ainda não tem ficha e traz resumo e
     retrato. Uma consulta por personagem, então roda com calma e dá para
     interromper — o que já foi trazido fica. */
  const [buscandoFichas, setBuscandoFichas] = useState(null);
  const abortarFichas = useRef(false);

  const semFicha = useMemo(
    () => personagens.filter((p) => p.pagina && (!fichaBoa(p) || !capas[p.id])),
    [personagens, capas]
  );

  const buscarFichasEmMassa = async () => {
    const alvos = semFicha;
    if (!alvos.length || buscandoFichas) return;
    abortarFichas.current = false;
    setBuscandoFichas({ feitos: 0, total: alvos.length });
    let ok = 0, falhas = 0;

    for (const p of alvos) {
      if (abortarFichas.current) break;
      let achou = false;
      for (const w of WIKIS) {
        try {
          if (!fichaBoa(p)) {
            const f = await fichaPersonagemDaWiki(w, p.pagina);
            if (f.resumo || f.nomeReal) {
              setMetaPers((prev) => [...prev.filter((x) => x.id !== p.id),
                { id: p.id, nome: p.nome, pagina: p.pagina, ...f }]);
              achou = true;
            }
          }
          if (!capas[p.id]) {
            const r = await retratosDaWiki(w, [p.pagina]);
            const src = r[p.pagina];
            if (src) { await salvarRetrato(p.nome, src); achou = true; }
          }
          if (achou) break;
        } catch (e) { /* tenta a outra base */ }
      }
      achou ? ok++ : falhas++;
      setBuscandoFichas((x) => x && { ...x, feitos: x.feitos + 1 });
    }

    setBuscandoFichas(null);
    avisar(falhas
      ? `${ok} ficha(s) trazida(s). ${falhas} não foram encontradas nas bases.`
      : `${ok} ficha(s) trazida(s).`);
  };

  /* Em quais volumes do acervo o personagem aparece — o dado que nenhuma
     wiki tem. */
  const volumesDoPersonagem = (nome) => {
    const alvo = semAcento(nome);
    const fora = [];
    for (const it of itens) {
      const series = originaisDe(it)
        .filter((o) => (o.personagens || []).some((x) => semAcento(x.nome) === alvo))
        .map((o) => o.serie);
      if (series.length) fora.push({ item: it, series });
    }
    return fora.sort((a, b) => a.item.titulo.localeCompare(b.item.titulo, "pt-BR"));
  };




  /* Marca ou desmarca a ligação narrativa — o oposto de "só coincidiu no
     tempo", que o app deduz sozinho e nunca grava. */

  const salvarSerie = async (id, campos, capaNova) => {
    setMetaSeries((p) => {
      const tem = p.some((m) => m.id === id);
      return tem ? p.map((m) => (m.id === id ? { ...m, ...campos } : m)) : [...p, { id, ...campos }];
    });
    if (capaNova !== undefined) await guardarCapa(id, capaNova);
    setSerieEditando(null);
    avisar("Série atualizada.");
  };

  /* A série em si não se apaga — ela existe enquanto houver item citando-a.
     O que dá para limpar é a personalização. */
  const limparSerie = async (id) => {
    setMetaSeries((p) => p.filter((m) => m.id !== id));
    if (capas[id]) await guardarCapa(id, null);
    avisar("Personalização da série removida.");
  };

  /* Fecha o detalhe do item devolvendo você para a tela de onde ele foi
     aberto — coleção, lista de leitura, série ou a própria grade. */
  const fecharDetalhe = () => {
    const o = origemItem;
    setAberto(null);
    setOrigemItem(null);
    if (!o) return;
    if (o.aba) setAba(o.aba);
    if (o.colecao) setColAberta(colecoes.find((c) => c.id === o.colecao.id) || o.colecao);
    if (o.listaLeitura) setListaAberta(listas.find((l) => l.id === o.listaLeitura.id) || o.listaLeitura);
    if (o.serie) setSerieAberta(o.serie);
  };

  /* ---- capas guardadas de vez ---- */
  const semCapaSalva = useMemo(
    () => itens.filter((i) => !capas[i.id] && candidatasCapa(i, i.capaUrl).length),
    [itens, capas]
  );
  const capasSalvas = useMemo(() => Object.keys(capas).length, [capas]);
  const [salvandoCapas, setSalvandoCapas] = useState(null);
  const abortarCapas = useRef(false);

  const salvarCapas = async () => {
    const alvos = semCapaSalva;
    if (!alvos.length || salvandoCapas) return;
    abortarCapas.current = false;
    setSalvandoCapas({ feitos: 0, total: alvos.length, ok: 0, falhas: 0 });

    let fila = [];
    const descarregar = async () => {
      if (!fila.length) return;
      const lote = fila; fila = [];
      try {
        await capasDB.gravarMuitas(lote);
        setCapas((p) => { const m = { ...p }; for (const [id, d] of lote) m[id] = d; return m; });
      } catch (e) {
        abortarCapas.current = true;
        avisar("O navegador recusou guardar mais capas — o espaço acabou. As que já foram salvas continuam valendo.");
      }
    };

    let i = 0, guardadas = 0, perdidas = 0;
    const trabalhador = async () => {
      while (i < alvos.length && !abortarCapas.current) {
        const it = alvos[i++];
        let dados = null;
        for (const url of candidatasCapa(it, it.capaUrl)) {
          try { dados = await baixarCapaComoBase64(url); break; }
          catch (e) { /* tenta o próximo endereço */ }
        }
        if (dados) { fila.push([it.id, dados]); guardadas++; } else { perdidas++; }
        setSalvandoCapas((p) => p && { ...p, feitos: p.feitos + 1, ok: guardadas, falhas: perdidas });
        if (fila.length >= 15) await descarregar();
      }
    };

    // 4 de cada vez: rápido o suficiente sem parecer um ataque ao servidor
    await Promise.all(Array.from({ length: 4 }, trabalhador));
    await descarregar();

    setSalvandoCapas(null);
    avisar(
      perdidas
        ? `${guardadas} capa(s) guardada(s) no acervo. ${perdidas} não vieram — sem capa na fonte ou bloqueadas pelo servidor.`
        : `${guardadas} capa(s) guardada(s) no acervo. Elas não dependem mais de site nenhum.`
    );
  };

  const apagarCapasSalvas = async () => {
    try { await capasDB.limpar(); } catch (e) { /* já estava vazio */ }
    setCapas({});
    avisar("Capas salvas apagadas. Voltam a ser buscadas na internet.");
  };

  /* ---- backup ---- */
  const exportar = () => {
    const blob = new Blob([JSON.stringify({ versao: 2, itens, colecoes, listas, series: metaSeries, eventos, eras, personagens: metaPers, linhasTempo, gruposSerie, capas }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `acervo-${hoje()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    avisar("Backup baixado.");
  };

  const exportarCsv = () => {
    const COLS = ["ISBN","TITULO","VOLUME","COLECAO","EDITORA","AUTOR","TIPO","GENERO","DATA AQUISICAO",
      "PRECO PAGO","LEITURA","DATA LEITURA","QTD PAGINAS","LINK DE IMAGEM DE CAPA","NOTAS","LISTA",
      "PUBLICACAO ORIGINAL","PONTO CHAVE"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const nomeCol = (id) => (colecoes.find((c) => c.id === id) || {}).nome || "";
    const linhas = itens.map((i) => [
      i.isbn || "",
      i.titulo || "",
      i.volume ?? "",
      (i.colecoes || []).map(nomeCol).filter(Boolean).join(" / "),
      i.editora || "",
      i.autor || "",
      i.tipo || "",
      (i.generos || []).join("/"),
      i.aquisicao || "",
      i.precoPago != null ? String(i.precoPago).replace(".", ",") : "",
      rotLeitura(i.leitura),
      i.dataLeitura || "",
      i.paginas ?? "",
      i.capaUrl || "",
      i.notas || "",
      i.lista === "desejos" ? "Desejos" : "Estante",
      origensParaTexto(i),
      i.marco ? "Sim" : "",
    ].map(esc).join(";"));
    const blob = new Blob(["\uFEFF" + [COLS.map(esc).join(";"), ...linhas].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `acervo-completo-${hoje()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    avisar(`${itens.length} item(ns) exportados — estante e desejos juntos, no mesmo layout que a importação lê.`);
  };

  const importarBackup = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(String(r.result).replace(/^\uFEFF/, ""));
        if (!d || !Array.isArray(d.itens)) throw new Error("formato");
        const lidos = d.versao === 2 ? { itens: d.itens || [], colecoes: d.colecoes || [], listas: d.listas || [] } : { ...migrarV1(d.itens || []), listas: [] };
        const jaTem = new Set(itens.map((x) => x.id));
        const jaCol = new Set(colecoes.map((x) => x.id));
        const jaLista = new Set(listas.map((x) => x.id));
        const novos = lidos.itens.filter((x) => !jaTem.has(x.id));
        const novasCols = lidos.colecoes.filter((x) => !jaCol.has(x.id));
        const novasListas = lidos.listas.filter((x) => !jaLista.has(x.id));
        setItens((p) => [...novos, ...p]);
        setColecoes((p) => [...p, ...novasCols]);
        setListas((p) => [...p, ...novasListas]);
        if (Array.isArray(d.personagens) && d.personagens.length) {
          const jaP = new Set(metaPers.map((x) => x.id));
          setMetaPers((p) => [...p, ...d.personagens.filter((x) => !jaP.has(x.id))]);
        }
        if (Array.isArray(d.eras) && d.eras.length) {
          const jaEra = new Set(eras.map((x) => x.id));
          setEras((p) => [...p, ...d.eras.filter((x) => !jaEra.has(x.id))]);
        }
        if (Array.isArray(d.eventos) && d.eventos.length) {
          const jaEv = new Set(eventos.map((x) => x.id));
          setEventos((p) => [...p, ...d.eventos.filter((x) => !jaEv.has(x.id))]);
        }
        if (Array.isArray(d.series) && d.series.length) {
          const jaSerie = new Set(metaSeries.map((x) => x.id));
          setMetaSeries((p) => [...p, ...d.series.filter((x) => !jaSerie.has(x.id))]);
        }
        if (d.capas) {
          const mapa = { ...capas, ...d.capas };
          setCapas(mapa);
          await capasDB.gravarMuitas(Object.entries(mapa)).catch(() => {});
        }
        avisar(
          novos.length
            ? `${novos.length} item(ns) restaurado(s).`
            : "Nada novo: esses itens já estão no acervo."
        );
      } catch {
        avisar("Esse arquivo não é um backup do Acervo.");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  };

  /* ---- listas derivadas ---- */
  const daLista = useMemo(() => itens.filter((i) => i.lista === aba), [itens, aba]);

  const editoras = useMemo(
    () => [...new Set(itens.map((i) => i.editora).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")),
    [itens]
  );
  /* Editora original e país repetem muito: em vez de digitar "DC Comics"
     mil vezes, o campo sugere o que você já usou, ordenado por frequência.
     Continua aceitando texto novo — a sugestão não fecha a porta. */
  const usadosNaOrigem = useMemo(() => {
    const ed = new Map(), pa = new Map();
    for (const i of itens) {
      for (const o of originaisDe(i)) {
        if (o.editora) ed.set(o.editora, (ed.get(o.editora) || 0) + 1);
        if (o.pais) pa.set(o.pais, (pa.get(o.pais) || 0) + 1);
      }
    }
    const ordena = (m) => [...m.entries()].sort((a, b) => b[1] - a[1]).map(([v]) => v);
    return { editoras: ordena(ed), paises: ordena(pa) };
  }, [itens]);

  const generosUsados = useMemo(
    () => [...new Set(itens.flatMap((i) => i.generos || []))].sort((a, b) => a.localeCompare(b, "pt-BR")),
    [itens]
  );

  const visiveis = useMemo(() => {
    const q = busca.trim().toLowerCase();
    const r = daLista.filter((i) => {
      // a busca alcança também série original, créditos e personagens —
      // procurar "Lobo" acha os volumes em que ele aparece
      if (q && ![
        i.titulo, i.autor, i.editora, i.isbn, i.notas, (i.generos || []).join(" "),
        originaisDe(i).map((o) => [o.serie, o.roteirista, o.desenhista,
          (o.personagens || []).map((p) => p.nome).join(" ")].join(" ")).join(" "),
      ].some((c) => (c || "").toLowerCase().includes(q))) return false;
      if (fTipo && i.tipo !== fTipo) return false;
      if (fEditora && i.editora !== fEditora) return false;
      if (fGenero && !(i.generos || []).includes(fGenero)) return false;
      if (fLeitura && (i.leitura || "nao_lido") !== fLeitura) return false;
      if (fColecao === "__sem__" && (i.colecoes || []).length) return false;
      if (fColecao && fColecao !== "__sem__" && !(i.colecoes || []).includes(fColecao)) return false;
      return true;
    });
    const txt = (a, b) => (a || "zzz").localeCompare(b || "zzz", "pt-BR");
    const peso = { alta: 0, media: 1, baixa: 2 };
    const cmp = {
      recentes: (a, b) => b.criadoEm - a.criadoEm,
      titulo: (a, b) => txt(a.titulo, b.titulo),
      autor: (a, b) => txt(a.autor, b.autor),
      editora: (a, b) => txt(a.editora, b.editora),
      aquisicao: (a, b) => (b.aquisicao || "").localeCompare(a.aquisicao || ""),
      nota: (a, b) => (b.nota || 0) - (a.nota || 0),
      volume: (a, b) => (a.volume ?? 9999) - (b.volume ?? 9999),
      prioridade: (a, b) => (peso[a.prioridade] ?? 3) - (peso[b.prioridade] ?? 3),
    };
    const base = cmp[fColecao ? "volume" : ordem] || cmp.recentes;
    const dir = ordemInv ? -1 : 1;
    return [...r].sort((a, b) => dir * base(a, b));
  }, [daLista, busca, fTipo, fEditora, fGenero, fColecao, fLeitura, ordem, ordemInv]);

  /* Todas as coleções na ordem manual — base pro arrasto. Quem nunca foi
     arrastada (ordem null) cai no fim, em ordem alfabética. */
  const colecoesOrdenadas = useMemo(() => {
    return [...colecoes].sort((a, b) => {
      const oa = a.ordem == null ? Infinity : a.ordem;
      const ob = b.ordem == null ? Infinity : b.ordem;
      return oa !== ob ? oa - ob : a.nome.localeCompare(b.nome, "pt-BR");
    });
  }, [colecoes]);

  const colecoesVisiveis = useMemo(() => {
    const q = busca.trim().toLowerCase();
    const base = colManual
      ? colecoesOrdenadas
      : [...colecoes].sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    return base.filter((c) => !q || c.nome.toLowerCase().includes(q) || (c.editora || "").toLowerCase().includes(q));
  }, [colecoes, colecoesOrdenadas, colManual, busca]);

  const reordenarColecoes = useCallback((idOrigem, idDestino) => {
    if (!idOrigem || !idDestino || idOrigem === idDestino) return;
    setColecoes((prev) => {
      const lista = [...prev].sort((a, b) => {
        const oa = a.ordem == null ? Infinity : a.ordem;
        const ob = b.ordem == null ? Infinity : b.ordem;
        return oa !== ob ? oa - ob : a.nome.localeCompare(b.nome, "pt-BR");
      });
      const de = lista.findIndex((c) => c.id === idOrigem);
      const para = lista.findIndex((c) => c.id === idDestino);
      if (de < 0 || para < 0) return prev;
      const [movida] = lista.splice(de, 1);
      lista.splice(para, 0, movida);
      // renumera tudo, pra não sobrar buraco nem empate
      const posicao = new Map(lista.map((c, i) => [c.id, i]));
      return prev.map((c) => ({ ...c, ordem: posicao.get(c.id) }));
    });
  }, []);

  const listasVisiveis = useMemo(() => {
    const q = busca.trim().toLowerCase();
    return listas
      .filter((l) => !q || l.nome.toLowerCase().includes(q))
      .sort((a, b) => b.criadoEm - a.criadoEm);
  }, [listas, busca]);

  const numeros = useMemo(() => {
    const estante = itens.filter((i) => i.lista === "estante");
    const desejos = itens.filter((i) => i.lista === "desejos");
    const series = colecoes.filter((c) => c.tipo === "serie");
    const estados = series.map((c) => estadoColecao(c, itens));
    return {
      estante: estante.length,
      desejos: desejos.length,
      colecoes: colecoes.length,
      completas: estados.filter((e) => e.completa).length,
      faltando: estados.reduce((s, e) => s + e.faltam.length, 0),
      semColecao: estante.filter((i) => !(i.colecoes || []).length).length,
      estimado: desejos.reduce((s, i) => s + (melhorPreco(i) ?? i.precoAlvo ?? 0), 0),
      emOferta: desejos.filter((i) => {
        const m = melhorPreco(i);
        return m != null && i.precoAlvo != null && m <= i.precoAlvo;
      }).length,
    };
  }, [itens, colecoes]);

  const aplicarTrocaEditora = () => {
    const { de, para } = trocaEditora;
    const novo = para.trim();
    if (!novo) return;
    const n = itens.filter((i) => i.editora === de).length;
    setItens((p) => p.map((i) => (i.editora === de ? { ...i, editora: novo } : i)));
    if (fEditora === de) setFEditora(novo);
    setTrocaEditora(null);
    avisar(`${n} item(ns) agora com a editora “${novo}”.`);
  };

  const limparFiltros = () => {
    setFSit("todas"); setFTipo(""); setFEditora(""); setFGenero(""); setFColecao(""); setFLeitura(""); setBusca(""); };
  const temFiltro = fTipo || fEditora || fGenero || fColecao || fLeitura || busca;
  const emSeries = aba === "series";
  /* Precisa vir depois de "emSeries": declarado antes, o React lia a
     constante ainda na zona morta e a tela não montava. */
  const mapaAnos = useMemo(
    () => (aba === "series" && vistaSeries === "mapa" ? montarMapaAnos(itens) : []),
    [aba, vistaSeries, itens]
  );
  /* A linha do tempo virou uma vista dentro de Personagens: é lá que ela
     faz sentido — a régua do Batman mora junto do Batman. O funcionamento
     é o mesmo, só mudou de lugar. */
  const [vistaPers, setVistaPers] = useState("lista");   // lista | linhas
  const emPersonagens = aba === "personagens" && vistaPers === "lista";
  const emLinhas = aba === "personagens" && vistaPers === "linhas";
  const emColecoes = aba === "colecoes";
  const emRelatorio = aba === "relatorios";
  const emListas = aba === "listas";

  /* Só dá pra arrastar na ordem manual e sem busca: com a lista filtrada,
     soltar entre dois cards não diria nada sobre as coleções escondidas. */
  const podeArrastar = emColecoes && colManual && !busca.trim();

  /* Volta pra primeira página sempre que o conjunto visível muda — senão
     você fica preso numa página que não existe mais. */
  useEffect(() => {
    setPagina(1);
  }, [aba, busca, fTipo, fEditora, fGenero, fColecao, fLeitura, ordem, ordemInv, porPagina]);

  /* A mesma paginação da estante serve às outras abas: 622 séries ou 1941
     personagens numa página só pesam para montar e para navegar. */
  const listaDaAba = emSeries ? listaDeSeries : emPersonagens ? personagensVisiveis : visiveis;
  const totalPaginas = porPagina ? Math.max(1, Math.ceil(listaDaAba.length / porPagina)) : 1;
  const paginaAtual = Math.min(pagina, totalPaginas);
  useEffect(() => {
    if (pagina !== paginaAtual) setPagina(paginaAtual);
  }, [pagina, paginaAtual]);

  // mudar de aba ou de recorte recomeça a paginação
  useEffect(() => { setPagina(1); setFiltrosCel(false); }, [aba, fSerie, fSit, busca, vistaSeries, vistaPers]);

  const paginados = useMemo(() => {
    if (!porPagina) return visiveis;
    const ini = (paginaAtual - 1) * porPagina;
    return visiveis.slice(ini, ini + porPagina);
  }, [visiveis, paginaAtual, porPagina]);

  const fatiar = (lista) => {
    if (!porPagina) return lista;
    const ini = (paginaAtual - 1) * porPagina;
    return lista.slice(ini, ini + porPagina);
  };
  /* Busca as imagens da página que está na tela, e só elas. Baixar 2500 de
     uma vez leva minutos e no celular gasta dados à toa; assim cada capa
     chega quando é preciso e fica guardada para sempre. */
  const buscandoCapa = useRef(new Set());

  useEffect(() => {
    if (!sessao || !carregado.current) return;
    let vivo = true;

    const idsNaTela = [];
    if (emPersonagens) idsNaTela.push(...fatiar(personagensVisiveis).map((p) => p.id));
    else if (emSeries) {
      for (const x of fatiar(listaDeSeries)) {
        if (x.tipo === "serie") idsNaTela.push(x.se.id);
        else { if (x.grupo.capa) idsNaTela.push(x.grupo.capa); idsNaTela.push(...x.membros.map((m) => m.id)); }
      }
    } else idsNaTela.push(...paginados.map((i) => i.id));

    const faltam = idsNaTela.filter((id) => id && !capas[id] && !buscandoCapa.current.has(id));
    if (!faltam.length) return;

    (async () => {
      for (const id of faltam.slice(0, 80)) {
        if (!vivo) break;
        buscandoCapa.current.add(id);
        try {
          const d = await baixarCapaNuvem(id);
          if (d && vivo) await guardarCapa(id, d);
        } catch (e) { /* segue para a próxima */ }
        finally { buscandoCapa.current.delete(id); }
      }
    })();

    return () => { vivo = false; };
  }, [sessao, paginados, personagensVisiveis, listaDeSeries, emPersonagens, emSeries, capas]);



  const irPara = (p) => {
    setPagina(Math.min(Math.max(1, p), totalPaginas));
    const topo = document.querySelector(".grade");
    if (topo) topo.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  /* ---- render ---- */
  return (
    <div className="acv">
      <style dangerouslySetInnerHTML={{ __html: CSS }} />

      <header className="acv-topo">
        <div className="topo-in">
          <div className="marca">
            <h1>Acervo</h1>
            <span>estante pessoal</span>
          </div>

          <div className="busca" style={emRelatorio ? { display: "none" } : undefined}>
            <Search size={15} />
            <input
              ref={buscaRef}
              value={busca}
              onChange={(e) => setBusca(e.target.value)}
              placeholder={emColecoes ? "Buscar coleção…" : emPersonagens ? "Buscar personagem…" : emSeries ? "Buscar série original…" : emListas ? "Buscar lista de leitura…" : "Buscar título, autor, editora…"}
              aria-label="Buscar no acervo"
            />
          </div>

          {/* no cabeçalho porque vale para todas as abas — na barra de
              ferramentas, só aparecia na estante e nos desejos */}
          <button

                  <button className="btn btn-primario" onClick={() => setLinhaEditando(linhaTempoVazia())}>
                    <Plus size={15} /> Criar a primeira

            return (

                eras={eras}
                aberta={faixaAberta}

                buscandoFases={buscandoFases}
                aoAbrirFaixa={abrirFaixa}

                aoAbrirSerie={(se) => { setOrigemItem({ aba }); setSerieAberta(se); }}
                aoEditar={() => setLinhaEditando(l)}
                aoRemover={() => removerLinha(l)}
                aoNovoEvento={(id) => setEventoEditando(eventoVazio(id))}

      ) : emRelatorio ? (

      ) : emSeries && vistaSeries === "mapa" ? (

          <MapaAnos

                  capaDe={capaDe}
                  indice={i}
                  aoAbrir={() => setColAberta(c)}
                  arrastavel={podeArrastar}
                  arrastando={colArrastada === c.id}
                  alvo={colAlvo === c.id && colArrastada !== c.id}

                  aoArrastarSobre={() => setColAlvo(c.id)}
                  aoSairDoAlvo={() => setColAlvo((v) => (v === c.id ? null : v))}
                  aoSoltar={() => { reordenarColecoes(colArrastada, c.id); setColArrastada(null); setColAlvo(null); }}
                  aoArrastarFim={() => { setColArrastada(null); setColAlvo(null); }}

            : emPersonagens

                  pers={p}
                  retrato={capas[p.id] || ""}

                  aoAbrir={() => abrirPersonagem(p)}

            : emSeries
            ? fatiar(listaDeSeries).flatMap((x, i) => {
                if (x.tipo === "serie") {

                    key={x.grupo.id}

                    aoAlternar={() => setGruposAbertos((p) => (p.includes(x.grupo.id) ? p.filter((y) => y !== x.grupo.id) : [...p, x.grupo.id]))}

                  />,
                ];
                // expandido: os membros entram logo depois, como um índice
                if (aberto) {
                  for (const m of x.membros) {
                    cards.push(
                      <CardSerie key={m.id} serie={m} capaSrc={capas[m.id] || ""} indice={i} noGrupo aoAbrir={() => setSerieAberta(m)} />

                  item={it}

              </h3>
              <p>
                {temFiltro
                  ? "Ajuste a busca ou limpe os filtros para ver tudo de novo."

                  : emSeries
                  ? "As séries aparecem sozinhas aqui. Abra um item, vá em Editar e preencha a seção “Publicação original” com a série e as edições que aquele volume compila — a série passa a existir nesta aba na hora."
                  : emColecoes
                  ? "Cadastre seus volumes primeiro na estante. Depois crie uma coleção — a série Dragon Ball, uma estante de terror — e junte os itens dentro dela para acompanhar o que falta."
                  : emListas
                  ? "Monte uma ordem de leitura juntando itens que já estão no seu acervo — de coleções e editoras diferentes, se for o caso. Útil para um personagem cuja história passa por várias séries."
                  : aba === "estante"
                  ? "Cadastre volume por volume. Cada um vira um card com a própria capa, e as coleções vêm depois."
                  : "Anote o que pretende comprar, defina um preço alvo e acompanhe quanto está custando."}
              </p>
              {temFiltro ? (
                <button className="btn" onClick={limparFiltros}>Limpar filtros</button>
              ) : emSeries ? (

                  <button className="btn" onClick={() => setFSerie("todas")}>Ver todas as séries</button>
                ) : null
              ) : (
                <button

                </button>
              )}
            </div>
          )}
        </main>

      {!carregando && !emRelatorio && !emColecoes && !emListas && !emLinhas

            <ChevronsLeft size={13} />
          </button>

            <ChevronLeft size={13} /> Anterior
          </button>

          <span className="pag-info">
            {porPagina ? <>página {paginaAtual} de {totalPaginas}</> : <>tudo em uma página</>}
            <em>
              {porPagina
                ? `${(paginaAtual - 1) * porPagina + 1}–${Math.min(paginaAtual * porPagina, visiveis.length)} de ${visiveis.length}`
                : `${visiveis.length} ${visiveis.length === 1 ? "item" : "itens"}`}
            </em>
          </span>

          <button className="btn btn-mini" onClick={() => irPara(paginaAtual + 1)} disabled={paginaAtual === totalPaginas}>
            Próxima <ChevronRight size={13} />
          </button>
          <button className="btn btn-mini" onClick={() => irPara(totalPaginas)} disabled={paginaAtual === totalPaginas} title="Última página">
            <ChevronsRight size={13} />
          </button>

            className="pag-tamanho"
            value={porPagina}
            onChange={(e) => setPorPagina(Number(e.target.value))}

          >
            <option value="60">60 por página</option>
            <option value="100">100 por página</option>
            <option value="200">200 por página</option>
            <option value="0">Mostrar tudo</option>
          </select>
        </nav>

        <div className="barra-prog">
          <i style={{ width: `${capasProg.total ? (capasProg.feitas / capasProg.total) * 100 : 0}%` }} />

        </div>

      {atualizando && (
        <div className="barra-prog">
          <i style={{ width: `${(atualizando.feitas / atualizando.total) * 100}%` }} />
          <span>
            Atualizando da base · {atualizando.feitas} de {atualizando.total}
            {atualizando.nome ? ` · ${atualizando.nome}` : ""}
          </span>
        </div>
      )}

      <footer className="rodape">
        <span className="rod-marca">Acervo</span>
        <span className="rod-versao">v{VERSAO.numero}</span>
        <span className="rod-data">{VERSAO.data}{VERSAO.nota ? ` · ${VERSAO.nota}` : ""}</span>

          <span className="rod-arquivo" title={`na nuvem como ${sessao.user.email}`}>

        {arquivo && (
          <span className={`rod-arquivo ${falhaArquivo ? "ruim" : ""}`} title={falhaArquivo || "gravando no arquivo vinculado"}>

              ? `arquivo sem gravar — ${falhaArquivo}`
              : salvoEm
                ? `arquivo salvo ${salvoEm.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`
                : "arquivo vinculado"}
          </span>
        )}
        <span className="rod-nums">
          {itens.length} itens · {colecoes.length} coleções · {series.length} séries · {personagens.length} personagens
        </span>

      {aberto && !editando && (
        <Detalhe
          item={aberto}

          aoAbrirPersonagem={(p) => { setOrigemItem({ aba, item: aberto }); setAberto(null); abrirPersonagem(p); }}
          aoFechar={fecharDetalhe}
          aoEditar={() => setEditando(aberto)}
          aoRemover={() => removerItem(aberto)}
          aoAtualizar={atualizarItem}
          aoMover={() => moverItem(aberto)}
          aoNavegar={setAberto}
          aoAbrirColecao={(c) => { setAberto(null); setAba("colecoes"); setColAberta(c); }}
        />
      )}

      {editando && (
        <Formulario
          inicial={editando}

          aoAbrirLote={() => { setEditando(null); setImportando(true); }}
          temCapaSerie={(id) => !!capas[id]}
          aoSalvarCapaSerie={(id, dados) => guardarCapa(id, dados)}
          aoSalvarRetrato={salvarRetrato}
          aoSalvarNumeracao={(id, nome, primeiro, ultimo, tipo, publicados, inicioSerie, fimSerie, publicando, anoFim, wikiId, paginaWiki) => {
            setMetaSeries((p) => {
              const atual = p.find((m) => m.id === id);
              const campos = { nome };
              if (tipo) campos.tipo = tipo;
              // não sobrescreve a faixa que você tenha definido à mão
              if (atual && Number(atual.ultimo) > 0) {
                // a faixa é sua, mas a lista do que existe pode ser atualizada
                const extra = {};
                if (tipo) extra.tipo = tipo;
                if (publicados) extra.publicados = publicados;
                if (inicioSerie) extra.inicio = inicioSerie;
                if (publicando != null) { extra.publicando = publicando; extra.anoFim = anoFim || 0; }
                if (paginaWiki) { extra.wikiId = wikiId; extra.paginaWiki = paginaWiki; }
                if (fimSerie) extra.fim = fimSerie;
                return Object.keys(extra).length ? p.map((m) => (m.id === id ? { ...m, ...extra } : m)) : p;
              }
              Object.assign(campos, { primeiro: primeiro || 0, ultimo: ultimo || 0, total: ultimo || 0 });
              if (publicados) campos.publicados = publicados;
              if (inicioSerie) campos.inicio = inicioSerie;
              if (publicando != null) { campos.publicando = publicando; campos.anoFim = anoFim || 0; }
              if (paginaWiki) { campos.wikiId = wikiId; campos.paginaWiki = paginaWiki; }
              if (fimSerie) campos.fim = fimSerie;
              return atual ? p.map((m) => (m.id === id ? { ...m, ...campos } : m)) : [...p, { id, ...campos }];
            });
          }}
          aoCriarColecao={criarColecao}
          aoSalvar={salvarItem}
          aoFechar={() => setEditando(null)}
          aoAvisar={avisar}
        />
      )}

      {colAberta && !colEditando && (
        <DetalheColecao
          col={colAberta}
          itens={itens}
          capaDe={capaDe}
          aoFechar={() => setColAberta(null)}
          aoEditar={() => setColEditando(colAberta)}
          aoRemover={() => removerColecao(colAberta)}
          aoAbrirItem={(i) => {
            const ordem = [...estadoColecao(colAberta, itens).membros].sort((a, b) => (a.volume ?? 999) - (b.volume ?? 999));
            setOrigemItem({ aba, colecao: colAberta });
            setColAberta(null); setNavLista(ordem); setAberto(i);
          }}
          aoVincular={(i) => vincular(i, colAberta.id)}
          aoDesvincular={(i) => desvincular(i, colAberta.id)}
          aoNovoVolume={novoVolume}
          aoEscolherParaVolume={escolherParaVolume}
          aoDesejarLacunas={desejarLacunas}
          aoAjustar={ajustarColecao}
        />
      )}

      {serieAberta && !serieEditando && (() => {
        // sempre relê da lista viva, pra refletir edição feita no item por trás
        const atual = series.find((x) => x.id === serieAberta.id);
        if (!atual) return null;
        return (
          <DetalheSerie
            serie={atual}
            capaSrc={capas[atual.id] || ""}
            aoFechar={() => setSerieAberta(null)}
            aoEditar={() => setSerieEditando(atual)}
            aoLimpar={() => limparSerie(atual.id)}
            aoAbrirItem={(i) => {
              setOrigemItem({ aba, serie: atual });
              setSerieAberta(null);
              setNavLista(atual.itens);
              setAberto(i);
            }}
          />
        );
      })()}

      {/* porta de entrada: sem sessão, o app não abre calado guardando só local */}
      {cfgNuvem && !sessao && !semNuvem && !carregando && (
        <PortaDeEntrada
          ocupado={nuvemOcupada}
          aoEntrar={async (email, senha) => {
            const sb = nuvem();
            if (!sb) return avisar("Configure o projeto primeiro.");
            setNuvemOcupada("entrando…");
            try {
              const { error } = await comPrazo(sb.auth.signInWithPassword({ email, password: senha }), 20, "o login");
              setNuvemOcupada("");
              if (error) return avisar(error.message);
              jaPuxou.current = false;
            } catch (e) { setNuvemOcupada(""); avisar(String(e.message || e)); }
          }}
          aoSeguirSemNuvem={() => {
            setSemNuvem(true);
            avisar("Trabalhando só neste aparelho. Entre pelo ícone de nuvem quando quiser sincronizar.");
          }}
        />
      )}

      {conflito && (
        <EscolherLado
          nuvem={conflito.nuvem}
          local={conflito.local}
          aoUsarNuvem={() => { aplicarDaNuvem(conflito.dados); setConflito(null); avisar("Trazido da nuvem."); }}
          aoUsarLocal={() => { const c = conflito; setConflito(null); enviarTudo().then(() => avisar("Nuvem atualizada com o que estava aqui.")); }}
          aoFechar={() => setConflito(null)}
        />
      )}

      {painelNuvem && (
        <PainelNuvem
          sessao={sessao}
          cfg={cfgNuvem}
          ocupado={nuvemOcupada}
          aoConfigurar={(c) => { esquecerCliente(); gravarConfigNuvem(c); setCfgNuvem(c); if (!c) setSessao(null); }}
          aoEntrar={async (email, senha) => {
            const sb = nuvem();
            if (!sb) return avisar("Configure o projeto primeiro.");
            setNuvemOcupada("entrando…");
            try {
            const { error } = await comPrazo(sb.auth.signInWithPassword({ email, password: senha }), 20, "o login");
            setNuvemOcupada("");
            if (error) return avisar(error.message);
            jaPuxou.current = false;
            avisar("Conectado.");
            } catch (e) { setNuvemOcupada(""); avisar(String(e.message || e)); }
          }}
          aoCriar={async (email, senha) => {
            const sb = nuvem();
            if (!sb) return avisar("Configure o projeto primeiro.");
            setNuvemOcupada("criando…");
            const { error } = await comPrazo(sb.auth.signUp({ email, password: senha }), 20, "a criação da conta");
            setNuvemOcupada("");
            if (error) return avisar(error.message);
            avisar("Conta criada. Se o projeto exigir, confirme pelo e-mail antes de entrar.");
          }}
          aoSair={async () => {
            const sb = nuvem();
            if (sb) await sb.auth.signOut();
            setSessao(null); jaPuxou.current = false;
            avisar("Desconectado. Os dados continuam aqui e no arquivo.");
          }}
          capas={chavesUteis().length}
          naNuvem={null}
          aoEnviarTudo={enviarTudo}
          backupAuto={backupAuto}
          backupEm={backupEm}
          arquivo={arquivo}
          aoTrocarBackup={setBackupAuto}
          aoSalvaguarda={salvaguarda}
          aoEnviarCapas={enviarCapas}
          aoBaixarCapas={baixarCapas}
          aoFechar={() => setPainelNuvem(false)}
          aoAvisar={avisar}
        />
      )}

      {grupoEditando && (
        <FormGrupoSerie
          inicial={grupoEditando}
          series={series}
          grupos={gruposSerie}
          capas={capas}
          aoSalvar={salvarGrupo}
          aoRemover={removerGrupo}
          aoFechar={() => setGrupoEditando(null)}
          aoAvisar={avisar}
        />
      )}

      {linhaEditando && (
        <FormLinha
          inicial={linhaEditando}
          series={series}
          aoSalvar={salvarLinha}
          aoFechar={() => setLinhaEditando(null)}

/* ══════════════════════════════════════════════════════════════
   LEITURA DE PLANILHA
   Só texto — nenhuma chamada de rede em lugar nenhum deste arquivo.
   ══════════════════════════════════════════════════════════════ */
const soIsbn = (s) => String(s || "").replace(/[^0-9Xx]/g, "").toUpperCase();
const ehIsbn = (s) => [10, 13].includes(soIsbn(s).length);

const semAcento = (s) =>
  String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const RX_VOL = /[\s\-–—,:]*\b(?:vol(?:ume)?\.?|v\.|n[º°o]\.?|tomo|#)\s*0*(\d{1,3})\b/i;

function separarVolume(titulo) {
  const t = String(titulo || "").trim();
  const m = t.match(RX_VOL);
  if (m && m.index > 2) {
    return { base: t.slice(0, m.index).replace(/[\s\-–—,:]+$/, "").trim(), vol: parseInt(m[1], 10) };
  }
  const m2 = t.match(/^(.{4,}?)[\s\-–—]+0*(\d{1,3})$/); // "Berserk 12"
  if (m2) return { base: m2[1].replace(/[\s\-–—,:]+$/, "").trim(), vol: parseInt(m2[2], 10) };
  return { base: t, vol: null };
}

const COLUNAS = {

  titulo: ["titulo", "título", "nome", "obra", "livro"],

  precoPago: ["preco pago", "preço pago", "preco", "preço", "valor", "valor pago", "preco de compra", "custo"],
  leitura: ["leitura", "status", "status leitura", "situacao", "situação", "lido"],
  dataLeitura: ["data leitura", "data de leitura", "lido em", "terminei em", "data conclusao", "data conclusão", "conclusao", "conclusão"],
  volume: ["volume", "vol", "numero", "número", "num"],

  tipo: ["tipo", "formato", "midia", "mídia"],
  paginas: ["qtd paginas", "qtd de paginas", "qtd. paginas", "quantidade de paginas", "paginas", "páginas", "numero de paginas", "número de páginas", "pgs", "pags"],
  capaUrl: ["link de imagem de capa", "link imagem capa", "link capa", "imagem de capa", "imagem capa", "url capa", "capa", "url da imagem", "url imagem"],
  ano: ["ano", "ano publicacao", "ano de publicacao", "ano de publicação", "ano edicao", "ano da edicao"],
  lista: ["lista", "destino", "estante ou desejos", "estante/desejos", "wishlist", "lista de desejos", "acervo"],
  publicacaoOriginal: ["publicacao original", "publicação original", "original", "serie original", "série original", "publicacao originais"],
  marco: ["ponto chave", "ponto-chave", "ponto chave?", "marco", "chave"],
};

/* "Desejos", "wishlist", "quero" → lista de desejos. "Estante", "tenho",
   "acervo" → estante. Vazio ou irreconhecível devolve "", e aí quem manda
   é o destino escolhido na tela de importação. */
/* ─── publicação original no CSV ───
   Um item pode compilar várias séries, então uma coluna só com posições
   fixas separadas por "|", e "//" entre séries:
     Wonder Woman (2007) | #6-10 | DC Comics | EUA | 03/2007-09/2007
   Campos vazios no fim podem ser omitidos. A ordem é sempre:
     série | edições | editora | país | publicação | arco | cronologia */
const CAMPOS_ORIG = ["serie", "edicoesTexto", "editora", "pais", "data", "arco", "cronologia",
                     "roteirista", "desenhista", "personagens"];

/* Os personagens são uma lista de objetos, então precisam de separadores
   próprios dentro da célula: "+" entre personagens e "^" entre o nome e a
   página da wiki. Sem isso, exportar para CSV e reimportar perderia o
   elenco e os créditos. */
const persParaTexto = (lista) => (lista || [])
  .map((x) => [x.nome, x.pagina].filter(Boolean).join("^"))
  .filter(Boolean).join(" + ");

const textoParaPers = (txt) => String(txt || "").split("+")
  .map((p) => {
    const [nome, pagina] = p.split("^").map((x) => x.trim());
    return nome ? { nome, pagina: pagina || "" } : null;
  })
  .filter(Boolean);

const origensParaTexto = (item) => {
  // "|" e "//" são os separadores, então não podem sobrar dentro dos valores
  const limpo = (v) => String(v || "").split("|").join("/").split("//").join("/").trim();
  // "^" e "+" são separadores internos da lista de personagens e ficam intactos
  return originaisDe(item)
    .map((o) => {
      const partes = CAMPOS_ORIG.map((k) => (k === "personagens" ? limpo(persParaTexto(o[k])) : limpo(o[k])));
      while (partes.length > 1 && !partes[partes.length - 1]) partes.pop(); // corta vazios do fim
      return partes.join(" | ");
    })
    .join(" // ");
};

const textoParaOrigens = (txt) => {
  if (!String(txt || "").trim()) return [];
  return String(txt)
    .split("//")
    .map((bloco) => {
      const partes = bloco.split("|").map((x) => x.trim());
      const o = {};
      CAMPOS_ORIG.forEach((k, i) => { o[k] = partes[i] || ""; });
      o.personagens = textoParaPers(o.personagens);
      o.numeros = numerosDeEdicoes(o.edicoesTexto);
      return o;
    })
    .filter((o) => o.serie);
};

/* ─── consulta às bases de quadrinhos ───
   DC Database e Marvel Database rodam MediaWiki, cuja API responde a
   requisições anônimas de qualquer origem quando se passa origin=*. É o
   mesmo motivo de o Open Library funcionar aqui. A página de categoria de
   um volume lista todas as edições com a data de capa. */
/* A editora e o país não vêm da consulta: são consequência de qual base
   respondeu. Achou no DC Database, é DC Comics; no Marvel Database, é
   Marvel. Vale inclusive para material anterior às compras — a Fawcett e a
   Quality estão lá porque a DC detém os personagens hoje. */
/* O "action=parse" funciona — 770 fichas de personagem vieram dele —, mas
   falha em páginas específicas, sobretudo categorias grandes: o servidor
   devolve erro e a resposta sai sem o cabeçalho de CORS, o que o navegador
   relata como bloqueio. São reservas, então a falha não impede nada; só
   não pode escapar como erro solto no console. */
async function tentarParse(wiki, pagina, extra = "prop=text") {
  try {
    const url = wiki.base + "?action=parse&page=" + encodeURIComponent(pagina)
      + "&" + extra + "&format=json&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (!r.ok) return null;
    const d = await r.json();
    if (d.error) return null;
    return d;
  } catch (e) {
    return null;   // reserva que não respondeu: segue sem ela
  }
}

const WIKIS = [
  { id: "dc", rot: "DC", base: "https://dc.fandom.com/api.php", editora: "DC Comics", pais: "Estados Unidos" },
  { id: "marvel", rot: "Marvel", base: "https://marvel.fandom.com/api.php", editora: "Marvel", pais: "Estados Unidos" },
];

const MESES_EN = {
  january: 1, february: 2, march: 3, april: 4, may: 5, june: 6,
  july: 7, august: 8, september: 9, october: 10, november: 11, december: 12,
};

// "Wonder Woman (1942)" → "Wonder Woman"; o ano vira pista, não parte do nome
/* O ano entre parênteses no nome — "Superman (1987)" — diz qual volume é,
   mas a busca o descarta. Aqui ele vira critério: pergunta-se a data da
   primeira edição de cada volume candidato e ordena-se pela proximidade,
   numa requisição só para todos. */
const anoDoNome = (n) => {
  // um grupo só: o ano inteiro, dentro ou fora dos parênteses
  const m = String(n || "").match(/\b((?:19|20)\d{2})\b/);
  return m ? Number(m[1]) : null;
};

async function anosDosVolumes(cands) {
  const fora = new Map();
  const porWiki = new Map();
  for (const v of cands) {
    if (!porWiki.has(v.wiki.id)) porWiki.set(v.wiki.id, { wiki: v.wiki, itens: [] });
    porWiki.get(v.wiki.id).itens.push(v);
  }
  for (const { wiki, itens } of porWiki.values()) {
    const titulos = itens.map((v) => v.rot + " 1");
    try {
      const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
        + encodeURIComponent(titulos.slice(0, 50).join("|")) + "&format=json&formatversion=2&origin=*";
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) continue;
      const d = await r.json();
      for (const pg of (d.query && d.query.pages) || []) {
        const txt = pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content;
        if (!txt) continue;
        const data = dataDaFicha(txt);
        const ano = data ? Number(data.slice(-4)) : null;
        if (ano) fora.set(String(pg.title).replace(/\s+1$/, ""), ano);
      }
    } catch (e) { /* segue sem os anos desta base */ }
  }
  return fora;
}

const nomeParaBusca = (n) =>
  String(n || "")
    .replace(/\((?:19|20)\d{2}[^)]*\)/g, " ")        // "(1942)" e "(1942-1986)"
    .replace(/\(\s*(?:vol(?:ume)?\.?\s*\d+)?\s*\)/gi, " ") // "(Volume 3)" e parênteses vazios
    .replace(/\bvol(?:ume)?\.?\s*\d+\b/gi, " ")
    .replace(/\s+/g, " ")
    .trim();

/* As bases escrevem o título do próprio jeito: "Blood & Whiskey" contra
   "Blood And Whiskey", dois-pontos contra travessão. Em vez de exigir que
   você acerte a grafia, tenta as variações mais comuns. */
function variacoesDoNome(nome) {
  const base = nomeParaBusca(nome);
  const v = new Set([base]);
  v.add(base.replace(/\s*&\s*/g, " and "));
  v.add(base.replace(/\band\b/gi, "&"));
  v.add(base.replace(/\s+[-–—]\s+/g, ": "));
  v.add(base.replace(/\s+[-–—]\s+/g, " "));
  v.add(base.replace(/[:,]/g, " ").replace(/\s+/g, " "));
  return [...v].map((x) => x.trim()).filter(Boolean);
}

// "Preacher Special Vol 1 1" (página de edição) → "Category:Preacher Special Vol 1"
/* Alguns volumes trazem um sufixo entre parênteses — "Injustice: Year Zero
   Vol 1 (Digital)". Sem prever isso, o título não casava com nada e caía no
   caminho de página solta, que não sabe enumerar edições. */
const SUFIXO_VOL = "(?:\\s*\\([^)]*\\))?";
const ehPaginaDeVolume = (t) => new RegExp("\\sVol\\s\\d+" + SUFIXO_VOL + "$").test(String(t));
const categoriaDaEdicao = (titulo) => {
  const m = String(titulo).match(new RegExp("^(.+\\sVol\\s\\d+" + SUFIXO_VOL + ")\\s+\\d+(?:\\.\\d+)?$"));
  return m ? "Category:" + m[1] : "";
};

async function volumesDaWiki(nome) {
  const nomes = variacoesDoNome(nome);
  if (!nomes.length) return [];
  const achados = new Map();

  /* Guarda também a página que deu origem à categoria. Especiais e
     one-shots costumam não ter categoria de volume: sem essa reserva, o app
     derivava "Category:X Vol 1", não encontrava nada, e você precisava ir
     ao DC Database copiar o endereço à mão. */
  const registrar = (w, pagina, reserva) => {
    if (!pagina || !ehPaginaDeVolume(pagina)) return;
    const chave = w.id + pagina;
    if (achados.has(chave)) {
      if (reserva && !achados.get(chave).reserva) achados.get(chave).reserva = reserva;
      return;
    }
    achados.set(chave, { wiki: w, pagina, rot: pagina.replace(/^Category:/, ""), reserva: reserva || "" });
  };

  await Promise.all(WIKIS.map(async (w) => {
    /* 0) Antes de buscar por texto, pergunta direto se as páginas existem.
       A busca do MediaWiki erra com dois-pontos no título — "The
       Multiversity: The Just" não aparecia —, enquanto a checagem por
       título é exata e cabe tudo numa requisição. */
    try {
      const candidatos = [];
      for (const n of nomes.slice(0, 4)) {
        candidatos.push(`${n} Vol 1`, `${n} Vol 2`, `${n} Vol 3`, `${n} Vol 1 1`,
                        `${n} Vol 1 (Digital)`, `${n} Vol 1 (Digital) 1`, n);
      }
      const url = `${w.base}?action=query&titles=${encodeURIComponent([...new Set(candidatos)].slice(0, 50).join("|"))}`
        + `&format=json&formatversion=2&origin=*`;
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (r.ok) {
        const d = await r.json();
        const existem = ((d.query && d.query.pages) || []).filter((pg) => !pg.missing).map((pg) => pg.title);
        // normaliza: página de edição e página de volume viram a categoria
        for (const t of existem) {
          const cat = categoriaDaEdicao(t);
          if (cat) registrar(w, cat, t);
          else if (ehPaginaDeVolume(t)) registrar(w, "Category:" + t, t);
        }
        // página solta só entra se nenhum volume apareceu
        if (!achados.size) {
          for (const t of existem) {
            if (!/\sVol\s\d+/.test(t)) achados.set(w.id + t, { wiki: w, pagina: t, rot: t, solta: true });
          }
        }
      }
    } catch (e) { /* segue para a busca por texto */ }

    if (achados.size) return;

    for (const n of nomes) {
      // 1) procura a categoria do volume
      try {
        const url = `${w.base}?action=query&list=search&srsearch=${encodeURIComponent("Category:" + n + " Vol")}`
          + `&srnamespace=14&srlimit=10&format=json&origin=*`;
        const r = await fetch(url, { mode: "cors", credentials: "omit" });
        if (r.ok) {
          const d = await r.json();
          ((d.query && d.query.search) || []).forEach((x) => registrar(w, x.title));
        }
      } catch (e) { /* tenta a próxima variação */ }

      if (achados.size) break;

      /* 2) nada? procura a página da edição em si e deduz a categoria a
         partir dela. Resolve os títulos que a busca por categoria não
         alcança, como os especiais com dois-pontos no nome. */
      try {
        const url = `${w.base}?action=query&list=search&srsearch=${encodeURIComponent(n + " Vol 1 1")}`
          + `&srnamespace=0&srlimit=10&format=json&origin=*`;
        const r = await fetch(url, { mode: "cors", credentials: "omit" });
        if (r.ok) {
          const d = await r.json();
          ((d.query && d.query.search) || []).forEach((x) => {
            const cat = categoriaDaEdicao(x.title);
            if (cat) registrar(w, cat);
          });
        }
      } catch (e) { /* segue */ }

      if (achados.size) break;

      /* 3) especiais sem volume no título ("Batman: War On Crime"). Procura
         a página pelo nome e oferece como está. */
      try {
        const url = `${w.base}?action=query&list=search&srsearch=${encodeURIComponent(n)}`
          + `&srnamespace=0&srlimit=6&format=json&origin=*`;
        const r = await fetch(url, { mode: "cors", credentials: "omit" });
        if (r.ok) {
          const d = await r.json();
          const alvo = semAcento(n);
          ((d.query && d.query.search) || []).forEach((x) => {
            if (ehPaginaDeVolume(x.title) || categoriaDaEdicao(x.title)) return;   // já tratado acima
            if (!semAcento(x.title).startsWith(alvo.slice(0, Math.max(6, alvo.length - 6)))) return;
            const chave = w.id + x.title;
            if (!achados.has(chave)) achados.set(chave, { wiki: w, pagina: x.title, rot: x.title, solta: true });
          });
        }
      } catch (e) { /* segue */ }

      if (achados.size) break;
    }
  }));

  return [...achados.values()];
}

/* Data de capa de cada edição do volume.
   Antes eu lia a página de categoria e procurava "#N (Mês, Ano)" no texto
   renderizado. Funciona nas séries longas, mas one-shots e especiais são
   listados de outro jeito e voltavam vazios. Agora enumera as páginas da
   categoria e lê o campo CoverDate da ficha de cada uma, que é onde a data
   realmente está. O método antigo fica como reserva. */
/* A data de capa aparece em formatos diferentes conforme a idade da
   página: "CoverDate = February, 1998", ou "Month = February" com
   "Year = 1998", ou ainda só no texto ("with a cover date of..."). */
function dataDaFicha(texto) {
  const pega = (nome) => {
    const m = texto.match(new RegExp("\\|\\s*" + nome + "\\s*=\\s*([^\\n|}]+)", "i"));
    return m ? m[1].replace(/\[\[|\]\]/g, "").trim() : "";
  };
  const monta = (mesTxt, ano) => {
    const mes = MESES_EN[String(mesTxt).toLowerCase()] || (Number(mesTxt) >= 1 && Number(mesTxt) <= 12 ? Number(mesTxt) : 0);
    return mes && ano ? String(mes).padStart(2, "0") + "/" + ano : "";
  };

  for (const campo of ["CoverDate", "Cover Date", "Date", "ReleaseDate"]) {
    const v = pega(campo);
    if (!v) continue;
    const m1 = v.match(/([A-Za-z]+)[,\s]+(\d{4})/);
    if (m1) { const d = monta(m1[1], m1[2]); if (d) return d; }
    const m2 = v.match(/(\d{4})[-\/](\d{1,2})/);
    if (m2) { const d = monta(m2[2], m2[1]); if (d) return d; }
    const m3 = v.match(/\b(\d{4})\b/);
    if (m3) return "01/" + m3[1];
  }

  const d3 = monta(pega("Month"), pega("Year"));
  if (d3) return d3;

  // último recurso no próprio wikitexto: a frase de abertura
  const m4 = texto.match(/cover date of\s+([A-Za-z]+),?\s*(\d{4})/i);
  if (m4) return monta(m4[1], m4[2]);
  return "";
}

/* Os números que aparecem no texto renderizado da categoria. Serve de
   reforço à enumeração, porque cada uma às vezes traz o que a outra perde. */
async function numerosDoHtmlDaCategoria(wiki, pagina) {
  if (!/^Category:/i.test(pagina)) return [];
  const base = String(pagina).replace(/^Category:/, "");
  const d = await tentarParse(wiki, pagina);
  if (!d) return [];
  const html = (d.parse && d.parse.text && d.parse.text["*"]) || "";
  const fora = new Set();
  // "Série #12 (Janeiro, 1990)" e também os títulos dos links "Série Vol 1 12"
  const re1 = /#(\d{1,7})\s*\(\s*[A-Za-z]+,?\s*\d{4}\s*\)/g;
  const re2 = new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s+(\\d{1,7})(?![\\d])", "g");
  let m;
  while ((m = re1.exec(html))) fora.add(Number(m[1]));
  while ((m = re2.exec(html))) fora.add(Number(m[1]));
  return [...fora];
}

async function edicoesDaWiki(wiki, pagina, alvos) {
  const base = String(pagina).replace(/^Category:/, "");

  /* Alguns especiais não têm volume nem número no título: a página é só
     "Batman: War On Crime". Nesse caso não há categoria para enumerar —
     lê-se a própria página. */
  if (!/^Category:/i.test(pagina)) {
    const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
      + encodeURIComponent(pagina) + "&format=json&formatversion=2&origin=*";
    const r = await fetch(url, { mode: "cors", credentials: "omit" });
    if (!r.ok) throw new Error("a página não respondeu (" + r.status + ")");
    const d = await r.json();
    const pg = ((d.query && d.query.pages) || [])[0] || {};
    if (pg.missing) throw new Error("não existe a página “" + pagina + "”");
    const txt = (pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content) || "";
    let data = dataDaFicha(txt);
    if (!data) {
      // reserva: a frase de abertura do texto renderizado
      try {
        const r2 = await fetch(wiki.base + "?action=parse&page=" + encodeURIComponent(pagina)
          + "&prop=text&format=json&formatversion=2&origin=*", { mode: "cors", credentials: "omit" });
        if (r2.ok) {
          const d2 = await r2.json();
          const texto = ((d2.parse && d2.parse.text) || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
          const m = texto.match(/cover date of\s+([A-Za-z]+),?\s*(\d{4})/i);
          if (m && MESES_EN[m[1].toLowerCase()]) {
            data = String(MESES_EN[m[1].toLowerCase()]).padStart(2, "0") + "/" + m[2];
          }
        }
      } catch (e) { /* fica sem data */ }
    }
    if (!data) throw new Error("achei a página, mas não a data de capa dela");
    return { numeros: [1], datas: [{ n: 1, data }] };
  }

  /* 1) quais edições existem nesta categoria.
     A API devolve no máximo 500 por vez — a Detective Comics passa de 800,
     então as edições altas ficavam de fora. Aqui pagina até acabar. */
  let titulos = [];
  try {
    let continuar = "";
    for (let volta = 0; volta < 8; volta++) {
      const url = wiki.base + "?action=query&list=categorymembers&cmtitle=" + encodeURIComponent(pagina)
        + "&cmnamespace=0&cmlimit=500&format=json&formatversion=2&origin=*"
        + (continuar ? "&cmcontinue=" + encodeURIComponent(continuar) : "");
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) break;
      const d = await r.json();
      titulos = titulos.concat(((d.query && d.query.categorymembers) || []).map((x) => x.title));
      continuar = (d.continue && d.continue.cmcontinue) || "";
      if (!continuar) break;
    }
  } catch (e) { /* cai na reserva */ }

  const numeroDe = (t) => {
    const bruto = t.startsWith(base + " ") ? t.slice(base.length + 1).trim() : "";
    const m = normalizarNumero(bruto);
    return /^\d{1,7}(\.\d{1,3})?$/.test(m) ? Number(m) : null;
  };
  let edicoes = titulos
    .map((t) => ({ titulo: t, n: numeroDe(t) }))
    .filter((x) => x.n !== null)
    .sort((a, b) => a.n - b.n);

  /* One-shots e especiais costumam não ter categoria de volume: a edição
     existe sozinha. Nesse caso, sonda os números diretamente — uma consulta
     com 50 títulos devolve quais existem e quais não. */
  if (!edicoes.length) {
    /* Começa no 0: a FCBD Dark Crisis Special Edition tem só a #0, e uma
       sonda que parte do 1 nunca a encontra. Especiais de Free Comic Book
       Day e edições do Hora Zero usam esse número com frequência. */
    const sonda = Array.from({ length: 51 }, (_, i) => base + " " + i);
    try {
      const url = wiki.base + "?action=query&titles=" + encodeURIComponent(sonda.join("|"))
        + "&format=json&formatversion=2&origin=*";
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (r.ok) {
        const d = await r.json();
        edicoes = ((d.query && d.query.pages) || [])
          .filter((pg) => !pg.missing)
          .map((pg) => ({ titulo: pg.title, n: numeroDe(pg.title) }))
          .filter((x) => x.n !== null)
          .sort((a, b) => a.n - b.n);
      }
    } catch (e) { /* segue para a reserva */ }
  }

  /* 2) lê a data de capa, 50 páginas por consulta. Só das edições que você
     tem: numa série de 880, ler todas seriam 18 requisições para nada. */
  const querAlvo = Array.isArray(alvos) && alvos.length ? new Set(alvos) : null;
  const aLer = querAlvo ? edicoes.filter((e) => querAlvo.has(e.n)) : edicoes.slice(0, 200);
  const fora = new Map();
  for (let i = 0; i < aLer.length; i += 50) {
    const lote = aLer.slice(i, i + 50);
    const url = wiki.base + "?action=query&prop=revisions&rvprop=content&rvslots=main&titles="
      + encodeURIComponent(lote.map((x) => x.titulo).join("|")) + "&format=json&formatversion=2&origin=*";
    try {
      const r = await fetch(url, { mode: "cors", credentials: "omit" });
      if (!r.ok) continue;
      const d = await r.json();
      const porTitulo = new Map(lote.map((x) => [x.titulo, x.n]));
      for (const pg of (d.query && d.query.pages) || []) {
        const n = porTitulo.get(pg.title);
        const txt = pg.revisions && pg.revisions[0] && pg.revisions[0].slots.main.content;
        if (n === undefined || !txt) continue;
        const d2 = dataDaFicha(txt);
        if (d2) fora.set(n, d2);
      }
    } catch (e) { /* segue para o próximo lote */ }
  }

  /* Poucas edições e nenhuma data? Lê o texto renderizado de cada uma: a
     abertura das páginas do DC Database diz "with a cover date of...". */
  if (!fora.size && aLer.length && aLer.length <= 12) {
    for (const e of aLer) {
      try {
        const url = wiki.base + "?action=parse&page=" + encodeURIComponent(e.titulo)
          + "&prop=text&format=json&formatversion=2&origin=*";
        const r = await fetch(url, { mode: "cors", credentials: "omit" });
        if (!r.ok) continue;
        const d = await r.json();
        const texto = ((d.parse && d.parse.text) || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
        const m = texto.match(/cover date of\s+([A-Za-z]+),?\s*(\d{4})/i);
        if (!m) continue;
        const mes = MESES_EN[m[1].toLowerCase()];
        if (mes) fora.set(e.n, String(mes).padStart(2, "0") + "/" + m[2]);
      } catch (err) { /* tenta a próxima */ }
    }
  }

  /* Junta o que a enumeração trouxe com o que a página renderizada mostra.
     Confiar só na primeira deixou a Action Comics com 145 edições em vez de
     1050 — a lista voltou incompleta e eu aceitava sem conferir. */
  const doHtml = await numerosDoHtmlDaCategoria(wiki, pagina).catch(() => []);
  const todos = [...new Set([...edicoes.map((e) => e.n), ...doHtml])].sort((a, b) => a - b);
