    </Modal>
  );
}

function DetalheListaLeitura({ lista, itens, capaDe, aoFechar, aoEditar, aoRemover, aoAbrirItem, aoAdicionar, aoTirar, aoMover }) {
  const [busca, setBusca] = useState("");
  const membros = lista.itens.map((id) => itens.find((i) => i.id === id)).filter(Boolean);

  const candidatos = useMemo(() => {
    const q = busca.trim().toLowerCase();
    if (!q) return [];
    return itens
      .filter((i) => !lista.itens.includes(i.id))
      .filter((i) => [i.titulo, i.autor, i.editora].some((c) => (c || "").toLowerCase().includes(q)))
      .slice(0, 12);
  }, [busca, itens, lista.itens]);

  return (
    <Modal
      titulo="Lista de leitura"
      aoFechar={aoFechar}
      rodape={<>
        <button className="btn" onClick={aoEditar}><Pencil size={14} /> Nome e notas</button>
        <button className="btn btn-perigo" style={{ marginLeft: "auto" }} onClick={() => {
          if (window.confirm(`Apagar a lista "${lista.nome}"? Os itens continuam no acervo, só a ordem de leitura é que some.`)) aoRemover();
        }}>
          <Trash2 size={14} /> Apagar lista
        </button>
      </>}
    >
      <h3 style={{ fontFamily: "var(--disp)", fontSize: 25, fontWeight: 700, margin: "0 0 4px", letterSpacing: "-.025em" }}>
        {lista.nome}
      </h3>
      <p className="autor" style={{ margin: "0 0 14px" }}>
        {membros.length} {membros.length === 1 ? "item" : "itens"} nesta ordem
      </p>
      {lista.notas && <div className="notas" style={{ marginBottom: 16 }}>{lista.notas}</div>}

      <div className="secao" style={{ marginTop: 0, paddingTop: 0, borderTop: "none" }}>
        <p className="secao-tit">Ordem de leitura</p>
        {membros.length === 0 ? (
          <p className="dica">Ainda sem itens. Use a busca abaixo para montar a sequência.</p>
        ) : (
          <div className="ordem-lista">
            {membros.map((m, i) => (
              <div className="ordem-item" key={m.id}>
                <span className="ordem-pos">{i + 1}</span>
                <button className="ordem-capa" onClick={() => aoAbrirItem(m)} title={m.titulo} style={{ padding: 0, border: "none" }}>
                  <Capa item={m} src={capaDe(m)} />
                </button>
                <div className="ordem-nome">
                  <b>{m.titulo}</b>
                  <small>{[m.editora, m.volume != null ? `vol. ${m.volume}` : ""].filter(Boolean).join(" · ")}</small>
                </div>
                {m.lista === "estante" && m.leitura && m.leitura !== "nao_lido" && (
                  <span className="pt" style={{ background: (LEITURAS.find((l) => l.v === m.leitura) || {}).cor, flexShrink: 0 }} />
                )}
                <div className="ordem-acoes">
                  <button onClick={() => aoMover(i, -1)} disabled={i === 0} aria-label="Subir"><ChevronDown size={15} style={{ transform: "rotate(180deg)" }} /></button>
                  <button onClick={() => aoMover(i, 1)} disabled={i === membros.length - 1} aria-label="Descer"><ChevronDown size={15} /></button>
                  <button onClick={() => aoTirar(m.id)} aria-label="Tirar da lista"><X size={15} /></button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="secao">
        <p className="secao-tit"><Plus size={12} /> Adicionar à lista</p>
        <div className="busca" style={{ maxWidth: "100%" }}>
          <Search size={15} />
          <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por título, autor ou editora…" />
        </div>
        {candidatos.length > 0 && (
          <div className="col-res">
            {candidatos.map((i) => (
              <div className="lote-linha" key={i.id}>
                <div className="lote-capa"><Capa item={i} src={capaDe(i)} /></div>
                <div className="lote-nome">
                  <b>{i.titulo}</b>
                  <small>{[i.autor, i.editora, i.volume != null ? `vol. ${i.volume}` : ""].filter(Boolean).join(" · ")}</small>
                </div>
                <button className="btn btn-mini" onClick={() => { aoAdicionar(i.id); setBusca(""); }}><Plus size={13} /> Incluir</button>
              </div>
            ))}
          </div>
        )}
        {busca.trim() && candidatos.length === 0 && (
          <p className="dica" style={{ marginTop: 10 }}>Nada no acervo bate com esse termo.</p>
        )}
      </div>
    </Modal>
  );
}


const mesDe = (iso) => (iso || "").slice(0, 7);
const anoDe = (iso) => (iso || "").slice(0, 4);
const rotMes = (m) => {
  const [a, mm] = m.split("-");
  const nomes = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  return `${nomes[parseInt(mm, 10) - 1] || "?"}/${a.slice(2)}`;
};

const AGRUPAR = [
  { v: "tipo", rot: "Tipo", multi: false, chaves: (i) => [i.tipo || "—"] },
  { v: "editora", rot: "Editora", multi: false, chaves: (i) => [i.editora || "Sem editora"] },
  { v: "autor", rot: "Autor", multi: false, chaves: (i) => [i.autor || "Sem autor"] },
  { v: "genero", rot: "Gênero", multi: true, chaves: (i) => ((i.generos || []).length ? i.generos : ["Sem gênero"]) },
  { v: "colecao", rot: "Coleção", multi: true, chaves: (i, c) => ((i.colecoes || []).length ? i.colecoes.map(c) : ["Fora de coleções"]) },
  { v: "leitura", rot: "Status de leitura", multi: false, chaves: (i) => [rotLeitura(i.leitura)] },
  { v: "anoPub", rot: "Ano de publicação", multi: false, chaves: (i) => [i.ano || "—"] },
  { v: "anoAq", rot: "Ano de aquisição", multi: false, chaves: (i) => [anoDe(i.aquisicao) || "—"] },
  { v: "pais", rot: "País de origem", multi: true, chaves: (i) => {
      const p = [...new Set(originaisDe(i).map((o) => o.pais).filter(Boolean))];
      return p.length ? p : ["Não identificado"];
    } },
  { v: "serieOrig", rot: "Série original", multi: true, chaves: (i) => {
      const s = originaisDe(i).map((o) => o.serie).filter(Boolean);
      return s.length ? s : ["Não identificada"];
    } },
  { v: "nota", rot: "Avaliação", multi: false, chaves: (i) => [i.nota ? `${i.nota} de 5` : "Sem nota"] },
];

function Barras({ dados, formato, cor }) {
  const teto = Math.max(1, ...dados.map((d) => d.valor));
  if (!dados.length) return <p className="dica">Nada com os filtros atuais.</p>;
  return (
    <div className="barras">
      {dados.map((d) => (
        <div className="barra-l" key={d.rot}>
          <span className="barra-rot" title={d.rot}>{d.rot}</span>
          <span className="barra-t"><i style={{ width: `${(d.valor / teto) * 100}%`, background: cor }} /></span>
          <span className="barra-val">{formato ? formato(d) : d.valor}</span>
        </div>
      ))}
    </div>
  );
}

function Relatorios({ itens, colecoes, series, aoAbrirItem, aoIrParaSeries }) {
  const vazio = { de: "", ate: "", leDe: "", leAte: "", lista: "estante", tipo: "", editora: "", autor: "", genero: "", colecao: "", leitura: "", ano: "", texto: "" };
  const [f, setF] = useState(vazio);
  const [agruparPor, setAgruparPor] = useState("editora");
  const [ordenarPor, setOrdenarPor] = useState("itens");
  const [escala, setEscala] = useState("mes");

  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const nomeCol = useCallback(
    (id) => (colecoes.find((c) => c.id === id) || {}).nome || "Coleção removida",
    [colecoes]
  );

  const opcoes = useMemo(() => ({
    editoras: [...new Set(itens.map((i) => i.editora).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")),
    autores: [...new Set(itens.map((i) => i.autor).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")),
    generos: [...new Set(itens.flatMap((i) => i.generos || []))].sort((a, b) => a.localeCompare(b, "pt-BR")),
    anos: [...new Set(itens.map((i) => i.ano).filter(Boolean))].sort().reverse(),
  }), [itens]);

  const filtrados = useMemo(() => {
    const q = f.texto.trim().toLowerCase();
    return itens.filter((i) => {
      if (f.lista && i.lista !== f.lista) return false;
      if (f.de && (i.aquisicao || "") < f.de) return false;
      if (f.ate && (i.aquisicao || "9999") > f.ate) return false;
      if (f.leDe && (i.dataLeitura || "") < f.leDe) return false;
      if (f.leAte && (i.dataLeitura || "9999") > f.leAte) return false;
      if (f.tipo && i.tipo !== f.tipo) return false;
      if (f.editora && i.editora !== f.editora) return false;
      if (f.autor && i.autor !== f.autor) return false;
      if (f.genero && !(i.generos || []).includes(f.genero)) return false;
      if (f.colecao === "__sem__" && (i.colecoes || []).length) return false;
      if (f.colecao && f.colecao !== "__sem__" && !(i.colecoes || []).includes(f.colecao)) return false;
      if (f.leitura && (i.leitura || "nao_lido") !== f.leitura) return false;
      if (f.ano && i.ano !== f.ano) return false;
      if (q && ![i.titulo, i.autor, i.editora, i.notas].some((c) => (c || "").toLowerCase().includes(q))) return false;
      return true;
    });
  }, [itens, f]);

  const resumo = useMemo(() => {
    const inv = filtrados.reduce((s, i) => s + (i.precoPago || 0), 0);
    const comPreco = filtrados.filter((i) => i.precoPago != null).length;
    const cont = { lido: 0, lendo: 0, nao_lido: 0 };
    filtrados.forEach((i) => { cont[i.leitura || "nao_lido"] = (cont[i.leitura || "nao_lido"] || 0) + 1; });
    const n = filtrados.length || 1;
    return {
      total: filtrados.length,
      investido: inv,
      comPreco,
      medio: comPreco ? inv / comPreco : 0,
      paginas: filtrados.reduce((s, i) => s + (i.paginas || 0), 0),
      lido: cont.lido, lendo: cont.lendo, naoLido: cont.nao_lido,
      pLido: Math.round((cont.lido / n) * 100),
      pLendo: Math.round((cont.lendo / n) * 100),
      pNao: Math.round((cont.nao_lido / n) * 100),
    };
  }, [filtrados]);

  const grupos = useMemo(() => {
    const def = AGRUPAR.find((a) => a.v === agruparPor) || AGRUPAR[0];
    const m = new Map();
    for (const i of filtrados) {
      for (const k of def.chaves(i, nomeCol)) {
        if (!m.has(k)) m.set(k, { rot: k, itens: 0, valor: 0, lidos: 0 });
        const g = m.get(k);
        g.itens++;
        g.valor += i.precoPago || 0;
        if (i.leitura === "lido") g.lidos++;
      }
    }
    const arr = [...m.values()];
    arr.sort(ordenarPor === "valor" ? (a, b) => b.valor - a.valor : (a, b) => b.itens - a.itens);
    return { def, arr };
  }, [filtrados, agruparPor, ordenarPor, nomeCol]);

  const linha = useMemo(() => {
    const chave = escala === "mes" ? mesDe : anoDe;
    const m = new Map();
    const toca = (k, campo, v) => {
      if (!k) return;
      if (!m.has(k)) m.set(k, { k, compras: 0, gasto: 0, leituras: 0 });
      m.get(k)[campo] += v;
    };
    for (const i of filtrados) {
      toca(chave(i.aquisicao), "compras", 1);
      toca(chave(i.aquisicao), "gasto", i.precoPago || 0);
      if (i.leitura === "lido") toca(chave(i.dataLeitura), "leituras", 1);
    }
    return [...m.values()].sort((a, b) => a.k.localeCompare(b.k)).slice(-30);
  }, [filtrados, escala]);

  const originais = useMemo(() => {
    const m = new Map();
    for (const i of filtrados) {
      for (const o of originaisDe(i)) {
        if (!m.has(o.serie)) m.set(o.serie, { serie: o.serie, editora: o.editora, pais: o.pais, nums: new Set(), itens: [] });
        const g = m.get(o.serie);
        if (!g.itens.includes(i)) g.itens.push(i);
        (o.numeros || []).forEach((n) => g.nums.add(n));
      }
    }
    /* O tamanho vem da numeração corrida, não do maior número: com a DC One
       Million, uma edição #1000000 fazia a série "ter" um milhão de edições
       e o relatório somava 18 milhões de faltantes. */
    return [...m.values()]
      .map((g) => {
        const { sequencia } = separarNumeracao([...g.nums]);
        return {
          ...g,
          max: sequencia.length ? Math.max(...sequencia) : 0,
          naSequencia: sequencia.length,
        };
      })
      .sort((a, b) => b.nums.size - a.nums.size);
  }, [filtrados]);

  /* Resumo enxuto para o relatório: a lista completa e navegável vive na
     aba Séries. Aqui interessa o panorama do recorte filtrado. */
  /* Usa exatamente a mesma conta da aba Séries, em vez de deduzir a faixa
     pelo maior número encontrado. Duas contas para a mesma pergunta davam
     respostas diferentes — e a de cá estava errada. */
  const resumoSeries = useMemo(() => {
    const idsNoRecorte = new Set(filtrados.map((i) => i.id));
    const noRecorte = (series || []).filter((se) => se.itens.some((i) => idsNoRecorte.has(i.id)));
    const comFalta = noRecorte.map((se) => ({
      serie: se.nome,
      editora: se.editora,
      pais: se.pais,
      nums: se.tenho,
      itens: se.itens,
      max: se.total,
      faltam: se.total > 0 ? se.faltam.length : -1,
    }));
    return {
      total: comFalta.length,
      completas: comFalta.filter((g) => g.faltam === 0).length,
      comLacuna: comFalta.filter((g) => g.faltam > 0).length,
      faltando: comFalta.reduce((n, g) => n + Math.max(0, g.faltam), 0),
      destaque: [...comFalta]
        .sort((a, b) => {
          const fa = a.faltam < 0 ? Infinity : a.faltam;
          const fb = b.faltam < 0 ? Infinity : b.faltam;
          if (fa !== fb) return fa - fb;
          return a.serie.localeCompare(b.serie, "pt-BR");
        })
        .slice(0, 8),
    };
  }, [series, filtrados]);

  const baixarCsv = () => {
    const cab = ["Título", "Volume", "Tipo", "Autor", "Editora", "Ano", "Páginas", "ISBN", "Coleções", "Gêneros", "Leitura", "Terminei em", "Aquisição", "Preço pago", "Nota", "Série original", "Edições originais", "País"];
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const linhas = filtrados.map((i) => [
      i.titulo, i.volume ?? "", i.tipo, i.autor, i.editora, i.ano, i.paginas ?? "", i.isbn,
      (i.colecoes || []).map(nomeCol).join(" / "), (i.generos || []).join(" / "),
      rotLeitura(i.leitura), i.dataLeitura, i.aquisicao,
      i.precoPago != null ? String(i.precoPago).replace(".", ",") : "",
      i.nota || "",
      originaisDe(i).map((o) => o.serie).join(" / "),
      originaisDe(i).map((o) => (o.edicoesTexto ? `${o.serie} ${o.edicoesTexto}` : o.serie)).join(" / "),
      [...new Set(originaisDe(i).map((o) => o.pais).filter(Boolean))].join(" / "),
    ].map(esc).join(";"));
    const blob = new Blob(["\uFEFF" + [cab.map(esc).join(";"), ...linhas].join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `acervo-relatorio-${hoje()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const tetoTempo = Math.max(1, ...linha.map((l) => Math.max(l.compras, l.leituras)));
  const tetoGasto = Math.max(1, ...linha.map((l) => l.gasto));

  return (
    <div className="rel">
      {/* filtros */}
      <div className="rel-bloco">
        <p className="secao-tit">
          <ListFilter size={12} /> Recorte
          <button className="btn btn-mini" style={{ marginLeft: "auto" }} onClick={() => setF(vazio)}>
            <X size={12} /> Limpar
          </button>
          <button className="btn btn-mini" onClick={baixarCsv} disabled={!filtrados.length}>
            <Download size={12} /> CSV
          </button>
        </p>
        <div className="rel-filtros">
          <div className="campo">
            <label>Lista</label>
            <select value={f.lista} onChange={(e) => set("lista", e.target.value)}>
              <option value="estante">Estante</option>
              <option value="desejos">Lista de desejos</option>
              <option value="">Tudo</option>
            </select>
          </div>
          <div className="campo"><label>Comprado a partir de</label><input type="date" value={f.de} onChange={(e) => set("de", e.target.value)} /></div>
          <div className="campo"><label>Comprado até</label><input type="date" value={f.ate} onChange={(e) => set("ate", e.target.value)} /></div>
          <div className="campo"><label>Lido a partir de</label><input type="date" value={f.leDe} onChange={(e) => set("leDe", e.target.value)} /></div>
          <div className="campo"><label>Lido até</label><input type="date" value={f.leAte} onChange={(e) => set("leAte", e.target.value)} /></div>
          <div className="campo">
            <label>Leitura</label>
            <select value={f.leitura} onChange={(e) => set("leitura", e.target.value)}>
              <option value="">Qualquer</option>
              {LEITURAS.map((l) => <option key={l.v} value={l.v}>{l.rot}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Tipo</label>
            <select value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>
              <option value="">Todos</option>{TIPOS.map((t) => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Editora</label>
            <select value={f.editora} onChange={(e) => set("editora", e.target.value)}>
              <option value="">Todas</option>{opcoes.editoras.map((t) => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Autor</label>
            <select value={f.autor} onChange={(e) => set("autor", e.target.value)}>
              <option value="">Todos</option>{opcoes.autores.map((t) => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Gênero</label>
            <select value={f.genero} onChange={(e) => set("genero", e.target.value)}>
              <option value="">Todos</option>{opcoes.generos.map((t) => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Coleção</label>
            <select value={f.colecao} onChange={(e) => set("colecao", e.target.value)}>
              <option value="">Todas</option>
              <option value="__sem__">Fora de coleções</option>
              {colecoes.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Ano de publicação</label>
            <select value={f.ano} onChange={(e) => set("ano", e.target.value)}>
              <option value="">Todos</option>{opcoes.anos.map((t) => <option key={t}>{t}</option>)}
            </select>
          </div>
          <div className="campo">
            <label>Busca livre</label>
            <input value={f.texto} onChange={(e) => set("texto", e.target.value)} placeholder="título, autor, notas…" />
          </div>
        </div>
      </div>

      {/* números */}
      <div className="rel-cartoes">
        <div className="cartao"><b>{resumo.total}</b><small>itens no recorte</small></div>
        <div className="cartao"><b className="am">{brl(resumo.investido)}</b><small>investido</small></div>
        <div className="cartao"><b>{brl(resumo.medio)}</b><small>média por item · {resumo.comPreco} com preço</small></div>
        <div className="cartao"><b>{resumo.paginas.toLocaleString("pt-BR")}</b><small>páginas</small></div>
      </div>

      <div className="rel-bloco">
        <p className="secao-tit"><BookOpen size={12} /> Leitura</p>
        <div className="pilha-leitura">
          <i style={{ width: `${resumo.pLido}%`, background: "var(--amarelo)" }} title={`Lidos: ${resumo.lido}`} />
          <i style={{ width: `${resumo.pLendo}%`, background: "var(--ciano)" }} title={`Lendo: ${resumo.lendo}`} />
          <i style={{ width: `${resumo.pNao}%`, background: "var(--tinta4)" }} title={`Não lidos: ${resumo.naoLido}`} />
        </div>
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginTop: 10 }}>
          <span className="legenda-cor"><span className="pt" style={{ background: "var(--amarelo)" }} />Lidos <b>{resumo.lido}</b> ({resumo.pLido}%)</span>
          <span className="legenda-cor"><span className="pt" style={{ background: "var(--ciano)" }} />Lendo <b>{resumo.lendo}</b> ({resumo.pLendo}%)</span>
          <span className="legenda-cor"><span className="pt" style={{ background: "var(--tinta4)" }} />Não lidos <b>{resumo.naoLido}</b> ({resumo.pNao}%)</span>
        </div>
      </div>

      {/* recorte livre */}
      <div className="rel-bloco">
        <p className="secao-tit">
          <BarChart3 size={12} /> Distribuição
          <span style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <span className="sel">
              <select value={agruparPor} onChange={(e) => setAgruparPor(e.target.value)} aria-label="Agrupar por">
                {AGRUPAR.map((a) => <option key={a.v} value={a.v}>{a.rot}</option>)}
              </select>
              <ChevronDown size={13} />
            </span>
            <span className="sel">
              <select value={ordenarPor} onChange={(e) => setOrdenarPor(e.target.value)} aria-label="Ordenar por">
                <option value="itens">Por quantidade</option>
                <option value="valor">Por valor investido</option>
              </select>
              <ChevronDown size={13} />
            </span>
          </span>
        </p>
        <Barras
          dados={grupos.arr.slice(0, 15).map((g) => ({ rot: g.rot, valor: ordenarPor === "valor" ? g.valor : g.itens, g }))}
          cor={ordenarPor === "valor" ? "var(--ciano)" : "var(--amarelo)"}
          formato={(d) => (ordenarPor === "valor" ? brl(d.g.valor) : `${d.g.itens} · ${brl(d.g.valor)}`)}
        />
        {grupos.def.multi && (
          <p className="dica" style={{ marginTop: 10 }}>
            Um item pode entrar em mais de um grupo aqui, então a soma passa do total do recorte.
          </p>
        )}
        {grupos.arr.length > 15 && <p className="dica" style={{ marginTop: 8 }}>Mostrando os 15 primeiros de {grupos.arr.length}.</p>}
      </div>

      {/* evolução */}
      <div className="rel-bloco">
        <p className="secao-tit">
          <TrendingUp size={12} /> Evolução
          <span className="sel" style={{ marginLeft: "auto" }}>
            <select value={escala} onChange={(e) => setEscala(e.target.value)} aria-label="Escala">
              <option value="mes">Por mês</option>
              <option value="ano">Por ano</option>
            </select>
            <ChevronDown size={13} />
          </span>
        </p>
        {linha.length ? (
          <>
            <div className="tempo">
              {linha.map((l) => (
                <div className="col" key={l.k} title={`${l.k}: ${l.compras} compra(s), ${l.leituras} leitura(s), ${brl(l.gasto)}`}>
                  <i style={{ height: `${(l.leituras / tetoTempo) * 100}%`, background: "var(--ciano)" }} />
                  <i style={{ height: `${(l.compras / tetoTempo) * 100}%`, background: "var(--amarelo)" }} />
                </div>
              ))}
            </div>
            <div className="tempo-rot">
              {linha.map((l) => <span key={l.k}>{escala === "mes" ? rotMes(l.k) : l.k}</span>)}
            </div>
            <div style={{ display: "flex", gap: 18, marginTop: 12, flexWrap: "wrap" }}>
              <span className="legenda-cor"><span className="pt" style={{ background: "var(--amarelo)" }} />Aquisições</span>
              <span className="legenda-cor"><span className="pt" style={{ background: "var(--ciano)" }} />Leituras concluídas</span>
            </div>
            <div className="tempo" style={{ height: 70, marginTop: 18 }}>
              {linha.map((l) => (
                <div className="col" key={l.k} title={`${l.k}: ${brl(l.gasto)}`}>
                  <i style={{ height: `${(l.gasto / tetoGasto) * 100}%`, background: "var(--magenta)", opacity: 0.75 }} />
                </div>
              ))}
            </div>
            <div className="tempo-rot"><span>gasto por período — pico de {brl(tetoGasto)}</span></div>
          </>
        ) : (
          <p className="dica">Sem datas de aquisição no recorte. Preencha a data de compra dos itens para ver a linha do tempo.</p>
        )}
      </div>

      {/* séries originais */}
      <div className="rel-bloco">
        <p className="secao-tit">
          <Globe size={12} /> Séries originais e lacunas
          {aoIrParaSeries && (
            <button className="btn btn-mini" style={{ marginLeft: "auto" }} onClick={aoIrParaSeries}>
              Abrir aba Séries
            </button>
          )}
        </p>
        {originais.length ? (
          <>
            <div className="painel" style={{ padding: "4px 0 14px" }}>
              <div className="stat"><b>{resumoSeries.total}</b><small>séries no recorte</small></div>
              <div className="stat ok"><b>{resumoSeries.completas}</b><small>completas</small></div>
              <div className="stat falta"><b>{resumoSeries.comLacuna}</b><small>com lacunas</small></div>
              <div className="stat falta"><b>{resumoSeries.faltando}</b><small>edições faltando</small></div>
            </div>

            <p className="dica" style={{ margin: "0 0 10px" }}>
              As {resumoSeries.destaque.length} mais perto de fechar. A lista completa, com o mapa edição
              por edição, fica na aba Séries.
            </p>

            <div className="orig-resumo">
              {resumoSeries.destaque.map((g) => (
                <div className="orig-linha" key={g.serie}>
                  <div className="orig-linha-txt">
                    <b>{g.serie}</b>
                    <span>{[g.editora, g.pais].filter(Boolean).join(" · ")}</span>
                  </div>
                  <div className="orig-linha-barra">
                    {g.max > 1 && <Lombadas total={g.max} tenho={g.nums} />}
                  </div>
                  <span className={`orig-linha-num ${g.faltam === 0 ? "ok" : ""}`}>
                    {g.max > 0
                      ? (g.faltam === 0 ? `completa · ${g.max}` : `${g.nums.size}/${g.max} · faltam ${g.faltam}`)
                      : `${g.itens.length} volume(s), sem numeração`}
                  </span>
                </div>
              ))}
            </div>

            {originais.length > resumoSeries.destaque.length && aoIrParaSeries && (
              <button className="btn btn-mini" style={{ marginTop: 12 }} onClick={aoIrParaSeries}>
                <Globe size={13} /> Ver as outras {originais.length - resumoSeries.destaque.length} na aba Séries
              </button>
            )}
          </>
        ) : (
          <p className="dica">
            Nenhuma publicação original preenchida no recorte. Abra um item, vá em Editar e preencha a
            seção “Publicação original” — a série e as edições que aquele volume compila.
          </p>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('raiz')).render(<Acervo />);
</script>

</body>
</html>
