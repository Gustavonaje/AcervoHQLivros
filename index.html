/* ══════════════════════════════════════════════════════════════
   ESTILO — tinta de impressão sobre papel-jornal.
   A paleta vem da quadricromia (ciano / magenta / amarelo) e cada
   cor carrega um significado: ciano = desejo, magenta = falta,
   amarelo = completo.
   ══════════════════════════════════════════════════════════════ */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');

.acv{
  --tinta:#141120; --tinta2:#1C1830; --tinta3:#262038; --tinta4:#332C4A;
  --linha:#372F52;
  --papel:#EFE9DE; --papel2:#A79FBC; --papel3:#6F6889;
  --ciano:#31BBD9; --magenta:#E5487F; --amarelo:#F2B33D; --verde:#4FC98B; --vermelho:#F04438;
  --disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --corpo:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  background:var(--tinta); color:var(--papel); font-family:var(--corpo);
  min-height:100vh; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.acv *{box-sizing:border-box;}
:where(.acv button){font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
:where(.acv input,.acv textarea,.acv select){font-family:inherit;font-size:14px;}
.acv :focus-visible{outline:2px solid var(--ciano);outline-offset:2px;border-radius:4px;}

/* ---------- cabeçalho ---------- */
.acv-topo{
  position:sticky;top:0;z-index:30;background:rgba(20,17,32,.92);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--linha);
}
.topo-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.marca{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
.marca h1{
  font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.03em;
  margin:0;line-height:1;
  background:linear-gradient(96deg,var(--papel) 30%,var(--amarelo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.marca span{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--papel3);}

.busca{position:relative;flex:1 1 240px;max-width:380px;}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--papel3);}
.busca input{
  width:100%;padding:9px 12px 9px 34px;border-radius:9px;
  background:var(--tinta2);border:1px solid var(--linha);color:var(--papel);
}
.busca input::placeholder{color:var(--papel3);}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;
  font-size:13.5px;font-weight:600;transition:.16s;white-space:nowrap;
  border:1px solid var(--linha);background:var(--tinta2);color:var(--papel);
}
.btn:hover{background:var(--tinta3);border-color:var(--tinta4);}
.btn-primario{background:var(--amarelo);color:#241B05;border-color:var(--amarelo);}
.btn-primario:hover{background:#ffc65a;border-color:#ffc65a;}
.btn-perigo{color:var(--magenta);}
.btn-perigo:hover{background:rgba(229,72,127,.13);border-color:var(--magenta);}
.btn-mini{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn-icone{padding:9px;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- painel de números ---------- */
.painel{max-width:1400px;margin:0 auto;padding:22px 20px 4px;display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat b{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1;}
.stat small{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--papel3);}
.stat.ok b{color:var(--amarelo);} .stat.falta b{color:var(--magenta);} .stat.desejo b{color:var(--ciano);}

/* ---------- abas e filtros ---------- */
.barra{max-width:1400px;margin:0 auto;padding:16px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.abas{display:flex;gap:4px;background:var(--tinta2);padding:4px;border-radius:11px;border:1px solid var(--linha);}
.aba{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--papel2);transition:.16s;}
.aba:hover{color:var(--papel);}
.aba.ativa{background:var(--tinta4);color:var(--papel);}
.aba .cont{font-family:var(--mono);font-size:11px;color:var(--papel3);}
.aba.ativa .cont{color:var(--amarelo);}

.sel{position:relative;display:inline-flex;align-items:center;}
.sel select{
  appearance:none;padding:8px 30px 8px 12px;border-radius:9px;background:var(--tinta2);
  border:1px solid var(--linha);color:var(--papel);font-size:13px;cursor:pointer;max-width:190px;
}
.sel svg{position:absolute;right:9px;pointer-events:none;color:var(--papel3);}

.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--linha);color:var(--papel2);background:transparent;transition:.16s;
}
.chip:hover{border-color:var(--tinta4);color:var(--papel);}
.chip.ativo{background:var(--papel);color:var(--tinta);border-color:var(--papel);}

/* ---------- grade de capas ---------- */
.grade{
  max-width:1400px;margin:0 auto;padding:8px 20px 90px;
  display:grid;gap:26px 18px;
  grid-template-columns:repeat(auto-fill,minmax(138px,1fr));
}
@media(min-width:900px){.grade{grid-template-columns:repeat(auto-fill,minmax(166px,1fr));}}

.card{text-align:left;display:flex;flex-direction:column;gap:9px;animation:surge .4s ease both;}
.card.selecionado .card-capa{outline:2px solid var(--ciano);outline-offset:2px;}
.marca-sel{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:6px;
  background:rgba(20,17,32,.8);border:1.5px solid var(--papel3);display:flex;align-items:center;
  justify-content:center;color:var(--tinta);z-index:2;}
.marca-sel.on{background:var(--ciano);border-color:var(--ciano);}
.barra-selecao{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 14px;
  padding:11px 14px;background:var(--tinta3);border:1px solid var(--ciano);border-radius:10px;}
.barra-selecao .contagem{color:var(--papel);font-weight:600;font-family:var(--corpo);font-size:13px;}
@keyframes surge{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.card-capa{
  position:relative;aspect-ratio:2/3;border-radius:5px;overflow:hidden;
  background:var(--tinta2);border:1px solid var(--linha);
  box-shadow:0 8px 22px -12px rgba(0,0,0,.9);transition:.22s cubic-bezier(.2,.8,.3,1);
}
.card:hover .card-capa{transform:translateY(-6px);box-shadow:0 20px 34px -16px rgba(0,0,0,.95);border-color:var(--tinta4);}
.card-capa img{width:100%;height:100%;object-fit:cover;display:block;}
.capa-vazia{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;gap:6px;}
.capa-vazia b{font-family:var(--disp);font-size:15px;font-weight:700;line-height:1.15;letter-spacing:-.02em;}
.capa-vazia small{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;}
.capa-vinco{position:absolute;inset:0;box-shadow:inset 7px 0 14px -10px rgba(0,0,0,.95),inset -1px 0 0 rgba(255,255,255,.05);pointer-events:none;}

.selo{
  position:absolute;top:7px;right:7px;padding:3px 8px;border-radius:20px;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  backdrop-filter:blur(6px);
}
.selo.ok{background:rgba(242,179,61,.92);color:#2A1E02;}
.selo.falta{background:rgba(229,72,127,.92);color:#fff;}
.selo.desejo{background:rgba(49,187,217,.92);color:#04222A;}
.selo.vol{top:auto;bottom:7px;left:7px;right:auto;background:rgba(20,17,32,.88);color:var(--papel);border:1px solid var(--linha);}
.selo.tema{background:rgba(167,159,188,.9);color:#1A1526;}
.card-capa.pilha{
  box-shadow:-5px 0 0 -1px var(--tinta3),-5px 0 0 0 var(--linha),
             -10px 0 0 -2px var(--tinta2),-10px 0 0 -1px var(--linha),
             0 8px 22px -12px rgba(0,0,0,.9);
  margin-left:10px;
}
.card:hover .card-capa.pilha{
  box-shadow:-7px 0 0 -1px var(--tinta3),-7px 0 0 0 var(--tinta4),
             -14px 0 0 -2px var(--tinta2),-14px 0 0 -1px var(--tinta4),
             0 20px 34px -16px rgba(0,0,0,.95);
}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;margin-top:12px;}
.slot{aspect-ratio:2/3;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--linha);
  background:var(--tinta);transition:.16s;display:flex;align-items:center;justify-content:center;}
.slot:hover{transform:translateY(-3px);border-color:var(--tinta4);}
.slot img{width:100%;height:100%;object-fit:cover;}
.slot.lacuna{border-style:dashed;border-color:var(--magenta);opacity:.75;flex-direction:column;gap:4px;}
.slot.lacuna:hover{opacity:1;background:rgba(229,72,127,.08);}
.slot.lacuna b{font-family:var(--mono);font-size:15px;color:var(--magenta);}
.slot.lacuna small{font-size:8.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--papel3);}
.slot-num{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;background:linear-gradient(transparent,rgba(10,8,16,.92));
  font-family:var(--mono);font-size:10px;text-align:center;}
.total-linha{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-radius:11px;
  background:var(--tinta);border:1px solid var(--linha);margin:14px 0;}
.total-linha label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--papel3);}
.total-linha input{width:84px;padding:7px 10px;border-radius:8px;background:var(--tinta2);border:1px solid var(--linha);
  color:var(--papel);font-family:var(--mono);font-size:15px;text-align:center;}
.total-linha.pedindo{border-color:rgba(242,179,61,.45);background:rgba(242,179,61,.07);}
.total-linha.pedindo input{border-color:rgba(242,179,61,.5);}
.total-linha .dica{flex:1 1 190px;}
.col-ajuste{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0 14px;
  padding:12px 14px;background:var(--tinta);border:1px solid var(--linha);border-radius:11px;}
.col-total{display:flex;align-items:center;gap:9px;margin-left:auto;}
.col-total span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--papel3);}
.col-total input{width:78px;padding:7px 9px;border-radius:8px;background:var(--tinta2);
  border:1px solid var(--linha);color:var(--papel);font-family:var(--mono);text-align:center;}
.col-total input:focus{border-color:var(--amarelo);}
.col-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.col-res{max-height:220px;overflow-y:auto;border:1px solid var(--linha);border-radius:9px;margin-top:10px;}
.selo.alvo{left:7px;right:auto;background:rgba(20,17,32,.85);color:var(--ciano);border:1px solid var(--ciano);}

/* ---------- listas de leitura ---------- */
.card-lista{aspect-ratio:2/3;border-radius:5px;border:1px solid var(--linha);background:
  linear-gradient(150deg,var(--tinta3),var(--tinta2));display:flex;flex-direction:column;
  justify-content:space-between;padding:14px 12px;position:relative;overflow:hidden;}
.card-lista .pilha-capas{display:flex;margin-bottom:auto;}
.card-lista .pilha-capas > div{width:38%;aspect-ratio:2/3;border-radius:3px;overflow:hidden;
  border:1px solid var(--linha);margin-left:-14%;box-shadow:2px 0 6px rgba(0,0,0,.4);background:var(--tinta);}
.card-lista .pilha-capas > div img{width:100%;height:100%;object-fit:cover;display:block;}
.card-lista .pilha-capas > div:first-child{margin-left:0;}
.card-lista .pilha-capas.unica{margin-bottom:0;flex:1;align-items:flex-end;}
.card-lista .pilha-capas.unica > div{width:100%;margin-left:0;box-shadow:none;}
.card-lista .num-ordem{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--tinta4);
  position:absolute;top:8px;right:10px;line-height:1;}
.ordem-lista{display:flex;flex-direction:column;gap:8px;}
.ordem-item{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:10px;
  background:var(--tinta);border:1px solid var(--linha);}
.ordem-pos{font-family:var(--mono);font-size:13px;color:var(--papel3);width:22px;text-align:center;flex-shrink:0;}
.ordem-capa{width:36px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;flex-shrink:0;background:var(--tinta3);}
.ordem-capa img{width:100%;height:100%;object-fit:cover;display:block;}
.ordem-nome{flex:1;min-width:0;}
.ordem-nome b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ordem-nome small{font-family:var(--mono);font-size:10.5px;color:var(--papel3);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.ordem-acoes{display:flex;gap:3px;flex-shrink:0;}
.ordem-acoes button{padding:5px;border-radius:6px;color:var(--papel3);}
.ordem-acoes button:hover:not(:disabled){background:var(--tinta3);color:var(--papel);}
.ordem-acoes button:disabled{opacity:.25;cursor:default;}

.card-titulo{font-family:var(--disp);font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-sub{font-family:var(--mono);font-size:10px;color:var(--papel3);text-transform:uppercase;letter-spacing:.07em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- lombadas: a assinatura da interface ---------- */
.lombadas{display:flex;gap:2px;align-items:flex-end;height:13px;}
.lomb{flex:1 1 0;min-width:2px;max-width:9px;height:100%;border-radius:1px;transition:.15s;}
.lomb.cheia{background:var(--amarelo);}
.lomb.vazia{background:transparent;border:1px dashed var(--magenta);opacity:.55;height:70%;}
.lomb.desejo{background:var(--ciano);opacity:.35;}
.prog{height:5px;border-radius:3px;background:var(--tinta3);overflow:hidden;}
.prog i{display:block;height:100%;background:var(--amarelo);}
.lomb-legenda{font-family:var(--mono);font-size:9.5px;color:var(--papel3);letter-spacing:.05em;}

/* ---------- estado vazio ---------- */
.vazio{grid-column:1/-1;padding:80px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.vazio h3{font-family:var(--disp);font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em;}
.vazio p{color:var(--papel2);max-width:420px;margin:0;font-size:14px;}

/* ---------- modal ---------- */
.fundo{position:fixed;inset:0;background:rgba(8,6,14,.82);backdrop-filter:blur(6px);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:860px;background:var(--tinta2);border:1px solid var(--linha);border-radius:16px;
  overflow:hidden;animation:sobe .24s cubic-bezier(.2,.8,.3,1) both;margin:auto;}
@keyframes sobe{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
.modal-topo{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--linha);
  position:sticky;top:0;background:var(--tinta2);z-index:2;}
.modal-topo h2{font-family:var(--disp);font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;margin-right:auto;}
.modal-corpo{padding:20px;}
.nav-item{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1px solid var(--linha);}
.nav-item button{padding:5px;border-radius:7px;color:var(--papel3);}
.nav-item button:hover:not(:disabled){background:var(--tinta3);color:var(--papel);}
.nav-item button:disabled{opacity:.25;cursor:default;}
.nav-item span{font-family:var(--mono);font-size:11.5px;color:var(--papel3);letter-spacing:.03em;min-width:64px;text-align:center;}
.modal-pe{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--linha);flex-wrap:wrap;align-items:center;}

/* ---------- formulário ---------- */
.grade-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.campo{display:flex;flex-direction:column;gap:6px;}
.campo.largo{grid-column:1/-1;}
.campo label{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--papel3);}
.campo input,.campo textarea,.campo select{
  padding:9px 11px;border-radius:8px;background:var(--tinta);border:1px solid var(--linha);color:var(--papel);width:100%;
}
.campo textarea{resize:vertical;min-height:76px;line-height:1.55;}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--tinta4);}
.dica{font-size:11.5px;color:var(--papel3);line-height:1.45;}
.rodape{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px 26px;
  margin-top:8px;border-top:1px solid var(--linha);font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;color:var(--papel3);}
.rod-marca{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:0;color:var(--papel2);}
.rod-data{color:var(--papel3);}
.rod-versao{padding:2px 7px;border-radius:4px;background:var(--tinta2);border:1px solid var(--linha);
  color:var(--papel2);}
.btn-ok{border-color:rgba(79,201,139,.45);color:var(--verde);}
.btn-icone.ligado{border-color:rgba(79,201,139,.5);color:var(--verde);}
.rod-arquivo{padding:2px 8px;border-radius:4px;background:rgba(79,201,139,.14);color:var(--verde);
  border:1px solid rgba(79,201,139,.3);}
.rod-arquivo.ruim{background:rgba(240,68,56,.14);color:var(--vermelho);border-color:rgba(240,68,56,.4);}
.rod-nums{margin-left:auto;}
@media (max-width:640px){ .rod-nums{margin-left:0;width:100%;} }

/* ── ajustes de celular ──────────────────────────────────────
   O app nasceu para tela grande; hospedado, passou a ser usado no
   telefone de verdade. */
@media (max-width:760px){
  .acv{padding:8px 10px 28px;}

  /* O cabeçalho deixa de grudar: ele ocupava um terço da tela e o conteúdo
     ficava espremido. Quem gruda são as abas, que é o que se usa o tempo
     todo. */
  .acv-topo{position:static;backdrop-filter:none;}
  .topo-in{padding:10px 12px;flex-wrap:wrap;gap:10px;}
  .topo-in .busca{order:3;width:100%;min-width:0;}
  .btn-icone{min-width:38px;min-height:38px;}

  /* As abas viram menu: sete destinos numa tira rolável nunca ficavam
     visíveis ao mesmo tempo. */
  .barra-cel{display:flex;gap:8px;position:sticky;top:0;z-index:40;
    padding:8px 0;background:rgba(20,17,32,.96);backdrop-filter:blur(12px);}
  .cel-menu{flex:1;justify-content:flex-start;min-height:42px;gap:9px;}
  .cel-menu b{font-size:14.5px;font-weight:600;}
  .cel-menu em{font-family:var(--mono);font-size:9px;font-style:normal;
    color:var(--papel3);padding:2px 6px;border-radius:4px;background:var(--tinta3);}
  .cel-filtro{min-height:42px;}
  .cel-filtro.ativo{border-color:var(--amarelo);color:var(--amarelo);}

  .gaveta-item.ativo{background:rgba(242,179,61,.12);color:var(--amarelo);}
  .gaveta-sub{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 8px 40px;}

  /* a barra de abas some; os filtros só aparecem quando você pede */
  .abas{display:none;}
  .barra{display:none;}
  .barra.cel-aberta{display:flex;flex-direction:column;align-items:stretch;
    gap:8px;padding:10px 0 14px;border-bottom:1px solid var(--linha);margin-bottom:8px;}
  .barra.cel-aberta > *{width:100%;}
  .barra.cel-aberta .chips{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
  .barra.cel-aberta .chips::-webkit-scrollbar{display:none;}
  .barra.cel-aberta .btn,.barra.cel-aberta .chip,.barra.cel-aberta .sel{min-height:40px;}
  .barra.cel-aberta .stat{display:none;}
  .contagem{display:none;}

  .grade{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}

  .modal{max-width:100%;width:100%;max-height:100%;height:100%;border-radius:0;}
  .modal-corpo{padding:14px;}
  .modal-pe{position:sticky;bottom:0;background:var(--tinta2);
    padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  .grade-form{grid-template-columns:1fr;}
  .campo.largo{grid-column:auto;}

  .lt,.mapa-anos{overflow-x:auto;}
  .lt-nome{width:104px;}
  .lt-eventos,.lt-rotulos,.lt-eras,.lt-regua{margin-left:104px;}
  .fx-barra{margin-left:86px;margin-right:46px;}
  .lt-conta{width:46px;}
  .ma-mes-grade{grid-template-columns:repeat(4,1fr);}

  .rodape{flex-direction:column;align-items:flex-start;gap:6px;padding:14px 0 20px;}
  .lote-topo{gap:6px;}
  .lt-escolha{grid-template-columns:1fr;max-height:260px;}
  .paginacao{flex-wrap:wrap;gap:6px;}
}

.contagem{font-family:var(--mono);font-size:11px;color:var(--papel3);letter-spacing:.03em;white-space:nowrap;}

/* ── cards da aba Séries ───────────────────────────────────── */
.card-serie{display:flex;flex-direction:column;gap:0;text-align:left;padding:0;overflow:hidden;}
.card-serie .card-capa{aspect-ratio:2/3;}
.serie-marca{position:relative;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;gap:8px;
  color:rgba(255,255,255,.85);}
.serie-marca span{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em;}
.serie-txt{padding:11px 12px 13px;display:flex;flex-direction:column;gap:5px;}
.serie-nome{font-weight:600;font-size:13.5px;line-height:1.25;color:var(--papel);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.serie-sub{font-family:var(--mono);font-size:10.5px;color:var(--papel3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.selo-tipo.palpite{background:rgba(167,159,188,.14);color:var(--papel3);}
/* ── linha do tempo ─────────────────────────────────────────── */
.lt{padding:4px 0 8px;}
.lt-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.lt-topo h2{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0;}
.lt-eras{position:relative;height:20px;margin-left:186px;margin-bottom:2px;}
.lt-era{position:absolute;top:0;height:18px;border-radius:3px;background:rgba(242,179,61,.1);
  border-left:1px solid rgba(242,179,61,.45);display:flex;align-items:center;overflow:hidden;}
.lt-era em{font-family:var(--mono);font-size:8px;font-style:normal;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amarelo);padding-left:5px;white-space:nowrap;}
.lt-regua{position:relative;height:16px;margin-left:186px;border-bottom:1px solid var(--linha);margin-bottom:10px;}
.lt-tick{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;
  color:var(--papel3);}
.lt-corpo{position:relative;}
.lt-eventos{position:absolute;left:186px;right:64px;top:0;bottom:0;pointer-events:none;}
.lt-evento{position:absolute;top:0;bottom:0;background:rgba(229,72,127,.1);border-left:1px solid var(--magenta);
  border-right:0;cursor:pointer;pointer-events:auto;padding:0;}
.lt-evento.proprio{background:rgba(49,187,217,.1);border-left-color:var(--ciano);}
.lt-evento{pointer-events:none;}

.lt-rotulos{position:relative;margin-left:186px;margin-right:64px;margin-bottom:2px;}
.lt-rot{position:absolute;background:none;border:none;padding:0 4px 0 3px;cursor:pointer;
  font-family:var(--mono);font-size:8px;line-height:12px;color:var(--magenta);white-space:nowrap;
  border-left:1px solid var(--magenta);}
.lt-rot.proprio{color:var(--ciano);border-left-color:var(--ciano);}
.lt-rot:hover{background:rgba(229,72,127,.16);color:var(--papel);}
.lt-faixa{display:flex;align-items:stretch;gap:0;min-height:34px;position:relative;}
.lt-faixa.aberta{background:rgba(255,255,255,.04);border-radius:6px;}
.lt-faixa.aberta .lt-nome b{color:var(--amarelo);}
.lt-nome{width:186px;flex-shrink:0;display:flex;align-items:center;gap:5px;background:none;border:none;
  cursor:pointer;padding:4px 8px 4px 0;text-align:left;color:var(--papel);}
.lt-nome b{font-size:12px;font-weight:600;line-height:1.15;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
/* "height:100%" só funciona quando a linha tem altura definida. Ao trocar
   a altura fixa por mínima para caber nome em duas linhas, a pista virou
   zero e as barras, que são absolutas, invadiram as faixas vizinhas. */
.lt-pista{position:relative;flex:1;align-self:stretch;min-height:34px;}
.lt-barra{position:absolute;top:50%;transform:translateY(-50%);height:14px;border-radius:3px;
  background:var(--tinta4);overflow:hidden;min-width:2px;}
.lt-barra i{position:absolute;top:0;height:100%;background:var(--ciano);border-radius:2px;}
.lt-conta{width:64px;flex-shrink:0;text-align:right;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;color:var(--papel3);padding:0;align-self:center;}
.lt-conta:hover{color:var(--ciano);}

.era-linha{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;}
.era-linha .btn-perigo{margin-bottom:2px;}

.lt-fases{margin:2px 0 10px 0;padding:6px 0 6px 18px;border-left:1px solid var(--linha);}

/* Fases numa barra só: cada trecho é um roteirista, a parte clara é o que
   você tem. O nome aparece dentro quando cabe; senão, fica na lista abaixo. */
/* a margem estava no lado errado — 186 à direita — e a barra das fases
   começava em cima da coluna de nomes, em vez de alinhada com as faixas */
/* 186 da coluna de nomes menos os 18 de recuo do bloco das fases: assim a
   barra fica exatamente sob a faixa da série a que pertence */
.fx-barra{position:relative;height:26px;margin:0 64px 8px 168px;background:var(--tinta3);border-radius:4px;}
/* faixa fina logo acima das fases: onde estão as suas edições, no tempo */
/* o que você tem: faixa clara na metade de baixo, sobre a cor da fase */
.fx-meu{position:absolute;bottom:0;height:9px;background:rgba(255,255,255,.88);border-radius:2px;
  min-width:2px;pointer-events:none;}
.fx{position:absolute;top:0;height:100%;overflow:hidden;border-radius:3px;
  border-right:1px solid var(--tinta);display:flex;align-items:center;}
.fx i{position:absolute;top:0;height:100%;border-radius:1px;}
.fx{cursor:pointer;}
.fx{opacity:1;}
.fx i{position:absolute;left:0;top:0;height:100%;border-radius:2px;}

.fx:hover{filter:brightness(1.4);z-index:3;}
.fx.sel{outline:2px solid var(--papel);outline-offset:-1px;z-index:4;filter:brightness(1.3);}

.fx-detalhe{padding:8px 11px;margin-top:2px;background:var(--tinta2);border:1px solid var(--linha);
  border-radius:8px;}
.fx-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fx-listas{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:7px;
  border-top:1px solid var(--linha);}
.fx-linha{font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--papel2);}
.fx-linha em{display:inline-block;min-width:44px;font-style:normal;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--papel3);}
.fx-linha.tem{color:var(--verde);}
.fx-linha.falta{color:var(--magenta);}
.fx-detalhe i{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.fx-detalhe b{font-size:13px;font-weight:600;}
.fx-num,.fx-per{font-family:var(--mono);font-size:10px;color:var(--papel3);}
.fx-cob{font-family:var(--mono);font-size:10px;color:var(--papel2);}
.fx-cob.cheia{color:var(--verde);}
.fx-cob.vazia{color:var(--papel3);opacity:.7;}
.fx-conv{font-size:10.5px;color:var(--papel3);font-style:italic;}
.lt-fase{display:flex;align-items:center;height:24px;}
.lt-fase-nome{width:168px;flex-shrink:0;padding-right:8px;font-size:11px;color:var(--papel2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.lt-barra.fase{height:10px;background:var(--tinta3);}
.lt-barra.fase i{background:var(--verde);}
.lt-fase .lt-conta{cursor:default;}
.lt-fase .lt-conta.cheia{color:var(--verde);}
.lt-fase .lt-conta.vazia{opacity:.45;}

.painel-lista{padding:4px 0 28px;}

/* ── mapa de edições no tempo ─────────────────────────────── */
.mapa-anos{padding:2px 0 8px;}
.ma-legenda{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.ma-legenda span{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  color:var(--papel2);}
.ma-legenda i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.ma-legenda b{color:var(--papel3);font-weight:400;font-size:9px;}

.ma-pista{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding-bottom:4px;}
.ma-ano{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
  padding:0 1.5px;cursor:pointer;flex-shrink:0;}
.ma-ano:hover .ma-bloco{outline:1px solid var(--papel3);outline-offset:2px;border-radius:2px;}
.ma-ano em{font-family:var(--mono);font-size:8.5px;font-style:normal;color:var(--papel3);height:12px;
  white-space:nowrap;}
.ma-ano em.fixo{color:var(--amarelo);font-weight:700;}
/* década ganha um risco: sem isso não dá para saber de que coluna o ano fala */
.ma-ano:nth-child(10n+1){border-left:1px solid var(--linha);}
.ma-ano.aberto .ma-bloco{outline:1.5px solid var(--amarelo);outline-offset:2px;border-radius:2px;}
.ma-ano.apagado{opacity:.35;}
.ma-ano.apagado:hover{opacity:.7;}
.ma-bloco{display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:1.4px;justify-content:flex-start;}
.ma-bloco.larga{width:100%;}
.mq{width:4px;height:4px;border-radius:1px;border:none;padding:0;cursor:pointer;flex-shrink:0;}
.mq:hover{outline:1.5px solid var(--papel);outline-offset:1px;z-index:2;}
.mq-capa{overflow:hidden;background:var(--tinta3);}
.mq-capa img{width:100%;height:100%;object-fit:cover;display:block;}

.ma-meses{margin-top:16px;border-top:1px solid var(--linha);padding-top:14px;}
.ma-meses-topo{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.ma-meses-topo b{font-family:var(--disp);font-size:20px;font-weight:700;}
/* No detalhe o mês vira coluna e cresce para baixo: doze colunas cabem na
   tela, e meses cheios alongam em vez de empurrar a rolagem lateral. */
.ma-mes-grade{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start;}
.ma-mes-grade.capas{grid-template-columns:repeat(auto-fit,minmax(92px,1fr));}
.ma-mes{display:flex;flex-direction:column;align-items:center;gap:3px;}
.ma-bloco.detalhe{flex-wrap:wrap;align-content:flex-start;justify-content:center;margin-top:2px;}
.ma-mes em{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--papel3);text-transform:uppercase;}
.ma-mes small{font-family:var(--mono);font-size:8.5px;color:var(--papel3);opacity:.7;}

.barra-prog{position:fixed;left:0;right:0;bottom:0;z-index:80;height:26px;background:var(--tinta2);
  border-top:1px solid var(--linha);display:flex;align-items:center;}
.barra-prog i{position:absolute;left:0;top:0;bottom:0;background:rgba(49,187,217,.18);transition:width .2s;}
.barra-prog span{position:relative;padding-left:14px;font-family:var(--mono);font-size:10px;color:var(--papel2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.rev-topo{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.rev-retrato{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--tinta3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--mono);font-size:17px;color:var(--papel3);}
.rev-retrato img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.rev-nome{font-family:var(--disp);font-size:20px;font-weight:700;margin:0;}
.rev-ops{display:flex;flex-direction:column;gap:6px;}
.rev-op{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;
  border:1px solid var(--linha);background:var(--tinta2);cursor:pointer;text-align:left;color:var(--papel);}
.rev-op:hover{border-color:var(--ciano);background:rgba(49,187,217,.08);}
.rev-op b{font-size:15px;font-weight:600;flex:1;}
.rev-op em{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--papel3);}

/* a barra do celular não existe no computador, onde tudo cabe na tela */
.barra-cel{display:none;}

/* gaveta que sobe de baixo: o menu de abas do celular */
.gaveta-fundo{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;}
.gaveta{width:100%;max-height:82vh;overflow-y:auto;background:var(--tinta2);
  border-top:1px solid var(--linha);border-radius:16px 16px 0 0;
  padding:8px 12px calc(16px + env(safe-area-inset-bottom));animation:sobe .18s ease;}
@keyframes sobe{from{transform:translateY(100%);}to{transform:none;}}
.gaveta-alca{display:block;width:38px;height:4px;border-radius:2px;background:var(--tinta4);
  margin:4px auto 12px;}
.gaveta-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 10px;
  background:none;border:none;color:var(--papel);font-size:15px;border-radius:9px;text-align:left;}
.gaveta-item:active{background:var(--tinta3);}
.gaveta-item b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--papel3);font-weight:400;}

.porta{position:fixed;inset:0;z-index:200;background:var(--tinta);display:flex;
  align-items:center;justify-content:center;padding:20px;}
.porta-caixa{width:100%;max-width:340px;}
.porta-marca{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 2px;
  background:linear-gradient(92deg,var(--ciano),var(--magenta) 55%,var(--amarelo));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.porta-btn{width:100%;justify-content:center;margin-top:14px;min-height:44px;}
.porta-sair{display:block;margin:12px auto 0;}

.cmp{border:1px solid var(--linha);border-radius:9px;overflow:hidden;}
.cmp-cab,.cmp-linha{display:grid;grid-template-columns:1fr 84px 84px;align-items:center;
  padding:7px 12px;font-size:13px;}
.cmp-cab{background:var(--tinta3);font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--papel3);}
.cmp-cab b,.cmp-linha b{text-align:right;font-family:var(--mono);}
.cmp-linha{border-top:1px solid var(--linha);}
.cmp-linha b.mais{color:var(--verde);}
.cmp-linha b.menos{color:var(--papel3);opacity:.6;}

.ponto-sit{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ponto-sit.publicando{background:var(--amarelo);}
.ponto-sit.encerrada{background:var(--verde);}
.ponto-sit.cancelada{background:var(--vermelho);}
.ponto-sit.semdado{background:var(--tinta4);border:1px solid var(--papel3);}

.selo-sit{position:absolute;bottom:6px;right:6px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid rgba(20,17,32,.8);box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.selo-sit.publicando{background:var(--amarelo);}
.selo-sit.encerrada{background:var(--verde);}
.selo-sit.cancelada{background:var(--vermelho);}
/* declaração desmentida pela data: verde, mas com anel para você saber que
   o app discordou da base */
.selo-sit.duvida{box-shadow:0 0 0 1px var(--amarelo),0 0 0 2px rgba(20,17,32,.8);}
.serie-marca{position:relative;}

.card-grupo{border-color:rgba(242,179,61,.28);}
.card-grupo.aberto{border-color:var(--amarelo);}
.card-capa{position:relative;}
.grupo-selo{position:absolute;top:7px;right:7px;z-index:2;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:rgba(20,17,32,.85);border:1px solid var(--amarelo);color:var(--amarelo);
  font-family:var(--mono);font-size:10px;line-height:18px;text-align:center;}
.selo-grupo{display:inline-block;margin-right:6px;padding:1px 5px;border-radius:3px;font-size:8px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(242,179,61,.16);
  color:var(--amarelo);vertical-align:middle;}
.grupo-pe{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;
  font-family:var(--mono);font-size:9px;color:var(--papel3);}
.grupo-pe span{display:inline-flex;align-items:center;gap:3px;}
.card-serie.no-grupo{border-left:2px solid rgba(242,179,61,.45);}

.lt-escolha{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;
  max-height:320px;overflow-y:auto;padding:10px;border:1px solid var(--linha);border-radius:10px;
  background:rgba(0,0,0,.16);margin:8px 0;}
.lt-op{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;border:1px solid transparent;
  background:none;cursor:pointer;text-align:left;color:var(--papel2);}
.lt-op i{width:13px;height:13px;border-radius:3px;border:1px solid var(--linha);flex-shrink:0;}
.lt-op.on{background:rgba(49,187,217,.1);border-color:rgba(49,187,217,.3);color:var(--papel);}
.lt-op.on i{background:var(--ciano);border-color:var(--ciano);}
.lt-op b{flex:1;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* o atributo title só aparece depois de um instante parado, que é o
   comportamento que você pediu */
[title]{cursor:inherit;}
.lt-op em{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--papel3);}
.lt-op small{font-family:var(--mono);font-size:8.5px;color:var(--papel3);min-width:46px;text-align:right;}

.selo-estreia.palpite{background:rgba(167,159,188,.14);color:var(--papel3);}
.selo-estreia{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:3px;font-family:var(--mono);
  font-size:9px;font-weight:700;background:rgba(49,187,217,.14);color:var(--ciano);vertical-align:middle;}

.selo-tipo{display:inline-block;margin-right:6px;padding:1px 5px;border-radius:3px;font-size:8px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(49,187,217,.15);
  color:var(--ciano);vertical-align:middle;}

.serie-cob{font-family:var(--mono);font-size:11px;color:var(--papel2);margin-top:2px;}
.serie-cob b{color:var(--papel);}
.serie-est{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:5px;
  border-radius:50%;background:var(--linha);color:var(--papel3);font-size:9px;vertical-align:middle;}
.serie-falta{font-family:var(--mono);font-size:10.5px;color:var(--magenta);letter-spacing:.02em;}
.serie-falta.ok{color:var(--amarelo);}
.serie-desejo{color:var(--papel3);}
.cont-chip{margin-left:6px;font-family:var(--mono);font-size:10px;opacity:.65;}

/* ── mapa por editora ─────────────────────────────────────── */
/* ponto-chave: losango na régua e veio vertical atravessando os mapas */
.mrc.chave{background:rgba(240,68,56,.18);color:var(--vermelho);}

.abas-origem{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.aba-origem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--linha);background:var(--tinta2);cursor:pointer;max-width:210px;text-align:left;}
.aba-origem b{font-size:12px;font-weight:600;color:var(--papel2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:186px;}
.aba-origem em{font-family:var(--mono);font-size:9px;font-style:normal;color:var(--papel3);}
.aba-origem:hover b{color:var(--papel);}
.aba-origem.ativa{border-color:var(--ciano);background:rgba(49,187,217,.1);}
.aba-origem.ativa b{color:var(--papel);}

.lista-eds-det{max-height:190px;overflow-y:auto;padding:8px;border:1px solid var(--linha);
  border-radius:8px;background:rgba(0,0,0,.16);margin-bottom:8px;}
.lista-eds-det .chip{font-family:var(--mono);font-size:10.5px;padding:3px 8px;}

.bloco-ficha{border:1px solid var(--linha);border-radius:10px;padding:12px 14px;margin-bottom:12px;
  background:rgba(255,255,255,.02);}
.elenco{display:flex;gap:12px;flex-wrap:wrap;}
.pers{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;background:none;border:none;
  padding:0;cursor:pointer;}
.card-pers{display:flex;flex-direction:column;gap:0;text-align:left;padding:0;overflow:hidden;}
.pers-retrato{aspect-ratio:1/1;background:var(--tinta2);display:flex;align-items:center;justify-content:center;
  overflow:hidden;}
.pers-retrato img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.pers-retrato span{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--papel3);}
.pers-retrato.grande{width:104px;height:104px;border-radius:50%;flex-shrink:0;border:2px solid var(--linha);}
.pers-retrato.grande span{font-size:24px;}
.card-pers .serie-txt{padding:10px 12px 12px;}

/* cartão do personagem: retrato à esquerda, ficha à direita */
.colar-wiki{margin-top:14px;padding-top:12px;border-top:1px solid var(--linha);}

.aviso-buraco{border-left:2px solid var(--amarelo);padding:7px 0 7px 11px;margin:10px 0 14px;}
.aviso-buraco b{color:var(--papel);}

.sugestoes{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.sug{background:var(--tinta2);border:1px solid var(--linha);border-radius:5px;padding:2px 7px;
  font-family:var(--mono);font-size:9.5px;color:var(--papel2);cursor:pointer;white-space:nowrap;}
.sug:hover{border-color:var(--ciano);color:var(--papel);}

.galeria-wiki{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;
  max-height:300px;overflow-y:auto;padding:10px;border:1px solid var(--linha);border-radius:10px;
  background:rgba(0,0,0,.18);margin-bottom:8px;}
.gal-item{position:relative;background:none;border:2px solid transparent;border-radius:8px;padding:0;
  cursor:pointer;overflow:hidden;aspect-ratio:3/4;}
.gal-item img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.gal-item em{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font-family:var(--mono);
  font-size:8px;font-style:normal;background:rgba(0,0,0,.6);color:var(--papel2);}
.gal-item:hover{border-color:var(--ciano);}
.gal-item.baixando{opacity:.4;}

.aparicoes{display:flex;flex-direction:column;gap:1px;}
.apar-serie{border-radius:6px;}
.apar-tit{display:flex;align-items:center;gap:7px;width:100%;background:none;border:none;cursor:pointer;
  padding:6px 8px;border-radius:6px;text-align:left;color:var(--papel);}
.apar-tit:hover{background:rgba(255,255,255,.04);}
.apar-tit b{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.apar-tit em{font-family:var(--mono);font-size:9.5px;font-style:normal;color:var(--papel3);white-space:nowrap;}

.pers-cartao{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.pers-cartao-foto{width:150px;flex-shrink:0;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
  background:var(--tinta2);border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;}
.pers-cartao-foto img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.pers-cartao-foto span{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--papel3);}
.pers-cartao-info{flex:1;min-width:240px;}
.pers-cartao-info h3{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px;}
.pers-sub{font-family:var(--mono);font-size:10.5px;color:var(--papel3);margin:0 0 14px;letter-spacing:.04em;}
.pers-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:0 0 14px;}
.pers-dados dt{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--papel3);margin-bottom:2px;}
.pers-dados dd{margin:0;font-size:13.5px;color:var(--papel);line-height:1.35;}
.pers-resumo{border-left:2px solid var(--ciano);padding:2px 0 2px 12px;}
.pers-resumo p{margin:0 0 7px;font-size:13.5px;line-height:1.55;color:var(--papel2);}
.pers-resumo-pe{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
@media (max-width:560px){
  .pers-cartao-foto{width:110px;}
  .pers-cartao-info h3{font-size:20px;}
}

.pers-face{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--tinta2);
  border:2px solid var(--linha);display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
.pers-face img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.pers-face span{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--papel3);}
.pers em{font-family:var(--corpo);font-size:9.5px;font-style:normal;color:var(--papel2);text-align:center;
  line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pers:hover .pers-face{border-color:var(--ciano);}
.pers:hover em{color:var(--papel);}

.pers-topo{display:flex;gap:16px;align-items:center;}
.pers-face.grande{width:92px;height:92px;border-width:3px;flex-shrink:0;}
.pers-face.grande span{font-size:26px;}

.capa-wiki{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;padding:10px;
  border:1px solid var(--linha);border-radius:10px;background:rgba(0,0,0,.16);}
.capa-wiki img{width:74px;border-radius:5px;display:block;flex-shrink:0;}
.capa-wiki > div{display:flex;flex-direction:column;gap:5px;}
.opcao{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--papel);cursor:pointer;}
.opcao input{accent-color:var(--ciano);width:15px;height:15px;cursor:pointer;}

.campo-auto{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:8px;
  border:1px dashed var(--linha);background:rgba(79,201,139,.06);}
.campo-auto b{font-family:var(--mono);font-size:12.5px;color:var(--verde);}
.campo-auto span{font-family:var(--mono);font-size:9px;color:var(--papel3);}

.lista-edicoes{margin-top:2px;}
.grade-edicoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;
  max-height:250px;overflow-y:auto;padding:10px;border:1px solid var(--linha);border-radius:9px;
  background:rgba(0,0,0,.16);margin-bottom:6px;}
.lin-edicao{display:flex;align-items:center;gap:7px;}
.num-ed{font-family:var(--mono);font-size:10.5px;color:var(--papel3);min-width:42px;text-align:right;}
.lin-edicao input{flex:1;min-width:0;padding:5px 8px;font-family:var(--mono);font-size:11px;border-radius:6px;
  border:1px solid var(--linha);background:var(--tinta2);color:var(--papel);}
.lin-edicao input.vazia{border-style:dashed;color:var(--papel3);}
.lin-edicao input:focus{border-color:var(--ciano);outline:none;}

.btn-mini-link{background:none;border:none;cursor:pointer;color:var(--ciano);font-family:var(--mono);
  font-size:9.5px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:4px;padding:0;margin-left:8px;
  text-transform:none;}
.btn-mini-link:hover{color:var(--papel);text-decoration:underline;}

.eds-regua,.eds-regua .ed-linha.eras .eds-pista,.ed-mosaico 
.ed-topo:hover 

/* o vão é a série inteira; as barras cheias são os volumes que você tem —
   o espaço entre elas é justamente o que falta */
.mrc{margin-left:7px;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;}
.mrc.lido{background:rgba(79,201,139,.16);color:var(--verde);}
.mrc.lendo{background:rgba(49,187,217,.16);color:var(--ciano);}
.mrc.parcial{background:rgba(49,187,217,.13);color:var(--ciano);}
/* barra terminando perto da borda: o rótulo vai pra esquerda dela */
@media (max-width:640px){
  .eds-regua,  }

/* ── mapa cronológico ──────────────────────────────────────── */
.leg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.04em;color:var(--papel3);}
.leg i{width:9px;height:9px;border-radius:2px;display:block;}


/* guia de leitura que segue o cursor — é o que faz o mapa parecer um mapa */

.mapa-regua,.mapa-secao,.mapa-regua 
.mapa-secao .mapa-secao 
.mapa-linha.evento .mapa-linha.evento.foco 
.mapa-linha 
.faixa{position:absolute;top:6px;height:14px;border-radius:4px;border:none;cursor:pointer;
  padding:0 6px;display:flex;align-items:center;overflow:hidden;
  background:var(--ciano);transition:filter .15s,height .15s,top .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 3px rgba(0,0,0,.3);}
.faixa:hover{filter:brightness(1.2);height:18px;top:4px;}
.faixa.ligada{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(229,72,127,.5),0 1px 4px rgba(0,0,0,.35);}
/* dente serrilhado quando a barra continua além da janela */
.faixa.corte-i{border-top-left-radius:0;border-bottom-left-radius:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7px);mask-image:linear-gradient(90deg,transparent 0,#000 7px);}
.faixa.corte-f{border-top-right-radius:0;border-bottom-right-radius:0;
  -webkit-mask-image:linear-gradient(270deg,transparent 0,#000 7px);mask-image:linear-gradient(270deg,transparent 0,#000 7px);}
.faixa-nome{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;
  color:rgba(20,17,32,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.faixa-evento{background:var(--amarelo);height:16px;top:5px;}
.faixa-evento.atual{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px rgba(242,179,61,.3),0 2px 6px rgba(0,0,0,.4);}

.dens-area{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.dens-alvo{position:absolute;top:0;bottom:0;}
.dica-rot{font-family:var(--mono);font-size:9.5px;color:var(--papel3);}

/* Guarda a sessão sem depender do localStorage: o acervo já o enche, e a

const _memoria = new Map();
const guardaDeSessao = {
  getItem: (k) => {
    try { const v = localStorage.getItem(k); if (v != null) return v; } catch (e) {}
    return _memoria.has(k) ? _memoria.get(k) : null;
  },
  setItem: (k, v) => {
    _memoria.set(k, v);
    try { localStorage.setItem(k, v); } catch (e) { /* segue só em memória */ }
  },
  removeItem: (k) => {
    _memoria.delete(k);
    try { localStorage.removeItem(k); } catch (e) {}
  },
};

/* Prazo em toda chamada: sem isto, uma requisição que não volta deixa a
   tela travada sem explicação. */
const comPrazo = (p, seg, rot) => Promise.race([
  p,
  new Promise((_, rej) => setTimeout(() => rej(new Error(`${rot} não respondeu em ${seg}s`)), seg * 1000)),
]);

/* Lê o acervo inteiro da nuvem: uma consulta, todas as partes. */
async function lerDaNuvem() {
  const sb = nuvem();
  if (!sb) return null;
  const { data, error } = await comPrazo(sb.from("acervo").select("parte, conteudo, versao"), 30, "a leitura da nuvem");
  if (error) throw new Error(error.message);
  const fora = { versoes: {} };
  for (const l of data || []) {
    fora[l.parte] = l.conteudo;
    fora.versoes[l.parte] = l.versao;
  }
  return fora;
}

/* Grava uma parte. Devolve a versão nova, que serve de recibo. */
async function gravarNaNuvem(parte, conteudo) {
  const sb = nuvem();
  if (!sb) return null;
  const { data, error } = await comPrazo(sb.rpc("gravar_parte", { p_parte: parte, p_conteudo: conteudo }), 30, `a gravação de ${parte}`);
  if (error) throw new Error(error.message);
  return data;
}

/* ── imagens na nuvem ────────────────────────────────────────
   Uma por arquivo, dentro de uma pasta com o seu identificador — é disso
   que as políticas do bucket dependem. O nome do arquivo codifica a chave,
   porque ela pode conter barra ("pers:bruce wayne/batman"). */
const nomeDeArquivo = (chave) =>
  encodeURIComponent(String(chave)).replace(/%/g, "_") + ".bin";

const chaveDoArquivo = (nome) =>
  decodeURIComponent(String(nome).replace(/\.bin$/, "").replace(/_/g, "%"));

const base64ParaBlob = (dataUrl) => {
  const m = String(dataUrl || "").match(/^data:([^;]+);base64,(.*)$/);
  if (!m) return null;
  const bin = atob(m[2]);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: m[1] });
};

const blobParaBase64 = (blob) => new Promise((ok, falha) => {
  const r = new FileReader();
  r.onload = () => ok(r.result);
  r.onerror = () => falha(new Error("não consegui ler a imagem"));
  r.readAsDataURL(blob);
});

async function enviarCapaNuvem(chave, dataUrl) {
  const sb = nuvem();
  if (!sb) return false;
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  const blob = base64ParaBlob(dataUrl);
  if (!blob) return false;
  const { error } = await sb.storage.from("capas")
    .upload(`${user.id}/${nomeDeArquivo(chave)}`, blob, { upsert: true, contentType: blob.type });
  if (error) throw new Error(error.message);
  return true;
}

async function baixarCapaNuvem(chave) {

  if (!user) return null;
  const { data, error } = await sb.storage.from("capas").download(`${user.id}/${nomeDeArquivo(chave)}`);
  if (error || !data) return null;
  return blobParaBase64(data);
}

const disco = {
  async ler(k) {
    if (typeof window !== "undefined" && window.storage) return window.storage.get(k);
    const v = localStorage.getItem(k);
    if (v == null) throw new Error("chave inexistente");
    return { key: k, value: v };
  },
  async gravar(k, v) {
    if (typeof window !== "undefined" && window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
    return { key: k, value: v };
  },
  async apagar(k) {
    if (typeof window !== "undefined" && window.storage) return window.storage.delete(k);
    localStorage.removeItem(k);
    return { key: k, deleted: true };
  },
};

/* ─── arquivo permanente em disco ───
   Chrome, Edge e Opera deixam a página escrever direto num arquivo que
   você escolhe. O atalho para esse arquivo fica guardado, então a cada
   alteração o acervo é gravado ali sozinho — limpar o cache ou trocar de
   navegador deixa de ser um risco, e o arquivo pode morar no Drive. */
const suportaArquivo =
  typeof window !== "undefined" &&
  typeof window.showSaveFilePicker === "function" &&
  !window.storage;

const bancoAtalho = () =>
  new Promise((ok, err) => {
    const p = indexedDB.open("acervo-arquivo", 1);
    p.onupgradeneeded = () => p.result.createObjectStore("atalhos");
    p.onsuccess = () => ok(p.result);
    p.onerror = () => err(p.error);
  });

async function guardarAtalho(h) {
  const b = await bancoAtalho();
  return new Promise((ok, err) => {
    const t = b.transaction("atalhos", "readwrite");
    t.objectStore("atalhos").put(h, "arquivo");
    t.oncomplete = () => ok(true);
    t.onerror = () => err(t.error);
  });
}

async function buscarAtalho() {
  try {
    const b = await bancoAtalho();
    return await new Promise((ok) => {
      const t = b.transaction("atalhos", "readonly");
      const q = t.objectStore("atalhos").get("arquivo");
      q.onsuccess = () => ok(q.result || null);
      q.onerror = () => ok(null);
    });
  } catch (e) {
    return null;
  }
}

async function esquecerAtalho() {
  try {
    const b = await bancoAtalho();
    const t = b.transaction("atalhos", "readwrite");
    t.objectStore("atalhos").delete("arquivo");
  } catch (e) { /* sem problema */ }
}

/* Cadastros antigos guardavam a série inteira num item só.
   Aqui ela vira um item por volume, mais uma coleção que os reúne. */
function migrarV1(antigos) {
  const colecoes = [], itens = [];
  for (const v of antigos) {
    const { volumesTotal, possuidos, ...base } = v;
    const poss = possuidos || [];
    const total = Number(volumesTotal) || 0;
    if (poss.length > 1 || total > 1) {
      const col = {
        id: uid(),
        nome: base.titulo,
        tipo: "serie",
        total: Math.max(total, ...poss, 1),
        editora: base.editora || "",
        notas: "",
        criadoEm: Date.now(),
      };
      colecoes.push(col);
      const vols = poss.length ? poss : [1];
      vols.forEach((n, i) => itens.push({
        ...base,
        id: i === 0 ? base.id : uid(),
        titulo: `${base.titulo} Vol. ${n}`,
        volume: n,
        colecoes: [col.id],
      }));
    } else {
      itens.push({ ...base, volume: poss[0] ?? null, colecoes: [] });
    }
  }
  return { itens, colecoes };
}

async function carregarTudo() {
  let itens = [], colecoes = [], listas = [], series = [], eventos = [], eras = [], personagens = [], linhasTempo = [], gruposSerie = [], achou = false;
  try {
    const r = await disco.ler(CHAVE);
    if (r && r.value) {
      const d = JSON.parse(r.value);
      itens = d.itens || [];
      colecoes = d.colecoes || [];
      listas = d.listas || [];
      series = d.series || [];
      eventos = d.eventos || [];
      eras = d.eras || [];
      personagens = d.personagens || [];
      linhasTempo = d.linhasTempo || [];
      gruposSerie = d.gruposSerie || [];
      achou = true;
    }
  } catch (e) { /* ainda não existe a versão nova */ }

  if (!achou) {
    try {
      const r = await disco.ler(CHAVE_V1);
      if (r && r.value) {
        const m = migrarV1(JSON.parse(r.value).itens || []);
        itens = m.itens;
        colecoes = m.colecoes;
        if (itens.length) await gravarDados(itens, colecoes, listas);
      }
    } catch (e) { /* primeira execução */ }
  }

  let capas = {};
  try { capas = await capasDB.lerTudo(); } catch (e) { capas = {}; }

  // capas de versões anteriores ainda moram nas 4 chaves do armazenamento
  // local; traz para o IndexedDB uma vez só e segue a vida
  const antigas = {};
  await Promise.all(
    Array.from({ length: FATIAS }, (_, i) =>
      disco.ler(chaveCapa(i))
        .then((r) => { if (r && r.value) Object.assign(antigas, JSON.parse(r.value)); })
        .catch(() => {})
    )
  );
  const migrar = Object.entries(antigas).filter(([id]) => !capas[id]);
  if (migrar.length) {
    try {
      await capasDB.gravarMuitas(migrar);
      for (const [id, d] of migrar) capas[id] = d;
    } catch (e) { Object.assign(capas, antigas); } // não deu: usa em memória mesmo
  }
  return { itens, colecoes, listas, series, eventos, eras, personagens, linhasTempo, gruposSerie, capas };
}

const gravarFatia = (capas, i) => {
  const parte = {};
  for (const id of Object.keys(capas)) if (fatiaDe(id) === i) parte[id] = capas[id];
  return disco.gravar(chaveCapa(i), JSON.stringify(parte));
};

/* ─── capas guardadas em IndexedDB ───
   Capa baixada e convertida em base64 pesa uns 25 KB. Com centenas delas
   o armazenamento local (5 MB no total) estoura na hora, então as capas
   moram no IndexedDB, que trabalha na casa das centenas de MB. O backup
   em JSON continua levando tudo junto, como antes. */
function bancoCapas() {
  return new Promise((ok, err) => {
    const p = indexedDB.open("acervo-capas", 1);
    p.onupgradeneeded = () => {
      if (!p.result.objectStoreNames.contains("capas")) p.result.createObjectStore("capas");
    };
    p.onsuccess = () => ok(p.result);
    p.onerror = () => err(p.error);
  });
}

const capasDB = {
  async lerTudo() {
    const b = await bancoCapas();
    return new Promise((ok) => {
      const mapa = {};
      const q = b.transaction("capas", "readonly").objectStore("capas").openCursor();
      q.onsuccess = () => { const c = q.result; if (c) { mapa[c.key] = c.value; c.continue(); } else ok(mapa); };
      q.onerror = () => ok(mapa);
    });
  },
  async gravarMuitas(pares) {
    if (!pares.length) return true;
    const b = await bancoCapas();
    return new Promise((ok, err) => {
      const t = b.transaction("capas", "readwrite");
      const loja = t.objectStore("capas");
      for (const [id, dados] of pares) { if (dados) loja.put(dados, id); else loja.delete(id); }
      t.oncomplete = () => ok(true);
      t.onerror = () => err(t.error || new Error("falha ao gravar capas"));
      t.onabort = () => err(t.error || new Error("gravação de capas abortada"));
    });
  },
  gravar(id, dados) { return this.gravarMuitas([[id, dados]]); },
  async limpar() {
    const b = await bancoCapas();
    return new Promise((ok) => {
      const t = b.transaction("capas", "readwrite");
      t.objectStore("capas").clear();
      t.oncomplete = () => ok(true);
      t.onerror = () => ok(false);
    });
  },
};

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const brl = (n) =>

const numero = (v) => {
  if (v === "" || v == null) return null;
  let t = String(v).trim().replace(/[^0-9.,-]/g, "");
  // Com vírgula, o ponto é separador de milhar; sem vírgula, o ponto é decimal.
  t = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t;
  const n = parseFloat(t);
  return isFinite(n) ? n : null;
};

// Pro campo de preço mostrar algo editável desde o início — sem isso, um
// valor já salvo (número) apareceria como "64.9" em vez de "64,90".
const paraTexto = (n) =>

const dataCurta = (iso) => {
  if (!iso) return "—";
  const [a, m, d] = iso.split("-");
  return d ? `${d}/${m}/${a}` : iso;

const hoje = () => new Date().toISOString().slice(0, 10);

// Cor de fundo estável derivada do título, para capas ausentes.
const matizDoTitulo = (t = "") => {
  let h = 0;
  for (let i = 0; i < t.length; i++) h = (h * 37 + t.charCodeAt(i)) % 360;
  return h;
};

/* "#1-5, 8" vira [1,2,3,4,5,8] — assim os relatórios sabem exatamente
   quais edições originais você tem, sem você digitar uma a uma. */
/* Cada edição pode carregar a própria data entre parênteses:
     220 (11/1975), 221 (01/1976), 291-294 (12/1977)
   Revista americana raramente é mensal certinha — a Wonder Woman era
   bimestral nos anos 70 —, então interpolar entre início e fim erraria.
   A data fica colada no número que ela pertence. */
/* Até sete dígitos: em 1998 a DC publicou a "DC One Million", com as
   edições numeradas #1000000. Com o limite de quatro, elas eram recusadas
   em silêncio e não havia como cadastrar. */
/* Edições em fração existem: a Teen Titans Vol 3 ½ e outras promocionais,
   quase sempre brindes de revista. Vale como número — meia edição entre a
   #0 e a #1 — e entra como complementar, sem mexer no tamanho da série. */
const FRACOES = { "½": 0.5, "⅓": 1 / 3, "⅔": 2 / 3, "¼": 0.25, "¾": 0.75, "⅛": 0.125 };

const normalizarNumero = (t) => {
  let v = String(t == null ? "" : t).trim();
  for (const [sinal, valor] of Object.entries(FRACOES)) {
    if (v === sinal) return String(valor);
    // "1½" -> 1.5, escrito assim em algumas fichas
    if (v.endsWith(sinal)) {
      const inteiro = v.slice(0, -sinal.length).trim();
      if (/^\d{1,7}$/.test(inteiro)) return String(Number(inteiro) + valor);
      if (!inteiro) return String(valor);
    }
  }
  // "1/2" digitado no teclado
  const m = v.match(/^(\d{1,7})?\s*(\d)\s*\/\s*(\d)$/);
  if (m && Number(m[3]) !== 0) return String((Number(m[1]) || 0) + Number(m[2]) / Number(m[3]));
  return v;
};

/* Mostra 0.5 como ½ — "#0.5" não é como ninguém chama essa edição. */
const rotuloNumero = (n) => {
  const achado = Object.entries(FRACOES).find(([, v]) => Math.abs(v - (n % 1)) < 0.001);
  if (!achado || Number.isInteger(n)) return String(n);
  const inteiro = Math.floor(n);
  return (inteiro ? inteiro : "") + achado[0];
};

const RE_EDICAO = /^(\d{1,7}(?:\.\d{1,2})?)(?:\s*\(([^)]*)\))?$/;
const RE_FAIXA = /^(\d{1,7})\s*(?:[-–—]|a|at[ée])\s*(\d{1,7})(?:\s*\(([^)]*)\))?$/i;
const RE_FAIXA_DEC = /^(\d{1,7}(?:\.\d{1,2})?)\s*(?:[-–—]|a|at[ée])\s*(\d{1,7}(?:\.\d{1,2})?)(?:\s*\(([^)]*)\))?$/i;

// devolve [{n, data}] preservando a data de cada edição
function edicoesDetalhadas(t) {
  const fora = new Map();
  const por = (n, data) => { if (!fora.has(n) || (data && !fora.get(n))) fora.set(n, data || ""); };

  for (const parte of String(t || "").replace(/#/g, "").split(/[,;]/)) {
    const cru = parte.trim();
    if (!cru) continue;
    /* "½" e "1/2" viram 0.5 antes de qualquer leitura, para o resto do
       caminho enxergar só números. */
    const solto = cru.match(/^([^(]+?)(\s*\([^)]*\))?$/);
    const p = solto ? normalizarNumero(solto[1]) + (solto[2] || "") : cru;

    const faixa = p.match(RE_FAIXA);
    if (faixa) {
      const [a, b] = [Number(faixa[1]), Number(faixa[2])];
      // data numa faixa vale para o trecho inteiro; o mapa usa como referência
      /* O teto existe para um "1-99999" digitado errado não gerar cem mil
         entradas. Estava em 500, o que engolia em silêncio a faixa "0-904"
         da Action Comics e deixava a série com 145 edições em vez de 1050. */
      if (b >= a && b - a <= 3000) for (let i = a; i <= b; i++) por(i, faixa[3]);
      continue;
    }
    const fd = p.match(RE_FAIXA_DEC);
    if (fd) { por(Number(fd[1]), fd[3]); por(Number(fd[2]), fd[3]); continue; }
    const solo = p.match(RE_EDICAO);
    if (solo) por(Number(solo[1]), solo[2]);
  }
  return [...fora.entries()].map(([n, data]) => ({ n, data: (data || "").trim() })).sort((a, b) => a.n - b.n);
}

function numerosDeEdicoes(t) {
  return edicoesDetalhadas(t).map((e) => e.n);
}

// edições ".1" são complementares: não preenchem o buraco do número cheio
const ehInteiro = (n) => Number.isInteger(n);

/* Algumas anuais trocaram a numeração pelo ano: a Detective Comics Annual
   vai de 1 a 11 e depois vira "2018", "2019". Tratar isso como número de
   edição faria a série ir até 2020 e inventar 2006 lacunas. Então, quando a
   série tem numeração normal convivendo com anos, os anos são contados
   como extras — igual às edições ".1". */
const PRIMEIRO_ANO = 1900;
/* Número que não pertence à sequência: ou é ano (as anuais viraram "2018",
   "2019") ou é a numeração comemorativa da DC One Million, que marcou as
   edições como #1000000. Os dois casos contam como edição que você tem, mas
   não definem o tamanho da série nem geram lacuna. O piso de 1900 é seguro
   porque nenhuma série da DC passou disso: a Action Comics está na casa da
   #1100. O teto antigo de 2200 deixava a One Million escapar. */
const ehNumeroDeAno = (n, todos) =>
  Number.isInteger(n) && n >= PRIMEIRO_ANO &&
  todos.some((x) => Number.isInteger(x) && x < PRIMEIRO_ANO);

/* Guardar 1050 números soltos seria desperdício: vira "0, 1-904, 957-1101",
   que é curto, legível e volta pelo mesmo leitor das edições. */
function compactarNumeros(nums) {
  const l = [...new Set(nums.filter(Number.isInteger))].sort((a, b) => a - b);
  const fora = [];
  let i = 0;
  while (i < l.length) {
    let j = i;
    while (j + 1 < l.length && l[j + 1] === l[j] + 1) j++;
    fora.push(i === j ? String(l[i]) : `${l[i]}-${l[j]}`);
    i = j + 1;
  }
  return fora.join(", ");
}

/* Números que faltam entre o primeiro e o último — não porque você não tem,
   mas porque nunca foram publicados. A Action Comics pulou de #904 para
   #957 quando o título virou Volume 2 nos Novos 52. */
function faixasInexistentes(publicados) {
  const l = [...new Set(publicados.filter(Number.isInteger))].sort((a, b) => a - b);
  const fora = [];
  for (let i = 1; i < l.length; i++) {
    if (l[i] - l[i - 1] > 1) fora.push([l[i - 1] + 1, l[i] - 1]);
  }
  return fora;
}

// separa a numeração de sequência dos extras (decimais e anos)
function separarNumeracao(lista) {
  const todos = [...lista];
  const sequencia = [], extras = [];
  for (const n of todos) {
    if (!ehInteiro(n) || ehNumeroDeAno(n, todos)) extras.push(n);
    else sequencia.push(n);
  }
  return { sequencia, extras };
}

/* Monta uma linha do tempo: resolve as séries escolhidas, junta os eventos
   que valem para ela e calcula a janela que cabe tudo. */
/* Onde estão, de fato, as edições que você tem. A barra preenchida da
   esquerda dizia "53 de 713" desenhando um bloco no começo — como se você
   tivesse as 53 primeiras. Aqui cada trecho aparece na posição real, e
   trechos vizinhos viram um bloco só para não sumirem em meio pixel. */
function blocosDePosse(tenho, primeiro, ultimo) {
  const a = Number(primeiro) || 1;
  const b = Number(ultimo) || 0;
  if (!b || b < a) return [];
  const larg = b - a + 1;
  const nums = [...tenho].filter((n) => Number.isInteger(n) && n >= a && n <= b).sort((x, y) => x - y);
  if (!nums.length) return [];

  // junta números vizinhos; a folga cresce com séries longas, senão uma
  // série de mil edições vira mil riscos de meio pixel
  const folga = Math.max(1, Math.round(larg / 220));
  const blocos = [];
  for (const n of nums) {
    const u = blocos[blocos.length - 1];
    if (u && n - u.fim <= folga) u.fim = n;
    else blocos.push({ ini: n, fim: n });
  }
  return blocos.map((x) => ({
    esq: ((x.ini - a) / larg) * 100,
    larg: Math.max(0.7, ((x.fim - x.ini + 1) / larg) * 100),
  }));
}

function montarLinha(linha, series, eventos, eras) {
  const porId = new Map(series.map((x) => [x.id, x]));
  const faixas = (linha.series || [])
    .map((id) => porId.get(id))
    .filter(Boolean)
    .map((se) => {
      const p = se.inicio ? periodoDoTexto(`${se.inicio} ${se.fimTexto || se.inicio}`) : null;
      return {
        ...se,
        ini: p ? p.ini : se.ini,
        fim: p ? p.fim : se.fim,
        // exige número de verdade: string vazia passava como período válido
        temPeriodo: !!(p || (Number.isFinite(se.ini) && Number.isFinite(se.fim))),
      };
    })
    .filter((x) => x.temPeriodo)
    .sort((a, b) => a.ini - b.ini);

  // universal (sem linha) ou desta linha
  const meus = (eventos || [])
    .filter((e) => !e.linha || e.linha === linha.id)
    .map((e) => ({ ...e, per: periodoDoTexto(`${e.inicio || ""} ${e.fim || e.inicio || ""}`) }))
    .filter((e) => e.per)
    .sort((a, b) => a.per.ini - b.per.ini);

  const marcos = (eras || [])
    .map((e) => ({ ...e, per: periodoDoTexto(`${e.inicio || ""} ${e.fim || ""}`) }))
    .filter((e) => e.per)
    .sort((a, b) => a.per.ini - b.per.ini);

  const pontos = [
    ...faixas.flatMap((f) => [f.ini, f.fim]),
    ...meus.flatMap((e) => [e.per.ini, e.per.fim]),
  ].filter(Number.isFinite);

  if (!pontos.length) return { faixas, eventos: meus, eras: marcos, janela: null };
  const ini = idxMes(anoDoIdx(Math.min(...pontos)), 1);
  const fim = idxMes(anoDoIdx(Math.max(...pontos)), 12);
  return { faixas, eventos: meus, eras: marcos, janela: { ini, fim } };
}

/* O que a coleção tem, o que falta e onde estão os buracos. */
function estadoColecao(col, itens) {
  const membros = itens.filter((i) => (i.colecoes || []).includes(col.id));
  const naEstante = membros.filter((i) => i.lista === "estante");
  const noDesejo = membros.filter((i) => i.lista === "desejos");
  const tenho = new Set(naEstante.map((i) => i.volume).filter((v) => v != null));
  const querendo = new Set(noDesejo.map((i) => i.volume).filter((v) => v != null));
  const total = col.tipo === "serie" ? Number(col.total) || 0 : 0;
  const faltam = total > 0
    ? Array.from({ length: total }, (_, i) => i + 1).filter((v) => !tenho.has(v))
    : [];
  return {
    membros, naEstante, noDesejo, tenho, querendo, total, faltam,
    completa: total > 0 && faltam.length === 0,
  };
}

/* ─── séries originais ───
   Diferente das coleções, a série não é criada por você: ela nasce sozinha
   assim que algum item declara pertencer a ela e some quando o último item
   que a citava sai do acervo. O que fica guardado é só o que você
   personaliza — total de edições e capa —, e mesmo isso só se você mexer. */
const chaveSerie = (nome) => `serie:${semAcento(String(nome || "").trim())}`;

/* Revista mensal costuma ser anotada com mês: "03/2007 - 09/2007". O campo
   continua livre — você escreve como quiser —, mas quando o mês aparece ele
   é lido e entra na ordenação, então março de 2007 vem antes de setembro de
   2007. Formatos entendidos, na ordem: "03/2007", "mar/2007", "março 2007"
   e, por último, um ano solto. Sem nada disso, tenta o ano no nome da série
   ("Wonder Woman (2007)"). */
const MESES_PT = {
  jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6,
  jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12,
  feb: 2, apr: 4, may: 5, aug: 8, sep: 9, oct: 10, dec: 12,
};
// 03/2007 · 3-2007 · 03.2007 — o mês precisa ser de 1 a 12
const RE_MES_ANO = /\b(0?[1-9]|1[0-2])[\/.\-](1[6-9]\d{2}|20\d{2})\b/;
// mar/2007 · marco de 2007 · september 1985
const RE_NOME_MES = /\b([a-z]{3})[a-z]*\.?\s*(?:de\s+)?[\/\-]?\s*(1[6-9]\d{2}|20\d{2})\b/;
const RE_SO_ANO = /\b(1[6-9]\d{2}|20\d{2})\b/;

function dataDaSerie(s) {
  for (const bruto of [s && s.data, s && s.nome]) {
    const t = semAcento(String(bruto || ""));
    if (!t) continue;

    let m = t.match(RE_MES_ANO);
    if (m) return { ano: Number(m[2]), mes: Number(m[1]) };

    m = t.match(RE_NOME_MES);
    if (m && MESES_PT[m[1]]) return { ano: Number(m[2]), mes: MESES_PT[m[1]] };

    m = t.match(RE_SO_ANO);
    if (m) return { ano: Number(m[1]), mes: null };
  }
  return { ano: null, mes: null };
}

// chave numérica para ordenar: mês desconhecido conta como 0, então a série
// que só informa o ano vem antes de qualquer mês daquele mesmo ano
const ordemDaData = (d) => (d.ano == null ? null : d.ano * 13 + (d.mes || 0));

const anoDaSerie = (s) => dataDaSerie(s).ano;

/* ─── períodos ───
   Para a linha do tempo não basta o início: "03/1985 - 09/1986" precisa
   virar um intervalo. Aqui o texto é varrido inteiro e todas as datas que
   aparecem viram pontos; o menor é o começo, o maior é o fim. Mês ausente
   conta como janeiro no começo e dezembro no fim, então "1985-1986" cobre
   os dois anos completos em vez de virar um traço fino. */
const RE_MES_ANO_G = /\b(0?[1-9]|1[0-2])[\/.\-](1[6-9]\d{2}|20\d{2})\b/g;
const RE_NOME_MES_G = /\b([a-z]{3})[a-z]*\.?\s*(?:de\s+)?[\/\-]?\s*(1[6-9]\d{2}|20\d{2})\b/g;
const RE_SO_ANO_G = /\b(1[6-9]\d{2}|20\d{2})\b/g;

// índice contínuo de meses — permite comparar 12/1985 com 01/1986 direto
const idxMes = (ano, mes) => ano * 12 + ((mes || 1) - 1);
const anoDoIdx = (i) => Math.floor(i / 12);
const mesDoIdx = (i) => (i % 12) + 1;
const rotuloIdx = (i, comMes) =>
  comMes ? `${String(mesDoIdx(i)).padStart(2, "0")}/${anoDoIdx(i)}` : String(anoDoIdx(i));

function periodoDoTexto(bruto) {
  let resto = semAcento(String(bruto || ""));
  if (!resto) return null;
  const pontos = [];
  const varrer = (re, ler) => {
    resto = resto.replace(re, (achado, ...gr) => {
      const p = ler(gr);
      if (p) pontos.push(p);
      return " ".repeat(achado.length); // some do texto, não é lido duas vezes
    });
  };
  varrer(RE_MES_ANO_G, (g) => ({ ano: Number(g[1]), mes: Number(g[0]) }));
  varrer(RE_NOME_MES_G, (g) => (MESES_PT[g[0]] ? { ano: Number(g[1]), mes: MESES_PT[g[0]] } : null));
  varrer(RE_SO_ANO_G, (g) => ({ ano: Number(g[0]), mes: null }));
  if (!pontos.length) return null;

  const inicios = pontos.map((p) => idxMes(p.ano, p.mes || 1));
  const fins = pontos.map((p) => idxMes(p.ano, p.mes || 12));
  return {
    ini: Math.min(...inicios),
    fim: Math.max(...fins),
    comMes: pontos.some((p) => p.mes != null),
  };
}

/* O período de uma entrada sai das datas individuais quando elas existem —
   são mais precisas que o campo de faixa, que continua valendo como resumo
   e para quem ainda não detalhou. */
/* Quando todas as edições têm data própria, o período da entrada é
   consequência delas — não precisa ser digitado. */
/* Rótulo curto para o mapa: com datas individuais o campo virou uma lista
   de 24 itens, que estourava a linha do gráfico. */
function rotuloEdicoes(edicoesTexto) {
  const eds = edicoesDetalhadas(edicoesTexto);
  if (!eds.length) return "";
  const nums = eds.map((e) => e.n);
  if (eds.length <= 3) return "#" + nums.map(rotuloNumero).join(", #");
  return `#${Math.min(...nums)}–${Math.max(...nums)} · ${eds.length} ed.`;
}

function resumoDasEdicoes(edicoesTexto) {
  const eds = edicoesDetalhadas(edicoesTexto);
  const datas = eds.map((e) => e.data).filter(Boolean);
  if (!eds.length || datas.length !== eds.length) return "";
  const p = periodoDoTexto(datas.join(" "));
  if (!p) return "";
  const a = rotuloIdx(p.ini, p.comMes), b = rotuloIdx(p.fim, p.comMes);
  return a === b ? a : `${a} - ${b}`;
}

const periodoDaOrigem = (o) => {
  const datas = edicoesDetalhadas(o && o.edicoesTexto).map((e) => e.data).filter(Boolean);
  if (datas.length) {
    const p = periodoDoTexto(datas.join(" "));
    if (p) return p;
  }
  return periodoDoTexto(o && o.data);
};

const ORDENS_SERIE = [
